<!DOCTYPE html>
<html lang="fa">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ثبت نام</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#111;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#222;
padding:40px;
border-radius:20px;
width:300px;
text-align:center;
}

input,textarea{
width:100%;
padding:10px;
margin:10px 0;
border:none;
border-radius:10px;
}

button{
background:#FF4D6D;
border:none;
padding:12px 20px;
border-radius:30px;
color:white;
font-size:16px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h2>ثبت نام</h2>

<input id="name" placeholder="نام">

<textarea id="bio" placeholder="بیوگرافی"></textarea>

<button onclick="save()">ثبت</button>

</div>

<script>

function save(){

let name = document.getElementById("name").value
let bio = document.getElementById("bio").value

localStorage.setItem("name",name)
localStorage.setItem("bio",bio)

window.location.href="profile.html"

}

</script>

</body>
</html>
