<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ثبت نام</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#020617;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.form{
background:#111;
padding:30px;
border-radius:20px;
width:320px;
text-align:center;
}

input,textarea{
width:100%;
padding:10px;
margin:10px 0;
border:none;
border-radius:10px;
}

button{
background:#FF4D6D;
border:none;
padding:12px 20px;
border-radius:20px;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<div class="form">

<h2>ثبت نام</h2>

<input id="name" placeholder="نام">

<input id="age" placeholder="سن">

<input id="city" placeholder="شهر">

<textarea id="bio" placeholder="بیو"></textarea>

<p>عکس پروفایل</p>

<input type="file" id="photo1">

<input type="file" id="photo2">

<input type="file" id="photo3">

<button onclick="register()">ثبت</button>

</div>

<script>

function register(){

let name=document.getElementById("name").value
let age=document.getElementById("age").value
let city=document.getElementById("city").value
let bio=document.getElementById("bio").value

let users = JSON.parse(localStorage.getItem("users")) || []

let user={
name:name,
age:age,
city:city,
bio:bio,
photo:"https://picsum.photos/200"
}

users.push(user)

localStorage.setItem("users",JSON.stringify(users))

window.location.href="users.html"

}

</script>

</body>

</html>
