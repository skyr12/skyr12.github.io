<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پروفایل</title>

<style>

body{
font-family:sans-serif;
background:#111;
color:white;
text-align:center;
margin:0;
}

.profile{
margin-top:80px;
}

.avatar{
width:120px;
height:120px;
border-radius:50%;
background:#ff4f7b;

}

.name{
font-size:24px;

}

.bio{
opacity:0.7;

}

button{
margin-top:20px;
padding:10px 20px;
border:none;
border-radius:10px;
background:#ff4f7b;
color:white;
font-size:16px;
}

</style>
</head>

<body>

<div class="profile">

<div class="avatar"></div>

<div class="name">نام کاربر</div>

<div class="bio">این بیوگرافی کاربر است</div>

<button>ویرایش پروفایل</button>

</div>

</body>
</html>
