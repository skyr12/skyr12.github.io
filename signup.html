<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ثبت نام</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#020617;
color:white;
text-align:center;
}

.card{
background:#111;
width:320px;
margin:40px auto;
padding:30px;
border-radius:20px;
}

input,textarea{
width:90%;
padding:10px;
margin:10px;
border:none;
border-radius:10px;
}

button{
background:#ff4d6d;
border:none;
padding:12px 25px;
border-radius:25px;
color:white;
font-size:16px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="card">

<h2>ثبت نام</h2>

<input id="name" placeholder="نام">

<input id="city" placeholder="شهر">

<textarea id="bio" placeholder="بیو"></textarea>

<input type="file" id="photo">

<br><br>

<button onclick="signup()">ثبت</button>

</div>

<script>

function signup(){

let name=document.getElementById("name").value
let city=document.getElementById("city").value
let bio=document.getElementById("bio").value

let file=document.getElementById("photo").files[0]

let reader=new FileReader()

reader.onload=function(){

let photo=reader.result

let user={
name:name,
city:city,
bio:bio,
photo:photo
}

let users=JSON.parse(localStorage.getItem("users"))||[]

users.push(user)

localStorage.setItem("users",JSON.stringify(users))

window.location.href="users.html"

}

reader.readAsDataURL(file)

}

</script>

</body>

</html>
