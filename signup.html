<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ثبت نام</title>

<style>

body{
font-family:sans-serif;
background:linear-gradient(135deg,#ff758c,#ff7eb3);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
margin:0;
color:white;
}

.form-box{
background:rgba(255,255,255,0.15);
padding:40px;
border-radius:20px;
backdrop-filter:blur(10px);
width:300px;
text-align:center;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
}

button{
width:100%;
padding:12px;
background:white;
color:#ff4f7b;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

</style>
</head>

<body>

<div class="form-box">

<h2>ثبت نام</h2>

<input type="text" placeholder="نام">

<input type="email" placeholder="ایمیل">

<input type="password" placeholder="رمز عبور">

<button>ساخت حساب</button>

</div>

</body>
</html>
