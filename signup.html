<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ثبت نام | نیمه گمشده</title>

<style>
body{
margin:0;
font-family:Tahoma;
background:#020617;
color:white;
text-align:center;
}

.card{
background:#111;
width:340px;
margin:40px auto;
padding:30px;
border-radius:20px;
}

h2{
margin-bottom:20px;
}

input,select,textarea{
width:90%;
padding:10px;
margin:8px;
border:none;
border-radius:10px;
font-family:Tahoma;
}

button{
background:#ff4d6d;
border:none;
padding:12px 25px;
border-radius:25px;
color:white;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

</style>
</head>

<body>

<div class="card">

<h2>ثبت نام</h2>

<input id="name" placeholder="نام">

<input id="age" type="number" placeholder="سن">

<select id="gender">
<option value="">جنسیت</option>
<option>مرد</option>
<option>زن</option>
</select>

<input id="city" placeholder="شهر">

<input id="job" placeholder="شغل">

<select id="education">
<option value="">تحصیلات</option>
<option>دیپلم</option>
<option>کارشناسی</option>
<option>کارشناسی ارشد</option>
<option>دکترا</option>
</select>

<textarea id="bio" placeholder="درباره خودتان"></textarea>

<input type="file" id="photo">

<button onclick="signup()">ثبت نام</button>

</div>

<script>

function signup(){

let name=document.getElementById("name").value
let age=document.getElementById("age").value
let gender=document.getElementById("gender").value
let city=document.getElementById("city").value
let job=document.getElementById("job").value
let education=document.getElementById("education").value
let bio=document.getElementById("bio").value

let file=document.getElementById("photo").files[0]

if(!file){
alert("عکس انتخاب کنید")
return
}

let reader=new FileReader()

reader.onload=function(){

let user={
name:name,
age:age,
gender:gender,
city:city,
job:job,
education:education,
bio:bio,
photo:reader.result
}

let users=JSON.parse(localStorage.getItem("users"))||[]

users.push(user)

localStorage.setItem("users",JSON.stringify(users))

window.location.href="search.html"

}

reader.readAsDataURL(file)

}

</script>

</body>
</html>
