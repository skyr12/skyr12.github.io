<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سوایپ کاربران</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#111;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.container{
position:relative;
width:320px;
height:420px;
}

.card{
position:absolute;
width:100%;
height:100%;
background:#222;
border-radius:20px;
box-shadow:0 10px 40px rgba(0,0,0,0.6);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.avatar{
width:150px;
height:150px;
border-radius:50%;
object-fit:cover;
margin-bottom:20px;
}

</style>

</head>

<body>

<div class="container">

<div class="card" id="card">

<img id="avatar" class="avatar">

<h2 id="name"></h2>

<p id="bio"></p>

</div>

</div>

<script>

let users=[

{
name:"سارا",
bio:"علاقه‌مند به سفر",
photo:"https://picsum.photos/300/300?1"
},

{
name:"امیر",
bio:"ورزشکار",
photo:"https://picsum.photos/300/300?2"
},

{
name:"لیلا",
bio:"عاشق موسیقی",
photo:"https://picsum.photos/300/300?3"
}

]

let index=0

function showUser(){

let u=users[index]

document.getElementById("name").innerText=u.name

document.getElementById("bio").innerText=u.bio

document.getElementById("avatar").src=u.photo

}

showUser()

let startX=0

let card=document.getElementById("card")

card.addEventListener("touchstart",e=>{

startX=e.touches[0].clientX

})

card.addEventListener("touchend",e=>{

let endX=e.changedTouches[0].clientX

if(endX-startX>100){

nextUser()

}

if(startX-endX>100){

nextUser()

}

})

function nextUser(){

index++

if(index>=users.length){

index=0

}

showUser()

}

</script>

</body>
</html>
