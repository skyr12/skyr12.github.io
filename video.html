<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Profile</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
text-align:center;
padding-bottom:80px;
}

.header{
background:#ff4d6d;
color:white;
padding:20px;
font-size:22px;
}

.video-box{
width:90%;
max-width:400px;
margin:30px auto;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

video{
width:100%;
border-radius:15px;
}

input{
margin:15px 0;
}

button{
padding:12px 20px;
border:none;
background:#ff4d6d;
color:white;
border-radius:20px;
}

.navbar{
position:fixed;
bottom:0;
left:0;
width:100%;
height:65px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -5px 15px rgba(0,0,0,0.15);
}

.navbar a{
text-decoration:none;
font-size:24px;
color:#444;
}

</style>

</head>

<body>

<div class="header">
Video Profile 🎥
</div>

<div class="video-box">

<video id="preview" controls></video>

<br>

<input type="file" accept="video/*" onchange="loadVideo(event)">

<br>

<button onclick="saveVideo()">Save Video</button>

</div>

<div class="navbar">
<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="chat.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="profile.html">👤</a>
</div>

<script>

function loadVideo(event){

let video=document.getElementById("preview")

video.src=URL.createObjectURL(event.target.files[0])

}

function saveVideo(){

alert("Video saved 🎥")

}

</script>

</body>
</html>
