<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدایا | همدم</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="header">
        <div class="logo">
            <span>🎁</span>
            فروشگاه هدایا
        </div>
        <div class="wallet" onclick="location.href='wallet.html'">
            <span>🪙</span>
            <span id="userCoins">۱,۲۵۰</span>
        </div>
    </div>
    
    <div style="padding: 15px;">
        <h3 style="color: white; margin-bottom: 15px;">🎁 هدایای مجازی</h3>
        
        <div class="gifts-grid">
            <div class="gift-item" onclick="buyGift('🌹', 10)">
                <div class="gift-emoji">🌹</div>
                <div>گل رز</div>
                <div style="font-size: 12px;">۱۰ 🪙</div>
            </div>
            <div class="gift-item" onclick="buyGift('💍', 500)">
                <div class="gift-emoji">💍</div>
                <div>حلقه</div>
                <div style="font-size: 12px;">۵۰۰ 🪙</div>
            </div>
            <div class="gift-item" onclick="buyGift('🚗', 1000)">
                <div class="gift-emoji">🚗</div>
                <div>ماشین</div>
                <div style="font-size: 12px;">۱,۰۰۰ 🪙</div>
            </div>
            <div class="gift-item" onclick="buyGift('🏰', 5000)">
                <div class="gift-emoji">🏰</div>
                <div>کاخ</div>
                <div style="font-size: 12px;">۵,۰۰۰ 🪙</div>
            </div>
            <div class="gift-item" onclick="buyGift('⭐', 10000)">
                <div class="gift-emoji">⭐</div>
                <div>سوپراستار</div>
                <div style="font-size: 12px;">۱۰,۰۰۰ 🪙</div>
            </div>
            <div class="gift-item" onclick="buyGift('🎁', 200)">
                <div class="gift-emoji">🎁</div>
                <div>جعبه</div>
                <div style="font-size: 12px;">۲۰۰ 🪙</div>
            </div>
            <div class="gift-item" onclick="buyGift('🎂', 150)">
                <div class="gift-emoji">🎂</div>
                <div>کیک</div>
                <div style="font-size: 12px;">۱۵۰ 🪙</div>
            </div>
            <div class="gift-item" onclick="buyGift('🍾', 300)">
                <div class="gift-emoji">🍾</div>
                <div>شامپاین</div>
                <div style="font-size: 12px;">۳۰۰ 🪙</div>
            </div>
        </div>
        
        <h3 style="color: white; margin: 30px 0 15px;">📦 خرید سکه</h3>
        
        <div class="coin-package popular" onclick="buyCoins(100)">
            <span class="popular-badge">پرفروش</span>
            <div>
                <strong style="font-size: 18px;">۱۰۰ سکه</strong>
            </div>
            <div style="color: #ff4d6d;">۱۰,۰۰۰ ت</div>
        </div>
        
        <div class="coin-package" onclick="buyCoins(500)">
            <div>
                <strong style="font-size: 18px;">۵۰۰ سکه</strong>
                <span style="color: #4caf50; font-size: 12px;">+۵۰ جایزه</span>
            </div>
            <div style="color: #ff4d6d;">۴۵,۰۰۰ ت</div>
        </div>
        
        <div class="coin-package" onclick="buyCoins(1000)">
            <div>
                <strong style="font-size: 18px;">۱,۰۰۰ سکه</strong>
                <span style="color: #4caf50; font-size: 12px;">+۲۰۰ جایزه</span>
            </div>
            <div style="color: #ff4d6d;">۸۰,۰۰۰ ت</div>
        </div>
        
        <div class="coin-package" onclick="buyCoins(5000)">
            <div>
                <strong style="font-size: 18px;">۵,۰۰۰ سکه</strong>
                <span style="color: #4caf50; font-size: 12px;">+۱,۰۰۰ جایزه</span>
            </div>
            <div style="color: #ff4d6d;">۳۵۰,۰۰۰ ت</div>
        </div>
    </div>
    
    <div class="navbar">
        <a href="index.html" class="nav-item">🏠</a>
        <a href="discover.html" class="nav-item">🔥</a>
        <a href="live.html" class="nav-item">🎥</a>
        <a href="gifts.html" class="nav-item active">🎁</a>
        <a href="profile.html" class="nav-item">👤</a>
    </div>
    
    <script>
        let userCoins = 1250;
        
        function buyGift(emoji, price) {
            if (userCoins >= price) {
                userCoins -= price;
                document.getElementById('userCoins').textContent = userCoins.toLocaleString();
                showToast(`✅ هدیه ${emoji} خریداری شد!`);
            } else {
                showToast('❌ سکه کافی ندارید!', 'error');
            }
        }
        
        function buyCoins(coins) {
            showToast(`🔄 درگاه پرداخت برای ${coins} سکه`);
        }
        
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span><span>${message}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
    </script>
</body>
</html>
