<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Send Gift</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
text-align:center;
padding-bottom:80px;
}

.header{
background:#ff4d6d;
color:white;
padding:20px;
font-size:22px;
}

.gift{
width:90%;
max-width:400px;
margin:20px auto;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.gift-icon{
font-size:40px;
}

button{
padding:12px 20px;
border:none;
background:#ff4d6d;
color:white;
border-radius:20px;
font-size:16px;
}

.navbar{
position:fixed;
bottom:0;
left:0;
width:100%;
height:65px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -5px 15px rgba(0,0,0,0.15);
}

.navbar a{
text-decoration:none;
font-size:24px;
color:#444;
}

</style>

</head>

<body>

<div class="header">
Send Gift 🎁
</div>

<div class="gift">

<div class="gift-icon">🌹</div>

<h3>Rose</h3>

<p>Cost: 10 Coins</p>

<button onclick="sendGift('Rose')">Send</button>

</div>

<div class="gift">

<div class="gift-icon">💎</div>

<h3>Diamond</h3>

<p>Cost: 50 Coins</p>

<button onclick="sendGift('Diamond')">Send</button>

</div>

<div class="gift">

<div class="gift-icon">🔥</div>

<h3>Heart</h3>

<p>Cost: 25 Coins</p>

<button onclick="sendGift('Heart')">Send</button>

</div>

<div class="navbar">
<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="chat.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="profile.html">👤</a>
</div>

<script>

function sendGift(name){

alert("You sent a "+name+" 🎁")

}

</script>

</body>
</html>
