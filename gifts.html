<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Send Gift</title><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
margin:0;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
font-size:22px;
}

.gifts{
display:flex;
justify-content:center;
gap:20px;
margin-top:30px;
}

.gift{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
cursor:pointer;
}

</style></head><body><div class="header">Send Gift

</div><div class="gifts"><div class="gift" onclick="sendGift('🌹',10)">
🌹 Rose<br>10 coins
</div><div class="gift" onclick="sendGift('💎',50)">
💎 Diamond<br>50 coins
</div><div class="gift" onclick="sendGift('👑',100)">
👑 Crown<br>100 coins
</div></div><script>

const firebaseConfig = {

apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh"

}

firebase.initializeApp(firebaseConfig)

const db = firebase.firestore()

let toUser = new URLSearchParams(location.search).get("user")

function sendGift(gift,price){

let user = firebase.auth().currentUser

let userRef = db.collection("users").doc(user.uid)

userRef.get().then(doc=>{

let coins = doc.data().coins || 0

if(coins < price){

alert("Not enough coins")

return

}

userRef.update({

coins: coins - price

})

db.collection("gifts").add({

from:user.uid,
to:toUser,
gift:gift,
price:price,
time:Date.now()

})

alert("Gift sent 🎁")

})

}

</script></body></html>
