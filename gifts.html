<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send Gift</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
text-align:center;
margin:0;
}

h2{
margin-top:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
padding:20px;
}

.gift{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
cursor:pointer;
}

.gift img{
width:60px;
}

.price{
color:#ff4d6d;
margin-top:10px;
}

.navbar{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
font-size:22px;
}

.navbar a{
text-decoration:none;
}

</style>

</head>

<body>

<h2>🎁 Send Gift</h2>

<div id="coins"></div>

<div class="grid">

<div class="gift" onclick="sendGift(10)">
<img src="https://cdn-icons-png.flaticon.com/512/2583/2583344.png">
<p>🌹 Rose</p>
<p class="price">10 Coins</p>
</div>

<div class="gift" onclick="sendGift(50)">
<img src="https://cdn-icons-png.flaticon.com/512/616/616554.png">
<p>🐻 Teddy</p>
<p class="price">50 Coins</p>
</div>

<div class="gift" onclick="sendGift(100)">
<img src="https://cdn-icons-png.flaticon.com/512/3468/3468377.png">
<p>💎 Diamond</p>
<p class="price">100 Coins</p>
</div>

<div class="gift" onclick="sendGift(500)">
<img src="https://cdn-icons-png.flaticon.com/512/833/833472.png">
<p>🚗 Car</p>
<p class="price">500 Coins</p>
</div>

</div>


<div class="navbar">

<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="inbox.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="visitors.html">👁️</a>
<a href="profile.html">👤</a>

</div>



<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh",
storageBucket:"nimeh-gomsodeh.firebasestorage.app",
messagingSenderId:"815930956932",
appId:"1:815930956932:web:e8696a6a69b4458fd936d1"

};

firebase.initializeApp(firebaseConfig)

const db=firebase.firestore()

let myId=""
let receiver=""
let myCoins=0



firebase.auth().onAuthStateChanged(user=>{

if(!user){

location.href="login.html"
return

}

myId=user.uid

const params=new URLSearchParams(window.location.search)

receiver=params.get("id")

loadCoins()

})



function loadCoins(){

db.collection("users").doc(myId).get()

.then(doc=>{

let u=doc.data()

myCoins=u.coins || 0

document.getElementById("coins").innerHTML="💰 Coins: "+myCoins

})

}



function sendGift(price){

if(myCoins<price){

alert("Not enough coins")

return

}

myCoins-=price

db.collection("users").doc(myId).update({

coins:myCoins

})

db.collection("gifts").add({

from:myId,
to:receiver,
price:price,
time:Date.now()

})

alert("🎁 Gift sent!")

loadCoins()

}

</script>

</body>
</html>
