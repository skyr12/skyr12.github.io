<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send Gift</title><style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
margin:0;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
font-size:20px;
}

.card{
background:white;
width:300px;
margin:auto;
margin-top:30px;
padding:20px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

button{
background:#ff4d6d;
color:white;
border:none;
padding:10px 20px;
border-radius:25px;
margin:10px;
cursor:pointer;
font-size:16px;
}

</style></head><body><div class="header">🎁 Send Gift</div><div class="card"><h3>Choose a Gift</h3><button onclick="sendGift('rose',10)">🌹 Rose (10 coins)</button>

<button onclick="sendGift('diamond',50)">💎 Diamond (50 coins)</button>

<button onclick="sendGift('crown',100)">👑 Crown (100 coins)</button>

</div><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script><script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh",
storageBucket:"nimeh-gomsodeh.firebasestorage.app",
messagingSenderId:"815930956932",
appId:"1:815930956932:web:e8696a6a69b4458fd936d1"

};

firebase.initializeApp(firebaseConfig)

const db=firebase.firestore()

const urlParams=new URLSearchParams(window.location.search)

const target=urlParams.get("id")

function sendGift(type,cost){

let user=firebase.auth().currentUser

let ref=db.collection("users").doc(user.uid)

ref.get().then(doc=>{

let coins=doc.data().coins || 0

if(coins < cost){

alert("Not enough coins")

return

}

ref.update({

coins:coins-cost

})

db.collection("gifts").add({

from:user.uid,
to:target,
type:type,
cost:cost,
time:Date.now()

})

alert("🎁 Gift sent!")

})

}

</script></body>
</html>
