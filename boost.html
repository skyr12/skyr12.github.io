<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boost Profile</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
}

.card{
width:320px;
margin:60px auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

button{
padding:15px 25px;
border:none;
border-radius:30px;
background:#ff4d6d;
color:white;
font-size:18px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="card">

<h2>Boost Your Profile</h2>

<p>Be seen by more people for 1 hour</p>

<button onclick="boostProfile()">
⭐ Activate Boost
</button>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>

const firebaseConfig={
apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh"
}

firebase.initializeApp(firebaseConfig)

const db=firebase.firestore()

let currentUser=null

firebase.auth().onAuthStateChanged(user=>{

currentUser=user

})


function boostProfile(){

let endTime=Date.now()+3600000

db.collection("boosts").add({

user:currentUser.uid,
end:endTime

})

alert("Boost Activated!")

}

</script>

</body>

</html>
