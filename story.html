<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Stories</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
padding:20px;
text-align:center;
}

.story{
width:90px;
height:90px;
border-radius:50%;
overflow:hidden;
display:inline-block;
margin:10px;
border:4px solid #ff4d6d;
}

.story img{
width:100%;
height:100%;
object-fit:cover;
}

input{
margin:20px;
}

button{
padding:10px 20px;
border:none;
background:#ff4d6d;
color:white;
border-radius:20px;
cursor:pointer;
}

</style>

</head>

<body>

<h2>Stories</h2>

<div id="stories"></div>

<br>

<input type="file" id="file">

<br>

<button onclick="upload()">Add Story</button>


<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {

apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.appspot.com"

};

firebase.initializeApp(firebaseConfig);

const storage = firebase.storage();
const db = firebase.firestore();

let currentUser="user1"


function upload(){

let file=document.getElementById("file").files[0]

let ref=storage.ref("stories/"+Date.now()+".jpg")

ref.put(file).then(()=>{

ref.getDownloadURL().then(url=>{

db.collection("stories").add({

user:currentUser,
image:url,
time:Date.now()

})

loadStories()

})

})

}


function loadStories(){

document.getElementById("stories").innerHTML=""

db.collection("stories").get().then(snapshot=>{

snapshot.forEach(doc=>{

let story=doc.data()

let div=document.createElement("div")

div.className="story"

div.innerHTML="<img src='"+story.image+"'>"

document.getElementById("stories").appendChild(div)

})

})

}

loadStories()

</script>

</body>

</html>
