<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stories</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
}

.story{
width:100px;
height:100px;
border-radius:50%;
overflow:hidden;
margin:10px;
display:inline-block;
border:4px solid #ff4d6d;
}

.story img{
width:100%;
height:100%;
object-fit:cover;
}

input{
padding:10px;
margin-top:20px;
width:220px;
}

button{
padding:10px 20px;
border:none;
border-radius:20px;
background:#ff4d6d;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<h2>Stories</h2>

<div id="stories"></div>

<br>

<input id="storyImage" placeholder="Image URL">

<button onclick="addStory()">Add Story</button>


<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>

const firebaseConfig={
apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh"
}

firebase.initializeApp(firebaseConfig)

const db=firebase.firestore()

let currentUser=null

firebase.auth().onAuthStateChanged(user=>{

currentUser=user

loadStories()

})


function addStory(){

let img=document.getElementById("storyImage").value

db.collection("stories").add({

user:currentUser.uid,
image:img,
time:Date.now()

})

alert("Story added")

}


function loadStories(){

db.collection("stories").get().then(snapshot=>{

snapshot.forEach(doc=>{

let data=doc.data()

let div=document.createElement("div")

div.className="story"

div.innerHTML="<img src='"+data.image+"'>"

document.getElementById("stories").appendChild(div)

})

})

}

</script>

</body>

</html>
