<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stories</title>

<style>

body{
font-family:Arial;
background:#f3f3f3;
text-align:center;
}

.story{

display:inline-block;
margin:10px;

}

.story img{

width:80px;
height:80px;
border-radius:50%;
border:3px solid #ff4d6d;

}

.viewer img{

width:320px;
border-radius:20px;
margin-top:20px;

}

</style>

</head>

<body>

<h2>Stories</h2>

<input id="url" placeholder="Story Image URL">

<button onclick="addStory()">Add Story</button>

<br><br>

<div id="stories"></div>

<div class="viewer">

<img id="viewer">

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>

const firebaseConfig={
apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh"
}

firebase.initializeApp(firebaseConfig)

const db=firebase.firestore()

function addStory(){

let url=document.getElementById("url").value

let user=firebase.auth().currentUser

db.collection("stories").add({

user:user.uid,
photo:url,
time:Date.now()

})

alert("Story added")

loadStories()

}


function loadStories(){

db.collection("stories").get().then(snapshot=>{

snapshot.forEach(doc=>{

let data=doc.data()

let div=document.createElement("div")

div.className="story"

div.innerHTML=`
<img src="${data.photo}">
`

div.onclick=function(){

document.getElementById("viewer").src=data.photo

}

document.getElementById("stories").appendChild(div)

})

})

}

loadStories()

</script>

</body>

</html>
