<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Stream</title>

<style>

body{
margin:0;
font-family:Arial;
background:#000;
color:white;
text-align:center;
padding-bottom:80px;
}

.header{
background:#ff4d6d;
padding:20px;
font-size:22px;
}

video{
width:100%;
max-width:400px;
border-radius:20px;
margin-top:20px;
}

button{
padding:12px 25px;
border:none;
border-radius:30px;
font-size:18px;
background:#ff4d6d;
color:white;
margin-top:20px;
cursor:pointer;
}

.navbar{
position:fixed;
bottom:0;
left:0;
width:100%;
height:70px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -5px 15px rgba(0,0,0,0.2);
}

.navbar a{
text-decoration:none;
font-size:26px;
color:black;
}

</style>

</head>

<body>

<div class="header">
Live Stream 🎥
</div>

<video id="liveVideo" autoplay muted></video>

<br>

<button onclick="startLive()">Start Live</button>

<div class="navbar">

<a href="discover.html">🔥</a>

<a href="matches.html">❤️</a>

<a href="chat.html">💬</a>

<a href="notifications.html">🔔</a>

<a href="profile.html">👤</a>

</div>

<script>

async function startLive(){

let video=document.getElementById("liveVideo")

let stream=await navigator.mediaDevices.getUserMedia({

video:true,
audio:true

})

video.srcObject=stream

}

</script>

</body>

</html>
