<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Manage Users</title><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><style>

body{
font-family:Arial;
background:#f5f5f5;
margin:0;
}

.header{
background:#111;
color:white;
padding:15px;
text-align:center;
font-size:22px;
}

.container{
padding:20px;
max-width:700px;
margin:auto;
}

.user{
background:white;
padding:15px;
margin-bottom:10px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

button{
margin-top:10px;
margin-right:10px;
padding:8px 15px;
border:none;
border-radius:8px;
cursor:pointer;
}

.ban{
background:red;
color:white;
}

.delete{
background:black;
color:white;
}

</style></head><body><div class="header">Manage Users

</div><div class="container" id="users"></div><script>

const firebaseConfig = {

apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh"

}

firebase.initializeApp(firebaseConfig)

const db = firebase.firestore()

const ADMIN_EMAIL="YOUR_EMAIL@gmail.com"

firebase.auth().onAuthStateChanged(user=>{

if(!user){

window.location="login.html"
return

}

if(user.email !== ADMIN_EMAIL){

document.body.innerHTML="Access denied"
return

}

loadUsers()

})

function loadUsers(){

db.collection("users").get().then(snapshot=>{

let html=""

snapshot.forEach(doc=>{

let u=doc.data()

html+=`

<div class="user">

<b>${u.name}</b><br>

${u.country}

<br>

<button class="ban" onclick="banUser('${doc.id}')">Ban</button>

<button class="delete" onclick="deleteUser('${doc.id}')">Delete</button>

</div>

`

})

document.getElementById("users").innerHTML=html

})

}

function banUser(id){

db.collection("users").doc(id).update({

banned:true

})

alert("User banned")

}

function deleteUser(id){

db.collection("users").doc(id).delete()

alert("User deleted")

}

</script></body></html>
