<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>Admin Panel</title><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script><style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
}

.card{
width:300px;
margin:20px auto;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

button{
padding:10px 20px;
background:red;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
margin:10px;
}

</style></head><body><h1>Admin Panel</h1><div id="users"></div><script>

const firebaseConfig = {
apiKey: "AIzaSyAA0xYFglY_ONI-PstgS4nP3uNIpyA",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.appspot.com",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.firestore();

const usersDiv=document.getElementById("users");

db.collection("users").get().then((snapshot)=>{

snapshot.forEach((doc)=>{

let u=doc.data();

let card=document.createElement("div");

card.className="card";

card.innerHTML=`

<img src="${u.photo}">

<h2>${u.name}</h2>

<p>${u.city} • ${u.country}</p>

<button onclick="deleteUser('${doc.id}')">Delete User</button>

`;

usersDiv.appendChild(card);

});

});


function deleteUser(id){

db.collection("users").doc(id).delete();

alert("User deleted");

location.reload();

}

</script></body>
</html>
