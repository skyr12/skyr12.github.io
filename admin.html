<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Dashboard</title><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><style>

body{
margin:0;
font-family:Arial;
background:#f5f5f5;
}

.header{
background:#111;
color:white;
padding:20px;
text-align:center;
font-size:22px;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
padding:30px;
max-width:800px;
margin:auto;
}

.card{
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 10px 20px rgba(0,0,0,0.15);
text-align:center;
}

.number{
font-size:35px;
color:#ff4d6d;
margin-top:10px;
}

</style></head><body><div class="header">Admin Dashboard

</div><div class="stats"><div class="card">
Users
<div id="users" class="number">0</div>
</div><div class="card">
Matches
<div id="matches" class="number">0</div>
</div><div class="card">
Messages
<div id="messages" class="number">0</div>
</div><div class="card">
Gifts
<div id="gifts" class="number">0</div>
</div></div><script>

const firebaseConfig = {

apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh"

}

firebase.initializeApp(firebaseConfig)

const db = firebase.firestore()

const ADMIN_EMAIL = "YOUR_EMAIL@gmail.com"

firebase.auth().onAuthStateChanged(user=>{

if(!user){

window.location="login.html"
return

}

if(user.email !== ADMIN_EMAIL){

document.body.innerHTML="Access denied"
return

}

loadStats()

})

function loadStats(){

db.collection("users").get().then(snap=>{
document.getElementById("users").innerText=snap.size
})

db.collection("matches").get().then(snap=>{
document.getElementById("matches").innerText=snap.size
})

db.collection("messages").get().then(snap=>{
document.getElementById("messages").innerText=snap.size
})

db.collection("gifts").get().then(snap=>{
document.getElementById("gifts").innerText=snap.size
})

}

</script></body></html>
