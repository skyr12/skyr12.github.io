<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

.header{
background:#ff4d6d;
color:white;
padding:20px;
text-align:center;
font-size:24px;
}

.container{
padding:20px;
}

.box{
background:white;
margin:15px 0;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

button{
padding:10px 15px;
border:none;
border-radius:10px;
background:#ff4d6d;
color:white;
cursor:pointer;
}

.user{
display:flex;
justify-content:space-between;
margin:10px 0;
}

</style>

</head>

<body>

<div class="header">
Admin Dashboard
</div>

<div class="container">

<div class="box">

<h3>📊 Site Stats</h3>

<p>Total Users: <span id="usersCount">0</span></p>

<p>Total Coins: <span id="coinsCount">0</span></p>

</div>

<div class="box">

<h3>👥 Manage Users</h3>

<div id="usersList"></div>

</div>

<div class="box">

<h3>🏆 Leaderboard</h3>

<div id="leaderboard"></div>

</div>

</div>

<script>

let users=[

{name:"Sara",coins:120},

{name:"John",coins:80},

{name:"Anna",coins:200},

{name:"Omar",coins:50}

]

function loadUsers(){

let list=document.getElementById("usersList")

list.innerHTML=""

users.forEach((u,i)=>{

let div=document.createElement("div")

div.className="user"

div.innerHTML=`

<span>${u.name} - ${u.coins} coins</span>

<button onclick="deleteUser(${i})">Delete</button>

`

list.appendChild(div)

})

document.getElementById("usersCount").innerText=users.length

}

function loadLeaderboard(){

let board=document.getElementById("leaderboard")

board.innerHTML=""

let sorted=[...users].sort((a,b)=>b.coins-a.coins)

sorted.forEach((u,i)=>{

let div=document.createElement("div")

div.innerHTML=`${i+1}. ${u.name} (${u.coins} coins)`

board.appendChild(div)

})

let total=users.reduce((sum,u)=>sum+u.coins,0)

document.getElementById("coinsCount").innerText=total

}

function deleteUser(i){

users.splice(i,1)

loadUsers()

loadLeaderboard()

}

loadUsers()

loadLeaderboard()

</script>

</body>

</html>
