<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Panel</title><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><style>

body{
margin:0;
font-family:Arial;
background:#f5f5f5;
text-align:center;
}

.header{
background:#111;
color:white;
padding:15px;
font-size:22px;
}

.container{
padding:30px;
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
max-width:600px;
margin:auto;
}

.box{
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 10px 20px rgba(0,0,0,0.15);
cursor:pointer;
}

.box:hover{
background:#ff4d6d;
color:white;
}

</style></head><body><div class="header">Admin Panel

</div><div class="container"><div class="box" onclick="backup()">Backup Database

</div><div class="box" onclick="loadUsers()">View Users

</div><div class="box" onclick="loadMatches()">View Matches

</div><div class="box" onclick="loadGifts()">View Gifts

</div></div><div id="result"></div><script>

const firebaseConfig = {

apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh"

}

firebase.initializeApp(firebaseConfig)

const db = firebase.firestore()

const ADMIN_EMAIL = "YOUR_EMAIL@gmail.com"

firebase.auth().onAuthStateChanged(user=>{

if(!user){

window.location="login.html"
return

}

if(user.email !== ADMIN_EMAIL){

document.body.innerHTML = "Access denied"

}

})

async function backup(){

let collections = ["users","likes","matches","messages"]

let data = {}

for(let col of collections){

let snap = await db.collection(col).get()

data[col] = []

snap.forEach(doc=>{

data[col].push(doc.data())

})

}

let blob = new Blob([JSON.stringify(data)],{type:"application/json"})

let a = document.createElement("a")

a.href = URL.createObjectURL(blob)

a.download = "backup.json"

a.click()

}

function loadUsers(){

db.collection("users").get().then(snap=>{

let html="<h2>Users</h2>"

snap.forEach(doc=>{

let u=doc.data()

html+= "<p>"+u.name+" - "+u.country+"</p>"

})

document.getElementById("result").innerHTML=html

})

}

function loadMatches(){

db.collection("matches").get().then(snap=>{

let html="<h2>Matches</h2>"

snap.forEach(doc=>{

html+= "<p>"+JSON.stringify(doc.data().users)+"</p>"

})

document.getElementById("result").innerHTML=html

})

}

function loadGifts(){

db.collection("gifts").get().then(snap=>{

let html="<h2>Gifts</h2>"

snap.forEach(doc=>{

let g=doc.data()

html+= "<p>"+g.gift+"</p>"

})

document.getElementById("result").innerHTML=html

})

}

</script></body></html>
