<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<style>

body{
font-family:Arial;
background:#f3f3f3;
text-align:center;
}

.card{

background:white;
width:320px;
margin:auto;
margin-top:20px;
padding:20px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,0.1);

}

img{
width:80px;
height:80px;
border-radius:50%;
}

button{

padding:8px 15px;
border:none;
border-radius:15px;
margin:5px;
cursor:pointer;

}

.block{
background:red;
color:white;
}

.unblock{
background:green;
color:white;
}

</style>

</head>

<body>

<h2>Admin Panel</h2>

<h3>Users</h3>

<div id="users"></div>

<h3>Reports</h3>

<div id="reports"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.firebasestorage.app",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.firestore();


function loadUsers(){

db.collection("users").get().then(snapshot=>{

snapshot.forEach(doc=>{

let data=doc.data();

let div=document.createElement("div");

div.className="card";

div.innerHTML=`

<img src="${data.photo}">

<h3>${data.name}</h3>

<p>${data.city} , ${data.country}</p>

<p>Age: ${data.age}</p>

<button class="block" onclick="blockUser('${doc.id}')">
Block
</button>

<button class="unblock" onclick="unblockUser('${doc.id}')">
Unblock
</button>

`;

document.getElementById("users").appendChild(div);

});

});

}


function blockUser(id){

db.collection("users").doc(id).update({

blocked:true

}).then(()=>{

alert("User blocked");

location.reload();

});

}


function unblockUser(id){

db.collection("users").doc(id).update({

blocked:false

}).then(()=>{

alert("User unblocked");

location.reload();

});

}


function loadReports(){

db.collection("reports").get().then(snapshot=>{

snapshot.forEach(doc=>{

let r=doc.data();

let div=document.createElement("div");

div.className="card";

div.innerHTML=`

<p>Reported User: ${r.to}</p>

<p>Reason: ${r.reason}</p>

`;

document.getElementById("reports").appendChild(div);

});

});

}


loadUsers();

loadReports();

</script>

</body>

</html>
