<!DOCTYPE html>
<html>

<head>

<title>Video Call</title>

<style>

body{
font-family:Arial;
background:#111;
color:white;
text-align:center;
margin:0;
}

.header{
background:#ff4d6d;
padding:15px;
font-size:20px;
}

video{
width:90%;
margin-top:20px;
border-radius:10px;
}

button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:25px;
background:#ff4d6d;
color:white;
font-size:16px;
}

</style>

</head>

<body>

<div class="header">🎥 Video Call</div>

<video id="localVideo" autoplay muted></video>

<br>

<button onclick="startCall()">Start Camera</button>

<script>

let video=document.getElementById("localVideo")

function startCall(){

navigator.mediaDevices.getUserMedia({
video:true,
audio:true
})
.then(stream=>{

video.srcObject=stream

})

}

</script>

</body>

</html>
