<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Call</title><style>

body{
margin:0;
background:black;
text-align:center;
color:white;
font-family:Arial;
}

.header{
background:#ff4d6d;
padding:10px;
font-size:18px;
}

video{
width:90%;
margin-top:10px;
border-radius:10px;
}

button{
background:#ff4d6d;
color:white;
border:none;
padding:12px 20px;
margin:10px;
border-radius:25px;
font-size:16px;
}

</style></head><body><div class="header">🎥 Video Call</div><video id="localVideo" autoplay muted></video>

<video id="remoteVideo" autoplay></video>

<br><button onclick="startCall()">Start Camera</button>

<button onclick="endCall()">End</button>

<script>

let localStream

async function startCall(){

localStream = await navigator.mediaDevices.getUserMedia({

video:true,
audio:true

})

document.getElementById("localVideo").srcObject = localStream

}


function endCall(){

localStream.getTracks().forEach(track=>track.stop())

alert("Call ended")

}

</script></body>
</html>
