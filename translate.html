<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Translate Message</title>

<style>

body{
font-family:Arial;
background:#f3f3f3;
text-align:center;
}

textarea{
width:300px;
height:100px;
margin-top:20px;
}

button{
padding:10px 20px;
background:#ff4d6d;
color:white;
border:none;
border-radius:20px;
cursor:pointer;
margin-top:10px;
}

.result{
margin-top:20px;
font-size:18px;
}

</style>

</head>

<body>

<h2>Translate Chat</h2>

<textarea id="text" placeholder="Type message"></textarea>

<br>

<button onclick="translateText()">
Translate
</button>

<div class="result" id="result"></div>

<script>

async function translateText(){

let text=document.getElementById("text").value

let res=await fetch(
"https://api.mymemory.translated.net/get?q="+text+"&langpair=en|fa"
)

let data=await res.json()

document.getElementById("result").innerText=
data.responseData.translatedText

}

</script>

</body>

</html>
