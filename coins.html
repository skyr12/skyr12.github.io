<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coins</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
text-align:center;
padding-bottom:80px;
}

.header{
background:#ff4d6d;
color:white;
padding:20px;
font-size:22px;
}

.pack{
width:90%;
max-width:400px;
margin:20px auto;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.price{
font-size:24px;
color:#ff4d6d;
}

button{
padding:12px 20px;
border:none;
background:#ff4d6d;
color:white;
border-radius:20px;
font-size:16px;
}

.navbar{
position:fixed;
bottom:0;
left:0;
width:100%;
height:65px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -5px 15px rgba(0,0,0,0.15);
}

.navbar a{
text-decoration:none;
font-size:24px;
color:#444;
}

</style>

</head>

<body>

<div class="header">
Buy Coins 🪙
</div>

<div class="pack">

<h2>100 Coins</h2>

<div class="price">$1.99</div>

<br>

<button onclick="buy(100)">Buy</button>

</div>

<div class="pack">

<h2>500 Coins</h2>

<div class="price">$6.99</div>

<br>

<button onclick="buy(500)">Buy</button>

</div>

<div class="pack">

<h2>1000 Coins</h2>

<div class="price">$12.99</div>

<br>

<button onclick="buy(1000)">Buy</button>

</div>

<div class="navbar">
<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="chat.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="profile.html">👤</a>
</div>

<script>

function buy(amount){

alert("You bought "+amount+" coins 🪙")

}

</script>

</body>
</html>
