<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Notifications</title><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
}

.header{
background:#ff4d6d;
color:white;
padding:20px;
text-align:center;
font-size:22px;
}

.container{
padding:20px;
max-width:500px;
margin:auto;
}

.notification{
background:white;
padding:15px;
margin-bottom:10px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

</style></head><body><div class="header">Notifications

</div><div class="container" id="notifications"></div><script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh"

}

firebase.initializeApp(firebaseConfig)

const db=firebase.firestore()

firebase.auth().onAuthStateChanged(user=>{

if(!user){

window.location="login.html"
return

}

loadNotifications(user.uid)

})

function loadNotifications(uid){

db.collection("notifications")

.where("to","==",uid)

.orderBy("time","desc")

.onSnapshot(snapshot=>{

let html=""

snapshot.forEach(doc=>{

let n=doc.data()

html+=`

<div class="notification">

${n.text}

</div>

`

})

document.getElementById("notifications").innerHTML=html

})

}

</script></body></html>
