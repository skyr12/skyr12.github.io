<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اعلان‌ها | همدم</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        .notification-card {
            background: white;
            border-radius: 20px;
            margin: 15px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            position: relative;
        }
        
        .notification-card:hover {
            transform: translateX(-5px);
            box-shadow: 0 10px 25px rgba(255,77,109,0.15);
        }
        
        .notification-card.unread {
            background: #fff5f5;
            border-right: 4px solid #ff4d6d;
        }
        
        .notification-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4d6d20, #ff8a5c20);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .notification-content {
            flex: 1;
        }
        
        .notification-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .notification-text {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .notification-time {
            font-size: 11px;
            color: #999;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .notification-actions {
            display: flex;
            gap: 10px;
        }
        
        .action-icon {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .action-icon.delete {
            background: #fee2e2;
            color: #ef4444;
        }
        
        .action-icon.delete:hover {
            background: #ef4444;
            color: white;
        }
        
        .empty-notifications {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 20px;
            margin: 15px;
        }
        
        .notification-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #ff4d6d;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
        }
        
        .filter-buttons {
            display: flex;
            gap: 10px;
            margin: 15px;
        }
        
        .filter-btn {
            background: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .filter-btn.active {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
        }
    </style>
</head>
<body>
    <!-- هدر -->
    <div class="header">
        <div class="logo">
            <span>🔔</span>
            اعلان‌ها
        </div>
        <div class="wallet" onclick="location.href='wallet.html'">
            <span>🪙</span>
            <span class="user-coins">۰</span>
        </div>
    </div>

    <!-- تب‌ها -->
    <div class="tabs">
        <div class="tab" onclick="location.href='index.html'">خانه</div>
        <div class="tab" onclick="location.href='discover.html'">اکتشاف</div>
        <div class="tab" onclick="location.href='live.html'">لایو</div>
        <div class="tab" onclick="location.href='gifts.html'">هدایا</div>
        <div class="tab active" onclick="location.href='profile.html'">پروفایل</div>
    </div>

    <!-- فیلترها -->
    <div class="filter-buttons">
        <button class="filter-btn active" onclick="filterNotifications('all')">همه</button>
        <button class="filter-btn" onclick="filterNotifications('unread')">خوانده نشده</button>
        <button class="filter-btn" onclick="filterNotifications('likes')">لایک‌ها</button>
        <button class="filter-btn" onclick="filterNotifications('matches')">تطابق‌ها</button>
    </div>

    <!-- لیست اعلان‌ها -->
    <div id="notificationsList">
        <!-- با JS لود میشه -->
    </div>

    <!-- دکمه پاک کردن همه -->
    <button class="btn btn-secondary" style="margin: 15px; width: calc(100% - 30px);" onclick="clearAllNotifications()">
        پاک کردن همه اعلان‌ها
    </button>

    <!-- نوار پایین -->
    <div class="navbar">
        <a href="index.html" class="nav-item">🏠</a>
        <a href="discover.html" class="nav-item">🔥</a>
        <a href="live.html" class="nav-item">🎥</a>
        <a href="gifts.html" class="nav-item">🎁</a>
        <a href="profile.html" class="nav-item active">👤</a>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage.js"></script>
    <script src="assets/script.js"></script>

    <script>
        let allNotifications = [];
        let currentFilter = 'all';
        let unsubscribeNotifications = null;
        
        // لود اعلان‌ها
        function loadNotifications() {
            if (!currentUser) {
                useSampleNotifications();
                return;
            }
            
            if (unsubscribeNotifications) {
                unsubscribeNotifications();
            }
            
            unsubscribeNotifications = db.collection('notifications')
                .where('userId', '==', currentUser.uid)
                .orderBy('time', 'desc')
                .onSnapshot(snapshot => {
                    allNotifications = [];
                    
                    snapshot.forEach(doc => {
                        allNotifications.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                    
                    displayNotifications();
                    updateNotificationBadge();
                }, error => {
                    console.error('Error loading notifications:', error);
                    useSampleNotifications();
                });
        }
        
        // استفاده از نمونه
        function useSampleNotifications() {
            allNotifications = [
                {
                    id: '1',
                    type: 'like',
                    icon: '❤️',
                    title: 'لایک جدید',
                    text: 'علی رضایی به شما لایک داد',
                    time: new Date(Date.now() - 1800000),
                    read: false
                },
                {
                    id: '2',
                    type: 'match',
                    icon: '💕',
                    title: 'تطابق جدید',
                    text: 'شما و سارا محمدی یک تطابق دارید',
                    time: new Date(Date.now() - 86400000),
                    read: true
                },
                {
                    id: '3',
                    type: 'gift',
                    icon: '🎁',
                    title: 'هدیه دریافت کردید',
                    text: 'مریم کریمی برای شما گل رز فرستاد',
                    time: new Date(Date.now() - 172800000),
                    read: false
                },
                {
                    id: '4',
                    type: 'visit',
                    icon: '👁️',
                    title: 'بازدید پروفایل',
                    text: 'رضا احمدی از پروفایل شما بازدید کرد',
                    time: new Date(Date.now() - 259200000),
                    read: true
                },
                {
                    id: '5',
                    type: 'system',
                    icon: '🔔',
                    title: 'اعلان سیستم',
                    text: 'به جمع همدم خوش آمدید',
                    time: new Date(Date.now() - 604800000),
                    read: true
                }
            ];
            
            displayNotifications();
        }
        
        // نمایش اعلان‌ها
        function displayNotifications() {
            let filtered = allNotifications;
            
            if (currentFilter === 'unread') {
                filtered = allNotifications.filter(n => !n.read);
            } else if (currentFilter === 'likes') {
                filtered = allNotifications.filter(n => n.type === 'like');
            } else if (currentFilter === 'matches') {
                filtered = allNotifications.filter(n => n.type === 'match');
            }
            
            if (filtered.length === 0) {
                showEmptyNotifications();
                return;
            }
            
            let html = '';
            
            filtered.forEach(notification => {
                const timeAgo = notification.time ? timeAgo(notification.time) : 'جدید';
                
                html += `
                    <div class="notification-card ${!notification.read ? 'unread' : ''}" onclick="markAsRead('${notification.id}')">
                        <div class="notification-icon">${notification.icon || '🔔'}</div>
                        <div class="notification-content">
                            <div class="notification-title">${notification.title}</div>
                            <div class="notification-text">${notification.text}</div>
                            <div class="notification-time">
                                <span>🕒</span>
                                <span>${timeAgo}</span>
                            </div>
                        </div>
                        <div class="notification-actions">
                            <div class="action-icon delete" onclick="deleteNotification('${notification.id}', event)">✕</div>
                        </div>
                    </div>
                `;
            });
            
            document.getElementById('notificationsList').innerHTML = html;
        }
        
        // نمایش حالت خالی
        function showEmptyNotifications() {
            let message = 'هیچ اعلانی وجود ندارد';
            if (currentFilter === 'unread') message = 'اعلان خوانده نشده‌ای ندارید';
            if (currentFilter === 'likes') message = 'لایک جدیدی ندارید';
            if (currentFilter === 'matches') message = 'تطابق جدیدی ندارید';
            
            document.getElementById('notificationsList').innerHTML = `
                <div class="empty-notifications">
                    <div class="empty-emoji">📭</div>
                    <h3 style="margin-bottom: 10px;">${message}</h3>
                    <p style="color: #666;">به زودی اینجا به روز میشه</p>
                </div>
            `;
        }
        
        // فیلتر اعلان‌ها
        function filterNotifications(filter) {
            currentFilter = filter;
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            displayNotifications();
        }
        
        // مارک به عنوان خوانده شده
        function markAsRead(notificationId) {
            const notification = allNotifications.find(n => n.id === notificationId);
            if (notification && !notification.read) {
                notification.read = true;
                
                if (currentUser) {
                    db.collection('notifications').doc(notificationId).update({
                        read: true
                    });
                }
                
                displayNotifications();
                updateNotificationBadge();
            }
        }
        
        // حذف اعلان
        function deleteNotification(notificationId, event) {
            event.stopPropagation();
            
            if (confirm('آیا از حذف این اعلان اطمینان دارید؟')) {
                allNotifications = allNotifications.filter(n => n.id !== notificationId);
                
                if (currentUser) {
                    db.collection('notifications').doc(notificationId).delete();
                }
                
                displayNotifications();
                updateNotificationBadge();
                showToast('✅ اعلان حذف شد');
            }
        }
        
        // پاک کردن همه اعلان‌ها
        function clearAllNotifications() {
            if (confirm('آیا از پاک کردن همه اعلان‌ها اطمینان دارید؟')) {
                allNotifications = [];
                
                if (currentUser) {
                    // حذف همه از Firebase
                    allNotifications.forEach(n => {
                        db.collection('notifications').doc(n.id).delete();
                    });
                }
                
                displayNotifications();
                updateNotificationBadge();
                showToast('✅ همه اعلان‌ها پاک شدند');
            }
        }
        
        // بروزرسانی نشانگر اعلان
        function updateNotificationBadge() {
            const unreadCount = allNotifications.filter(n => !n.read).length;
            
            // بروزرسانی در localStorage برای نمایش در منو
            localStorage.setItem('notificationBadge', unreadCount);
            
            // بروزرسانی در منوی پایین (اگه badge داریم)
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                if (item.textContent.includes('🔔')) {
                    if (unreadCount > 0) {
                        let badge = item.querySelector('.nav-badge');
                        if (!badge) {
                            badge = document.createElement('span');
                            badge.className = 'nav-badge';
                            item.appendChild(badge);
                        }
                        badge.textContent = unreadCount;
                    } else {
                        const badge = item.querySelector('.nav-badge');
                        if (badge) badge.remove();
                    }
                }
            });
        }
        
        // لود اولیه
        document.addEventListener('DOMContentLoaded', () => {
            loadNotifications();
        });
        
        // پاکسازی شنونده
        window.addEventListener('beforeunload', () => {
            if (unsubscribeNotifications) {
                unsubscribeNotifications();
            }
        });
    </script>
</body>
</html>
