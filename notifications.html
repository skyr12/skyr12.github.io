<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
padding-bottom:80px;
}

.header{
background:#ff4d6d;
color:white;
padding:20px;
text-align:center;
font-size:22px;
}

.notification-list{
width:90%;
max-width:400px;
margin:20px auto;
}

.notification{
background:white;
padding:15px;
margin-bottom:10px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.navbar{
position:fixed;
bottom:0;
left:0;
width:100%;
height:65px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -5px 15px rgba(0,0,0,0.15);
}

.navbar a{
text-decoration:none;
font-size:24px;
color:#444;
}

</style>

</head>

<body>

<div class="header">
Notifications 🔔
</div>

<div id="notifications" class="notification-list"></div>

<div class="navbar">
<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="chat.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="profile.html">👤</a>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

var firebaseConfig = {

apiKey:"YOUR_API_KEY",
authDomain:"YOUR_PROJECT.firebaseapp.com",
projectId:"YOUR_PROJECT_ID"

};

firebase.initializeApp(firebaseConfig)

var db = firebase.firestore()

let currentUser="user1"

function loadNotifications(){

db.collection("notifications")
.orderBy("time","desc")
.onSnapshot(snapshot=>{

let html=""

snapshot.forEach(doc=>{

let data=doc.data()

html+=`<div class="notification">${data.text}</div>`

})

document.getElementById("notifications").innerHTML=html

})

}

loadNotifications()

</script>

</body>
</html>
