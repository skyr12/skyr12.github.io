<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
text-align:center;
font-size:20px;
}

.note{
background:white;
margin:10px;
padding:15px;
border-radius:10px;
}

.navbar{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
font-size:22px;
}

</style>

</head>

<body>

<div class="header">🔔 Notifications</div>

<div id="notes"></div>

<div class="navbar">
<a href="discover.html">🔥</a>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh",
storageBucket:"nimeh-gomsodeh.firebasestorage.app",
messagingSenderId:"815930956932",
appId:"1:815930956932:web:e8696a6a69b4458fd936d1"

};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig)
}

const db=firebase.firestore()

firebase.auth().onAuthStateChanged(user=>{

if(!user){

location.href="login.html"
return

}

loadNotes(user.uid)

})

function loadNotes(uid){

db.collection("notifications")
.where("to","==",uid)
.orderBy("time","desc")
.onSnapshot(snapshot=>{

let html=""

snapshot.forEach(doc=>{

let n=doc.data()

html+=`

<div class="note">

${n.text}

</div>

`

})

document.getElementById("notes").innerHTML=html

})

}

</script>

</body>
</html>
