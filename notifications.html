<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Notifications</title><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
text-align:center;
font-size:20px;
}

.list{
padding:10px;
}

.item{
background:white;
padding:15px;
margin:10px 0;
border-radius:10px;
box-shadow:0 5px 10px rgba(0,0,0,0.1);
}

.time{
font-size:12px;
color:gray;
margin-top:5px;
}

</style></head><body><div class="header">Notifications

</div><div class="list" id="list"></div><script>

const firebaseConfig = {

apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh"

}

firebase.initializeApp(firebaseConfig)

const db = firebase.firestore()

firebase.auth().onAuthStateChanged(user=>{

if(!user){

window.location="login.html"
return

}

loadNotifications(user.uid)

})

function loadNotifications(uid){

db.collection("notifications")
.where("user","==",uid)
.orderBy("time","desc")
.onSnapshot(snapshot=>{

let box=document.getElementById("list")
box.innerHTML=""

snapshot.forEach(doc=>{

let n=doc.data()

let div=document.createElement("div")
div.className="item"

div.innerHTML=`
<div>${n.text}</div>
<div class="time">${new Date(n.time).toLocaleString()}</div>
`

box.appendChild(div)

})

})

}

</script></body></html>
