<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اعلان‌ها | نیمه گمشده</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f5f5f5;
            min-height: 100vh;
            padding-bottom: 70px;
        }

        .header {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 24px;
        }

        .header h1 {
            font-size: 22px;
            flex: 1;
        }

        .notification-card {
            background: white;
            margin: 15px;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            position: relative;
        }

        .notification-card.unread {
            background: #fff5f5;
            border-right: 3px solid #ff4d6d;
        }

        .notification-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .notification-content {
            flex: 1;
        }

        .notification-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 3px;
        }

        .notification-text {
            color: #666;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .notification-time {
            color: #999;
            font-size: 11px;
        }

        .unread-dot {
            position: absolute;
            top: 20px;
            left: 15px;
            width: 10px;
            height: 10px;
            background: #ff4d6d;
            border-radius: 50%;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #ddd;
        }

        .nav-item {
            text-decoration: none;
            color: #999;
            font-size: 24px;
        }

        .nav-item.active {
            color: #ff4d6d;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="back-btn">←</a>
        <h1>اعلان‌ها</h1>
        <div></div>
    </div>

    <div class="notification-card unread">
        <div class="notification-icon">❤️</div>
        <div class="notification-content">
            <div class="notification-title">لایک جدید</div>
            <div class="notification-text">سارا محمدی به شما لایک داد</div>
            <div class="notification-time">۲ دقیقه پیش</div>
        </div>
        <span class="unread-dot"></span>
    </div>

    <div class="notification-card unread">
        <div class="notification-icon">💕</div>
        <div class="notification-content">
            <div class="notification-title">تطابق جدید</div>
            <div class="notification-text">شما با علی رضایی تطابق دارید</div>
            <div class="notification-time">۱ ساعت پیش</div>
        </div>
        <span class="unread-dot"></span>
    </div>

    <div class="notification-card">
        <div class="notification-icon">👁️</div>
        <div class="notification-content">
            <div class="notification-title">بازدید پروفایل</div>
            <div class="notification-text">مریم کریمی از پروفایل شما بازدید کرد</div>
            <div class="notification-time">دیروز</div>
        </div>
    </div>

    <div class="notification-card">
        <div class="notification-icon">🎁</div>
        <div class="notification-content">
            <div class="notification-title">هدیه دریافت کردید</div>
            <div class="notification-text">کاربر مهمان برای شما گل رز فرستاد</div>
            <div class="notification-time">۳ روز پیش</div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item">🏠</a>
        <a href="discover.html" class="nav-item">🔍</a>
        <a href="matches.html" class="nav-item">❤️</a>
        <a href="profile.html" class="nav-item">👤</a>
    </div>
</body>
</html>
