<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications</title>

<style>

body{
font-family:Arial;
background:#f3f3f3;
text-align:center;
}

.card{
background:white;
width:320px;
margin:auto;
margin-top:20px;
padding:20px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<h2>Notifications</h2>

<div id="notifications"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.firebasestorage.app",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.firestore();


firebase.auth().onAuthStateChanged(user=>{

if(user){

loadNotifications(user.uid);

}

});


function loadNotifications(uid){

db.collection("notifications")
.where("to","==",uid)
.get()
.then(snapshot=>{

snapshot.forEach(doc=>{

const data=doc.data();

const div=document.createElement("div");

div.className="card";

div.innerHTML=`

<h3>${data.message}</h3>

`;

document.getElementById("notifications").appendChild(div);

});

});

}

</script>

</body>

</html>
