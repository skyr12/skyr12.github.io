<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
background:#f5f5f5;
margin:0;
}

h2{
text-align:center;
margin-top:20px;
}

#notifications{
padding:20px;
}

.card{

background:white;
padding:15px;
margin-bottom:10px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);

}

.navbar{

position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
font-size:22px;

}

.navbar a{

}

</style>

</head>

<body>

<h2>🔔 Notifications</h2>

<div id="notifications"></div>


<div class="navbar">

<a href="discover.html">🔥</a>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh",
storageBucket:"nimeh-gomsodeh.firebasestorage.app",
messagingSenderId:"815930956932",
appId:"1:815930956932:web:e8696a6a69b4458fd936d1"

};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig)
}

const db=firebase.firestore()

let myId=""

firebase.auth().onAuthStateChanged(user=>{

if(!user){

location.href="login.html"
return

}

myId=user.uid

loadNotifications()

})


function loadNotifications(){

db.collection("notifications")

.where("to","==",myId)

.orderBy("time","desc")

.onSnapshot(snapshot=>{

let html=""

snapshot.forEach(doc=>{

let n=doc.data()

html+=`

<div class="card">

${n.text}

</div>

`

})

document.getElementById("notifications").innerHTML=html

})

}

</script>

</body>
</html>
