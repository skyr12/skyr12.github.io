<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Account Verification</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
text-align:center;
padding-bottom:80px;
}

.header{
background:#ff4d6d;
color:white;
padding:20px;
font-size:22px;
}

.box{

background:white;
margin:30px;
padding:20px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);

}

input{

padding:12px;
width:80%;
margin:10px;
border-radius:10px;
border:1px solid #ccc;

}

button{

padding:12px 25px;
border:none;
border-radius:30px;
background:#ff4d6d;
color:white;
font-size:16px;

}

.success{

color:green;
margin-top:15px;

}

.navbar{

position:fixed;
bottom:0;
left:0;
width:100%;
height:70px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -5px 15px rgba(0,0,0,0.2);

}

.navbar a{

text-decoration:none;
font-size:26px;

}

</style>

</head>

<body>

<div class="header">
Verify Account ✔
</div>

<div class="box">

<p>Upload your ID or selfie to verify your profile</p>

<input type="file">

<br>

<button onclick="verify()">Submit Verification</button>

<div id="msg" class="success"></div>

</div>

<div class="navbar">

<a href="discover.html">🔥</a>

<a href="matches.html">❤️</a>

<a href="chat.html">💬</a>

<a href="notifications.html">🔔</a>

<a href="profile.html">👤</a>

</div>

<script>

function verify(){

document.getElementById("msg").innerText="✔ Your request has been sent for verification."

}

</script>

</body>

</html>
