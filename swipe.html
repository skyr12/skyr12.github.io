<!DOCTYPE html>
<html lang="fa">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پیدا کردن افراد</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#111;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
position:relative;
width:320px;
height:420px;
}

.card{
position:absolute;
width:100%;
height:100%;
background:#222;
border-radius:20px;
box-shadow:0 10px 40px rgba(0,0,0,0.6);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
transition:0.3s;
}

.avatar{
width:120px;
height:120px;
border-radius:50%;
background:#FF4D6D;
margin-bottom:20px;
}

h2{
margin:10px 0;
}

</style>

</head>

<body>

<div class="container">

<div class="card" id="card">

<div class="avatar"></div>

<h2 id="name">سارا</h2>

<p id="info">۲۶ ساله • تهران</p>

</div>

</div>

<script>

const users = [
{name:"سارا",age:26,city:"تهران"},
{name:"علی",age:29,city:"دبی"},
{name:"مریم",age:24,city:"استانبول"},
{name:"رضا",age:31,city:"برلین"}
]

let index = 0
let startX = 0

const card = document.getElementById("card")

card.addEventListener("touchstart",(e)=>{
startX = e.touches[0].clientX
})

card.addEventListener("touchend",(e)=>{

let endX = e.changedTouches[0].clientX

if(endX - startX > 100){
nextUser()
}

if(startX - endX > 100){
nextUser()
}

})

function nextUser(){

index++

if(index >= users.length){
index = 0
}

document.getElementById("name").innerText = users[index].name

document.getElementById("info").innerText =
users[index].age + " ساله • " + users[index].city

}

</script>

</body>
</html>
