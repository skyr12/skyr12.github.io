<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پیدا کردن افراد</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#111;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.container{
width:320px;
height:480px;
position:relative;
}

.card{
width:100%;
height:100%;
background:#222;
border-radius:20px;
box-shadow:0 10px 40px rgba(0,0,0,0.6);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
transition:0.4s;
}

.avatar{
width:160px;
height:160px;
border-radius:50%;
object-fit:cover;
margin-bottom:20px;
}

.buttons{
display:flex;
gap:40px;
margin-top:30px;
}

button{
width:60px;
height:60px;
border:none;
border-radius:50%;
font-size:24px;
cursor:pointer;
}

.nope{
background:#333;
color:#ff3b3b;
}

.like{
background:#FF4D6D;
color:white;
}

.matchPopup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
font-size:26px;
}

.matchPopup button{
margin-top:15px;
padding:12px 25px;
border:none;
border-radius:25px;
background:#FF4D6D;
color:white;
font-size:16px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<div class="card" id="card">

<img id="avatar" class="avatar">

<h2 id="name"></h2>

<p id="bio"></p>

<p id="distance"></p>

<div class="buttons">

<button class="nope" onclick="nope()">❌</button>

<button class="like" onclick="like()">❤️</button>

</div>

</div>

</div>

<div class="matchPopup" id="matchPopup">

🎉 Match شد!

<a href="chat.html">
<button>💬 شروع چت</button>
</a>

<a href="matches.html">
<button>❤️ دیدن Match ها</button>
</a>

<button onclick="closeMatch()">ادامه</button>

</div>

<script>

let users=[

{
name:"سارا",
bio:"علاقه‌مند به سفر",
distance:"📍 فاصله 3 km",
photo:"https://picsum.photos/300/300?1"
},

{
name:"امیر",
bio:"ورزشکار",
distance:"📍 فاصله 5 km",
photo:"https://picsum.photos/300/300?2"
},

{
name:"لیلا",
bio:"عاشق موسیقی",
distance:"📍 فاصله 8 km",
photo:"https://picsum.photos/300/300?3"
}

]

let index=0

function showUser(){

let u=users[index]

document.getElementById("name").innerText=u.name
document.getElementById("bio").innerText=u.bio
document.getElementById("distance").innerText=u.distance
document.getElementById("avatar").src=u.photo

}

showUser()

function like(){

let matches = JSON.parse(localStorage.getItem("matches")) || []

matches.push(users[index])

localStorage.setItem("matches",JSON.stringify(matches))

document.getElementById("matchPopup").style.display="flex"

}

function nope(){

nextUser()

}

function closeMatch(){

document.getElementById("matchPopup").style.display="none"

nextUser()

}

function nextUser(){

index++

if(index>=users.length){

index=0

}

showUser()

}

</script>

</body>

</html>
