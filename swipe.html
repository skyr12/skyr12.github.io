<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سوایپ</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#020617;
color:white;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
height:100vh;
text-align:center;
}

.card{
background:#111;
padding:30px;
border-radius:20px;
width:300px;
box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

.avatar{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
margin-bottom:15px;
}

.name{
font-size:22px;
margin:5px;
}

.bio{
opacity:0.7;
margin-bottom:10px;
}

.city{
font-size:14px;
opacity:0.6;
}

.buttons{
margin-top:20px;
display:flex;
justify-content:center;
gap:20px;
}

button{
border:none;
padding:15px 20px;
border-radius:50%;
font-size:22px;
cursor:pointer;
}

.no{
background:#333;
color:red;
}

.like{
background:#FF4D6D;
color:white;
}

.match{
margin-top:30px;
background:#111;
padding:20px;
border-radius:20px;
display:none;
}

.match button{
margin-top:10px;
border-radius:20px;
padding:10px 20px;
font-size:14px;
}

</style>

</head>

<body>

<div class="card" id="card">

<img id="photo" class="avatar">

<div class="name" id="name"></div>

<div class="bio" id="bio"></div>

<div class="city" id="city"></div>

<div class="buttons">

<button class="no" onclick="dislike()">✖</button>

<button class="like" onclick="like()">❤</button>

</div>

</div>

<div class="match" id="matchBox">

<h2>🎉 Match شد!</h2>

<button onclick="goChat()">💬 شروع چت</button>

<button onclick="nextUser()">ادامه</button>

</div>

<script>

let users = JSON.parse(localStorage.getItem("users")) || []

if(users.length === 0){

users = [

{
name:"سارا",
age:27,
city:"تهران",
bio:"علاقه‌مند به سفر",
photo:"https://picsum.photos/300?1"
},

{
name:"آرمان",
age:29,
city:"اصفهان",
bio:"ورزشکار و کوهنورد",
photo:"https://picsum.photos/300?2"
},

{
name:"نسترن",
age:25,
city:"شیراز",
bio:"عاشق موسیقی",
photo:"https://picsum.photos/300?3"
},

{
name:"امیر",
age:31,
city:"مشهد",
bio:"برنامه نویس",
photo:"https://picsum.photos/300?4"
}

]

localStorage.setItem("users",JSON.stringify(users))

}

let index=0

function showUser(){

if(index >= users.length){

document.body.innerHTML="<h2>هیچ کاربری باقی نمانده</h2>"

return

}

let user=users[index]

document.getElementById("photo").src=user.photo
document.getElementById("name").innerText=user.name+" "+user.age
document.getElementById("bio").innerText=user.bio
document.getElementById("city").innerText="📍 "+user.city

}

function dislike(){

index++

showUser()

}

function like(){

let matches = JSON.parse(localStorage.getItem("matches")) || []

matches.push(users[index])

localStorage.setItem("matches",JSON.stringify(matches))

document.getElementById("matchBox").style.display="block"

}

function nextUser(){

document.getElementById("matchBox").style.display="none"

index++

showUser()

}

function goChat(){

window.location.href="matches.html"

}

showUser()

</script>

</body>

</html>
