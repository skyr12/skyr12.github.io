<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Discover</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
}

.card{
width:300px;
margin:auto;
background:white;
padding:20px;
border-radius:20px;
margin-top:40px;
}

img{
width:100%;
border-radius:15px;
}

button{
margin:10px;
padding:12px 20px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
}

.like{
background:#ff4d6d;
color:white;
}

.nope{
background:#ccc;
}

</style>

</head>

<body>

<h2>Discover People</h2>

<div id="card"></div>

<button class="nope" onclick="nextUser()">❌</button>
<button class="like" onclick="likeUser()">❤️</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
addDoc
} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.firebasestorage.app",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1",
measurementId: "G-KTCV2B5R9L"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

let users=[]
let index=0

async function loadUsers(){

let querySnapshot=await getDocs(collection(db,"users"))

querySnapshot.forEach((doc)=>{

users.push(doc.data())

})

showUser()

}

function showUser(){

if(users.length==0)return

let user=users[index]

document.getElementById("card").innerHTML=`

<div class="card">

<img src="https://randomuser.me/api/portraits/men/1.jpg">

<h3>${user.name}</h3>
<p>${user.city}</p>

</div>

`

}

window.nextUser=function(){

index++

if(index>=users.length)index=0

showUser()

}

window.likeUser=async function(){

let user=users[index]

await addDoc(collection(db,"likes"),{

name:user.name,
city:user.city

})

nextUser()

}

loadUsers()

</script>

</body>

</html>
