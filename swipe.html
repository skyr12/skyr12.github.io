<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سوایپ کاربران</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#111;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.container{
position:relative;
width:320px;
height:450px;
}

.card{
position:absolute;
width:100%;
height:100%;
background:#222;
border-radius:20px;
box-shadow:0 10px 40px rgba(0,0,0,0.6);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
transition:0.4s;
cursor:grab;
}

.avatar{
width:160px;
height:160px;
border-radius:50%;
object-fit:cover;
margin-bottom:20px;
}

.distance{
margin-top:5px;
opacity:0.7;
}

.likeLabel{
position:absolute;
top:40px;
left:20px;
border:3px solid #00ff6a;
padding:10px 20px;
font-weight:bold;
transform:rotate(-20deg);
color:#00ff6a;
display:none;
}

.nopeLabel{
position:absolute;
top:40px;
right:20px;
border:3px solid #ff3b3b;
padding:10px 20px;
font-weight:bold;
transform:rotate(20deg);
color:#ff3b3b;
display:none;
}

.matchPopup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-size:28px;
display:none;
}

.matchPopup button{
margin-top:20px;
padding:12px 25px;
background:#FF4D6D;
border:none;
border-radius:25px;
color:white;
cursor:pointer;
font-size:16px;
}

</style>

</head>

<body>

<div class="container">

<div class="card" id="card">

<div class="likeLabel" id="like">LIKE</div>
<div class="nopeLabel" id="nope">NOPE</div>

<img id="avatar" class="avatar">

<h2 id="name"></h2>

<p id="bio"></p>

<p id="distance" class="distance"></p>

</div>

</div>

<div class="matchPopup" id="matchPopup">

🎉 Match شد!

<a href="chat.html">
<button>💬 شروع چت</button>
</a>

<button onclick="closeMatch()">ادامه</button>

</div>

<script>

let users=[

{
name:"سارا",
bio:"علاقه‌مند به سفر",
distance:"3 km",
photo:"https://picsum.photos/300/300?1"
},

{
name:"امیر",
bio:"ورزشکار",
distance:"8 km",
photo:"https://picsum.photos/300/300?2"
},

{
name:"لیلا",
bio:"عاشق موسیقی",
distance:"5 km",
photo:"https://picsum.photos/300/300?3"
}

]

let index=0

function showUser(){

let u=users[index]

document.getElementById("name").innerText=u.name
document.getElementById("bio").innerText=u.bio
document.getElementById("distance").innerText="📍 فاصله: "+u.distance
document.getElementById("avatar").src=u.photo

}

showUser()

let startX=0
let card=document.getElementById("card")

card.addEventListener("mousedown",e=>{
startX=e.clientX
})

card.addEventListener("mouseup",e=>{
handleSwipe(e.clientX)
})

card.addEventListener("touchstart",e=>{
startX=e.touches[0].clientX
})

card.addEventListener("touchend",e=>{
handleSwipe(e.changedTouches[0].clientX)
})

function handleSwipe(endX){

if(endX-startX>100){

document.getElementById("like").style.display="block"

card.style.transform="translateX(400px) rotate(20deg)"

setTimeout(matchUser,400)

}

if(startX-endX>100){

document.getElementById("nope").style.display="block"

card.style.transform="translateX(-400px) rotate(-20deg)"

setTimeout(nextUser,400)

}

}

function matchUser(){

document.getElementById("matchPopup").style.display="flex"

}

function closeMatch(){

document.getElementById("matchPopup").style.display="none"

nextUser()

}

function nextUser(){

index++

if(index>=users.length){
index=0
}

document.getElementById("like").style.display="none"
document.getElementById("nope").style.display="none"

card.style.transform="none"

showUser()

}

</script>

</body>
</html>
