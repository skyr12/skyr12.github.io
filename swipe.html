<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پیدا کردن افراد</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.card{

background:#111;
padding:30px;
border-radius:20px;
width:300px;
text-align:center;

}

.avatar{

width:150px;
height:150px;
border-radius:50%;
object-fit:cover;
margin-bottom:15px;

}

.buttons{

display:flex;
justify-content:center;
gap:20px;
margin-top:20px;

}

button{

width:60px;
height:60px;
border-radius:50%;
border:none;
font-size:22px;
cursor:pointer;

}

.nope{

background:#333;
color:red;

}

.like{

background:#FF4D6D;
color:white;

}

</style>

</head>

<body>

<div class="card">

<img id="photo" class="avatar">

<h2 id="name"></h2>

<p id="city"></p>

<p id="bio"></p>

<div class="buttons">

<button class="nope" onclick="nope()">❌</button>

<button class="like" onclick="like()">❤️</button>

</div>

</div>

<script>

let users=[]

let name=localStorage.getItem("name")
let city=localStorage.getItem("city")
let bio=localStorage.getItem("bio")
let photo=localStorage.getItem("photo")

if(name){

users.push({

name:name,
city:city,
bio:bio,
photo:photo

})

}

let index=0

function showUser(){

let u=users[index]

document.getElementById("name").innerText=u.name

document.getElementById("city").innerText=u.city

document.getElementById("bio").innerText=u.bio

document.getElementById("photo").src=u.photo

}

showUser()

function like(){

alert("❤️ Match شد")

}

function nope(){

index++

if(index>=users.length){

index=0

}

showUser()

}

</script>

</body>
</html>
