<!DOCTYPE html>
<html lang="fa">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوایپ</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.card{
background:#111;
padding:30px;
border-radius:20px;
width:300px;
text-align:center;
}

.avatar{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
margin-bottom:15px;
}

.buttons{
margin-top:20px;
display:flex;
justify-content:center;
gap:20px;
}

button{
border:none;
padding:15px 20px;
border-radius:50%;
font-size:20px;
cursor:pointer;
}

.no{
background:#333;
color:red;
}

.like{
background:#FF4D6D;
color:white;
}

</style>

</head>

<body>

<div class="card">

<img id="photo" class="avatar">

<h2 id="name"></h2>

<p id="city"></p>

<p id="bio"></p>

<div class="buttons">

<button class="no" onclick="dislike()">❌</button>

<button class="like" onclick="like()">❤️</button>

</div>

</div>

<script>

let users = JSON.parse(localStorage.getItem("users")) || []

let index=0

function showUser(){

if(users.length===0){

document.body.innerHTML="<h2>هیچ کاربری ثبت نام نکرده</h2>"
return

}

let u=users[index]

document.getElementById("name").innerText=u.name
document.getElementById("city").innerText=u.city
document.getElementById("bio").innerText=u.bio
document.getElementById("photo").src=u.photo

}

function like(){

let matches = JSON.parse(localStorage.getItem("matches")) || []

matches.push(users[index])

localStorage.setItem("matches",JSON.stringify(matches))

alert("Match شد ❤️")

nextUser()

}

function dislike(){

nextUser()

}

function nextUser(){

index++

if(index>=users.length){

index=0

}

showUser()

}

showUser()

</script>

</body>

</html>
