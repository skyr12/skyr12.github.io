<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Swipe</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.card{
background:#111;
padding:30px;
border-radius:20px;
width:300px;
text-align:center;
position:absolute;
transition:0.3s;
}

.avatar{
width:150px;
height:150px;
border-radius:50%;
object-fit:cover;
margin-bottom:15px;
}

</style>

</head>

<body>

<div class="card" id="card">

<img id="photo" class="avatar">

<h2 id="name"></h2>

<p id="city"></p>

<p id="bio"></p>

</div>

<script>

let users = JSON.parse(localStorage.getItem("users")) || []

let index=0

function showUser(){

if(users.length===0){

document.body.innerHTML="<h2>هیچ کاربری وجود ندارد</h2>"

return

}

let u=users[index]

document.getElementById("name").innerText=u.name
document.getElementById("city").innerText=u.city
document.getElementById("bio").innerText=u.bio
document.getElementById("photo").src=u.photo

}

showUser()

let card=document.getElementById("card")

let startX=0

card.addEventListener("touchstart",(e)=>{

startX=e.touches[0].clientX

})

card.addEventListener("touchend",(e)=>{

let endX=e.changedTouches[0].clientX

if(endX-startX>100){

like()

}

if(startX-endX>100){

dislike()

}

})

function like(){

let matches = JSON.parse(localStorage.getItem("matches")) || []

matches.push(users[index])

localStorage.setItem("matches",JSON.stringify(matches))

nextUser()

}

function dislike(){

nextUser()

}

function nextUser(){

index++

if(index>=users.length){

index=0

}

showUser()

}

</script>

</body>

</html>
