<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پیدا کردن نیمه گمشده</title>

<style>

body{
margin:0;
font-family:sans-serif;
background:#111;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.card{
width:300px;
height:420px;
background:#222;
border-radius:20px;
text-align:center;
padding:20px;
}

.avatar{
width:150px;
height:150px;
border-radius:50%;
background:#ff4f7b;
margin:auto;
}

.name{
font-size:24px;
margin-top:15px;
}

.buttons{
margin-top:30px;
display:flex;
justify-content:space-around;
}

button{
padding:15px;
border:none;
border-radius:50%;
font-size:20px;
cursor:pointer;
}

.no{
background:#444;
color:white;
}

.like{
background:#ff4f7b;
color:white;
}

</style>
</head>

<body>

<div class="card">

<div class="avatar"></div>

<div class="name">سارا ۲۷</div>

<div class="buttons">

<button class="no">❌</button>

<button class="like">❤️</button>

</div>

</div>

</body>
</html>
