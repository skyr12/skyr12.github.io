.card{

overflow:hidden;

}

.card img{
width:100%;
height:280px;

}

.info{

}

.navbar{
position:fixed;

display:flex;

firebase.initializeApp(firebaseConfig)

let db=firebase.firestore()

firebase.auth().onAuthStateChanged(user=>{

if(!user) return

let uid=user.uid

db.collection("likes")
.where("to","==",uid)
.onSnapshot(snapshot=>{

let box=document.getElementById("likes")

box.innerHTML=""

snapshot.forEach(doc=>{

let data=doc.data()

db.collection("users").doc(data.from).get().then(userDoc=>{

let u=userDoc.data()

let card=document.createElement("div")

card.className="card"

card.innerHTML=`

<img src="${u.photo}">

<div class="info">

<h3>${u.name}</h3>

<p>${u.country}</p>

</div>

`

box.appendChild(card)

})

})

})

})
