<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>Who Liked Me</title><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script><style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
}

.card{
width:300px;
margin:20px auto;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.card img{
width:100%;
height:300px;
object-fit:cover;
}

.box{
width:320px;
margin:80px auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

button{
padding:12px 25px;
background:gold;
border:none;
border-radius:20px;
font-size:18px;
cursor:pointer;
}

</style></head><body><h1>People Who Liked You</h1><div id="content"></div><script>

const firebaseConfig = {
apiKey: "AIzaSyAA0xYFglY_ONI-PstgS4nP3uNIpyA",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.appspot.com",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.firestore();

const content=document.getElementById("content");

firebase.auth().onAuthStateChanged((user)=>{

db.collection("users").doc(user.uid).get().then((doc)=>{

let data=doc.data();

if(!data.premium){

content.innerHTML=`

<div class="box">

<h2>Premium Feature</h2>

<p>Upgrade to Premium to see who liked you</p>

<button onclick="goPremium()">Upgrade</button>

</div>

`;

return;

}

loadLikes(user.uid);

});

});


function loadLikes(uid){

db.collection("likes")
.where("to","==",uid)
.get()
.then((snapshot)=>{

snapshot.forEach((doc)=>{

let like=doc.data();

db.collection("users").doc(like.from).get()
.then((userDoc)=>{

let u=userDoc.data();

let card=document.createElement("div");

card.className="card";

card.innerHTML=`

<img src="${u.photo}">

<h2>${u.name}</h2>

<p>${u.city} • ${u.country}</p>

`;

content.appendChild(card);

});

});

});

}


function goPremium(){

window.location.href="premium.html";

}

</script></body>
</html>
