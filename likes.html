<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Who Liked You</title><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
text-align:center;
}

.header{
background:#ff4d6d;
color:white;
padding:20px;
font-size:22px;
}

.container{
max-width:500px;
margin:auto;
padding:20px;
}

.card{
background:white;
border-radius:15px;
padding:15px;
margin-bottom:15px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

img{
width:100%;
border-radius:10px;
}

</style></head><body><div class="header">Who Liked You ❤️

</div><div class="container" id="likes"></div><script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh"

}

firebase.initializeApp(firebaseConfig)

const db=firebase.firestore()

firebase.auth().onAuthStateChanged(user=>{

if(!user){

window.location="login.html"
return

}

let uid=user.uid

db.collection("users").doc(uid).get().then(doc=>{

let data=doc.data()

if(!data.premium){

alert("Premium required")

window.location="premium.html"

return

}

loadLikes(uid)

})

})

function loadLikes(uid){

db.collection("likes")

.where("to","==",uid)

.get()

.then(snapshot=>{

let html=""

snapshot.forEach(doc=>{

let like=doc.data()

db.collection("users").doc(like.from).get()

.then(userDoc=>{

let u=userDoc.data()

html+=`

<div class="card">

<img src="${u.photo || 'https://via.placeholder.com/400'}">

<h2>${u.name}</h2>

<p>${u.country}</p>

</div>

`

document.getElementById("likes").innerHTML=html

})

})

})

}

</script></body></html>
