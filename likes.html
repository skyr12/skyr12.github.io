<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Likes</title>

<style>

body{
font-family:Arial;
background:#f3f3f3;
text-align:center;
}

.card{
width:320px;
margin:auto;
margin-top:20px;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
padding:20px;
}

.card img{
width:100%;
height:300px;
object-fit:cover;
border-radius:10px;
}

</style>

</head>

<body>

<h2>People Who Liked You</h2>

<div id="likes"></div>

<div id="premiumMessage"></div>


<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>

const firebaseConfig={
apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh"
}

firebase.initializeApp(firebaseConfig)

const db=firebase.firestore()

let currentUser=null
let myData=null

firebase.auth().onAuthStateChanged(user=>{

currentUser=user

db.collection("users")
.doc(user.uid)
.get()
.then(doc=>{

myData=doc.data()

if(!myData.premium){

document.getElementById("premiumMessage").innerHTML=
"⭐ Upgrade to Premium to see who liked you"

return

}

loadLikes()

})

})


function loadLikes(){

db.collection("likes")
.where("to","==",currentUser.uid)
.get()
.then(snapshot=>{

snapshot.forEach(doc=>{

let data=doc.data()

db.collection("users")
.doc(data.from)
.get()
.then(userDoc=>{

let user=userDoc.data()

let div=document.createElement("div")

div.className="card"

div.innerHTML=`

<img src="${user.photo}">

<h3>${user.name}</h3>

<p>${user.city}</p>

`

document.getElementById("likes").appendChild(div)

})

})

})

}

</script>

</body>

</html>
