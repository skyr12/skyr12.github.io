<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رولت | همدم</title>
    <link rel="stylesheet" href="../assets/style.css">
    <style>
        .game-container {
            background: linear-gradient(135deg, #1a472a, #2d5a3a);
            min-height: 100vh;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .roulette-wheel {
            width: 300px;
            height: 300px;
            margin: 30px auto;
            position: relative;
        }
        
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #ff4d6d 0deg 45deg,
                #4a90e2 45deg 90deg,
                #4caf50 90deg 135deg,
                #ffd700 135deg 180deg,
                #ff4d6d 180deg 225deg,
                #4a90e2 225deg 270deg,
                #4caf50 270deg 315deg,
                #ffd700 315deg 360deg
            );
            border: 5px solid gold;
            box-shadow: 0 0 30px rgba(255,215,0,0.5);
            transition: transform 3s cubic-bezier(0.25, 0.1, 0.15, 1);
        }
        
        .wheel.spinning {
            transform: rotate(1440deg);
        }
        
        .pointer {
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid gold;
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        
        .bet-panel {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin: 20px;
        }
        
        .bet-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        
        .bet-btn {
            background: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .bet-btn:hover {
            transform: scale(1.05);
            background: #ff4d6d;
            color: white;
        }
        
        .color-btn {
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .color-btn.red {
            background: #ff4d6d;
            color: white;
        }
        
        .color-btn.black {
            background: #333;
            color: white;
        }
        
        .color-btn.green {
            background: #4caf50;
            color: white;
        }
        
        .result-box {
            background: rgba(255,255,255,0.2);
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 style="margin-bottom: 20px;">🎰 رولت</h1>
        
        <div class="wallet" style="background: rgba(255,255,255,0.2); margin: 0 auto 20px; width: fit-content;">
            <span>🪙</span>
            <span id="gameCoins">۱,۰۰۰</span>
        </div>
        
        <div class="roulette-wheel">
            <div class="wheel" id="wheel"></div>
            <div class="pointer"></div>
        </div>
        
        <div class="bet-panel">
            <h3>💰 مبلغ شرط</h3>
            <div class="bet-buttons">
                <button class="bet-btn" onclick="setBet(10)">۱۰</button>
                <button class="bet-btn" onclick="setBet(50)">۵۰</button>
                <button class="bet-btn" onclick="setBet(100)">۱۰۰</button>
                <button class="bet-btn" onclick="setBet(500)">۵۰۰</button>
                <button class="bet-btn" onclick="setBet(1000)">۱,۰۰۰</button>
                <button class="bet-btn" onclick="setBet(5000)">۵,۰۰۰</button>
            </div>
            
            <p>شرط فعلی: <span id="currentBet">۱۰</span> سکه</p>
            
            <h3 style="margin: 20px 0 10px;">🎨 رنگ</h3>
            <div style="display: flex; gap: 10px;">
                <button class="color-btn red" style="flex: 1;" onclick="placeBet('red')">قرمز</button>
                <button class="color-btn black" style="flex: 1;" onclick="placeBet('black')">مشکی</button>
                <button class="color-btn green" style="flex: 1;" onclick="placeBet('green')">سبز</button>
            </div>
        </div>
        
        <div class="result-box" id="result">
            آماده شروع بازی
        </div>
        
        <button class="btn btn-primary" style="width: 100%;" onclick="spinWheel()">
            چرخوندن (🎡)
        </button>
    </div>
    
    <script>
        let coins = 1000;
        let currentBet = 10;
        let selectedColor = null;
        let isSpinning = false;
        
        function setBet(amount) {
            currentBet = amount;
            document.getElementById('currentBet').textContent = amount.toLocaleString('fa-IR');
        }
        
        function placeBet(color) {
            if (isSpinning) return;
            
            selectedColor = color;
            document.getElementById('result').innerHTML = `شرط روی ${color === 'red' ? 'قرمز' : color === 'black' ? 'مشکی' : 'سبز'} با مبلغ ${currentBet} سکه`;
        }
        
        function spinWheel() {
            if (!selectedColor) {
                alert('لطفاً ابتدا یک رنگ انتخاب کنید');
                return;
            }
            
            if (coins < currentBet) {
                alert('سکه کافی ندارید!');
                return;
            }
            
            isSpinning = true;
            
            // کم کردن سکه
            coins -= currentBet;
            document.getElementById('gameCoins').textContent = coins.toLocaleString('fa-IR');
            
            // چرخوندن
            const wheel = document.getElementById('wheel');
            wheel.classList.add('spinning');
            
            // تعیین نتیجه
            setTimeout(() => {
                wheel.classList.remove('spinning');
                
                const random = Math.random();
                let result;
                let multiplier;
                
                if (random < 0.45) { // 45% قرمز
                    result = 'red';
                    multiplier = 2;
                } else if (random < 0.9) { // 45% مشکی
                    result = 'black';
                    multiplier = 2;
                } else { // 10% سبز
                    result = 'green';
                    multiplier = 10;
                }
                
                if (result === selectedColor) {
                    const win = currentBet * multiplier;
                    coins += win;
                    document.getElementById('result').innerHTML = `
                        🎉 برد! ${result === 'green' ? 'سبز' : (result === 'red' ? 'قرمز' : 'مشکی')} شد
                        <br>
                        شما ${win} سکه بردید
                    `;
                } else {
                    document.getElementById('result').innerHTML = `
                        😢 باخت! ${result === 'green' ? 'سبز' : (result === 'red' ? 'قرمز' : 'مشکی')} شد
                        <br>
                        ${currentBet} سکه را باختید
                    `;
                }
                
                document.getElementById('gameCoins').textContent = coins.toLocaleString('fa-IR');
                isSpinning = false;
                selectedColor = null;
            }, 3000);
        }
    </script>
</body>
</html>
