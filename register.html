<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>Register</title><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script><style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
}

.box{
width:320px;
margin:80px auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

input{
width:90%;
padding:10px;
margin:8px;
border-radius:10px;
border:1px solid #ccc;
}

button{
padding:10px 20px;
background:red;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

</style></head><body><div class="box"><h2>Create Account</h2><input id="name" placeholder="Name">
<input id="age" placeholder="Age">
<input id="city" placeholder="City">
<input id="country" placeholder="Country"><input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password"><button onclick="register()">Register</button>

</div><script>

const firebaseConfig = {
apiKey: "AIzaSyAA0xYFglY_ONI-PstgS4nP3uNIpyA",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.appspot.com",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

function register(){

let name=document.getElementById("name").value;
let age=document.getElementById("age").value;
let city=document.getElementById("city").value;
let country=document.getElementById("country").value;

let email=document.getElementById("email").value;
let password=document.getElementById("password").value;

firebase.auth().createUserWithEmailAndPassword(email,password)

.then((userCredential)=>{

let user=userCredential.user;

db.collection("users").doc(user.uid).set({

name:name,
age:age,
city:city,
country:country,
photo:"https://randomuser.me/api/portraits/men/50.jpg"

});

window.location.href="discover.html";

})

.catch((error)=>{

alert(error.message);

});

}

</script></body>
</html>
