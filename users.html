<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>کاربران</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#111;
color:white;
text-align:center;
padding:40px;
}

.users{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
}

.card{
background:#222;
padding:20px;
border-radius:20px;
width:220px;
box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

.avatar{
width:90px;
height:90px;
border-radius:50%;
margin:auto;
margin-bottom:10px;
object-fit:cover;
}

button{
margin-top:8px;
background:#FF4D6D;
border:none;
padding:10px 15px;
border-radius:20px;
color:white;
cursor:pointer;
}

.chat{
background:#444;
}

.match{
margin-top:10px;
color:#4CAF50;
font-weight:bold;
}

</style>

</head>

<body>

<h1>کاربران</h1>

<div class="users" id="users"></div>

<script>

let users = [

{
name:"سارا",
age:27,
bio:"علاقه‌مند به سفر",
avatar:"https://i.pravatar.cc/150?img=5"
},

{
name:"امیر",
age:30,
bio:"ورزشکار",
avatar:"https://i.pravatar.cc/150?img=12"
},

{
name:"لیلا",
age:25,
bio:"عاشق موسیقی",
avatar:"https://i.pravatar.cc/150?img=32"
}

]

let myName = localStorage.getItem("name")
let myBio = localStorage.getItem("bio")
let myAvatar = localStorage.getItem("avatar")

if(myName){

users.unshift({

name:myName,
age:"",
bio:myBio,
avatar:myAvatar

})

}

let html=""

users.forEach((u,i)=>{

html+=`

<div class="card">

<img src="${u.avatar}" class="avatar">

<h3>${u.name}</h3>

<p>${u.bio}</p>

<button onclick="like(${i})">❤️ لایک</button>

<div id="match${i}"></div>

</div>

`

})

document.getElementById("users").innerHTML=html

function like(i){

document.getElementById("match"+i).innerHTML=

`<div class="match">🎉 Match شد!</div>
<a href="chat.html">
<button class="chat">💬 چت</button>
</a>`

}

</script>

</body>
</html>
