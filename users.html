<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>کاربران</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#020617;
color:white;
text-align:center;
padding:30px;
}

.container{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
}

.card{
background:#111;
padding:20px;
border-radius:20px;
width:220px;
position:relative;
}

.avatar{
width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
margin-bottom:10px;
}

.online{
position:absolute;
top:15px;
right:15px;
width:12px;
height:12px;
background:#00ff6a;
border-radius:50%;
}

</style>

</head>

<body>

<h1>👥 کاربران</h1>

<div class="container" id="users"></div>

<script>

let users = JSON.parse(localStorage.getItem("users")) || []

let html=""

users.forEach(u=>{

html+=`

<div class="card">

<div class="online"></div>

<img src="${u.photo}" class="avatar">

<h3>${u.name}</h3>

<p>${u.city}</p>

<p>${u.bio}</p>

</div>

`

})

document.getElementById("users").innerHTML=html

</script>

</body>

</html>
