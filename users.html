<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>کاربران</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#020617;
color:white;
text-align:center;
padding:40px;
}

.users{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
}

.card{

background:#111;
padding:20px;
border-radius:20px;
width:200px;

}

.avatar{

width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
margin-bottom:10px;

}

button{

margin-top:10px;
background:#FF4D6D;
border:none;
padding:8px 15px;
border-radius:20px;
color:white;
cursor:pointer;

}

</style>

</head>

<body>

<h1>کاربران</h1>

<div class="users" id="users"></div>

<script>

let users=[]

let name=localStorage.getItem("name")
let age=localStorage.getItem("age")
let city=localStorage.getItem("city")
let bio=localStorage.getItem("bio")
let photo=localStorage.getItem("photo")

if(name){

users.push({

name:name,
age:age,
city:city,
bio:bio,
photo:photo

})

}

let html=""

users.forEach(u=>{

html+=`

<div class="card">

<img src="${u.photo}" class="avatar">

<h3>${u.name}</h3>

<p>${u.city}</p>

<p>${u.bio}</p>

<button>❤️ لایک</button>

</div>

`

})

document.getElementById("users").innerHTML=html

</script>

</body>
</html>
