<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>کاربران</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#111;
color:white;
text-align:center;
padding:40px;
}

.users{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
margin-top:30px;
}

.card{
background:#222;
padding:20px;
border-radius:20px;
width:230px;
box-shadow:0 10px 30px rgba(0,0,0,0.6);
position:relative;
}

.avatar{
width:100%;
height:200px;
border-radius:15px;
object-fit:cover;
margin-bottom:10px;
}

.online{
width:14px;
height:14px;
background:#00ff6a;
border-radius:50%;
position:absolute;
top:15px;
left:15px;
border:2px solid #222;
}

button{
margin-top:8px;
background:#FF4D6D;
border:none;
padding:10px 15px;
border-radius:20px;
color:white;
cursor:pointer;
}

.chat{
background:#444;
}

.match{
margin-top:10px;
color:#4CAF50;
font-weight:bold;
}

.gallery{
display:flex;
gap:5px;
margin-top:8px;
}

.gallery img{
width:30%;
border-radius:8px;
}

</style>

</head>

<body>

<h1>کاربران آنلاین</h1>

<div class="users" id="users"></div>

<script>

let users = [

{
name:"سارا",
age:27,
online:true,
bio:"علاقه‌مند به سفر",
avatar:"https://picsum.photos/300/300?1",
photos:[
"https://picsum.photos/200/200?2",
"https://picsum.photos/200/200?3",
"https://picsum.photos/200/200?4"
]
},

{
name:"امیر",
age:30,
online:false,
bio:"ورزشکار",
avatar:"https://picsum.photos/300/300?5",
photos:[
"https://picsum.photos/200/200?6",
"https://picsum.photos/200/200?7",
"https://picsum.photos/200/200?8"
]
},

{
name:"لیلا",
age:25,
online:true,
bio:"عاشق موسیقی",
avatar:"https://picsum.photos/300/300?9",
photos:[
"https://picsum.photos/200/200?10",
"https://picsum.photos/200/200?11",
"https://picsum.photos/200/200?12"
]
}

]

let html=""

users.forEach((u,i)=>{

html+=`

<div class="card">

${u.online ? '<div class="online"></div>' : ''}

<img src="${u.avatar}" class="avatar">

<h3>${u.name} ${u.age}</h3>

<p>${u.bio}</p>

<div class="gallery">

<img src="${u.photos[0]}">
<img src="${u.photos[1]}">
<img src="${u.photos[2]}">

</div>

<button onclick="like(${i})">❤️ لایک</button>

<div id="match${i}"></div>

</div>

`

})

document.getElementById("users").innerHTML=html

function like(i){

document.getElementById("match"+i).innerHTML=

`<div class="match">🎉 Match شد!</div>
<a href="chat.html">
<button class="chat">💬 چت</button>
</a>`

}

</script>

</body>
</html>
