<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>کاربران</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#111;
color:white;
text-align:center;
padding:40px;
}

.users{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
}

.card{
background:#222;
padding:20px;
border-radius:20px;
width:230px;
box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

.avatar{
width:100%;
height:200px;
border-radius:15px;
object-fit:cover;
margin-bottom:10px;
}

.status{
margin-top:5px;
font-size:14px;
opacity:0.8;
}

.online{
color:#00ff6a;
}

button{
margin-top:8px;
background:#FF4D6D;
border:none;
padding:10px 15px;
border-radius:20px;
color:white;
cursor:pointer;
}

.block{
background:#444;
}

.report{
background:#ff3b3b;
}

</style>

</head>

<body>

<h1>کاربران</h1>

<div class="users" id="users"></div>

<script>

let users=[

{
name:"سارا",
bio:"علاقه‌مند به سفر",
photo:"https://picsum.photos/300/300?1",
online:true
},

{
name:"امیر",
bio:"ورزشکار",
photo:"https://picsum.photos/300/300?2",
online:false,
lastSeen:"10 دقیقه پیش"
},

{
name:"لیلا",
bio:"عاشق موسیقی",
photo:"https://picsum.photos/300/300?3",
online:false,
lastSeen:"1 ساعت پیش"
}

]

let blocked = JSON.parse(localStorage.getItem("blocked")) || []

let reports = JSON.parse(localStorage.getItem("reports")) || []

function render(){

let html=""

users.forEach((u,i)=>{

if(blocked.includes(i)) return

html+=`

<div class="card">

<img src="${u.photo}" class="avatar">

<h3>${u.name}</h3>

<p>${u.bio}</p>

<p class="status">

${u.online ? '<span class="online">🟢 آنلاین</span>' : '⏰ '+u.lastSeen}

</p>

<button onclick="like(${i})">❤️ لایک</button>

<button class="block" onclick="blockUser(${i})">🚫 بلاک</button>

<button class="report" onclick="reportUser(${i})">🚨 گزارش</button>

</div>

`

})

document.getElementById("users").innerHTML=html

}

function like(i){

alert("کاربر لایک شد ❤️")

}

function blockUser(i){

blocked.push(i)

localStorage.setItem("blocked",JSON.stringify(blocked))

render()

}

function reportUser(i){

reports.push(users[i])

localStorage.setItem("reports",JSON.stringify(reports))

alert("کاربر گزارش شد 🚨")

}

render()

</script>

</body>
</html>
