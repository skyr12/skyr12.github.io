<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users</title>

<style>

body{
font-family:tahoma;
background:#f4f4f4;
text-align:center;
}

.card{
background:white;
width:300px;
margin:auto;
margin-top:20px;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<h2>Users</h2>

<div id="users"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";


const firebaseConfig = {
apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.firebasestorage.app",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1",
measurementId: "G-KTCV2B5R9L"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


const querySnapshot = await getDocs(collection(db,"users"));

querySnapshot.forEach((doc)=>{

let user = doc.data()

document.getElementById("users").innerHTML += `

<div class="card">
<h3>${user.name}</h3>
<p>${user.city}</p>
</div>

`

})

</script>

</body>
</html>
