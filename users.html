<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Profile</title><style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
margin:0;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
font-size:20px;
}

.card{
background:white;
width:320px;
margin:auto;
margin-top:30px;
padding:20px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.card img{
width:200px;
height:200px;
object-fit:cover;
border-radius:10px;
}

button{
background:#ff4d6d;
color:white;
border:none;
padding:10px 20px;
border-radius:25px;
margin:8px;
cursor:pointer;
}

.gift{
background:#9c27b0;
}

#gallery img{
width:80px;
height:80px;
margin:5px;
border-radius:10px;
object-fit:cover;
}

.navbar{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
font-size:22px;
}

.navbar a{
text-decoration:none;
}

</style></head><body><div class="header">👤 User Profile</div><div class="card"><img id="photo"><h2 id="name"></h2><p id="country"></p><p id="online"></p><button onclick="likeUser()">❤️ Like</button>

<a id="giftLink">
<button class="gift">🎁 Send Gift</button>
</a><h3>📸 Photos</h3><div id="gallery"></div></div><div class="navbar"><a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="inbox.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="visitors.html">👁️</a>
<a href="profile.html">👤</a>

</div><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script><script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh",
storageBucket:"nimeh-gomsodeh.firebasestorage.app",
messagingSenderId:"815930956932",
appId:"1:815930956932:web:e8696a6a69b4458fd936d1"

};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig)
}

const db=firebase.firestore()

const urlParams=new URLSearchParams(window.location.search)

const userId=urlParams.get("id")

document.getElementById("giftLink").href="gift.html?id="+userId

firebase.auth().onAuthStateChanged(user=>{

if(!user){

location.href="login.html"
return

}

loadUser()

saveVisitor(user.uid)

loadPhotos()

})


function loadUser(){

db.collection("users").doc(userId).get()

.then(doc=>{

let u=doc.data()

document.getElementById("photo").src=u.photo
document.getElementById("name").innerText=u.name
document.getElementById("country").innerText=u.country

let online=u.online ? "🟢 Online" : "⚫ Offline"

document.getElementById("online").innerText=online

})

}


function likeUser(){

let user=firebase.auth().currentUser

db.collection("likes").add({

from:user.uid,
to:userId,
time:Date.now()

})

alert("❤️ Liked")

}


function saveVisitor(visitorId){

db.collection("visitors").add({

profile:userId,
visitor:visitorId,
time:Date.now()

})

}


function loadPhotos(){

db.collection("photos")
.where("user","==",userId)
.get()

.then(snapshot=>{

let html=""

snapshot.forEach(doc=>{

let p=doc.data()

html+=`
<img src="${p.photo}">
`

})

document.getElementById("gallery").innerHTML=html

})

}

</script></body>
</html>
