<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>کاربران</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#111;
color:white;
text-align:center;
padding:40px;
}

.users{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
margin-top:30px;
}

.card{
background:#222;
padding:20px;
border-radius:20px;
width:230px;
box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

.avatar{
width:100%;
height:200px;
border-radius:15px;
object-fit:cover;
margin-bottom:10px;
}

button{
margin-top:8px;
background:#FF4D6D;
border:none;
padding:10px 15px;
border-radius:20px;
color:white;
cursor:pointer;
}

.chat{
background:#444;
}

.match{
margin-top:10px;
color:#4CAF50;
font-weight:bold;
}

.gallery{
display:flex;
gap:5px;
margin-top:8px;
}

.gallery img{
width:30%;
border-radius:8px;
}

.filter{
margin-top:20px;
}

input,select{
padding:8px;
border-radius:10px;
border:none;
margin:5px;
}

</style>

</head>

<body>

<h1>کاربران</h1>

<div class="filter">

سن از
<input id="minAge" type="number" placeholder="20">

تا
<input id="maxAge" type="number" placeholder="35">

<br><br>

شهر

<select id="city">

<option value="">همه</option>
<option value="تهران">تهران</option>
<option value="دبی">دبی</option>
<option value="استانبول">استانبول</option>

</select>

<button onclick="filterUsers()">جستجو</button>

</div>

<div class="users" id="users"></div>

<script>

let users = [

{
name:"سارا",
age:27,
city:"تهران",
bio:"علاقه‌مند به سفر",
avatar:"https://picsum.photos/300/300?1",
photos:[
"https://picsum.photos/200/200?2",
"https://picsum.photos/200/200?3",
"https://picsum.photos/200/200?4"
]
},

{
name:"امیر",
age:30,
city:"دبی",
bio:"ورزشکار",
avatar:"https://picsum.photos/300/300?5",
photos:[
"https://picsum.photos/200/200?6",
"https://picsum.photos/200/200?7",
"https://picsum.photos/200/200?8"
]
},

{
name:"لیلا",
age:25,
city:"استانبول",
bio:"عاشق موسیقی",
avatar:"https://picsum.photos/300/300?9",
photos:[
"https://picsum.photos/200/200?10",
"https://picsum.photos/200/200?11",
"https://picsum.photos/200/200?12"
]
}

]

function showUsers(list){

let html=""

list.forEach((u,i)=>{

html+=`

<div class="card">

<img src="${u.avatar}" class="avatar">

<h3>${u.name} ${u.age}</h3>

<p>${u.city}</p>

<p>${u.bio}</p>

<div class="gallery">

<img src="${u.photos[0]}">
<img src="${u.photos[1]}">
<img src="${u.photos[2]}">

</div>

<button onclick="like(${i})">❤️ لایک</button>

<div id="match${i}"></div>

</div>

`

})

document.getElementById("users").innerHTML=html

}

function filterUsers(){

let min=document.getElementById("minAge").value
let max=document.getElementById("maxAge").value
let city=document.getElementById("city").value

let filtered = users.filter(u =>

(!min || u.age >= min) &&
(!max || u.age <= max) &&
(!city || u.city === city)

)

showUsers(filtered)

}

function like(i){

document.getElementById("match"+i).innerHTML=

`<div class="match">🎉 Match شد!</div>
<a href="chat.html">
<button class="chat">💬 چت</button>
</a>`

}

showUsers(users)

</script>

</body>
</html>
