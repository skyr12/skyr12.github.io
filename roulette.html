<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Roulette</title><style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
height:100vh;
}

h1{
color:#ff4d6d;
}

#wheel{
width:250px;
height:250px;
border-radius:50%;
border:10px solid #ff4d6d;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
background:white;
transition:transform 3s ease-out;
}

button{
margin-top:30px;
padding:15px 40px;
border:none;
border-radius:30px;
font-size:18px;
background:#ff4d6d;
color:white;
cursor:pointer;
}

.result{
margin-top:20px;
font-size:20px;
font-weight:bold;
}

</style></head><body><h1>🎡 Roulette</h1><div id="wheel">SPIN

</div><button onclick="spin()">Spin</button>

<div class="result" id="result"></div><script>

let rewards = [

"💎 10 Coins",
"❤️ Super Like",
"⭐ Boost",
"🎁 Gift",
"💎 50 Coins",
"❌ Nothing"

]

function spin(){

let wheel = document.getElementById("wheel")

let random = Math.floor(Math.random()*rewards.length)

let rotate = 720 + Math.random()*360

wheel.style.transform = "rotate("+rotate+"deg)"

setTimeout(()=>{

document.getElementById("result").innerText = "You won: " + rewards[random]

},3000)

}

</script></body></html>
