<!DOCTYPE html>
<html>
<head>
    <title>ورود به همدم</title>
    <style>
        body {
            background: #ff4d6d;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            width: 300px;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #ff4d6d;
            margin-bottom: 20px;
        }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            background: #ff4d6d;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #ff3355;
        }
        .demo {
            background: white;
            color: #ff4d6d;
            border: 2px solid #ff4d6d;
        }
        .demo:hover {
            background: #ff4d6d;
            color: white;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>❤️ همدم</h1>
        <p>ورود به حساب کاربری</p>
        
        <input type="text" id="email" placeholder="ایمیل" value="test@test.com">
        <input type="password" id="pass" placeholder="رمز عبور" value="123456">
        
        <button onclick="login()">ورود</button>
        <button class="demo" onclick="demo()">ورود به عنوان مهمان</button>
    </div>

    <script>
        function login() {
            let email = document.getElementById('email').value;
            let pass = document.getElementById('pass').value;
            
            if(email && pass) {
                window.location.href = 'index.html';
            } else {
                alert('لطفاً ایمیل و رمز عبور را وارد کنید');
            }
        }
        
        function demo() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
