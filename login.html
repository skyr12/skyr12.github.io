<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | همدم</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
        }

        .login-card {
            background: white;
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 48px;
            color: #ff4d6d;
            margin-bottom: 10px;
        }

        .logo p {
            color: #666;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ff4d6d;
        }

        .btn {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .btn-primary {
            background: #ff4d6d;
            color: white;
        }

        .btn-primary:hover {
            background: #ff3355;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: white;
            color: #ff4d6d;
            border: 2px solid #ff4d6d;
        }

        .btn-secondary:hover {
            background: #ff4d6d;
            color: white;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }

        .links a:hover {
            color: #ff4d6d;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <h1>❤️ همدم</h1>
                <p>به خانواده همدم خوش آمدید</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>ایمیل</label>
                    <input type="email" id="email" value="test@test.com" required>
                </div>

                <div class="form-group">
                    <label>رمز عبور</label>
                    <input type="password" id="password" value="123456" required>
                </div>

                <button type="submit" class="btn btn-primary">ورود به حساب</button>
                <button type="button" class="btn btn-secondary" onclick="demoLogin()">ورود به عنوان مهمان</button>

                <div class="links">
                    <a href="#">ثبت نام کنید</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (email === 'test@test.com' && password === '123456') {
                window.location.href = 'index.html';
            } else {
                alert('ایمیل یا رمز عبور اشتباه است');
            }
        }

        function demoLogin() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
