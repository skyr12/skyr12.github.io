<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NIMEH | Where Muslims Meet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* لوگو */
        .logo-section {
            margin-bottom: 40px;
        }

        .logo {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #000;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 16px;
            color: #666;
            font-weight: 400;
        }

        /* دکمه‌ها */
        .buttons-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            background: white;
        }

        .btn-google {
            background: white;
            color: #000;
            border: 1.5px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-google:hover {
            background: #f8f8f8;
        }

        .btn-email {
            background: #00b894;
            color: white;
            border: none;
        }

        .btn-email:hover {
            background: #019d7a;
        }

        .google-icon {
            font-size: 20px;
        }

        /* لینک کمک */
        .help-section {
            margin-top: 40px;
        }

        .help-link {
            color: #999;
            text-decoration: none;
            font-size: 14px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 2px;
        }

        .help-link:hover {
            color: #00b894;
            border-bottom-color: #00b894;
        }

        /* فوتر */
        .footer {
            margin-top: 60px;
            color: #999;
            font-size: 12px;
        }

        .footer a {
            color: #999;
            text-decoration: none;
            margin: 0 5px;
        }

        .footer a:hover {
            color: #00b894;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- لوگو -->
        <div class="logo-section">
            <div class="logo">NIMEH</div>
            <div class="tagline">Where Muslims Meet</div>
        </div>

        <!-- دکمه‌ها -->
        <div class="buttons-section">
            <button class="btn btn-google" onclick="window.location='index.html'">
                <span class="google-icon">🇬</span>
                Continue with Google
            </button>
            
            <button class="btn btn-email" onclick="window.location='index.html'">
                Continue with Email
            </button>
        </div>

        <!-- لینک کمک -->
        <div class="help-section">
            <a href="#" class="help-link">Need help?</a>
        </div>

        <!-- فوتر -->
        <div class="footer">
            <a href="#">Terms</a> • 
            <a href="#">Privacy</a> • 
            <a href="#">Contact</a>
        </div>
    </div>
</body>
</html>
