<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | نیمه گمشده</title>
    <link href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <style>
        /* استایل‌ها مثل قبل (برای اختصار حذف شده) */
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <h1>نیمه گمشده</h1>
            <p>به جامعه ما بپیوندید</p>
        </div>

        <div class="tabs">
            <span class="tab active" onclick="switchTab('login')">ورود</span>
            <span class="tab" onclick="switchTab('register')">ثبت‌نام</span>
        </div>

        <!-- فرم ورود -->
        <div id="loginForm">
            <div class="form-group">
                <label>ایمیل</label>
                <input type="email" id="loginEmail" placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label>رمز عبور</label>
                <input type="password" id="loginPassword" placeholder="********">
            </div>
            <button class="btn" onclick="login()">ورود</button>
            <button class="btn btn-outline" onclick="guestLogin()">ورود به عنوان مهمان</button>
        </div>

        <!-- فرم ثبت‌نام (مخفی) -->
        <div id="registerForm" style="display: none;">
            <div class="form-group">
                <label>نام کامل</label>
                <input type="text" id="registerName" placeholder="مثال: سارا محمدی">
            </div>
            <div class="form-group">
                <label>ایمیل</label>
                <input type="email" id="registerEmail" placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label>رمز عبور</label>
                <input type="password" id="registerPassword" placeholder="حداقل ۶ کاراکتر">
            </div>
            <button class="btn" onclick="register()">ثبت‌نام</button>
        </div>

        <div class="divider">یا</div>
        <button class="btn btn-outline" style="margin-bottom:0;">ادامه با شماره موبایل</button>

        <div class="footer-links">
            <span>حساب ندارید؟ <a href="#" onclick="switchTab('register')">ثبت نام</a></span>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>

    <script>
        // Firebase Config (کلیدهای خودت را جایگزین کن)
        const firebaseConfig = {
            apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
            authDomain: "nimeh-gomsodeh.firebaseapp.com",
            projectId: "nimeh-gomsodeh",
            storageBucket: "nimeh-gomsodeh.firebasestorage.app",
            messagingSenderId: "815930956932",
            appId: "1:815930956932:web:e8696a6a69b4458fd936d1"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // توابع کمکی
        function switchTab(tab) {
            const loginTab = document.querySelectorAll('.tab')[0];
            const registerTab = document.querySelectorAll('.tab')[1];
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');

            if (tab === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else {
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                registerForm.style.display = 'block';
                loginForm.style.display = 'none';
            }
        }

        // ورود
        function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    window.location.href = 'index.html';
                })
                .catch(error => {
                    alert('خطا: ' + error.message);
                });
        }

        // ثبت‌نام
        function register() {
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            auth.createUserWithEmailAndPassword(email, password)
                .then(userCredential => {
                    return db.collection('users').doc(userCredential.user.uid).set({
                        name: name,
                        email: email,
                        coins: 100,
                        vip: false,
                        createdAt: new Date().toISOString()
                    });
                })
                .then(() => {
                    window.location.href = 'index.html';
                })
                .catch(error => {
                    alert('خطا: ' + error.message);
                });
        }

        // ورود مهمان
        function guestLogin() {
            auth.signInAnonymously()
                .then(userCredential => {
                    return db.collection('users').doc(userCredential.user.uid).set({
                        name: 'مهمان',
                        coins: 50,
                        vip: false,
                        guest: true,
                        createdAt: new Date().toISOString()
                    });
                })
                .then(() => {
                    window.location.href = 'index.html';
                })
                .catch(error => {
                    alert('خطا: ' + error.message);
                });
        }

        // اگر کاربر قبلاً وارد شده بود، مستقیم برو به صفحه اصلی
        auth.onAuthStateChanged(user => {
            if (user) {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
