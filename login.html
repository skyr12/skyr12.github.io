<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | نیمه گمشده</title>
    <link href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Vazir, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f8fafc, #eef2f6);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-card {
            background: white;
            border-radius: 2rem;
            padding: 2.5rem 2rem;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 30px -10px rgba(0,0,0,0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #1f2937;
        }

        .logo p {
            color: #6b7280;
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #374151;
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 1px solid #d1d5db;
            border-radius: 3rem;
            font-size: 1rem;
            background: #f9fafb;
            transition: 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16,185,129,0.1);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 3rem;
            background: #10b981;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 1rem;
        }

        .btn:hover {
            background: #059669;
        }

        .btn-outline {
            background: white;
            border: 1px solid #10b981;
            color: #10b981;
        }

        .btn-outline:hover {
            background: #f0fdf4;
        }

        .divider {
            text-align: center;
            color: #9ca3af;
            font-size: 0.9rem;
            margin: 1.5rem 0;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background: #e5e7eb;
        }

        .divider::before { right: 0; }
        .divider::after { left: 0; }

        .footer-links {
            text-align: center;
            color: #6b7280;
            font-size: 0.8rem;
        }

        .footer-links a {
            color: #10b981;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <h1>نیمه گمشده</h1>
            <p>به جامعه ما بپیوندید</p>
        </div>

        <form onsubmit="event.preventDefault(); alert('ورود موقت'); window.location.href='index.html';">
            <div class="form-group">
                <label>ایمیل</label>
                <input type="email" placeholder="example@email.com" value="test@test.com">
            </div>
            <div class="form-group">
                <label>رمز عبور</label>
                <input type="password" placeholder="********" value="123456">
            </div>
            <button class="btn">ورود</button>
            <button type="button" class="btn btn-outline" onclick="window.location.href='index.html'">ورود به عنوان مهمان</button>
        </form>

        <div class="divider">یا</div>
        <button class="btn btn-outline" style="margin-bottom:0;">ادامه با شماره موبایل</button>

        <div class="footer-links">
            <span>حساب ندارید؟ <a href="#">ثبت نام</a></span>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
        }
    </script>
</body>
</html>
