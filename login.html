<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ورود | نیمه گمشده</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        h2 {
            color: #ff4d6d;
            margin-bottom: 10px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 30px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #ff4d6d;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px 0;
        }
        button:hover {
            background: #ff3355;
        }
        .demo {
            background: white;
            color: #ff4d6d;
            border: 2px solid #ff4d6d;
        }
        .demo:hover {
            background: #ff4d6d;
            color: white;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>نیمه گمشده</h2>
        <p>لطفاً وارد شوید</p>
        <form onsubmit="event.preventDefault(); window.location='index.html';">
            <input type="email" placeholder="ایمیل" value="test@test.com" required>
            <input type="password" placeholder="رمز عبور" value="123456" required>
            <button type="submit">ورود</button>
        </form>
        <button class="demo" onclick="window.location='index.html'">ورود مهمان</button>
    </div>
</body>
</html>
