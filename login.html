<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | همدم</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        .auth-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .auth-box {
            background: white;
            border-radius: 30px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: slideUp 0.5s ease;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .auth-header .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .auth-header h2 {
            color: #333;
            margin-bottom: 5px;
        }
        
        .auth-header p {
            color: #666;
            font-size: 14px;
        }
        
        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: #f5f5f5;
            padding: 5px;
            border-radius: 15px;
        }
        
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .auth-tab.active {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
        }
        
        .auth-form {
            display: none;
        }
        
        .auth-form.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        .input-group {
            position: relative;
        }
        
        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }
        
        .form-control {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid #eee;
            border-radius: 15px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #ff4d6d;
        }
        
        .auth-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,77,109,0.3);
        }
        
        .auth-divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }
        
        .auth-divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #eee;
            z-index: 1;
        }
        
        .auth-divider span {
            background: white;
            padding: 0 15px;
            color: #999;
            font-size: 14px;
            position: relative;
            z-index: 2;
        }
        
        .social-login {
            display: flex;
            gap: 10px;
        }
        
        .social-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 15px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 20px;
        }
        
        .social-btn:hover {
            border-color: #ff4d6d;
            transform: translateY(-2px);
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
        
        .auth-footer a {
            color: #ff4d6d;
            text-decoration: none;
            font-weight: 600;
        }
        
        .error-message {
            background: #fee2e2;
            color: #ef4444;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .error-message.show {
            display: block;
            animation: shake 0.3s ease;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .success-message {
            background: #4caf5020;
            color: #4caf50;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="logo">❤️</div>
                <h2>به همدم خوش آمدید</h2>
                <p>برای ادامه وارد شوید یا ثبت نام کنید</p>
            </div>
            
            <!-- تب‌های ورود/ثبت نام -->
            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchAuthTab('login')">ورود</div>
                <div class="auth-tab" onclick="switchAuthTab('register')">ثبت نام</div>
            </div>
            
            <!-- پیام خطا -->
            <div class="error-message" id="errorMessage"></div>
            
            <!-- پیام موفقیت -->
            <div class="success-message" id="successMessage"></div>
            
            <!-- فرم ورود -->
            <div class="auth-form active" id="loginForm">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>ایمیل</label>
                        <div class="input-group">
                            <span class="input-icon">✉️</span>
                            <input type="email" class="form-control" id="loginEmail" placeholder="example@email.com" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>رمز عبور</label>
                        <div class="input-group">
                            <span class="input-icon">🔒</span>
                            <input type="password" class="form-control" id="loginPassword" placeholder="********" required>
                        </div>
                    </div>
                    
                    <div style="text-align: left; margin-bottom: 15px;">
                        <a href="#" style="color: #ff4d6d; text-decoration: none; font-size: 13px;">رمز عبور را فراموش کردید؟</a>
                    </div>
                    
                    <button type="submit" class="auth-btn" id="loginBtn">
                        <span>ورود</span>
                        <span class="loading-spinner" style="display: none;"></span>
                    </button>
                </form>
            </div>
            
            <!-- فرم ثبت نام -->
            <div class="auth-form" id="registerForm">
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>نام و نام خانوادگی</label>
                        <div class="input-group">
                            <span class="input-icon">👤</span>
                            <input type="text" class="form-control" id="registerName" placeholder="سارا محمدی" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>ایمیل</label>
                        <div class="input-group">
                            <span class="input-icon">✉️</span>
                            <input type="email" class="form-control" id="registerEmail" placeholder="example@email.com" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>رمز عبور</label>
                        <div class="input-group">
                            <span class="input-icon">🔒</span>
                            <input type="password" class="form-control" id="registerPassword" placeholder="حداقل ۶ کاراکتر" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>تکرار رمز عبور</label>
                        <div class="input-group">
                            <span class="input-icon">🔒</span>
                            <input type="password" class="form-control" id="registerConfirmPassword" placeholder="********" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="auth-btn" id="registerBtn">
                        <span>ثبت نام</span>
                        <span class="loading-spinner" style="display: none;"></span>
                    </button>
                </form>
            </div>
            
            <!-- ورود با شبکه‌های اجتماعی -->
            <div class="auth-divider">
                <span>یا</span>
            </div>
            
            <div class="social-login">
                <button class="social-btn" onclick="handleGoogleLogin()">🇬</button>
                <button class="social-btn" onclick="handleFacebookLogin()">🇫</button>
                <button class="social-btn" onclick="handlePhoneLogin()">📱</button>
            </div>
            
            <div class="auth-footer">
                <p>با ورود یا ثبت نام، <a href="#">قوانین و مقررات</a> را می‌پذیرید</p>
            </div>
        </div>
    </div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>
    
    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
            authDomain: "nimeh-gomsodeh.firebaseapp.com",
            projectId: "nimeh-gomsodeh",
            storageBucket: "nimeh-gomsodeh.firebasestorage.app",
            messagingSenderId: "815930956932",
            appId: "1:815930956932:web:e8696a6a69b4458fd936d1"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        // Check if user is already logged in
        auth.onAuthStateChanged(user => {
            if (user) {
                console.log("✅ User already logged in:", user.email);
                // Redirect to main page
                window.location.href = 'index.html';
            }
        });
        
        // Switch between login and register tabs
        function switchAuthTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelector('.auth-tab').classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }
        
        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }
        
        // Show success message
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.classList.add('show');
            
            setTimeout(() => {
                successDiv.classList.remove('show');
            }, 5000);
        }
        
        // Handle login
        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            
            // Show loading
            btn.disabled = true;
            btn.querySelector('span:first-child').style.display = 'none';
            btn.querySelector('.loading-spinner').style.display = 'inline-block';
            
            auth.signInWithEmailAndPassword(email, password)
                .then(userCredential => {
                    console.log("✅ Login successful:", userCredential.user.email);
                    
                    // Update last login
                    db.collection('users').doc(userCredential.user.uid).update({
                        lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
                        online: true
                    });
                    
                    // Redirect to main page
                    window.location.href = 'index.html';
                })
                .catch(error => {
                    console.error("❌ Login error:", error);
                    
                    let errorMessage = 'خطا در ورود';
                    if (error.code === 'auth/user-not-found') {
                        errorMessage = 'کاربری با این ایمیل یافت نشد';
                    } else if (error.code === 'auth/wrong-password') {
                        errorMessage = 'رمز عبور اشتباه است';
                    } else if (error.code === 'auth/invalid-email') {
                        errorMessage = 'ایمیل نامعتبر است';
                    }
                    
                    showError(errorMessage);
                    
                    // Hide loading
                    btn.disabled = false;
                    btn.querySelector('span:first-child').style.display = 'inline';
                    btn.querySelector('.loading-spinner').style.display = 'none';
                });
        }
        
        // Handle register
        function handleRegister(event) {
            event.preventDefault();
            
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;
            const btn = document.getElementById('registerBtn');
            
            // Check passwords match
            if (password !== confirmPassword) {
                showError('رمز عبور و تکرار آن یکسان نیستند');
                return;
            }
            
            // Check password length
            if (password.length < 6) {
                showError('رمز عبور باید حداقل ۶ کاراکتر باشد');
                return;
            }
            
            // Show loading
            btn.disabled = true;
            btn.querySelector('span:first-child').style.display = 'none';
            btn.querySelector('.loading-spinner').style.display = 'inline-block';
            
            auth.createUserWithEmailAndPassword(email, password)
                .then(userCredential => {
                    console.log("✅ Registration successful:", userCredential.user.email);
                    
                    // Create user profile in Firestore
                    return db.collection('users').doc(userCredential.user.uid).set({
                        name: name,
                        email: email,
                        photo: `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&size=200&background=ff4d6d&color=fff`,
                        coins: 100, // Welcome bonus
                        vip: 'none',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
                        online: true
                    });
                })
                .then(() => {
                    showSuccess('✅ ثبت نام با موفقیت انجام شد');
                    
                    // Redirect to main page after 1 second
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                })
                .catch(error => {
                    console.error("❌ Registration error:", error);
                    
                    let errorMessage = 'خطا در ثبت نام';
                    if (error.code === 'auth/email-already-in-use') {
                        errorMessage = 'این ایمیل قبلاً ثبت نام کرده است';
                    } else if (error.code === 'auth/invalid-email') {
                        errorMessage = 'ایمیل نامعتبر است';
                    }
                    
                    showError(errorMessage);
                    
                    // Hide loading
                    btn.disabled = false;
                    btn.querySelector('span:first-child').style.display = 'inline';
                    btn.querySelector('.loading-spinner').style.display = 'none';
                });
        }
        
        // Google login
        function handleGoogleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            
            auth.signInWithPopup(provider)
                .then(result => {
                    console.log("✅ Google login successful:", result.user.email);
                    
                    // Check if user exists in Firestore
                    return db.collection('users').doc(result.user.uid).get()
                        .then(doc => {
                            if (!doc.exists) {
                                // Create new user
                                return db.collection('users').doc(result.user.uid).set({
                                    name: result.user.displayName,
                                    email: result.user.email,
                                    photo: result.user.photoURL,
                                    coins: 100,
                                    vip: 'none',
                                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                                    lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
                                    online: true
                                });
                            } else {
                                // Update last login
                                return db.collection('users').doc(result.user.uid).update({
                                    lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
                                    online: true
                                });
                            }
                        });
                })
                .then(() => {
                    window.location.href = 'index.html';
                })
                .catch(error => {
                    console.error("❌ Google login error:", error);
                    showError('خطا در ورود با گوگل');
                });
        }
        
        // Facebook login (simulated)
        function handleFacebookLogin() {
            showError('ورود با فیسبوک به زودی فعال می‌شود');
        }
        
        // Phone login (simulated)
        function handlePhoneLogin() {
            showError('ورود با شماره تلفن به زودی فعال می‌شود');
        }
        
        // Demo accounts for testing
        window.demoLogin = function(role) {
            if (role === 'user') {
                document.getElementById('loginEmail').value = 'user@hamdam.com';
                document.getElementById('loginPassword').value = '123456';
            } else if (role === 'admin') {
                document.getElementById('loginEmail').value = 'admin@hamdam.com';
                document.getElementById('loginPassword').value = 'admin123';
            }
            
            handleLogin(new Event('submit'));
        };
    </script>
    
    <!-- Demo buttons (remove in production) -->
    <div style="position: fixed; bottom: 20px; left: 20px; display: flex; gap: 10px;">
        <button onclick="demoLogin('user')" style="background: #4caf50; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer;">دمو کاربر</button>
        <button onclick="demoLogin('admin')" style="background: #ff4d6d; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer;">دمو ادمین</button>
    </div>
</body>
</html>
