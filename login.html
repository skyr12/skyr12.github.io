<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود | نیمه گمشده</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
        }

        .login-box h1 {
            color: #ff4d6d;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .login-box p {
            color: #666;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #eee;
            border-radius: 30px;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #ff4d6d;
        }

        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary {
            background: #ff4d6d;
            color: white;
        }

        .btn-primary:hover {
            background: #ff3355;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,77,109,0.3);
        }

        .btn-secondary {
            background: white;
            color: #ff4d6d;
            border: 2px solid #ff4d6d;
        }

        .btn-secondary:hover {
            background: #ff4d6d;
            color: white;
        }

        a {
            color: #ff4d6d;
            text-decoration: none;
            font-size: 14px;
        }

        .links {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>نیمه گمشده</h1>
        <p>به جمع ما بپیوندید</p>
        
        <form action="index.html" method="get">
            <input type="email" placeholder="ایمیل" value="test@test.com" required>
            <input type="password" placeholder="رمز عبور" value="123456" required>
            <button type="submit" class="btn-primary">ورود</button>
        </form>
        
        <a href="index.html"><button class="btn-secondary">ورود مهمان</button></a>
        
        <div class="links">
            <a href="#">رمز را فراموش کردید؟</a> | <a href="#">ثبت نام</a>
        </div>
    </div>
</body>
</html>
