<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ورود | همدم</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box {
            background: white;
            width: 400px;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #ff4d6d;
            font-size: 48px;
            margin-bottom: 20px;
        }
        button {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
        }
        button:hover {
            background: #ff3355;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>❤️ همدم</h1>
        <p style="margin-bottom: 30px; color: #666;">برای ورود کلیک کنید</p>
        
        <button onclick="goToHome()">ورود به همدم</button>
    </div>

    <script>
        function goToHome() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
