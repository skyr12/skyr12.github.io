<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Search Users</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
padding-bottom:80px;
text-align:center;
}

.header{
background:#ff4d6d;
color:white;
padding:20px;
font-size:22px;
}

.search-box{
width:90%;
max-width:400px;
margin:20px auto;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

input{
width:90%;
padding:10px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
}

.user{
background:white;
padding:15px;
margin:10px auto;
width:90%;
max-width:400px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.navbar{
position:fixed;
bottom:0;
left:0;
width:100%;
height:65px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -5px 15px rgba(0,0,0,0.15);
}

.navbar a{
text-decoration:none;
font-size:24px;
color:#444;
}

</style>

</head>

<body>

<div class="header">
Search Users 🔎
</div>

<div class="search-box">

<input id="country" placeholder="Country">

<input id="age" placeholder="Age">

<button onclick="searchUsers()">Search</button>

</div>

<div id="results"></div>

<div class="navbar">
<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="chat.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="profile.html">👤</a>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

var firebaseConfig = {

apiKey:"YOUR_API_KEY",
authDomain:"YOUR_PROJECT.firebaseapp.com",
projectId:"YOUR_PROJECT_ID"

};

firebase.initializeApp(firebaseConfig)

var db = firebase.firestore()

function searchUsers(){

let country=document.getElementById("country").value

db.collection("users")
.where("country","==",country)
.get()
.then(snapshot=>{

let html=""

snapshot.forEach(doc=>{

let u=doc.data()

html+=`
<div class="user">

<h3>${u.name}</h3>

<p>${u.country}</p>

</div>
`

})

document.getElementById("results").innerHTML=html

})

}

</script>

</body>
</html>
