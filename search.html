<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Search</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
}

.card{
width:320px;
margin:20px auto;
background:white;
border-radius:20px;
padding:20px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
border-radius:10px;
}

input{
padding:10px;
margin:5px;
width:120px;
}

button{
padding:10px 20px;
border:none;
border-radius:20px;
background:#ff4d6d;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<h2>Search Users</h2>

<input id="minAge" placeholder="Min Age">

<input id="maxAge" placeholder="Max Age">

<input id="country" placeholder="Country">

<br>

<button onclick="searchUsers()">Search</button>

<div id="results"></div>


<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>

const firebaseConfig={
apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh"
}

firebase.initializeApp(firebaseConfig)

const db=firebase.firestore()

function searchUsers(){

let minAge=document.getElementById("minAge").value
let maxAge=document.getElementById("maxAge").value
let country=document.getElementById("country").value

document.getElementById("results").innerHTML=""

db.collection("users").get().then(snapshot=>{

snapshot.forEach(doc=>{

let user=doc.data()

if(user.age>=minAge && user.age<=maxAge && user.country==country){

let div=document.createElement("div")

div.className="card"

div.innerHTML=`

<img src="${user.photo}">

<h3>${user.name}</h3>

<p>${user.country}</p>

<p>Age ${user.age}</p>

`

document.getElementById("results").appendChild(div)

}

})

})

}

</script>

</body>

</html>
