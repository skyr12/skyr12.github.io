<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard</title><style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
text-align:center;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
font-size:20px;
}

.user{
background:white;
width:320px;
margin:auto;
margin-top:15px;
padding:15px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
display:flex;
align-items:center;
}

.user img{
width:60px;
height:60px;
border-radius:50%;
object-fit:cover;
margin-right:15px;
}

.rank{
font-size:22px;
margin-right:10px;
}

.navbar{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
font-size:22px;
}

.navbar a{
text-decoration:none;
}

</style></head><body><div class="header">🏆 Leaderboard</div><div id="list"></div><div class="navbar"><a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="inbox.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="visitors.html">👁️</a>
<a href="profile.html">👤</a>

</div><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script><script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh",
storageBucket:"nimeh-gomsodeh.firebasestorage.app",
messagingSenderId:"815930956932",
appId:"1:815930956932:web:e8696a6a69b4458fd936d1"

};

firebase.initializeApp(firebaseConfig)

const db = firebase.firestore()

function loadLeaderboard(){

db.collection("users")
.orderBy("coins","desc")
.limit(20)
.get()

.then(snapshot=>{

let html=""
let rank=1

snapshot.forEach(doc=>{

let u=doc.data()

html+=`

<div class="user">

<div class="rank">#${rank}</div>

<img src="${u.photo}">

<div>

<h3>${u.name}</h3>

<p>💰 ${u.coins || 0} coins</p>

</div>

</div>

`

rank++

})

document.getElementById("list").innerHTML=html

})

}

loadLeaderboard()

</script></body>
</html>
