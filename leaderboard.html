<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
text-align:center;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
font-size:20px;
}

.user{
background:white;
margin:15px;
padding:15px;
border-radius:15px;
display:flex;
align-items:center;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.user img{
width:60px;
height:60px;
border-radius:50%;
margin-right:10px;
}

.rank{
font-size:20px;
margin-right:10px;
}

.navbar{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
font-size:22px;
}

.navbar a{
text-decoration:none;
}

</style>

</head>

<body>

<div class="header">🏆 Leaderboard</div>

<div id="list"></div>

<div class="navbar">
<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="chat.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="visitors.html">👁️</a>
<a href="profile.html">👤</a>
</div>


<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {

apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.firebasestorage.app",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1"

};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig);
}

const db=firebase.firestore()


db.collection("users")

.orderBy("boost","desc")

.get()

.then(snapshot=>{

let rank=1

snapshot.forEach(doc=>{

let u=doc.data()

document.getElementById("list").innerHTML+=`

<div class="user">

<div class="rank">#${rank}</div>

<img src="${u.photo}">

<div>

<b>${u.name} ${u.vip ? "👑" : ""}</b><br>

${u.country}

</div>

</div>

`

rank++

})

})

</script>

</body>

</html>
