<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verify Profile</title>

<style>

body{
font-family:Arial;
background:#f3f3f3;
text-align:center;
}

.card{
width:320px;
margin:auto;
margin-top:40px;
background:white;
border-radius:20px;
padding:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

button{
padding:12px 20px;
margin-top:20px;
background:#ff4d6d;
color:white;
border:none;
border-radius:20px;
cursor:pointer;
}

</style>

</head>

<body>

<h2>Photo Verification</h2>

<div class="card">

<input type="text" id="photo" placeholder="Selfie Image URL">

<br>

<button onclick="submitVerification()">
Submit Verification
</button>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>

const firebaseConfig={
apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh"
}

firebase.initializeApp(firebaseConfig)

const db=firebase.firestore()

let currentUser=null

firebase.auth().onAuthStateChanged(user=>{

currentUser=user

})


function submitVerification(){

let photo=document.getElementById("photo").value

db.collection("verifications").add({

user:currentUser.uid,
photo:photo,
time:Date.now()

})

alert("Verification submitted")

}

</script>

</body>

</html>
