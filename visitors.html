<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بازدیدکنندگان پروفایل | چه کسی دیده؟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Vazir', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding-bottom: 80px;
            position: relative;
            overflow-x: hidden;
        }

        /* انیمیشن پس‌زمینه */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            25% { transform: translateY(-30px) translateX(15px); }
            50% { transform: translateY(-50px) translateX(-15px); }
            75% { transform: translateY(-30px) translateX(30px); }
        }

        /* هدر اصلی */
        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-title h1 {
            font-size: 28px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .visitor-count {
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .header-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 15px;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px) rotate(90deg);
        }

        /* بخش آمار */
        .stats-container {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            margin: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border-radius: 25px;
            color: white;
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.8;
        }

        /* دسته‌بندی بازدیدکنندگان */
        .categories {
            display: flex;
            gap: 10px;
            padding: 0 20px 20px;
            overflow-x: auto;
            scrollbar-width: none;
            position: relative;
            z-index: 10;
        }

        .category-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            backdrop-filter: blur(5px);
        }

        .category-btn.active {
            background: white;
            color: #764ba2;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .category-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        /* لیست بازدیدکنندگان */
        .visitors-container {
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .visitor-item {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            margin: 15px 0;
            padding: 20px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 2px solid transparent;
            animation: slideIn 0.5s ease forwards;
            opacity: 0;
            transform: translateX(30px);
        }

        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .visitor-item:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: #FFD700;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .visitor-avatar {
            position: relative;
        }

        .avatar-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .visitor-item:hover .avatar-img {
            transform: scale(1.1);
            border-color: #FFD700;
        }

        .online-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 15px;
            height: 15px;
            background: #4CAF50;
            border-radius: 50%;
            border: 3px solid white;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .visitor-info {
            flex: 1;
        }

        .visitor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .visitor-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .visit-time {
            font-size: 12px;
            color: #999;
            background: #f5f5f5;
            padding: 5px 10px;
            border-radius: 50px;
        }

        .visitor-details {
            display: flex;
            gap: 15px;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }

        .visitor-details span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .visitor-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-new {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
        }

        .status-returning {
            background: linear-gradient(135deg, #FF9800, #F57C00);
            color: white;
        }

        .status-regular {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
        }

        .visitor-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .action-btn {
            background: #f5f5f5;
            border: none;
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .action-btn:hover {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            transform: translateY(-2px);
        }

        /* بخش بازدیدکنندگان ویژه */
        .featured-section {
            padding: 20px;
        }

        .section-title {
            color: white;
            font-size: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .horizontal-scroll {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 5px 0;
            scrollbar-width: none;
        }

        .featured-card {
            min-width: 140px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .featured-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .featured-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }

        .featured-info {
            padding: 12px;
            text-align: center;
        }

        .featured-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .featured-time {
            font-size: 10px;
            color: #999;
        }

        /* حالت خالی */
        .empty-state {
            text-align: center;
            color: white;
            padding: 50px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            margin: 20px;
        }

        .empty-state span {
            font-size: 80px;
            display: block;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .empty-state p {
            opacity: 0.8;
            margin-bottom: 30px;
        }

        .share-btn {
            background: white;
            color: #764ba2;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .share-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        /* نوار پایین */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            box-shadow: 0 -5px 30px rgba(0, 0, 0, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            z-index: 1000;
        }

        .nav-item {
            color: #666;
            font-size: 24px;
            text-decoration: none;
            transition: all 0.3s ease;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            position: relative;
        }

        .nav-item.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .nav-item:hover {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            transform: translateY(-3px);
        }

        .nav-badge {
            position: absolute;
            top: 0;
            right: 0;
            background: #ff4d6d;
            color: white;
            font-size: 10px;
            font-weight: bold;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }

        /* مودال جزئیات بازدیدکننده */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: none;
        }

        .modal-overlay.show {
            display: block;
        }

        .visitor-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: white;
            border-radius: 40px;
            overflow: hidden;
            z-index: 2001;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            max-width: 350px;
            width: 90%;
        }

        .visitor-modal.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .modal-header {
            position: relative;
        }

        .modal-cover {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .modal-avatar {
            position: absolute;
            bottom: -40px;
            left: 20px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 5px solid white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .modal-content {
            padding: 60px 25px 25px;
        }

        .modal-name {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .modal-location {
            color: #666;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .modal-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .modal-stat {
            text-align: center;
        }

        .modal-stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .modal-stat-label {
            font-size: 11px;
            color: #999;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .modal-btn.primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .modal-btn.secondary {
            background: #f5f5f5;
            color: #333;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            z-index: 10;
            transition: all 0.3s ease;
        }

        .close-modal:hover {
            transform: rotate(90deg);
            background: rgba(255, 77, 77, 0.8);
        }

        /* نوتیفیکیشن */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: white;
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            z-index: 3000;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            border-right: 4px solid #4CAF50;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            border-right-color: #ff4d4d;
        }

        .toast-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .toast.success .toast-icon {
            background: #4CAF50;
            color: white;
        }

        .toast.error .toast-icon {
            background: #ff4d4d;
            color: white;
        }

        .toast-message {
            flex: 1;
            color: #333;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .header-title h1 {
                font-size: 22px;
            }
            
            .visitor-item {
                padding: 15px;
            }
            
            .avatar-img {
                width: 60px;
                height: 60px;
            }
            
            .visitor-name {
                font-size: 16px;
            }
            
            .visitor-details {
                flex-wrap: wrap;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- ذرات پس‌زمینه -->
    <div class="bg-particles" id="particles"></div>

    <!-- هدر -->
    <div class="header">
        <div class="header-content">
            <div class="header-title">
                <h1>👁️ بازدیدکنندگان</h1>
                <span class="visitor-count" id="visitorCount">0</span>
            </div>
            <div class="header-actions">
                <button class="header-btn" onclick="refreshVisitors()">🔄</button>
                <button class="header-btn" onclick="showFilters()">⚙️</button>
            </div>
        </div>
    </div>

    <!-- آمار -->
    <div class="stats-container">
        <div class="stat-item">
            <div class="stat-value" id="totalVisitors">0</div>
            <div class="stat-label">کل بازدید</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="uniqueVisitors">0</div>
            <div class="stat-label">بازدیدکننده</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="todayVisitors">0</div>
            <div class="stat-label">امروز</div>
        </div>
    </div>

    <!-- دسته‌بندی -->
    <div class="categories">
        <button class="category-btn active" onclick="filterCategory('all', this)">همه</button>
        <button class="category-btn" onclick="filterCategory('today', this)">امروز</button>
        <button class="category-btn" onclick="filterCategory('week', this)">این هفته</button>
        <button class="category-btn" onclick="filterCategory('month', this)">این ماه</button>
        <button class="category-btn" onclick="filterCategory('returning', this)">بازگشتی‌ها</button>
    </div>

    <!-- بازدیدکنندگان ویژه -->
    <div class="featured-section" id="featuredSection">
        <div class="section-title">
            <span>⭐</span>
            <span>بازدیدکنندگان ویژه</span>
        </div>
        <div class="horizontal-scroll" id="featuredScroll"></div>
    </div>

    <!-- لیست بازدیدکنندگان -->
    <div class="visitors-container">
        <div id="visitorsList"></div>
    </div>

    <!-- حالت خالی -->
    <div class="empty-state" id="emptyState" style="display: none;">
        <span>👁️</span>
        <h3>هنوز بازدیدی نداشتی!</h3>
        <p>پروفایل خودت رو به اشتراک بذار تا دیگران ببیننت</p>
        <button class="share-btn" onclick="shareProfile()">اشتراک‌گذاری پروفایل</button>
    </div>

    <!-- نوار پایین -->
    <nav class="bottom-nav">
        <a href="discover.html" class="nav-item">🔥</a>
        <a href="matches.html" class="nav-item">❤️</a>
        <a href="gift.html" class="nav-item">🎁</a>
        <a href="inbox.html" class="nav-item">💬</a>
        <a href="notifications.html" class="nav-item">🔔</a>
        <a href="visitors.html" class="nav-item active">👁️</a>
        <a href="profile.html" class="nav-item">👤</a>
    </nav>

    <!-- مودال جزئیات بازدیدکننده -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
    <div class="visitor-modal" id="visitorModal">
        <button class="close-modal" onclick="closeModal()">✕</button>
        <div class="modal-header">
            <div class="modal-cover"></div>
            <img src="" alt="avatar" class="modal-avatar" id="modalAvatar">
        </div>
        <div class="modal-content">
            <div class="modal-name" id="modalName"></div>
            <div class="modal-location" id="modalLocation"></div>
            <div class="modal-stats">
                <div class="modal-stat">
                    <div class="modal-stat-value" id="modalVisits">0</div>
                    <div class="modal-stat-label">بازدید</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-value" id="modalLastVisit">-</div>
                    <div class="modal-stat-label">آخرین بازدید</div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn primary" onclick="startChat()" id="modalChatBtn">💬 شروع چت</button>
                <button class="modal-btn secondary" onclick="sendGift()" id="modalGiftBtn">🎁 ارسال گیفت</button>
            </div>
        </div>
    </div>

    <!-- نوتیفیکیشن -->
    <div class="toast" id="toast">
        <div class="toast-icon" id="toastIcon">✓</div>
        <div class="toast-message" id="toastMessage"></div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>

        const firebaseConfig = {
            apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
            authDomain: "nimeh-gomsodeh.firebaseapp.com",
            projectId: "nimeh-gomsodeh",
            storageBucket: "nimeh-gomsodeh.firebasestorage.app",
            messagingSenderId: "815930956932",
            appId: "1:815930956932:web:e8696a6a69b4458fd936d1"

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Variables
        let myId = "";
        let visitors = [];
        let visitorDetails = new Map();
        let currentFilter = 'all';
        let selectedVisitorId = null;

        // Create particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = `${Math.random() * 15 + 5}px`;
                particle.style.height = particle.style.width;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                particle.style.animationDelay = `${Math.random() * 10}s`;
                particle.style.animationDuration = `${Math.random() * 15 + 10}s`;
                particlesContainer.appendChild(particle);
            }
        }

        // Check Authentication
        firebase.auth().onAuthStateChanged(user => {
            if (!user) {
                location.href = "login.html";
                return;
            }
            myId = user.uid;
            loadVisitors();
            createParticles();
        });

        // Load visitors
        function loadVisitors() {
            db.collection("visitors")
                .where("profile", "==", myId)
                .orderBy("time", "desc")
                .onSnapshot(snapshot => {
                    visitors = [];
                    visitorDetails.clear();
                    
                    snapshot.forEach(doc => {
                        const visit = doc.data();
                        visit.id = doc.id;
                        visitors.push(visit);
                        
                        // Load visitor user data
                        db.collection("users").doc(visit.visitor).get().then(userDoc => {
                            if (userDoc.exists) {
                                const userData = userDoc.data();
                                if (!visitorDetails.has(visit.visitor)) {
                                    visitorDetails.set(visit.visitor, {
                                        ...userData,
                                        id: visit.visitor,
                                        visits: [],
                                        lastVisit: visit.time
                                    });
                                }
                                const visitor = visitorDetails.get(visit.visitor);
                                visitor.visits.push(visit);
                                if (visit.time > visitor.lastVisit) {
                                    visitor.lastVisit = visit.time;
                                }
                            }
                            displayVisitors();
                        });
                    });
                    
                    updateStats();
                });
        }

        // Display visitors
        function displayVisitors() {
            const visitorsList = document.getElementById('visitorsList');
            const featuredScroll = document.getElementById('featuredScroll');
            const emptyState = document.getElementById('emptyState');
            const visitorCount = document.getElementById('visitorCount');
            
            if (visitorDetails.size === 0) {
                visitorsList.innerHTML = '';
                featuredScroll.innerHTML = '';
                emptyState.style.display = 'block';
                visitorCount.textContent = '0';
                return;
            }

            emptyState.style.display = 'none';
            
            // Convert to array and sort
            let visitors = Array.from(visitorDetails.values());
            
            // Apply filter
            const now = new Date();
            if (currentFilter === 'today') {
                visitors = visitors.filter(v => {
                    const lastVisit = v.lastVisit?.seconds * 1000;
                    return lastVisit > now.setHours(0,0,0,0);
                });
            } else if (currentFilter === 'week') {
                const weekAgo = now.setDate(now.getDate() - 7);
                visitors = visitors.filter(v => {
                    return (v.lastVisit?.seconds * 1000) > weekAgo;
                });
            } else if (currentFilter === 'month') {
                const monthAgo = now.setMonth(now.getMonth() - 1);
                visitors = visitors.filter(v => {
                    return (v.lastVisit?.seconds * 1000) > monthAgo;
                });
            } else if (currentFilter === 'returning') {
                visitors = visitors.filter(v => v.visits.length > 1);
            }
            
            // Sort by last visit
            visitors.sort((a, b) => (b.lastVisit?.seconds || 0) - (a.lastVisit?.seconds || 0));
            
            // Display in list
            let listHtml = '';
            visitors.forEach((visitor, index) => {
                listHtml += createVisitorItem(visitor, index);
            });
            visitorsList.innerHTML = listHtml;
            
            // Display featured (top 10)
            let featuredHtml = '';
            visitors.slice(0, 10).forEach((visitor, index) => {
                featuredHtml += createFeaturedCard(visitor, index);
            });
            featuredScroll.innerHTML = featuredHtml;
            
            visitorCount.textContent = visitors.length;
        }

        // Create visitor item HTML
        function createVisitorItem(visitor, index) {
            const lastVisit = visitor.lastVisit ? new Date(visitor.lastVisit.seconds * 1000) : new Date();
            const timeStr = formatVisitTime(lastVisit);
            const visitCount = visitor.visits.length;
            
            let statusClass = 'status-new';
            let statusText = 'بازدید جدید';
            if (visitCount > 5) {
                statusClass = 'status-regular';
                statusText = 'بازدیدکننده ثابت';
            } else if (visitCount > 1) {
                statusClass = 'status-returning';
                statusText = 'بازدید مجدد';
            }
            
            return `
                <div class="visitor-item" onclick="showVisitorDetails('${visitor.id}')" style="animation-delay: ${index * 0.1}s">
                    <div class="visitor-avatar">
                        <img src="${visitor.photo || 'https://via.placeholder.com/150x150?text=User'}" class="avatar-img">
                        ${visitor.online ? '<span class="online-badge"></span>' : ''}
                    </div>
                    <div class="visitor-info">
                        <div class="visitor-header">
                            <span class="visitor-name">${visitor.name || 'کاربر'}</span>
                            <span class="visit-time">${timeStr}</span>
                        </div>
                        <div class="visitor-details">
                            <span>📍 ${visitor.city || 'نامشخص'}</span>
                            <span>🎂 ${visitor.age || '??'} سال</span>
                            <span>👁️ ${visitCount} بازدید</span>
                        </div>
                        <div>
                            <span class="visitor-status ${statusClass}">${statusText}</span>
                        </div>
                        <div class="visitor-actions">
                            <button class="action-btn" onclick="event.stopPropagation(); startChat('${visitor.id}')">💬 پیام</button>
                            <button class="action-btn" onclick="event.stopPropagation(); sendGift('${visitor.id}')">🎁 گیفت</button>
                            <button class="action-btn" onclick="event.stopPropagation(); addToFavorites('${visitor.id}')">⭐ علاقه‌مندی</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Create featured card
        function createFeaturedCard(visitor, index) {
            return `
                <div class="featured-card" onclick="showVisitorDetails('${visitor.id}')">
                    <img src="${visitor.photo || 'https://via.placeholder.com/150x150?text=User'}" alt="${visitor.name || 'User'}">
                    <div class="featured-info">
                        <div class="featured-name">${visitor.name || 'کاربر'}</div>
                        <div class="featured-time">${visitor.visits.length} بازدید</div>
                    </div>
                </div>
            `;
        }

        // Format visit time
        function formatVisitTime(date) {
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return 'لحظاتی پیش';
            if (diff < 3600000) return `${Math.floor(diff / 60000)} دقیقه پیش`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)} ساعت پیش`;
            if (diff < 604800000) return `${Math.floor(diff / 86400000)} روز پیش`;
            return date.toLocaleDateString('fa-IR');
        }

        // Filter category
        function filterCategory(category, btn) {
            currentFilter = category;
            
            // Update active button
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            displayVisitors();
        }

        // Show visitor details
        function showVisitorDetails(visitorId) {
            selectedVisitorId = visitorId;
            const visitor = visitorDetails.get(visitorId);
            
            if (visitor) {
                document.getElementById('modalAvatar').src = visitor.photo || 'https://via.placeholder.com/400x400?text=User';
                document.getElementById('modalName').textContent = visitor.name || 'کاربر';
                document.getElementById('modalLocation').innerHTML = `📍 ${visitor.city || 'نامشخص'} • ${visitor.age || '??'} سال`;
                document.getElementById('modalVisits').textContent = visitor.visits.length;
                
                const lastVisit = visitor.lastVisit ? new Date(visitor.lastVisit.seconds * 1000) : new Date();
                document.getElementById('modalLastVisit').textContent = formatVisitTime(lastVisit);
                
                document.getElementById('modalOverlay').classList.add('show');
                document.getElementById('visitorModal').classList.add('show');
            }
        }

        // Close modal
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
            document.getElementById('visitorModal').classList.remove('show');
        }

        // Start chat
        function startChat(userId) {
            const id = userId || selectedVisitorId;
            if (id) {
                location.href = `chat.html?id=${id}`;
            }
        }

        // Send gift
        function sendGift(userId) {
            const id = userId || selectedVisitorId;
            if (id) {
                location.href = `gift.html?id=${id}`;
            }
        }

        // Add to favorites
        function addToFavorites(userId) {
            showToast('به علاقه‌مندی‌ها اضافه شد');
        }

        // Share profile
        function shareProfile() {
            const profileUrl = `https://nimesh.live/profile.html?id=${myId}`;
            
            if (navigator.share) {
                navigator.share({
                    title: 'پروفایل من',
                    text: 'بیا تو نیمش به من سر بزن!',
                    url: profileUrl
                });
            } else {
                navigator.clipboard.writeText(profileUrl);
                showToast('لینک پروفایل کپی شد');
            }
        }

        // Update stats
        function updateStats() {
            const totalVisitors = visitors.length;
            const uniqueVisitors = visitorDetails.size;
            
            const today = new Date().setHours(0,0,0,0);
            const todayVisitors = visitors.filter(v => 
                v.time?.seconds * 1000 > today
            ).length;
            
            document.getElementById('totalVisitors').textContent = totalVisitors;
            document.getElementById('uniqueVisitors').textContent = uniqueVisitors;
            document.getElementById('todayVisitors').textContent = todayVisitors;
        }

        // Refresh visitors
        function refreshVisitors() {
            showToast('در حال به‌روزرسانی...');
            loadVisitors();
        }

        // Show filters
        function showFilters() {
            showToast('فیلترها به زودی اضافه می‌شوند');
        }

        // Show toast
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const messageEl = document.getElementById('toastMessage');
            
            toast.className = `toast ${type}`;
            icon.innerHTML = type === 'success' ? '✓' : '✗';
            messageEl.textContent = message;
            
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Handle network status
        window.addEventListener('online', () => {
            showToast('اتصال اینترنت برقرار شد');
        });

        window.addEventListener('offline', () => {
            showToast('اتصال اینترنت قطع شد', 'error');
        });
    </script>
</body>
</html>
