<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Visitors</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
margin:0;
}

h2{
margin-top:20px;
}

.card{
background:white;
margin:20px auto;
padding:20px;
border-radius:12px;
width:80%;
max-width:400px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<h2>👁️ Profile Visitors</h2>

<div id="visitors"></div>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.firebasestorage.app",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1",
measurementId: "G-KTCV2B5R9L"
}

firebase.initializeApp(firebaseConfig)

let db = firebase.firestore()

firebase.auth().onAuthStateChanged(user=>{

if(!user) return

db.collection("visitors")
.where("profile","==",user.uid)
.onSnapshot(snapshot=>{

let box=document.getElementById("visitors")

box.innerHTML=""

snapshot.forEach(doc=>{

let div=document.createElement("div")

div.className="card"

div.innerText="Someone visited your profile 👀"

box.appendChild(div)

})

})

})

</script>
