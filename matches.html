<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطابق‌ها | نیمه گمشده</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f5f5f5;
            min-height: 100vh;
            padding-bottom: 70px;
        }

        .header {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 24px;
        }

        .header h1 {
            font-size: 22px;
            flex: 1;
        }

        .stats {
            background: white;
            margin: 15px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #ff4d6d;
        }

        .stat-label {
            color: #666;
            font-size: 12px;
            margin-top: 5px;
        }

        .tabs {
            display: flex;
            background: white;
            margin: 15px;
            border-radius: 40px;
            padding: 5px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            color: #666;
        }

        .tab.active {
            background: #ff4d6d;
            color: white;
        }

        .match-card {
            background: white;
            margin: 15px;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .match-card img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ff4d6d;
        }

        .match-info {
            flex: 1;
        }

        .match-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .match-time {
            color: #999;
            font-size: 12px;
        }

        .chat-btn {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
        }

        .new-badge {
            background: #ff4d6d;
            color: white;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-right: 10px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #ddd;
        }

        .nav-item {
            text-decoration: none;
            color: #999;
            font-size: 24px;
        }

        .nav-item.active {
            color: #ff4d6d;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="back-btn">←</a>
        <h1>تطابق‌های من</h1>
        <div></div>
    </div>

    <div class="stats">
        <div>
            <div class="stat-number">۴۵</div>
            <div class="stat-label">کل تطابق‌ها</div>
        </div>
        <div>
            <div class="stat-number">۱۲</div>
            <div class="stat-label">جدید</div>
        </div>
        <div>
            <div class="stat-number">۸</div>
            <div class="stat-label">آنلاین</div>
        </div>
    </div>

    <div class="tabs">
        <span class="tab active">همه</span>
        <span class="tab">جدید</span>
        <span class="tab">آنلاین</span>
    </div>

    <div class="match-card">
        <img src="https://randomuser.me/api/portraits/women/1.jpg">
        <div class="match-info">
            <div class="match-name">
                سارا محمدی
                <span class="new-badge">جدید</span>
            </div>
            <div class="match-time">تطابق ۲ دقیقه پیش</div>
        </div>
        <button class="chat-btn" onclick="location.href='chat.html'">💬</button>
    </div>

    <div class="match-card">
        <img src="https://randomuser.me/api/portraits/men/1.jpg">
        <div class="match-info">
            <div class="match-name">علی رضایی</div>
            <div class="match-time">تطابق ۲ ساعت پیش • آنلاین</div>
        </div>
        <button class="chat-btn" onclick="location.href='chat.html'">💬</button>
    </div>

    <div class="match-card">
        <img src="https://randomuser.me/api/portraits/women/2.jpg">
        <div class="match-info">
            <div class="match-name">مریم کریمی</div>
            <div class="match-time">تطابق دیروز</div>
        </div>
        <button class="chat-btn" onclick="location.href='chat.html'">💬</button>
    </div>

    <div class="match-card">
        <img src="https://randomuser.me/api/portraits/men/2.jpg">
        <div class="match-info">
            <div class="match-name">رضا احمدی</div>
            <div class="match-time">تطابق ۳ روز پیش</div>
        </div>
        <button class="chat-btn" onclick="location.href='chat.html'">💬</button>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item">🏠</a>
        <a href="discover.html" class="nav-item">🔍</a>
        <a href="matches.html" class="nav-item active">❤️</a>
        <a href="profile.html" class="nav-item">👤</a>
    </div>
</body>
</html>
