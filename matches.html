<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Match ها</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#111;
color:white;
text-align:center;
padding:40px;
}

.matches{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
margin-top:30px;
}

.card{
background:#222;
padding:20px;
border-radius:20px;
width:200px;
box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

.avatar{
width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
margin-bottom:10px;
}

button{
margin-top:10px;
background:#FF4D6D;
border:none;
padding:10px 15px;
border-radius:20px;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<h1>❤️ Match های شما</h1>

<div class="matches" id="matches"></div>

<script>

let matches = JSON.parse(localStorage.getItem("matches")) || []

let html=""

matches.forEach((u,i)=>{

html+=`

<div class="card">

<img src="${u.photo}" class="avatar">

<h3>${u.name}</h3>

<p>${u.bio}</p>

<a href="chat.html">
<button>💬 چت</button>
</a>

</div>

`

})

document.getElementById("matches").innerHTML=html

</script>

</body>
</html>
