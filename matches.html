<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Your Matches</title><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
text-align:center;
}

.header{
background:#ff4d6d;
color:white;
padding:20px;
font-size:22px;
}

.container{
max-width:500px;
margin:auto;
padding:20px;
}

.card{
background:white;
border-radius:15px;
padding:15px;
margin-bottom:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
cursor:pointer;
}

.card img{
width:100%;
border-radius:10px;
}

</style></head><body><div class="header">💘 Your Matches

</div><div id="matches" class="container"></div><script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh"

}

firebase.initializeApp(firebaseConfig)

const db = firebase.firestore()

firebase.auth().onAuthStateChanged(user=>{

if(!user){

window.location="login.html"
return

}

loadMatches(user.uid)

})

function loadMatches(uid){

db.collection("matches")

.where("users","array-contains",uid)

.get()

.then(snapshot=>{

let html=""

snapshot.forEach(doc=>{

let data = doc.data()

let otherUser = data.users.find(u => u !== uid)

db.collection("users").doc(otherUser).get().then(userDoc=>{

let u = userDoc.data()

html += `

<div class="card" onclick="openChat('${doc.id}')">

<img src="${u.photo || 'https://via.placeholder.com/400'}">

<h2>${u.name}</h2>

<p>${u.country}</p>

</div>

`

document.getElementById("matches").innerHTML = html

})

})

})

}

function openChat(matchId){

window.location = "chat.html?match=" + matchId

}

</script></body></html>
