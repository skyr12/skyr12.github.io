<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matches</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
text-align:center;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
font-size:20px;
}

.container{
padding:20px;
}

.card{
background:white;
width:260px;
margin:auto;
margin-top:20px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
padding:15px;
}

.card img{
width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
}

.chat{
background:#ff4d6d;
color:white;
border:none;
padding:10px 20px;
border-radius:20px;
margin-top:10px;
cursor:pointer;
}

.navbar{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
font-size:22px;
}

.navbar a{
text-decoration:none;
}

</style>

</head>

<body>

<div class="header">❤️ Matches</div>

<div class="container">

<div id="matches"></div>

</div>


<div class="navbar">

<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="chat.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="visitors.html">👁️</a>
<a href="profile.html">👤</a>

</div>



<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh",
storageBucket:"nimeh-gomsodeh.firebasestorage.app",
messagingSenderId:"815930956932",
appId:"1:815930956932:web:e8696a6a69b4458fd936d1"

};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig)
}

const db=firebase.firestore()


firebase.auth().onAuthStateChanged(user=>{

if(!user){

location.href="login.html"
return

}

loadMatches(user.uid)

})



function loadMatches(myId){

db.collection("likes")
.where("from","==",myId)
.get()

.then(snapshot=>{

snapshot.forEach(doc=>{

let liked=doc.data().to

checkMatch(myId,liked)

})

})

}



function checkMatch(myId,otherId){

db.collection("likes")
.where("from","==",otherId)
.where("to","==",myId)
.get()

.then(snapshot=>{

if(!snapshot.empty){

showMatch(otherId)

}

})

}



function showMatch(uid){

db.collection("users").doc(uid).get()

.then(doc=>{

let u=doc.data()

let html=`

<div class="card">

<img src="${u.photo}">

<h3>${u.name}</h3>

<button class="chat" onclick="chat('${uid}')">

💬 Chat

</button>

</div>

`

document.getElementById("matches").innerHTML+=html

})

}



function chat(uid){

location.href="chat.html?id="+uid

}

</script>

</body>
</html>
