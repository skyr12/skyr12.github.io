<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matches</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
margin:0;
text-align:center;
}

h2{
margin-top:20px;
}

#matches{
padding:20px;
}

.card{

background:white;
border-radius:15px;
padding:15px;
margin:10px;
display:flex;
align-items:center;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
cursor:pointer;

}

.card img{

width:60px;
height:60px;
border-radius:50%;
object-fit:cover;
margin-right:15px;

}

.navbar{

position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
font-size:22px;

}

.navbar a{
text-decoration:none;
}

</style>

</head>

<body>

<h2>❤️ Matches</h2>

<div id="matches"></div>


<div class="navbar">

<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="chat.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="visitors.html">👁️</a>
<a href="profile.html">👤</a>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh",
storageBucket:"nimeh-gomsodeh.firebasestorage.app",
messagingSenderId:"815930956932",
appId:"1:815930956932:web:e8696a6a69b4458fd936d1"

};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig)
}

const db=firebase.firestore()

let myId=""

firebase.auth().onAuthStateChanged(user=>{

if(!user){

location.href="login.html"
return

}

myId=user.uid

loadMatches()

})


function loadMatches(){

db.collection("matches")

.onSnapshot(snapshot=>{

let html=""

snapshot.forEach(doc=>{

let m=doc.data()

if(m.users.includes(myId)){

let otherId = m.users.find(id=>id!==myId)

db.collection("users").doc(otherId).get()

.then(userDoc=>{

let u=userDoc.data()

html+=`

<div class="card" onclick="openChat('${otherId}')">

<img src="${u.photo}">

<h3>${u.name}</h3>

</div>

`

document.getElementById("matches").innerHTML=html

})

}

})

})

}


function openChat(id){

window.location.href="chat.html?id="+id

}

</script>

</body>
</html>
