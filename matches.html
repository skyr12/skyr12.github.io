<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت | نیمه گمشده</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 24px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .user-info img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid white;
        }

        .user-details h3 {
            font-size: 16px;
            margin-bottom: 3px;
        }

        .user-details p {
            font-size: 12px;
            opacity: 0.9;
        }

        .online {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            margin-left: 5px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 80%;
            display: flex;
            flex-direction: column;
        }

        .message.sent {
            align-self: flex-end;
        }

        .message.received {
            align-self: flex-start;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        .sent .message-content {
            background: #ff4d6d;
            color: white;
            border-bottom-left-radius: 5px;
        }

        .received .message-content {
            background: white;
            color: #333;
            border: 1px solid #eee;
            border-bottom-right-radius: 5px;
        }

        .message-time {
            font-size: 10px;
            color: #999;
            margin-top: 3px;
            padding: 0 5px;
        }

        .sent .message-time {
            text-align: left;
        }

        .received .message-time {
            text-align: right;
        }

        .chat-input {
            background: white;
            padding: 15px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #eee;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 30px;
            outline: none;
            font-size: 14px;
        }

        .chat-input input:focus {
            border-color: #ff4d6d;
        }

        .chat-input button {
            background: #ff4d6d;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .chat-input button:hover {
            background: #ff3355;
            transform: scale(1.1);
        }

        .typing {
            color: #999;
            font-size: 12px;
            padding: 5px 15px;
        }
    </style>
</head>
<body>
    <div class="chat-header">
        <a href="matches.html" class="back-btn">←</a>
        <div class="user-info">
            <img src="https://randomuser.me/api/portraits/women/1.jpg">
            <div class="user-details">
                <h3>سارا محمدی <span class="online"></span></h3>
                <p>آنلاین</p>
            </div>
        </div>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="message received">
            <div class="message-content">سلام! خوبی؟</div>
            <span class="message-time">۱۰:۲۳</span>
        </div>
        <div class="message sent">
            <div class="message-content">سلام ممنون، تو خوبی؟</div>
            <span class="message-time">۱۰:۲۴</span>
        </div>
        <div class="message received">
            <div class="message-content">مرسی، حالت چطوره؟</div>
            <span class="message-time">۱۰:۲۵</span>
        </div>
        <div class="message sent">
            <div class="message-content">عالی‌ام، تازه از سفر برگشتم</div>
            <span class="message-time">۱۰:۲۶</span>
        </div>
        <div class="message received">
            <div class="message-content">عجب! کجا رفته بودی؟</div>
            <span class="message-time">۱۰:۲۷</span>
        </div>
    </div>

    <div class="typing" id="typingIndicator" style="display: none;">در حال تایپ...</div>

    <div class="chat-input">
        <input type="text" id="messageInput" placeholder="پیام شما...">
        <button onclick="sendMessage()">➤</button>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const container = document.getElementById('chatMessages');
            const now = new Date();
            const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message sent';
            msgDiv.innerHTML = `
                <div class="message-content">${text}</div>
                <span class="message-time">${time}</span>
            `;
            container.appendChild(msgDiv);
            input.value = '';
            container.scrollTop = container.scrollHeight;
        }

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
