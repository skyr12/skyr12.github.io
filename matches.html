<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Match ها</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#020617;
color:white;
text-align:center;
padding:30px;
}

.container{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
}

.card{
background:#111;
padding:20px;
border-radius:20px;
width:220px;
position:relative;
}

.avatar{
width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
margin-bottom:10px;
}

.last{
opacity:0.7;
font-size:14px;
margin-top:5px;
}

button{
margin-top:10px;
background:#FF4D6D;
border:none;
padding:8px 15px;
border-radius:20px;
color:white;
cursor:pointer;
}

.notify{
position:absolute;
top:15px;
right:15px;
width:12px;
height:12px;
background:red;
border-radius:50%;
}

</style>

</head>

<body>

<h1>❤️ Match های شما</h1>

<div class="container" id="matches"></div>

<script>

let matches = JSON.parse(localStorage.getItem("matches")) || []

let chats = JSON.parse(localStorage.getItem("chats")) || {}

let html=""

matches.forEach((u,i)=>{

let lastMessage="هیچ پیامی نیست"

let newMsg=false

if(chats[i] && chats[i].length>0){

lastMessage = chats[i][chats[i].length-1]

newMsg=true

}

html+=`

<div class="card">

${newMsg ? '<div class="notify"></div>' : ''}

<img src="${u.photo}" class="avatar">

<h3>${u.name}</h3>

<p>${u.city}</p>

<div class="last">

💬 ${lastMessage}

</div>

<button onclick="openChat(${i})">چت</button>

</div>

`

})

document.getElementById("matches").innerHTML=html

function openChat(i){

localStorage.setItem("chatIndex",i)

window.location.href="chat.html"

}

</script>

</body>

</html>
