<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Match ها</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#020617;
color:white;
text-align:center;
padding-bottom:80px;
}

.title{
margin-top:30px;
font-size:26px;
}

.list{
margin-top:30px;
}

.card{
background:#111;
width:260px;
margin:20px auto;
padding:20px;
border-radius:20px;
}

.avatar{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
}

.btn{
background:#ff4d6d;
border:none;
padding:10px 20px;
border-radius:20px;
color:white;
margin-top:10px;
cursor:pointer;
}

.bottomMenu{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111;
display:flex;
justify-content:space-around;
padding:15px;
font-size:24px;
}

.bottomMenu a{
color:white;
text-decoration:none;
}

</style>

</head>

<body>

<h1 class="title">❤️ Match های شما</h1>

<div class="list" id="list"></div>

<div class="bottomMenu">

<a href="users.html">🔎</a>

<a href="swipe.html">❤️</a>

<a href="matches.html">💬</a>

</div>

<script>

let matches = JSON.parse(localStorage.getItem("matches")) || []

let html=""

matches.forEach((u,i)=>{

html+=`

<div class="card">

<img src="${u.photo}" class="avatar">

<h3>${u.name}</h3>

<p>${u.city}</p>

<button class="btn" onclick="chat(${i})">💬 شروع چت</button>

</div>

`

})

document.getElementById("list").innerHTML=html

function chat(i){

localStorage.setItem("chatIndex",i)

window.location.href="chat.html"

}

</script>

</body>

</html>
