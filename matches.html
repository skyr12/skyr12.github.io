<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Matches</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
text-align:center;
padding-bottom:80px;
}

.header{
background:#ff4d6d;
color:white;
padding:20px;
font-size:22px;
}

.match-list{
width:90%;
max-width:400px;
margin:30px auto;
}

.match{
display:flex;
align-items:center;
background:white;
padding:10px;
margin-bottom:15px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
cursor:pointer;
}

.match img{
width:60px;
height:60px;
border-radius:50%;
margin-right:15px;
object-fit:cover;
}

.match-name{
font-size:18px;
}

.navbar{
position:fixed;
bottom:0;
left:0;
width:100%;
height:65px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -5px 15px rgba(0,0,0,0.15);
}

.navbar a{
text-decoration:none;
font-size:24px;
color:#444;
}

</style>

</head>

<body>

<div class="header">
Your Matches ❤️
</div>

<div class="match-list">

<div class="match" onclick="openChat('Sara')">
<img src="https://randomuser.me/api/portraits/women/44.jpg">
<div class="match-name">Sara</div>
</div>

<div class="match" onclick="openChat('John')">
<img src="https://randomuser.me/api/portraits/men/65.jpg">
<div class="match-name">John</div>
</div>

<div class="match" onclick="openChat('Anna')">
<img src="https://randomuser.me/api/portraits/women/68.jpg">
<div class="match-name">Anna</div>
</div>

</div>

<div class="navbar">
<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="chat.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="profile.html">👤</a>
</div>

<script>

function openChat(name){

alert("Open chat with " + name)

}

</script>

</body>
</html>
