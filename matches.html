<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Match ها</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#020617;
color:white;
text-align:center;
padding:30px;
}

.container{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
}

.card{
background:#111;
padding:20px;
border-radius:20px;
width:220px;
box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

.avatar{
width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
margin-bottom:10px;
}

button{
margin-top:10px;
background:#FF4D6D;
border:none;
padding:8px 15px;
border-radius:20px;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<h1>❤️ Match های شما</h1>

<div class="container" id="matches"></div>

<script>

let matches = JSON.parse(localStorage.getItem("matches")) || []

if(matches.length === 0){

document.getElementById("matches").innerHTML="<p>هنوز Match نداری</p>"

}

else{

let html=""

matches.forEach((u,i)=>{

html+=`

<div class="card">

<img src="${u.photo}" class="avatar">

<h3>${u.name}</h3>

<p>${u.city}</p>

<button onclick="openChat(${i})">💬 چت</button>

</div>

`

})

document.getElementById("matches").innerHTML=html

}

function openChat(i){

localStorage.setItem("chatIndex",i)

window.location.href="chat.html"

}

</script>

</body>

</html>
