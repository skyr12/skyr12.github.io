<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Matches</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
text-align:center;
padding-bottom:80px;
}

.header{
background:#ff4d6d;
color:white;
padding:20px;
font-size:22px;
}

.card{
background:white;
margin:20px;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.navbar{
position:fixed;
bottom:0;
left:0;
width:100%;
height:70px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -5px 15px rgba(0,0,0,0.2);
}

.navbar a{
text-decoration:none;
font-size:26px;
color:black;
}

</style>

</head>

<body>

<div class="header">
❤️ Your Matches
</div>

<div id="matches"></div>

<div class="navbar">

<a href="discover.html">🔥</a>

<a href="matches.html">❤️</a>

<a href="chat.html">💬</a>

<a href="notifications.html">🔔</a>

<a href="profile.html">👤</a>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>


<script>

const firebaseConfig = {
  apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
  authDomain: "nimeh-gomsodeh.firebaseapp.com",
  projectId: "nimeh-gomsodeh",
  storageBucket: "nimeh-gomsodeh.firebasestorage.app",
  messagingSenderId: "815930956932",
  appId: "1:815930956932:web:e8696a6a69b4458fd936d1",
  measurementId: "G-KTCV2B5R9L"
};

firebase.initializeApp(firebaseConfig)

const db = firebase.firestore()


firebase.auth().onAuthStateChanged(user=>{

if(!user){

alert("Please login first")

location.href="login.html"

return

}

loadMatches(user.uid)

})


function loadMatches(uid){

db.collection("matches")
.where("users","array-contains",uid)
.onSnapshot(snapshot=>{

let container=document.getElementById("matches")

container.innerHTML=""

snapshot.forEach(doc=>{

let div=document.createElement("div")

div.className="card"

div.innerHTML=`

<h3>🎉 New Match</h3>

<button onclick="location.href='chat.html'">
Open Chat
</button>

`

container.appendChild(div)

})

})

}

</script>
<div class="navbar">

<a href="discover.html">🔥</a>

<a href="matches.html">❤️</a>

<a href="chat.html">💬</a>

<a href="notifications.html">🔔</a>

<a href="visitors.html">👁️</a>

<a href="profile.html">👤</a>

</div>
</body>

</html>
