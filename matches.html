<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطابق‌ها | همدم</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        .match-card {
            background: white;
            border-radius: 20px;
            margin: 15px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            position: relative;
        }
        
        .match-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(255,77,109,0.2);
        }
        
        .match-card.unread::before {
            content: '';
            position: absolute;
            top: 50%;
            right: -5px;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            background: #ff4d6d;
            border-radius: 50%;
        }
        
        .match-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff4d6d;
        }
        
        .match-info {
            flex: 1;
        }
        
        .match-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .match-last {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .match-time {
            font-size: 11px;
            color: #999;
        }
        
        .online-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #4caf50;
            border-radius: 50%;
            margin-left: 5px;
        }
        
        .offline-indicator {
            background: #999;
        }
        
        .new-match-badge {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            margin-right: 10px;
        }
        
        .empty-matches {
            text-align: center;
            padding: 50px 20px;
            background: white;
            border-radius: 20px;
            margin: 15px;
        }
        
        .empty-emoji {
            font-size: 80px;
            margin-bottom: 20px;
        }
        
        .tabs-mini {
            display: flex;
            background: white;
            border-radius: 30px;
            margin: 15px;
            padding: 5px;
        }
        
        .tab-mini {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 14px;
        }
        
        .tab-mini.active {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
        }
    </style>
</head>
<body>
    <!-- هدر -->
    <div class="header">
        <div class="logo">
            <span>❤️</span>
            تطابق‌ها
        </div>
        <div class="wallet" onclick="location.href='wallet.html'">
            <span>🪙</span>
            <span class="user-coins">۰</span>
        </div>
    </div>

    <!-- تب‌ها -->
    <div class="tabs">
        <div class="tab" onclick="location.href='index.html'">خانه</div>
        <div class="tab" onclick="location.href='discover.html'">اکتشاف</div>
        <div class="tab" onclick="location.href='live.html'">لایو</div>
        <div class="tab" onclick="location.href='gifts.html'">هدایا</div>
        <div class="tab active" onclick="location.href='profile.html'">پروفایل</div>
    </div>

    <!-- تب‌های داخلی -->
    <div class="tabs-mini">
        <div class="tab-mini active" onclick="filterMatches('all')">همه</div>
        <div class="tab-mini" onclick="filterMatches('new')">جدید</div>
        <div class="tab-mini" onclick="filterMatches('online')">آنلاین</div>
    </div>

    <!-- لیست تطابق‌ها -->
    <div id="matchesList">
        <!-- با JS لود میشه -->
    </div>

    <!-- نوار پایین -->
    <div class="navbar">
        <a href="index.html" class="nav-item">🏠</a>
        <a href="discover.html" class="nav-item">🔥</a>
        <a href="live.html" class="nav-item">🎥</a>
        <a href="gifts.html" class="nav-item">🎁</a>
        <a href="profile.html" class="nav-item active">👤</a>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage.js"></script>
    <script src="assets/script.js"></script>

    <script>
        let allMatches = [];
        let currentFilter = 'all';
        
        // لود تطابق‌ها
        function loadMatches() {
            if (!currentUser) return;
            
            document.getElementById('matchesList').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>در حال بارگذاری...</p>
                </div>
            `;
            
            db.collection('matches')
                .where('users', 'array-contains', currentUser.uid)
                .orderBy('time', 'desc')
                .get()
                .then(snapshot => {
                    if (snapshot.empty) {
                        showEmptyMatches();
                        return;
                    }
                    
                    allMatches = [];
                    let promises = [];
                    
                    snapshot.forEach(doc => {
                        const match = doc.data();
                        const otherUserId = match.users.find(id => id !== currentUser.uid);
                        
                        // دریافت اطلاعات کاربر مقابل
                        const promise = db.collection('users').doc(otherUserId).get()
                            .then(userDoc => {
                                if (userDoc.exists) {
                                    allMatches.push({
                                        id: doc.id,
                                        userId: otherUserId,
                                        userData: userDoc.data(),
                                        matchData: match,
                                        unread: checkUnread(match.lastMessageTime)
                                    });
                                }
                            });
                        
                        promises.push(promise);
                    });
                    
                    Promise.all(promises).then(() => {
                        displayMatches();
                    });
                })
                .catch(error => {
                    console.error('Error loading matches:', error);
                    useSampleMatches();
                });
        }
        
        // استفاده از نمونه
        function useSampleMatches() {
            allMatches = [
                {
                    id: '1',
                    userId: 'sample1',
                    userData: {
                        name: 'سارا محمدی',
                        photo: 'https://randomuser.me/api/portraits/women/1.jpg',
                        online: true,
                        lastSeen: new Date()
                    },
                    matchData: {
                        time: new Date(),
                        lastMessage: 'سلام خوبی؟',
                        lastMessageTime: new Date()
                    },
                    unread: true
                },
                {
                    id: '2',
                    userId: 'sample2',
                    userData: {
                        name: 'علی رضایی',
                        photo: 'https://randomuser.me/api/portraits/men/1.jpg',
                        online: false,
                        lastSeen: new Date(Date.now() - 3600000)
                    },
                    matchData: {
                        time: new Date(Date.now() - 86400000),
                        lastMessage: 'ممنون عالی بود',
                        lastMessageTime: new Date(Date.now() - 3600000)
                    },
                    unread: false
                },
                {
                    id: '3',
                    userId: 'sample3',
                    userData: {
                        name: 'مریم کریمی',
                        photo: 'https://randomuser.me/api/portraits/women/2.jpg',
                        online: true,
                        lastSeen: new Date()
                    },
                    matchData: {
                        time: new Date(Date.now() - 172800000),
                        lastMessage: 'فیلم جدید دیدی؟',
                        lastMessageTime: new Date(Date.now() - 7200000)
                    },
                    unread: false
                }
            ];
            
            displayMatches();
        }
        
        // نمایش تطابق‌ها
        function displayMatches() {
            let filtered = allMatches;
            
            if (currentFilter === 'new') {
                filtered = allMatches.filter(m => m.unread);
            } else if (currentFilter === 'online') {
                filtered = allMatches.filter(m => m.userData.online);
            }
            
            if (filtered.length === 0) {
                showEmptyMatches(currentFilter);
                return;
            }
            
            let html = '';
            
            filtered.forEach(match => {
                const lastMessage = match.matchData.lastMessage || 'شروع گفتگو';
                const lastTime = match.matchData.lastMessageTime ? timeAgo(match.matchData.lastMessageTime) : 'جدید';
                const status = match.userData.online ? 
                    '<span class="online-indicator"></span> آنلاین' : 
                    '<span class="offline-indicator"></span> آفلاین';
                
                html += `
                    <div class="match-card ${match.unread ? 'unread' : ''}" onclick="openChat('${match.userId}')">
                        <img src="${match.userData.photo || 'https://randomuser.me/api/portraits/women/1.jpg'}" class="match-avatar">
                        <div class="match-info">
                            <div class="match-name">
                                ${match.userData.name}
                                ${match.unread ? '<span class="new-match-badge">جدید</span>' : ''}
                            </div>
                            <div class="match-last">${lastMessage}</div>
                            <div class="match-time">
                                ${status} • ${lastTime}
                            </div>
                        </div>
                    </div>
                `;
            });
            
            document.getElementById('matchesList').innerHTML = html;
        }
        
        // نمایش حالت خالی
        function showEmptyMatches(filter = 'all') {
            let message = 'هیچ تطابقی وجود ندارد';
            if (filter === 'new') message = 'پیام جدیدی ندارید';
            if (filter === 'online') message = 'کاربر آنلاینی وجود ندارد';
            
            document.getElementById('matchesList').innerHTML = `
                <div class="empty-matches">
                    <div class="empty-emoji">😢</div>
                    <h3 style="margin-bottom: 10px;">${message}</h3>
                    <p style="color: #666; margin-bottom: 20px;">برای پیدا کردن تطابق جدید به صفحه اکتشاف برو</p>
                    <button class="btn btn-primary" onclick="location.href='discover.html'">
                        رفتن به اکتشاف
                    </button>
                </div>
            `;
        }
        
        // چک کردن پیام خوانده نشده
        function checkUnread(lastMessageTime) {
            if (!lastMessageTime) return true;
            
            // اینجا می‌تونی منطق خودت رو بذاری
            return false;
        }
        
        // فیلتر تطابق‌ها
        function filterMatches(filter) {
            currentFilter = filter;
            
            document.querySelectorAll('.tab-mini').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            displayMatches();
        }
        
        // باز کردن چت
        function openChat(userId) {
            location.href = `chat.html?id=${userId}`;
        }
        
        // لود اولیه
        document.addEventListener('DOMContentLoaded', () => {
            if (currentUser) {
                loadMatches();
            } else {
                useSampleMatches();
            }
        });
    </script>
</body>
</html>
