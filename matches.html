<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Matches</title>

<style>

body{
font-family:Arial;
background:#f3f3f3;
text-align:center;
}

.match{
background:white;
width:300px;
margin:auto;
margin-top:20px;
padding:20px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,0.1);
}

img{
width:100px;
height:100px;
border-radius:50%;
}

button{
padding:10px 20px;
background:#ff4d6d;
color:white;
border:none;
border-radius:20px;
cursor:pointer;
margin-top:10px;
}

</style>

</head>

<body>

<h2>Your Matches</h2>

<div id="matches"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.firebasestorage.app",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

function loadMatches(){

const user = firebase.auth().currentUser;

db.collection("matches").get().then(snapshot=>{

snapshot.forEach(doc=>{

const match = doc.data();

if(match.user1==user.uid || match.user2==user.uid){

const otherUser = match.user1==user.uid ? match.user2 : match.user1;

db.collection("users").doc(otherUser).get().then(userDoc=>{

const data=userDoc.data();

const div=document.createElement("div");

div.className="match";

div.innerHTML=`

<img src="${data.photo}">
<h3>${data.name}</h3>
<p>${data.city}, ${data.country}</p>

<button onclick="openChat('${otherUser}')">
Chat
</button>

`;

document.getElementById("matches").appendChild(div);

});

}

});

});

}

function openChat(id){

window.location.href="chat.html?user="+id;

}

firebase.auth().onAuthStateChanged(user=>{

if(user){

loadMatches();

}else{

window.location.href="login.html";

}

});

</script>

</body>
</html>
