<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Database Backup</title><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><style>

body{
font-family:Arial;
background:#f5f5f5;
text-align:center;
padding-top:80px;
}

button{
padding:15px 40px;
font-size:18px;
background:#ff4d6d;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

button:hover{
background:#ff2e55;
}

</style></head><body><h2>Backup Firebase Database</h2><button onclick="backup()">Download Backup</button>

<script>

const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
projectId: "YOUR_PROJECT_ID"
}

firebase.initializeApp(firebaseConfig)

const db = firebase.firestore()

async function backup(){

let collections = ["users","likes","messages"]

let backupData = {}

for(let col of collections){

let snapshot = await db.collection(col).get()

backupData[col] = []

snapshot.forEach(doc=>{
backupData[col].push(doc.data())
})

}

let dataStr = JSON.stringify(backupData)

let blob = new Blob([dataStr], {type:"application/json"})

let a = document.createElement("a")

a.href = URL.createObjectURL(blob)

a.download = "firebase-backup.json"

a.click()

}

</script></body></html>
