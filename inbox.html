<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f5f5f5;
}

header{
background:#ff4d6d;
color:white;
padding:15px;
text-align:center;
}

.list{
padding:10px;
}

.chat{
background:white;
padding:15px;
margin:10px;
border-radius:15px;
display:flex;
align-items:center;
gap:15px;
cursor:pointer;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.chat img{
width:50px;
height:50px;
border-radius:50%;
object-fit:cover;
}

.name{
font-weight:bold;
}

.navbar{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
font-size:22px;
}

.navbar a{
text-decoration:none;
}

</style>

</head>

<body>

<header>

💬 Inbox

</header>

<div id="list" class="list"></div>

<div class="navbar">

<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="inbox.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="visitors.html">👁️</a>
<a href="profile.html">👤</a>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh",
storageBucket:"nimeh-gomsodeh.firebasestorage.app",
messagingSenderId:"815930956932",
appId:"1:815930956932:web:e8696a6a69b4458fd936d1"

};

firebase.initializeApp(firebaseConfig)

const db=firebase.firestore()

let myId=""



firebase.auth().onAuthStateChanged(user=>{

if(!user){

location.href="login.html"
return

}

myId=user.uid

loadChats()

})



function loadChats(){

db.collection("messages")

.orderBy("time","desc")

.get()

.then(snapshot=>{

let chats={}

snapshot.forEach(doc=>{

let m=doc.data()

if(m.from===myId || m.to===myId){

let other=m.from===myId ? m.to : m.from

if(!chats[other]){

chats[other]=true

db.collection("users").doc(other).get()

.then(userDoc=>{

let u=userDoc.data()

let html=`

<div class="chat" onclick="openChat('${other}')">

<img src="${u.photo}">

<div>

<div class="name">${u.name}</div>

<div>Open chat</div>

</div>

</div>

`

document.getElementById("list").innerHTML+=html

})

}

}

})

})

}



function openChat(userId){

location.href="chat.html?id="+userId

}

</script>

</body>
</html>
