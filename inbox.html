<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>همدم | صفحه اصلی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
        }

        .header {
            background: #ff4d6d;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .card img {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
        }

        h2 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
        }

        .btn-like {
            background: #ff4d6d;
            color: white;
        }

        .btn-dislike {
            background: #eee;
            color: #333;
        }

        .navbar {
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #ddd;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        .nav-item {
            text-decoration: none;
            font-size: 24px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        ❤️ همدم
    </div>

    <div class="container">
        <div class="card">
            <img src="https://randomuser.me/api/portraits/women/1.jpg">
            <div class="card-content">
                <h2>سارا محمدی، ۲۴</h2>
                <p>📍 تهران - عاشق موسیقی و سفر</p>
                <div class="buttons">
                    <button class="btn btn-dislike" onclick="next()">✕</button>
                    <button class="btn btn-like" onclick="next()">❤️</button>
                </div>
            </div>
        </div>
    </div>

    <div class="navbar">
        <a href="index.html" class="nav-item">🏠</a>
        <a href="#" class="nav-item">🔥</a>
        <a href="#" class="nav-item">❤️</a>
        <a href="#" class="nav-item">👤</a>
    </div>

    <script>
        function next() {
            location.reload();
        }
    </script>
</body>
</html>
