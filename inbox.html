<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>همدم | صفحه اصلی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .header {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .container {
            max-width: 500px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .profile-card {
            background: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }

        .profile-info {
            padding: 30px;
        }

        .name-age {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .name {
            font-size: 32px;
            font-weight: 700;
            color: #333;
        }

        .age {
            font-size: 24px;
            color: #ff4d6d;
            background: #ffe5e9;
            padding: 5px 20px;
            border-radius: 40px;
        }

        .location {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .bio {
            color: #444;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 25px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 20px;
        }

        .interests {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .interest {
            background: #f0f0f0;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 14px;
            color: #555;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
        }

        .action-btn {
            flex: 1;
            height: 70px;
            border: none;
            border-radius: 40px;
            font-size: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .like-btn {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
        }

        .like-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(255,77,109,0.4);
        }

        .dislike-btn {
            background: white;
            color: #ff4d6d;
            border: 2px solid #ff4d6d;
        }

        .dislike-btn:hover {
            background: #ff4d6d;
            color: white;
        }

        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid rgba(0,0,0,0.1);
            box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
        }

        .nav-item {
            text-decoration: none;
            font-size: 28px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #666;
            transition: all 0.3s ease;
        }

        .nav-item.active {
            background: linear-gradient(135deg, #ff4d6d20, #ff8a5c20);
            color: #ff4d6d;
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>❤️ همدم</h1>
        <p>پیدا کن، عاشق شو، زندگی کن</p>
    </div>

    <div class="container">
        <div class="profile-card">
            <img src="https://randomuser.me/api/portraits/women/1.jpg" class="profile-image">
            
            <div class="profile-info">
                <div class="name-age">
                    <span class="name">سارا محمدی</span>
                    <span class="age">۲۴</span>
                </div>
                
                <div class="location">
                    <span>📍</span>
                    <span>تهران، ۳ کیلومتری شما</span>
                </div>
                
                <div class="bio">
                    ✨ عاشق موسیقی، سفر و ماجراجویی<br>
                    📸 عکاس آماتور<br>
                    ☕ عاشق قهوه و کتاب
                </div>
                
                <div class="interests">
                    <span class="interest">🎵 موسیقی</span>
                    <span class="interest">✈️ سفر</span>
                    <span class="interest">📚 کتاب</span>
                    <span class="interest">🎮 بازی</span>
                    <span class="interest">☕ قهوه</span>
                </div>
                
                <div class="action-buttons">
                    <button class="action-btn dislike-btn" onclick="next()">✕</button>
                    <button class="action-btn like-btn" onclick="next()">❤️</button>
                </div>
            </div>
        </div>
    </div>

    <div class="navbar">
        <a href="index.html" class="nav-item active">🏠</a>
        <a href="discover.html" class="nav-item">🔥</a>
        <a href="profile.html" class="nav-item">👤</a>
    </div>

    <script>
        function next() {
            location.reload();
        }
    </script>
</body>
</html>
