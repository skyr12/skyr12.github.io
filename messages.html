<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پیام‌ها</title>

<style>

body{
margin:0;
font-family:Tahoma;
background:#020617;
color:white;
display:flex;
flex-direction:column;
height:100vh;
}

.header{
background:#111;
padding:15px;
text-align:center;
font-size:20px;
}

.messages{
flex:1;
overflow-y:auto;
padding:20px;
}

.msg{
background:#ff4d6d;
padding:10px 15px;
border-radius:15px;
margin-bottom:10px;
width:max-content;
max-width:70%;
}

.inputBox{
display:flex;
padding:10px;
background:#111;
}

input{
flex:1;
padding:10px;
border:none;
border-radius:20px;
}

button{
background:#ff4d6d;
border:none;
padding:10px 15px;
border-radius:20px;
color:white;
margin-right:10px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="header">

💬 چت

</div>

<div class="messages" id="messages"></div>

<div class="inputBox">

<input id="msgInput" placeholder="پیام بنویس">

<button onclick="sendMsg()">ارسال</button>

</div>

<script>

let chats=JSON.parse(localStorage.getItem("chats"))||[]

function showMessages(){

let html=""

chats.forEach(m=>{

html+=`<div class="msg">${m}</div>`

})

document.getElementById("messages").innerHTML=html

}

function sendMsg(){

let text=document.getElementById("msgInput").value

if(text==="") return

chats.push(text)

localStorage.setItem("chats",JSON.stringify(chats))

document.getElementById("msgInput").value=""

showMessages()

}

showMessages()

</script>

</body>

</html>
