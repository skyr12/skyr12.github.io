<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile Views</title>

<style>

body{
font-family:Arial;
background:#f3f3f3;
text-align:center;
}

.card{
background:white;
width:300px;
margin:auto;
margin-top:20px;
padding:20px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,0.1);
}

img{
width:80px;
height:80px;
border-radius:50%;
}

</style>

</head>

<body>

<h2>Who viewed your profile</h2>

<div id="views"></div>


<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.firebasestorage.app",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.firestore();


firebase.auth().onAuthStateChanged(user=>{

if(user){

loadViews(user.uid);

}

});


function loadViews(uid){

db.collection("profileViews")
.where("to","==",uid)
.get()
.then(snapshot=>{

snapshot.forEach(doc=>{

const data=doc.data();

db.collection("users").doc(data.from).get()

.then(userDoc=>{

const u=userDoc.data();

const div=document.createElement("div");

div.className="card";

div.innerHTML=`

<img src="${u.photo}">

<h3>${u.name}</h3>

<p>${u.city}, ${u.country}</p>

`;

document.getElementById("views").appendChild(div);

});

});

});

}

</script>

</body>

</html>
