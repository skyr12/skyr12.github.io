<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پروفایل کاربر</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#020617;
color:white;
text-align:center;
padding-bottom:100px;
}

.card{
background:#111;
width:320px;
margin:40px auto;
padding:30px;
border-radius:20px;
}

.avatar{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
}

.name{
font-size:24px;
margin-top:10px;
}

.city{
opacity:0.7;
margin-top:5px;
}

.bio{
margin-top:15px;
}

.btn{
background:#ff4d6d;
border:none;
padding:12px 25px;
border-radius:30px;
color:white;
font-size:16px;
margin-top:15px;
cursor:pointer;
}

.bottomMenu{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111;
display:flex;
justify-content:space-around;
padding:15px;
font-size:24px;
}

.bottomMenu a{
color:white;
text-decoration:none;
}

</style>

</head>

<body>

<div class="card">

<img id="photo" class="avatar">

<h2 id="name" class="name"></h2>

<p id="city" class="city"></p>

<p id="bio" class="bio"></p>

<button class="btn" onclick="like()">❤️ لایک</button>

</div>

<div class="bottomMenu">

<a href="users.html">🔎</a>

<a href="swipe.html">❤️</a>

<a href="matches.html">💬</a>

</div>

<script>

let user = JSON.parse(localStorage.getItem("viewUser"))

document.getElementById("name").innerText = user.name
document.getElementById("city").innerText = user.city
document.getElementById("bio").innerText = user.bio
document.getElementById("photo").src = user.photo

function like(){

let matches = JSON.parse(localStorage.getItem("matches")) || []

matches.push(user)

localStorage.setItem("matches",JSON.stringify(matches))

window.location.href="matches.html"

}

</script>

</body>

</html>
