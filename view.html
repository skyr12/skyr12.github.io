<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
margin:0;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
font-size:20px;
font-weight:bold;
}

.card{
background:white;
width:300px;
margin:30px auto;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
overflow:hidden;
}

.card img{
width:100%;
height:300px;
object-fit:cover;
}

.info{
padding:15px;
}

.name{
font-size:22px;
font-weight:bold;
}

.country{
color:gray;
margin-top:5px;
}

.bio{
margin-top:10px;
color:#555;
}

.navbar{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
font-size:22px;
}

.navbar a{
text-decoration:none;
}

</style>

</head>

<body>

<div class="header">👤 Profile</div>

<div id="profile"></div>

<div class="navbar">
<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="chat.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="visitors.html">👁️</a>
<a href="profile.html">👤</a>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
apiKey:"YOUR_KEY",
authDomain:"YOUR_DOMAIN",
projectId:"YOUR_PROJECT",
storageBucket:"YOUR_BUCKET",
messagingSenderId:"YOUR_ID",
appId:"YOUR_APP"
}

firebase.initializeApp(firebaseConfig)

const db = firebase.firestore()

/* گرفتن id پروفایل */

const urlParams = new URLSearchParams(window.location.search)
const profileId = urlParams.get("id")

firebase.auth().onAuthStateChanged(user=>{

if(!user){
location.href="login.html"
return
}

/* ثبت visitor */

if(user.uid !== profileId){

db.collection("visitors").add({

profile: profileId,
visitor: user.uid,
time: Date.now()

})

}

/* گرفتن اطلاعات پروفایل */

db.collection("users").doc(profileId).get().then(doc=>{

let u = doc.data()

document.getElementById("profile").innerHTML = `

<div class="card">

<img src="${u.photo}">

<div class="info">

<div class="name">
${u.name} ${u.vip ? "👑" : ""}, ${u.age}
</div>

<div class="country">${u.country}</div>

<div class="bio">${u.bio || ""}</div>

</div>

</div>

`

})

})

</script>

</body>
</html>
