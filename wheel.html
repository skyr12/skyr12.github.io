<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spin Wheel</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f3f3f3;
text-align:center;
padding-bottom:80px;
}

.header{
background:#ff4d6d;
color:white;
padding:20px;
font-size:22px;
}

.wheel{

width:250px;
height:250px;
border-radius:50%;
margin:40px auto;
border:10px solid #ff4d6d;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
background:white;

}

button{

padding:12px 25px;
border:none;
border-radius:30px;
font-size:18px;
background:#ff4d6d;
color:white;
cursor:pointer;

}

.result{

font-size:20px;
margin-top:20px;

}

.navbar{

position:fixed;
bottom:0;
left:0;
width:100%;
height:70px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -5px 15px rgba(0,0,0,0.2);

}

.navbar a{

text-decoration:none;
font-size:26px;

}

</style>

</head>

<body>

<div class="header">
Spin & Win 🎡
</div>

<div class="wheel" id="wheel">
🎡
</div>

<button onclick="spinWheel()">Spin</button>

<div class="result" id="result"></div>

<div class="navbar">

<a href="discover.html">🔥</a>

<a href="matches.html">❤️</a>

<a href="chat.html">💬</a>

<a href="notifications.html">🔔</a>

<a href="profile.html">👤</a>

</div>

<script>

function spinWheel(){

let prizes=[

"10 Coins 🪙",
"50 Coins 🪙",
"100 Coins 🪙",
"Try Again 😅",
"20 Coins 🪙"

]

let prize=prizes[Math.floor(Math.random()*prizes.length)]

document.getElementById("result").innerText="You won: "+prize

}

</script>

</body>

</html>
