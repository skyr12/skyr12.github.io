<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
text-align:center;
overflow:hidden;
}

.card{
width:320px;
margin:40px auto;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
position:relative;
touch-action:none;
}

.card img{
width:100%;
height:320px;
object-fit:cover;
}

.info{
padding:15px;
}

.name{
font-size:22px;
font-weight:bold;
}

.distance{
color:gray;
}

.navbar{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
font-size:22px;
}

</style>

</head>

<body>

<h2>🔥 Discover</h2>

<div id="card"></div>

<div class="navbar">
<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="chat.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="visitors.html">👁️</a>
<a href="profile.html">👤</a>
</div>


<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh",
storageBucket:"nimeh-gomsodeh.firebasestorage.app",
messagingSenderId:"815930956932",
appId:"1:815930956932:web:e8696a6a69b4458fd936d1"

};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig)
}

const db=firebase.firestore()

let users=[]
let index=0
let startX=0

firebase.auth().onAuthStateChanged(user=>{

if(!user){
location.href="login.html"
return
}

loadUsers()

})

function loadUsers(){

db.collection("users")
.orderBy("boost","desc")
.get()
.then(snapshot=>{

snapshot.forEach(doc=>{

let u=doc.data()
u.id=doc.id

users.push(u)

})

showUser()

})

}

function showUser(){

let u=users[index]

if(!u){

document.getElementById("card").innerHTML="<h3>No more users</h3>"

return
}

let vip=u.vip?"👑 ":""

document.getElementById("card").innerHTML=

`<div class="card" id="swipeCard">

<img src="${u.photo}">

<div class="info">

<div class="name">${vip}${u.name}, ${u.age}</div>

<div>${u.country}</div>

</div>

</div>`

addSwipe()

}

function addSwipe(){

let card=document.getElementById("swipeCard")

card.addEventListener("touchstart",e=>{

startX=e.touches[0].clientX

})

card.addEventListener("touchend",e=>{

let endX=e.changedTouches[0].clientX

let diff=endX-startX

if(diff>100){

like()

}

if(diff<-100){

skip()

}

})

}

function like(){

let currentUser=firebase.auth().currentUser.uid
let likedUser=users[index].id

db.collection("likes").add({

from:currentUser,
to:likedUser,
time:Date.now()

})

db.collection("likes")
.where("from","==",likedUser)
.where("to","==",currentUser)
.get()
.then(snapshot=>{

if(!snapshot.empty){

db.collection("matches").add({

users:[currentUser,likedUser],
time:Date.now()

})

db.collection("notifications").add({

to:likedUser,
text:"❤️ It's a Match!",
time:Date.now()

})

alert("❤️ It's a Match!")

}

})

index++
showUser()

}

function skip(){

index++
showUser()

}

</script>

</body>
</html>
