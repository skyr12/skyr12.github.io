<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discover</title>

<style>

body{
font-family:Arial;
background:#f3f3f3;
text-align:center;
margin:0;
}

.card{

background:white;
width:320px;
margin:auto;
margin-top:60px;
padding:20px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
position:relative;
transition:0.3s;

}

img{
width:100%;
border-radius:20px;
}

</style>

</head>

<body>

<h2>Discover</h2>

<div id="card" class="card">

<img id="photo">

<h3 id="name"></h3>

<p id="city"></p>

<p id="age"></p>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>


<script>

const firebaseConfig = {

apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",

authDomain: "nimeh-gomsodeh.firebaseapp.com",

projectId: "nimeh-gomsodeh",

storageBucket: "nimeh-gomsodeh.firebasestorage.app",

messagingSenderId: "815930956932",

appId: "1:815930956932:web:e8696a6a69b4458fd936d1"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


let users=[];
let index=0;


firebase.auth().onAuthStateChanged(user=>{

if(user){

loadUsers();

}

});


function loadUsers(){

db.collection("users").get().then(snapshot=>{

snapshot.forEach(doc=>{

users.push({
id:doc.id,
...doc.data()
});

});

showUser();

});

}


function showUser(){

const user=users[index];

document.getElementById("name").innerText=user.name;

document.getElementById("city").innerText=user.city+" , "+user.country;

document.getElementById("age").innerText="Age: "+user.age;

document.getElementById("photo").src=user.photo;

}



let startX=0;

const card=document.getElementById("card");


card.addEventListener("touchstart",e=>{

startX=e.touches[0].clientX;

});


card.addEventListener("touchend",e=>{

let endX=e.changedTouches[0].clientX;

let diff=endX-startX;


if(diff>80){

like();

}

if(diff<-80){

skip();

}

});


function like(){

const currentUser=firebase.auth().currentUser;

const target=users[index];

db.collection("likes").add({

from:currentUser.uid,

to:target.id,

time:Date.now()

}).then(()=>{

checkMatch(target.id);

nextUser();

});

}


function checkMatch(userId){

const currentUser=firebase.auth().currentUser;

db.collection("likes")

.where("from","==",userId)

.where("to","==",currentUser.uid)

.get()

.then(snapshot=>{

if(!snapshot.empty){

alert("❤️ It's a Match!");

}

});

}


function skip(){

nextUser();

}


function nextUser(){

index++;

if(index>=users.length){

index=0;

}

showUser();

}

</script>

</body>

</html>
