<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discover</title>

<style>

body{
font-family:Arial;
background:#f3f3f3;
text-align:center;
margin:0;
}

.card{

width:320px;
margin:auto;
margin-top:80px;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
position:relative;

}

.card img{
width:100%;
height:320px;
object-fit:cover;
}

.info{
padding:20px;
}

.buttons{

margin-top:20px;

}

button{
padding:12px 20px;
margin:5px;
border:none;
border-radius:20px;
cursor:pointer;
}

.like{
background:#ff4d6d;
color:white;
}

.skip{
background:gray;
color:white;
}

</style>

</head>

<body>

<h2>Discover</h2>

<div class="card" id="card">

<img id="photo">

<div class="info">

<h3 id="name"></h3>

<p id="city"></p>

<p id="age"></p>

</div>

</div>

<div class="buttons">

<button class="like" onclick="likeUser()">❤️ Like</button>

<button class="skip" onclick="nextUser()">❌ Skip</button>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>

const firebaseConfig = {
apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh"
}

firebase.initializeApp(firebaseConfig)

const db=firebase.firestore()

let users=[]
let index=0
let currentUser=null

firebase.auth().onAuthStateChanged(user=>{

currentUser=user

loadUsers()

})


function loadUsers(){

db.collection("users").get().then(snapshot=>{

snapshot.forEach(doc=>{

let data=doc.data()

if(doc.id===currentUser.uid) return

data.id=doc.id

users.push(data)

})

showUser()

})

}


function showUser(){

if(users.length==0) return

let user=users[index]

document.getElementById("name").innerText=user.name

document.getElementById("city").innerText=user.city+" , "+user.country

document.getElementById("age").innerText="Age: "+user.age

document.getElementById("photo").src=user.photo

}


function nextUser(){

index++

if(index>=users.length){

index=0

}

showUser()

}


function likeUser(){

let target=users[index]

db.collection("likes").add({

from:currentUser.uid,
to:target.id,
time:Date.now()

})

nextUser()

}

</script>

</body>

</html>
