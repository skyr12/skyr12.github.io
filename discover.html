<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>Discover</title><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script><style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
}

.card{
width:320px;
margin:40px auto;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.card img{
width:100%;
height:320px;
object-fit:cover;
}

.info{
padding:20px;
}

button{
border:none;
padding:10px 20px;
font-size:16px;
border-radius:20px;
cursor:pointer;
margin:5px;
}

.like{
background:red;
color:white;
}

.skip{
background:gray;
color:white;
}

#notify{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
background:green;
color:white;
padding:15px 30px;
border-radius:20px;
display:none;
}

</style></head><body><h1>Discover</h1><div id="notify">New Match ❤️</div><div id="users"></div><script>

const firebaseConfig = {
apiKey: "AIzaSyAA0xYFglY_ONI-PstgS4nP3uNIpyA",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.appspot.com",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.firestore();

let users=[];
let current=0;

const usersDiv=document.getElementById("users");

db.collection("users").get().then((snapshot)=>{

snapshot.forEach((doc)=>{

users.push({id:doc.id,...doc.data()});

});

showUser();

});


function showUser(){

if(current>=users.length){

usersDiv.innerHTML="<h2>No more users</h2>";

return;

}

let u=users[current];

usersDiv.innerHTML=`

<div class="card">

<img src="${u.photo}">

<div class="info">

<h2>${u.name}</h2>

<p>${u.city} • ${u.country}</p>

<p>Age: ${u.age}</p>

<button class="like" onclick="likeUser('${u.id}')">❤️ Like</button>

<button class="skip" onclick="skipUser()">❌ Skip</button>

</div>

</div>

`;

}


function likeUser(id){

db.collection("likes").add({

user:id,
time:Date.now()

});

checkMatch(id);

current++;

showUser();

}


function checkMatch(id){

db.collection("likes")
.where("user","==",id)
.get()
.then((snapshot)=>{

if(!snapshot.empty){

document.getElementById("notify").style.display="block";

setTimeout(()=>{

document.getElementById("notify").style.display="none";

},3000);

}

});

}


function skipUser(){

current++;

showUser();

}

</script></body>
</html>
