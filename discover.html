<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discover</title>

<style>

body{
font-family:Arial;
background:#f3f3f3;
text-align:center;
}

.card{
background:white;
width:300px;
margin:auto;
margin-top:40px;
padding:20px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,0.1);
}

img{
width:100%;
border-radius:15px;
}

button{
padding:12px 20px;
border:none;
border-radius:20px;
margin:10px;
font-size:16px;
cursor:pointer;
}

.like{
background:red;
color:white;
}

.skip{
background:gray;
color:white;
}

</style>

</head>

<body>

<h2>Discover</h2>

<div class="card">

<img id="photo" src="https://randomuser.me/api/portraits/men/50.jpg">

<h3 id="name">User</h3>

<p id="city">City</p>

<p id="age">Age</p>

<button class="like" onclick="likeUser()">❤️ Like</button>

<button class="skip" onclick="nextUser()">❌ Skip</button>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.firebasestorage.app",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

let users=[];
let index=0;

function loadUsers(){

db.collection("users").get().then(snapshot=>{

snapshot.forEach(doc=>{

users.push({
id:doc.id,
...doc.data()
});

});

showUser();

});

}

function showUser(){

if(users.length==0)return;

const user=users[index];

document.getElementById("name").innerText=user.name;

document.getElementById("city").innerText=user.city+" , "+user.country;

document.getElementById("age").innerText="Age: "+user.age;

document.getElementById("photo").src=user.photo;

}

function nextUser(){

index++;

if(index>=users.length){

index=0;

}

showUser();

}

function likeUser(){

const currentUser=firebase.auth().currentUser;

const target=users[index];

db.collection("likes").add({

from:currentUser.uid,
to:target.id,
time:Date.now()

}).then(()=>{

checkMatch(target.id);

nextUser();

});

}

function checkMatch(userId){

const currentUser=firebase.auth().currentUser;

db.collection("likes")
.where("from","==",userId)
.where("to","==",currentUser.uid)
.get()
.then(snapshot=>{

if(!snapshot.empty){

db.collection("matches").add({

user1:currentUser.uid,
user2:userId,
time:Date.now()

});

alert("🎉 It's a Match!");

}

});

}

firebase.auth().onAuthStateChanged(user=>{

if(user){

loadUsers();

}else{

window.location.href="login.html";

}

});

</script>

</body>
</html>
