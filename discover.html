<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discover</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<style>

body{
font-family:Arial;
background:#f5f5f5;
text-align:center;
margin:0;
padding:0;
}

.card{

width:320px;
margin:auto;
background:white;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
overflow:hidden;
margin-top:40px;

}

.card img{

width:100%;
height:300px;
object-fit:cover;

}

.info{
padding:15px;
}

button{

padding:10px 20px;
border:none;
border-radius:20px;
margin:5px;
font-size:16px;

}

.like{
background:red;
color:white;
}

.skip{
background:gray;
color:white;
}

</style>

</head>

<body>

<h2>Discover</h2>

<div class="card">

<img id="photo">

<div class="info">

<h3 id="name"></h3>

<p id="location"></p>

<p id="age"></p>

<button class="like" onclick="like()">❤️ Like</button>
<button class="skip" onclick="next()">❌ Skip</button>

</div>

</div>

<script>

const firebaseConfig = {
apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.firebasestorage.app",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.firestore();

let users=[];
let index=0;
let currentUser=null;

firebase.auth().onAuthStateChanged((user)=>{

if(user){

currentUser=user;

loadUsers();

}

})

function loadUsers(){

db.collection("users").get().then((snapshot)=>{

snapshot.forEach((doc)=>{

let data=doc.data();

data.id=doc.id;

users.push(data);

})

showUser();

})

}

function showUser(){

if(users.length==0)return;

let user=users[index];

document.getElementById("photo").src=user.photo;
document.getElementById("name").innerText=user.name;
document.getElementById("location").innerText=user.city+" , "+user.country;
document.getElementById("age").innerText="Age: "+user.age;

}

function next(){

index++;

if(index>=users.length){

alert("No more users");

return;

}

showUser();

}

function like(){

let likedUser=users[index];

db.collection("likes").add({

from:currentUser.uid,
to:likedUser.id

}).then(()=>{

checkMatch(currentUser.uid,likedUser.id);

})

next();

}

function checkMatch(user1,user2){

db.collection("likes")
.where("from","==",user2)
.where("to","==",user1)
.get()
.then((snapshot)=>{

if(!snapshot.empty){

alert("❤️ It's a Match!");

}

})

}

</script>

</body>
</html>
