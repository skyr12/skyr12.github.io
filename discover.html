<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Discover</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{

width:320px;
height:420px;
background:white;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
overflow:hidden;
position:absolute;
}

.card img{
width:100%;
height:70%;
object-fit:cover;
}

.info{
padding:15px;
text-align:center;
}

h2{
margin:5px 0;
}

.buttons{
margin-top:10px;
}

button{
padding:10px 20px;
border:none;
border-radius:20px;
margin:5px;
font-size:16px;
cursor:pointer;
}

.like{
background:#ff4d6d;
color:white;
}

.skip{
background:#ccc;
}

</style>

</head>

<body>

<div class="card" id="card">

<img src="https://randomuser.me/api/portraits/men/32.jpg">

<div class="info">

<h2>Farhad</h2>

<p>Age 25 • UK</p>

<div class="buttons">

<button class="like" onclick="like()">❤️ Like</button>

<button class="skip" onclick="skip()">❌ Skip</button>

</div>

</div>

</div>

<script>

let card = document.getElementById("card");

function like(){

card.style.transform="translateX(500px) rotate(20deg)";

setTimeout(loadNext,300);

}

function skip(){

card.style.transform="translateX(-500px) rotate(-20deg)";

setTimeout(loadNext,300);

}

function loadNext(){

card.style.transform="none";

card.querySelector("img").src="https://randomuser.me/api/portraits/women/"+Math.floor(Math.random()*50)+".jpg";

}

</script>

</body>

</html>
