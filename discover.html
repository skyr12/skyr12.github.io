<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اکتشاف | همدم</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <!-- هدر -->
    <div class="header">
        <div class="logo">
            <span>🔥</span>
            اکتشاف
        </div>
        <div class="wallet" onclick="location.href='wallet.html'">
            <span>🪙</span>
            <span class="user-coins">۰</span>
        </div>
    </div>

    <!-- تب‌ها -->
    <div class="tabs">
        <div class="tab" onclick="location.href='index.html'">خانه</div>
        <div class="tab active" onclick="location.href='discover.html'">اکتشاف</div>
        <div class="tab" onclick="location.href='live.html'">لایو</div>
        <div class="tab" onclick="location.href='gifts.html'">هدایا</div>
        <div class="tab" onclick="location.href='profile.html'">پروفایل</div>
    </div>

    <!-- فیلترها -->
    <div style="display: flex; gap: 10px; padding: 15px; overflow-x: auto;">
        <select class="form-control" style="width: auto; min-width: 100px;" id="cityFilter">
            <option value="">همه شهرها</option>
            <option value="tehran">تهران</option>
            <option value="isfahan">اصفهان</option>
            <option value="shiraz">شیراز</option>
            <option value="mashhad">مشهد</option>
            <option value="tabriz">تبریز</option>
        </select>
        
        <select class="form-control" style="width: auto; min-width: 100px;" id="ageFilter">
            <option value="">همه سنین</option>
            <option value="18-25">۱۸-۲۵</option>
            <option value="26-35">۲۶-۳۵</option>
            <option value="36-45">۳۶-۴۵</option>
        </select>
        
        <button class="btn btn-primary" onclick="applyFilters()" style="padding: 10px 20px;">اعمال فیلتر</button>
    </div>

    <!-- کانتینر اصلی برای کاربران -->
    <div id="discoverContainer">
        <!-- کاربران با JS لود میشن -->
    </div>

    <!-- نوار پایین -->
    <div class="navbar">
        <a href="index.html" class="nav-item">🏠</a>
        <a href="discover.html" class="nav-item active">🔥</a>
        <a href="live.html" class="nav-item">🎥</a>
        <a href="gifts.html" class="nav-item">🎁</a>
        <a href="profile.html" class="nav-item">👤</a>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage.js"></script>
    <script src="assets/script.js"></script>

    <script>
        let currentUsers = [];
        let currentIndex = 0;

        // لود کاربران
        function loadUsers() {
            document.getElementById('discoverContainer').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>در حال پیدا کردن کاربران...</p>
                </div>
            `;

            // گرفتن کاربران از Firebase
            db.collection("users")
                .limit(20)
                .get()
                .then(snapshot => {
                    if (snapshot.empty) {
                        useSampleUsers();
                        return;
                    }

                    currentUsers = [];
                    snapshot.forEach(doc => {
                        if (doc.id !== currentUser?.uid) {
                            currentUsers.push({
                                id: doc.id,
                                ...doc.data()
                            });
                        }
                    });

                    if (currentUsers.length === 0) {
                        useSampleUsers();
                    } else {
                        currentIndex = 0;
                        showCurrentUser();
                    }
                })
                .catch(error => {
                    console.error("Error loading users:", error);
                    useSampleUsers();
                });
        }

        // استفاده از کاربران نمونه
        function useSampleUsers() {
            currentUsers = [
                {
                    id: "sample1",
                    name: "سارا محمدی",
                    age: 24,
                    city: "تهران",
                    bio: "عاشق موسیقی و سفر ❤️",
                    photo: "https://randomuser.me/api/portraits/women/1.jpg",
                    distance: 3
                },
                {
                    id: "sample2",
                    name: "علی رضایی",
                    age: 28,
                    city: "اصفهان",
                    bio: "برنامه‌نویس، عاشق تکنولوژی 🎮",
                    photo: "https://randomuser.me/api/portraits/men/1.jpg",
                    distance: 5
                },
                {
                    id: "sample3",
                    name: "مریم کریمی",
                    age: 23,
                    city: "شیراز",
                    bio: "موسیقی‌دان و عاشق هنر 🎵",
                    photo: "https://randomuser.me/api/portraits/women/2.jpg",
                    distance: 2
                }
            ];
            currentIndex = 0;
            showCurrentUser();
        }

        // نمایش کاربر فعلی
        function showCurrentUser() {
            if (currentIndex >= currentUsers.length) {
                document.getElementById('discoverContainer').innerHTML = `
                    <div style="text-align: center; padding: 50px; background: white; border-radius: 25px; margin: 15px;">
                        <div style="font-size: 80px; margin-bottom: 20px;">🔍</div>
                        <h3 style="margin-bottom: 10px;">کاربری پیدا نشد!</h3>
                        <p style="color: #666; margin-bottom: 20px;">بعداً دوباره امتحان کن</p>
                        <button class="btn btn-primary" onclick="loadUsers()">تلاش مجدد</button>
                    </div>
                `;
                return;
            }

            const user = currentUsers[currentIndex];
            const remaining = currentUsers.length - currentIndex - 1;

            const html = `
                <div style="color: white; text-align: center; margin: 10px;">
                    ${remaining} کاربر باقی‌مانده
                </div>

                <div class="profile-card">
                    <img src="${user.photo}" class="profile-image" alt="${user.name}">
                    
                    <div class="profile-info">
                        <div class="name-age">
                            <span class="name">${user.name}</span>
                            <span class="age">${user.age || '۲۴'}</span>
                        </div>
                        
                        <div class="location">
                            <span>📍</span>
                            <span>${user.city || 'تهران'}، ${user.distance || '۳'} کیلومتری</span>
                        </div>
                        
                        <div class="bio">
                            ${user.bio || 'عاشق موسیقی، سفر و تکنولوژی ❤️'}
                        </div>
                        
                        <div class="interests">
                            <span class="interest-tag">🎵 موسیقی</span>
                            <span class="interest-tag">✈️ سفر</span>
                            <span class="interest-tag">📚 کتاب</span>
                            <span class="interest-tag">🎮 بازی</span>
                        </div>
                        
                        <div class="action-buttons">
                            <button class="action-btn dislike-btn" onclick="nextUser('dislike', '${user.id}')">✕</button>
                            <button class="action-btn like-btn" onclick="nextUser('like', '${user.id}')">❤️</button>
                            <button class="action-btn dislike-btn" onclick="nextUser('superlike', '${user.id}')">⭐</button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('discoverContainer').innerHTML = html;
        }

        // رفتن به کاربر بعدی
        function nextUser(action, userId) {
            handleAction(action, userId);
            currentIndex++;
            setTimeout(showCurrentUser, 500);
        }

        // اعمال فیلتر
        function applyFilters() {
            const city = document.getElementById('cityFilter').value;
            const age = document.getElementById('ageFilter').value;
            
            // فیلتر کردن کاربران
            let filtered = [...currentUsers];
            
            if (city) {
                filtered = filtered.filter(u => u.city === city);
            }
            
            if (age) {
                const [min, max] = age.split('-').map(Number);
                filtered = filtered.filter(u => u.age >= min && u.age <= max);
            }
            
            if (filtered.length > 0) {
                currentUsers = filtered;
                currentIndex = 0;
                showCurrentUser();
            } else {
                showToast('کاربری با این فیلترها پیدا نشد', 'error');
            }
        }

        // لود اولیه
        document.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</body>
</html>
