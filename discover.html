<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
text-align:center;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
font-size:20px;
}

.card{
width:320px;
margin:40px auto;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.card img{
width:100%;
height:320px;
object-fit:cover;
}

.info{
padding:20px;
}

.buttons{
display:flex;
justify-content:space-around;
padding:20px;
}

button{
border:none;
padding:12px 20px;
border-radius:30px;
font-size:16px;
cursor:pointer;
}

.like{
background:#ff4d6d;
color:white;
}

.skip{
background:#ddd;
}

.navbar{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
font-size:22px;
}

.navbar a{
text-decoration:none;
}

</style>

</head>

<body>

<div class="header">🔥 Discover</div>

<div id="card"></div>

<div class="buttons">

<button class="skip" onclick="skip()">Skip</button>
<button class="like" onclick="like()">❤️ Like</button>

</div>

<div class="navbar">
<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="chat.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="visitors.html">👁️</a>
<a href="profile.html">👤</a>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {

apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.firebasestorage.app",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1"

};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig);
}

const db=firebase.firestore()

let users=[]
let index=0


firebase.auth().onAuthStateChanged(user=>{

if(!user){

location.href="login.html"

return

}

db.collection("users")

.orderBy("boost","desc")

.get()

.then(snapshot=>{

snapshot.forEach(doc=>{

let data=doc.data()

data.id=doc.id

users.push(data)

})

showUser()

})

})


function showUser(){

if(index>=users.length){

document.getElementById("card").innerHTML="No more users"

return

}

let u=users[index]

document.getElementById("card").innerHTML=`

<div class="card" onclick="openProfile()">

<img src="${u.photo}">

<div class="info">

<h2>${u.name} ${u.vip ? "👑" : ""}</h2>

<p>${u.country}</p>

<p>Age: ${u.age}</p>

</div>

</div>

`

}


function skip(){

index++

showUser()

}


function like(){

let currentUser=firebase.auth().currentUser.uid

let likedUser=users[index].id


db.collection("likes").add({

from:currentUser,
to:likedUser,
time:Date.now()

})


db.collection("likes")

.where("from","==",likedUser)
.where("to","==",currentUser)

.get()

.then(snapshot=>{

if(!snapshot.empty){

db.collection("matches").add({

users:[currentUser,likedUser],
time:Date.now()

})

db.collection("notifications").add({

to:likedUser,
text:"❤️ It's a Match!",
time:Date.now()

})

alert("❤️ It's a Match!")

}

})


index++

showUser()

}


function openProfile(){

let user=users[index]

localStorage.setItem("viewUser",JSON.stringify(user))

window.location.href="view.html"

}

</script>

</body>
</html>
