<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>اکتشاف | نیمه گمشده</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0d0d0d;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* پس زمینه متحرک */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(125deg, #0d0d0d 0%, #1a1a2e 50%, #16213e 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ذرات معلق */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: floatParticle 20s infinite linear;
        }

        @keyframes floatParticle {
            from {
                transform: translateY(100vh) translateX(-50vw) rotate(0deg);
            }
            to {
                transform: translateY(-100vh) translateX(50vw) rotate(360deg);
            }
        }

        /* محتوای اصلی */
        .discover-container {
            position: relative;
            z-index: 10;
            height: 100vh;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            padding: 20px 15px 80px;
            display: flex;
            flex-direction: column;
        }

        /* هدر */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            color: white;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .header-icons {
            display: flex;
            gap: 20px;
        }

        .header-icons span {
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.3s;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
        }

        .header-icons span:hover {
            transform: scale(1.1);
        }

        /* فیلترهای سریع */
        .quick-filters {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 5px 0 15px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .quick-filters::-webkit-scrollbar {
            display: none;
        }

        .filter-chip {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 22px;
            border-radius: 40px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .filter-chip.active {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            border-color: transparent;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3);
        }

        .filter-chip:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.2);
        }

        /* کارت اصلی (Tinder-like) */
        .cards-container {
            flex: 1;
            position: relative;
            margin: 10px 0 20px;
        }

        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: transparent;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5);
            cursor: grab;
            transition: transform 0.3s, opacity 0.3s;
            user-select: none;
            touch-action: none;
        }

        .card.swiping {
            transition: none;
            cursor: grabbing;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .card:hover .card-image {
            transform: scale(1.05);
        }

        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 40%, transparent 100%);
            pointer-events: none;
        }

        /* اطلاعات کاربر روی کارت */
        .card-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px 25px;
            color: white;
            z-index: 5;
            transform: translateY(0);
            transition: transform 0.3s;
        }

        .card-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 10px;
        }

        .card-name {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .card-age {
            font-size: 24px;
            font-weight: 400;
            color: #ff4d6d;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .card-location {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            margin-bottom: 10px;
            opacity: 0.9;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .card-bio {
            font-size: 14px;
            line-height: 1.6;
            opacity: 0.8;
            margin-bottom: 15px;
            max-width: 80%;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .card-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .card-tag {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 15px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
        }

        .vip-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ffd700, #ffa500);
            padding: 8px 18px;
            border-radius: 30px;
            color: white;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 10px 20px rgba(255, 215, 0, 0.3);
            z-index: 6;
        }

        .online-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(76, 175, 80, 0.9);
            backdrop-filter: blur(10px);
            padding: 6px 15px;
            border-radius: 30px;
            color: white;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 6;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* نشانگرهای لایک/دیسلایک */
        .swipe-indicator {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 80px;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 20;
            pointer-events: none;
        }

        .swipe-indicator.left {
            left: 20px;
            color: #ff4d6d;
            text-shadow: 0 0 30px rgba(255, 77, 109, 0.5);
        }

        .swipe-indicator.right {
            right: 20px;
            color: #4caf50;
            text-shadow: 0 0 30px rgba(76, 175, 80, 0.5);
        }

        .swipe-indicator.show {
            opacity: 1;
            animation: pop 0.3s;
        }

        @keyframes pop {
            0% { transform: translateY(-50%) scale(0.5); }
            80% { transform: translateY(-50%) scale(1.2); }
            100% { transform: translateY(-50%) scale(1); }
        }

        /* دکمه‌های اقدام */
        .action-buttons {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 30;
            pointer-events: none;
        }

        .action-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: none;
            font-size: 30px;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            transform: scale(1.1) rotate(10deg);
        }

        .action-btn.dislike {
            background: white;
            color: #ff4d6d;
            border: 2px solid #ff4d6d;
        }

        .action-btn.like {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
        }

        .action-btn.superlike {
            background: linear-gradient(135deg, #4a90e2, #357abd);
            color: white;
        }

        /* کانتر کاربران */
        .counter {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 5px 12px;
            border-radius: 30px;
            color: white;
            font-size: 12px;
            z-index: 15;
        }

        /* نوتیفیکیشن */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 12px 25px;
            color: white;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            border-left: 4px solid #4caf50;
        }

        .toast.error {
            border-left: 4px solid #f44336;
        }

        .toast.info {
            border-left: 4px solid #2196f3;
        }

        /* منوی پایین */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 50;
        }

        .nav-item {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 24px;
            transition: all 0.3s;
        }

        .nav-item.active {
            color: #ff4d6d;
            transform: translateY(-5px);
        }

        .nav-item:hover {
            color: #ff4d6d;
        }

        /* مودال اطلاعات بیشتر */
        .info-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            z-index: 2000;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .info-modal.show {
            display: flex;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px 40px 0 0;
            padding: 30px 20px;
            width: 100%;
            max-width: 400px;
            color: white;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 22px;
        }

        .close-modal {
            font-size: 28px;
            cursor: pointer;
            opacity: 0.7;
        }

        .modal-section {
            margin-bottom: 20px;
        }

        .modal-section h4 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #ff4d6d;
        }

        .modal-section p {
            line-height: 1.6;
            opacity: 0.8;
        }

        .modal-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .modal-gallery img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <div class="animated-bg"></div>
    <div class="particles" id="particles"></div>

    <div class="discover-container">
        <div class="header">
            <div class="logo">نیمه گمشده</div>
            <div class="header-icons">
                <span>🔔</span>
                <span>⚙️</span>
            </div>
        </div>

        <div class="quick-filters">
            <span class="filter-chip active">همه</span>
            <span class="filter-chip">نزدیک من</span>
            <span class="filter-chip">آنلاین</span>
            <span class="filter-chip">VIP</span>
            <span class="filter-chip">تازه‌واردها</span>
            <span class="filter-chip">محبوب</span>
        </div>

        <div class="cards-container" id="cardsContainer">
            <!-- کارت‌ها با JS ساخته می‌شوند -->
        </div>

        <div class="action-buttons" id="actionButtons">
            <button class="action-btn dislike" onclick="handleAction('dislike')">✕</button>
            <button class="action-btn like" onclick="handleAction('like')">❤️</button>
            <button class="action-btn superlike" onclick="handleAction('superlike')">⭐</button>
        </div>

        <div class="bottom-nav">
            <a href="index.html" class="nav-item">🏠</a>
            <a href="discover.html" class="nav-item active">🔍</a>
            <a href="matches.html" class="nav-item">❤️</a>
            <a href="profile.html" class="nav-item">👤</a>
        </div>
    </div>

    <!-- نوتیفیکیشن -->
    <div class="toast" id="toast">
        <span id="toastIcon">✅</span>
        <span id="toastMessage">عملیات موفق</span>
    </div>

    <!-- مودال اطلاعات -->
    <div class="info-modal" id="infoModal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>اطلاعات بیشتر</h3>
                <span class="close-modal" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-gallery">
                <img src="https://randomuser.me/api/portraits/women/1.jpg">
                <img src="https://randomuser.me/api/portraits/women/2.jpg">
                <img src="https://randomuser.me/api/portraits/women/3.jpg">
            </div>
            <div class="modal-section">
                <h4>درباره من</h4>
                <p id="modalBio">✨ عاشق موسیقی، سفر و ماجراجویی</p>
            </div>
            <div class="modal-section">
                <h4>علاقه‌مندی‌ها</h4>
                <div class="card-tags" id="modalInterests"></div>
            </div>
        </div>
    </div>

    <script>
        // داده‌های نمونه
        const profiles = [
            {
                name: 'سارا محمدی',
                age: 24,
                city: 'تهران',
                distance: 3,
                bio: '✨ عاشق موسیقی، سفر و ماجراجویی\n📸 عکاس حرفه‌ای\n☕ قهوه و کتاب',
                image: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&auto=format&fit=crop',
                vip: true,
                online: true,
                interests: ['🎵 موسیقی', '✈️ سفر', '📚 کتاب', '☕ قهوه']
            },
            {
                name: 'علی رضایی',
                age: 28,
                city: 'اصفهان',
                distance: 5,
                bio: '🎮 گیمر حرفه‌ای\n🏋️ بدنساز\n💻 برنامه‌نویس',
                image: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&auto=format&fit=crop',
                vip: false,
                online: true,
                interests: ['🎮 بازی', '⚽ ورزش', '💻 برنامه‌نویسی']
            },
            {
                name: 'مریم کریمی',
                age: 26,
                city: 'شیراز',
                distance: 2,
                bio: '📸 عکاس\n✈️ عاشق سفر\n☕ قهوه',
                image: 'https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=400&auto=format&fit=crop',
                vip: true,
                online: false,
                interests: ['📸 عکاسی', '✈️ سفر', '☕ قهوه']
            }
        ];

        let currentIndex = 0;
        let startX = 0;
        let currentX = 0;
        let isDragging = false;
        let currentCard = null;

        function createParticles() {
            const particles = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = Math.random() * 30 + 20 + 's';
                particles.appendChild(particle);
            }
        }

        function loadProfiles() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            
            profiles.forEach((profile, index) => {
                const card = createCard(profile, index);
                container.appendChild(card);
            });
        }

        function createCard(profile, index) {
            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('data-index', index);
            card.style.zIndex = profiles.length - index;
            card.style.opacity = index === 0 ? '1' : '0';
            card.style.pointerEvents = index === 0 ? 'auto' : 'none';

            card.innerHTML = `
                <img src="${profile.image}" class="card-image">
                <div class="card-overlay"></div>
                ${profile.vip ? '<div class="vip-badge"><span>👑</span>VIP</div>' : ''}
                ${profile.online ? '<div class="online-badge"><span class="online-dot"></span>آنلاین</div>' : ''}
                <div class="counter">${profiles.length - index} کاربر باقی‌مانده</div>
                <div class="card-info">
                    <div class="card-header">
                        <span class="card-name">${profile.name}</span>
                        <span class="card-age">${profile.age}</span>
                    </div>
                    <div class="card-location">
                        <span>📍</span>
                        <span>${profile.city} • ${profile.distance} کیلومتری</span>
                    </div>
                    <div class="card-bio">${profile.bio.split('\n')[0]}</div>
                    <div class="card-tags">
                        ${profile.interests.slice(0, 3).map(i => `<span class="card-tag">${i}</span>`).join('')}
                    </div>
                </div>
            `;

            // رویدادهای موس
            card.addEventListener('mousedown', startDrag);
            card.addEventListener('mousemove', drag);
            card.addEventListener('mouseup', endDrag);
            card.addEventListener('mouseleave', endDrag);

            // رویدادهای لمسی
            card.addEventListener('touchstart', startDrag);
            card.addEventListener('touchmove', drag);
            card.addEventListener('touchend', endDrag);

            return card;
        }

        function startDrag(e) {
            e.preventDefault();
            const card = e.target.closest('.card');
            if (!card || card.dataset.index != 0) return;

            isDragging = true;
            currentCard = card;
            card.classList.add('swiping');

            const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            startX = clientX;
            currentX = clientX;

            // حذف اندیکاتورهای قبلی
            document.querySelectorAll('.swipe-indicator').forEach(el => el.remove());
        }

        function drag(e) {
            if (!isDragging || !currentCard) return;

            e.preventDefault();
            const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            currentX = clientX;

            const diff = currentX - startX;
            const rotate = diff * 0.1;
            const opacity = Math.min(Math.abs(diff) / 300, 0.8);

            currentCard.style.transform = `translateX(${diff}px) rotate(${rotate}deg)`;

            // نمایش اندیکاتور
            let indicator = document.querySelector('.swipe-indicator');
            if (!indicator) {
                indicator = document.createElement('div');
                indicator.className = 'swipe-indicator';
                currentCard.appendChild(indicator);
            }

            if (diff > 50) {
                indicator.className = 'swipe-indicator right show';
                indicator.textContent = '❤️';
            } else if (diff < -50) {
                indicator.className = 'swipe-indicator left show';
                indicator.textContent = '✕';
            } else {
                indicator.classList.remove('show');
            }
        }

        function endDrag(e) {
            if (!isDragging || !currentCard) return;

            e.preventDefault();
            currentCard.classList.remove('swiping');

            const diff = currentX - startX;

            if (Math.abs(diff) > 100) {
                // سوایپ کامل
                const direction = diff > 0 ? 'right' : 'left';
                const action = direction === 'right' ? 'like' : 'dislike';
                handleAction(action, true);
            } else {
                // برگرداندن کارت به جای اول
                currentCard.style.transform = '';
                document.querySelectorAll('.swipe-indicator').forEach(el => el.remove());
            }

            isDragging = false;
            currentCard = null;
        }

        function handleAction(action, fromSwipe = false) {
            if (!fromSwipe) {
                // اگر از دکمه استفاده شده
                const currentCard = document.querySelector('.card[data-index="0"]');
                if (currentCard) {
                    currentCard.style.transform = action === 'like' 
                        ? 'translateX(200px) rotate(20deg)' 
                        : 'translateX(-200px) rotate(-20deg)';
                }
            }

            // نمایش نوتیفیکیشن
            if (action === 'like') {
                showToast('❤️ لایک شد!', 'success');
            } else if (action === 'superlike') {
                showToast('⭐ سوپرلایک شد!', 'info');
            } else {
                showToast('✕ رد شد', 'error');
            }

            // پروفایل بعدی
            setTimeout(() => {
                const container = document.getElementById('cardsContainer');
                container.removeChild(container.children[0]);
                
                if (container.children.length > 0) {
                    container.children[0].style.opacity = '1';
                    container.children[0].style.pointerEvents = 'auto';
                    container.children[0].style.transform = '';
                } else {
                    // پایان پروفایل‌ها
                    showEndMessage();
                }
            }, 300);
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const msg = document.getElementById('toastMessage');

            toast.className = 'toast ' + type;
            icon.innerHTML = type === 'success' ? '✅' : type === 'info' ? 'ℹ️' : '❌';
            msg.innerHTML = message;

            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function showEndMessage() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = `
                <div style="display: flex; align-items: center; justify-content: center; height: 100%; color: white; text-align: center;">
                    <div>
                        <div style="font-size: 80px; margin-bottom: 20px;">✨</div>
                        <h3 style="font-size: 24px; margin-bottom: 10px;">به پایان رسید!</h3>
                        <p style="opacity: 0.7;">بعداً دوباره امتحان کنید</p>
                        <button onclick="location.reload()" style="background: linear-gradient(135deg, #ff4d6d, #ff8a5c); border: none; color: white; padding: 15px 30px; border-radius: 40px; margin-top: 20px; cursor: pointer;">شروع مجدد</button>
                    </div>
                </div>
            `;
        }

        function showInfo() {
            const profile = profiles[currentIndex];
            document.getElementById('modalBio').textContent = profile.bio;
            
            const interestsContainer = document.getElementById('modalInterests');
            interestsContainer.innerHTML = profile.interests.map(i => `<span class="card-tag">${i}</span>`).join('');
            
            document.getElementById('infoModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('infoModal').classList.remove('show');
        }

        // کیبورد برای دیباگ
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                handleAction('like');
            } else if (e.key === 'ArrowLeft') {
                handleAction('dislike');
            } else if (e.key === 'ArrowUp') {
                handleAction('superlike');
            }
        });

        // راه‌اندازی
        createParticles();
        loadProfiles();
    </script>
</body>
</html>
