<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نیمه گمشده | صفحه اصلی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding-bottom: 70px;
        }

        /* هدر اصلی */
        .header {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.3);
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        /* کارت سکه */
        .coins-card {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .coins-card:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.3);
        }

        /* بخش‌های مختلف */
        .section {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            color: white;
            font-size: 24px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* اسکرول افقی */
        .horizontal-scroll {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 10px 0 20px;
            scrollbar-width: none;
        }

        .horizontal-scroll::-webkit-scrollbar {
            display: none;
        }

        /* کارت بازی برای اسکرول افقی */
        .game-card-horizontal {
            min-width: 150px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .game-card-horizontal:hover {
            transform: translateY(-5px) scale(1.05);
        }

        .game-card-horizontal img {
            width: 100%;
            height: 100px;
            object-fit: cover;
        }

        .game-card-horizontal .title {
            padding: 10px;
            text-align: center;
            font-weight: 600;
            color: #333;
        }

        /* گرید بازی‌ها */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* کارت بازی اصلی */
        .game-card {
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(255, 77, 109, 0.3);
        }

        .game-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .game-content {
            padding: 15px;
        }

        .game-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .game-name {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }

        .game-badge {
            background: linear-gradient(135deg, #ff4d6d20, #ff8a5c20);
            color: #ff4d6d;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .game-stats {
            display: flex;
            gap: 15px;
            color: #666;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .game-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .game-price {
            color: #ff4d6d;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .game-players {
            color: #4caf50;
            font-size: 13px;
        }

        /* دسته‌بندی */
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin: 20px 0;
            padding: 0 20px;
        }

        .category-btn {
            background: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .category-btn.active {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
        }

        /* بنر ویژه */
        .featured-banner {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 20px;
            padding: 30px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 30px 0;
        }

        /* نوار پایین */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .nav-item {
            text-decoration: none;
            font-size: 24px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #666;
        }

        .nav-item.active {
            background: linear-gradient(135deg, #ff4d6d20, #ff8a5c20);
            color: #ff4d6d;
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <div class="coins-card" onclick="showCoinShop()">
        <span>🪙</span>
        <span id="userCoins">1,250</span>
    </div>

    <div class="header">
        <h1>✨ نیمه گمشده</h1>
        <p>دوستان جدید پیدا کن، بازی کن و برنده شو!</p>
    </div>

    <!-- دسته‌بندی سریع -->
    <div class="categories">
        <button class="category-btn active" onclick="filterGames('all')">همه</button>
        <button class="category-btn" onclick="filterGames('casino')">🎰 کازینو</button>
        <button class="category-btn" onclick="filterGames('puzzle')">🧩 پازل</button>
        <button class="category-btn" onclick="filterGames('action')">⚡ اکشن</button>
        <button class="category-btn" onclick="filterGames('sport')">⚽ ورزشی</button>
    </div>

    <!-- بازی‌های محبوب (اسکرول افقی) -->
    <div class="section">
        <div class="section-title">
            <span>🔥</span>
            بازی‌های محبوب
        </div>
        <div class="horizontal-scroll" id="popularGames">
            <!-- با JS لود میشه -->
        </div>
    </div>

    <!-- بنر ویژه بازی -->
    <div class="section">
        <div class="featured-banner">
            <div>
                <h2 style="font-size: 24px; margin-bottom: 10px;">🎰 جکپات ۱۰۰ میلیونی</h2>
                <p style="margin-bottom: 20px;">امشب، یک نفر برنده می‌شود!</p>
                <button style="background: white; color: #667eea; border: none; padding: 12px 30px; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer;" onclick="openGame('jackpot.html')">شرکت در مسابقه</button>
            </div>
            <div style="font-size: 60px;">🏆</div>
        </div>
    </div>

    <!-- همه بازی‌ها -->
    <div class="section">
        <div class="section-title">
            <span>🎮</span>
            همه بازی‌ها
        </div>
        <div class="games-grid" id="allGames">
            <!-- با JS لود میشه -->
        </div>
    </div>

    <!-- نوار پایین -->
    <div class="navbar">
        <a href="index.html" class="nav-item active">🏠</a>
        <a href="discover.html" class="nav-item">🔥</a>
        <a href="matches.html" class="nav-item">❤️</a>
        <a href="inbox.html" class="nav-item">💬</a>
        <a href="profile.html" class="nav-item">👤</a>
    </div>

    <script>
        // داده‌های بازی‌ها
        const games = [
            { id: 1, name: "Roulette", category: "casino", image: "https://images.unsplash.com/photo-1596838132731-3301c3fd4317?w=400", players: 1243, prize: "۵۰M", price: 100, popular: true },
            { id: 2, name: "Lucky Wheel", category: "casino", image: "https://images.unsplash.com/photo-1608889175123-7c52c2b3b8d5?w=400", players: 892, prize: "۱۰M", price: 50, popular: true },
            { id: 3, name: "Slots", category: "casino", image: "https://images.unsplash.com/photo-1596484552834-6a58f850e0a1?w=400", players: 2156, prize: "۱۰۰M", price: 200, popular: true },
            { id: 4, name: "Fruit Game", category: "casino", image: "https://images.unsplash.com/photo-1586201375761-83865001e31c?w=400", players: 567, prize: "۵M", price: 25, popular: false },
            { id: 5, name: "Quiz", category: "puzzle", image: "https://images.unsplash.com/photo-1584697964358-4f47c6df0b6c?w=400", players: 432, prize: "۲M", price: 30, popular: false },
            { id: 6, name: "Fishing", category: "action", image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400", players: 789, prize: "۳M", price: 40, popular: true }
        ];

        let userCoins = 1250;

        // لود بازی‌ها
        function loadGames() {
            // بازی‌های محبوب (افقی)
            const popularGames = games.filter(g => g.popular);
            document.getElementById('popularGames').innerHTML = popularGames.map(game => `
                <div class="game-card-horizontal" onclick="openGame('${game.name.toLowerCase()}.html')">
                    <img src="${game.image}" alt="${game.name}">
                    <div class="title">${game.name}</div>
                </div>
            `).join('');

            // همه بازی‌ها (گرید)
            document.getElementById('allGames').innerHTML = games.map(game => `
                <div class="game-card" onclick="openGame('${game.name.toLowerCase()}.html')">
                    <img src="${game.image}" alt="${game.name}">
                    <div class="game-content">
                        <div class="game-header">
                            <span class="game-name">${game.name}</span>
                            <span class="game-badge">${game.category}</span>
                        </div>
                        <div class="game-stats">
                            <span>👥 ${game.players.toLocaleString()}</span>
                            <span>🏆 ${game.prize}</span>
                        </div>
                        <div class="game-footer">
                            <span class="game-price">🪙 ${game.price}</span>
                            <span class="game-players">🟢 ${Math.floor(game.players/10)} آنلاین</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // باز کردن بازی
        function openGame(page) {
            if (userCoins >= 50) {
                userCoins -= 50;
                document.getElementById('userCoins').textContent = userCoins.toLocaleString();
                window.location = page;
            } else {
                alert('❌ سکه کافی ندارید!');
            }
        }

        // فیلتر بازی‌ها
        function filterGames(category) {
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const filtered = category === 'all' ? games : games.filter(g => g.category === category);
            document.getElementById('allGames').innerHTML = filtered.map(game => `
                <div class="game-card" onclick="openGame('${game.name.toLowerCase()}.html')">
                    <img src="${game.image}" alt="${game.name}">
                    <div class="game-content">
                        <div class="game-header">
                            <span class="game-name">${game.name}</span>
                            <span class="game-badge">${game.category}</span>
                        </div>
                        <div class="game-stats">
                            <span>👥 ${game.players.toLocaleString()}</span>
                            <span>🏆 ${game.prize}</span>
                        </div>
                        <div class="game-footer">
                            <span class="game-price">🪙 ${game.price}</span>
                            <span class="game-players">🟢 ${Math.floor(game.players/10)} آنلاین</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // فروشگاه سکه
        function showCoinShop() {
            alert('🪙 فروشگاه سکه به زودی...');
        }

        loadGames();
    </script>
</body>
</html>
