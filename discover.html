<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اکتشاف | نیمه گمشده</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f5f5f5;
            min-height: 100vh;
            padding-bottom: 70px;
        }

        .header {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 24px;
        }

        .header h1 {
            font-size: 22px;
            flex: 1;
        }

        .coins {
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 12px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }

        .filters {
            display: flex;
            gap: 10px;
            padding: 15px;
            overflow-x: auto;
            white-space: nowrap;
            background: white;
            margin: 15px;
            border-radius: 40px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .filter-chip {
            background: #f0f0f0;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
        }

        .filter-chip.active {
            background: #ff4d6d;
            color: white;
        }

        .search-box {
            background: white;
            margin: 0 15px 15px;
            padding: 12px 20px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
        }

        .search-box span {
            color: #999;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 0 15px;
        }

        .user-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s;
        }

        .user-card:hover {
            transform: translateY(-5px);
        }

        .user-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .user-info {
            padding: 10px;
        }

        .user-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 3px;
        }

        .user-age {
            color: #ff4d6d;
            font-size: 12px;
        }

        .user-location {
            color: #999;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 3px;
            margin-top: 5px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #ddd;
        }

        .nav-item {
            text-decoration: none;
            color: #999;
            font-size: 24px;
        }

        .nav-item.active {
            color: #ff4d6d;
        }
    </style>
</head>
<body>
    <div class="header">
