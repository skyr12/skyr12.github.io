<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover</title><style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
text-align:center;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
font-size:20px;
}

#card{
width:320px;
height:420px;
background:white;
margin:auto;
margin-top:30px;
border-radius:20px;
box-shadow:0 5px 25px rgba(0,0,0,0.2);
overflow:hidden;
position:relative;
}

#card img{
width:100%;
height:300px;
object-fit:cover;
}

.info{
padding:15px;
}

.buttons{
margin-top:20px;
}

button{
border:none;
padding:12px 20px;
margin:10px;
border-radius:30px;
font-size:16px;
cursor:pointer;
}

.like{
background:#ff4d6d;
color:white;
}

.skip{
background:#ccc;
}

.navbar{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
font-size:22px;
}

.navbar a{
text-decoration:none;
}

</style></head><body><div class="header">🔥 Discover</div><div id="card"><img id="photo"><div class="info"><h2 id="name"></h2><p id="country"></p></div></div><div class="buttons"><button class="skip" onclick="skip()">❌ Skip</button>

<button class="like" onclick="like()">❤️ Like</button>

</div><div class="navbar"><a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="inbox.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="visitors.html">👁️</a>
<a href="profile.html">👤</a>

</div><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script><script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh",
storageBucket:"nimeh-gomsodeh.firebasestorage.app",
messagingSenderId:"815930956932",
appId:"1:815930956932:web:e8696a6a69b4458fd936d1"

};

firebase.initializeApp(firebaseConfig)

const db=firebase.firestore()

let users=[]
let index=0
let myId=""

firebase.auth().onAuthStateChanged(user=>{

if(!user){

location.href="login.html"
return

}

myId=user.uid

loadUsers()

})


function loadUsers(){

db.collection("users").get()

.then(snapshot=>{

users=[]

snapshot.forEach(doc=>{

let u=doc.data()

u.id=doc.id

if(u.id!==myId){

users.push(u)

}

})

showUser()

})

}


function showUser(){

let user=users[index]

if(!user){

document.getElementById("card").innerHTML="<h2>No more users</h2>"

return

}

document.getElementById("photo").src=user.photo
document.getElementById("name").innerText=user.name
document.getElementById("country").innerText=user.country

}


function like(){

let currentUser=firebase.auth().currentUser.uid

let likedUser=users[index].id

db.collection("likes").add({

from:currentUser,
to:likedUser,
time:Date.now()

})

alert("❤️ Liked")

index++

showUser()

}


function skip(){

index++

showUser()

}

</script></body>
</html>
