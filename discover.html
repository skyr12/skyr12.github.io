<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discover</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
margin:0;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
font-size:20px;
font-weight:bold;
}

.card{
background:white;
width:300px;
margin:30px auto;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
overflow:hidden;
}

.card img{
width:100%;
height:300px;
object-fit:cover;
}

.info{
padding:15px;
}

.name{
font-size:20px;
font-weight:bold;
}

.country{
color:gray;
}

.buttons{
display:flex;
justify-content:space-around;
padding:15px;
}

.btn{
padding:10px 15px;
border:none;
border-radius:20px;
font-size:16px;
cursor:pointer;
}

.pass{background:#ddd}
.super{background:#2196f3;color:white}
.like{background:#ff4d6d;color:white}

.navbar{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
font-size:22px;
}

.navbar a{
text-decoration:none;
}

</style>

</head>

<body>

<div class="header">🔥 Discover</div>

<div id="card"></div>

<div class="navbar">
<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="chat.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="visitors.html">👁️</a>
<a href="profile.html">👤</a>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
apiKey:"YOUR_KEY",
authDomain:"YOUR_DOMAIN",
projectId:"YOUR_PROJECT",
storageBucket:"YOUR_BUCKET",
messagingSenderId:"YOUR_ID",
appId:"YOUR_APP"
}

firebase.initializeApp(firebaseConfig)

const db = firebase.firestore()

let users=[]
let index=0

firebase.auth().onAuthStateChanged(user=>{

if(!user){
location.href="login.html"
return
}

db.collection("users").get().then(snapshot=>{

users=[]

snapshot.forEach(doc=>{
users.push({
id:doc.id,
...doc.data()
})
})

/* مرتب سازی کاربران */

users.sort((a,b)=>{

/* Boost اول */
if(b.boost===true && a.boost!==true) return 1
if(a.boost===true && b.boost!==true) return -1

/* بعد VIP */
if(b.vip===true && a.vip!==true) return 1
if(a.vip===true && b.vip!==true) return -1

return 0

})

showUser()

})

})

function showUser(){

if(index>=users.length){
document.getElementById("card").innerHTML="No more users"
return
}

let u=users[index]

document.getElementById("card").innerHTML=`

<div class="card">

<img src="${u.photo}">

<div class="info">

<div class="name">

${u.boost ? "🔥 " : ""}${u.name} ${u.vip ? "👑" : ""}, ${u.age}

</div>

<div class="country">${u.country}</div>

</div>

<div class="buttons">

<button class="btn pass" onclick="pass()">❌</button>

<button class="btn super" onclick="superLike()">⭐</button>

<button class="btn like" onclick="like()">❤️</button>

</div>

</div>

`

}

function pass(){

index++
showUser()

}

function like(){

let currentUser=firebase.auth().currentUser.uid
let likedUser=users[index].id

db.collection("likes").add({
from:currentUser,
to:likedUser,
time:Date.now()
})

db.collection("likes")
.where("from","==",likedUser)
.where("to","==",currentUser)
.get()
.then(snapshot=>{

if(!snapshot.empty){

db.collection("matches").add({
users:[currentUser,likedUser],
time:Date.now()
})

db.collection("notifications").add({
to:likedUser,
text:"❤️ It's a Match!",
time:Date.now()
})

alert("❤️ It's a Match!")

}

})

index++
showUser()

}

function superLike(){

let currentUser=firebase.auth().currentUser.uid
let likedUser=users[index].id

db.collection("superLikes").add({
from:currentUser,
to:likedUser,
time:Date.now()
})

alert("⭐ Super Like sent")

index++
showUser()

}

</script>

</body>
</html>
