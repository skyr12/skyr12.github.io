<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Discover</title><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
text-align:center;
font-size:22px;
}

.container{
padding:20px;
max-width:500px;
margin:auto;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
margin-bottom:20px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.card img{
width:100%;
height:300px;
object-fit:cover;
}

.info{
padding:15px;
text-align:center;
}

.name{
font-size:22px;
font-weight:bold;
}

.status{
margin-top:5px;
font-size:14px;
}

.online{
color:green;
}

.offline{
color:gray;
}

</style></head><body><div class="header">Discover People

</div><div class="container" id="users"></div><script>

const firebaseConfig = {

apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh"

}

firebase.initializeApp(firebaseConfig)

const db = firebase.firestore()

firebase.auth().onAuthStateChanged(user=>{

if(!user){

window.location="login.html"
return

}

loadUsers()

})

function loadUsers(){

db.collection("users").get().then(snapshot=>{

let html=""

snapshot.forEach(doc=>{

let u=doc.data()

let statusText="Offline"
let statusClass="offline"

if(u.online===true){

statusText="Online"
statusClass="online"

}

html+=`

<div class="card">

<img src="${u.photo || 'https://via.placeholder.com/400'}">

<div class="info">

<div class="name">

${u.name} • ${u.age}

</div>

<div>

${u.country}

</div>

<div class="status ${statusClass}">

${statusText}

</div>

</div>

</div>

`

})

document.getElementById("users").innerHTML=html

})

}

</script></body></html>
