<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Discover</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{

width:320px;
height:420px;
background:white;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
overflow:hidden;
position:absolute;
}

.card img{
width:100%;
height:70%;
object-fit:cover;
}

.info{
padding:15px;
text-align:center;
}

h2{
margin:5px 0;
}

button{
padding:10px 20px;
border:none;
border-radius:20px;
margin:5px;
font-size:16px;
cursor:pointer;
}

.like{
background:#ff4d6d;
color:white;
}

.skip{
background:#ccc;
}

</style>

</head>

<body>

<div class="card" id="card">

<img id="photo" src="https://randomuser.me/api/portraits/men/32.jpg">

<div class="info">

<h2 id="name">Farhad</h2>

<p id="country">UK • 25</p>

<button class="like" onclick="like()">❤️ Like</button>

<button class="skip" onclick="skip()">❌ Skip</button>

</div>

</div>

<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {

apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.firebasestorage.app",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


let users = [

{name:"Farhad",age:25,country:"UK",photo:"https://randomuser.me/api/portraits/men/32.jpg"},

{name:"Sara",age:23,country:"Turkey",photo:"https://randomuser.me/api/portraits/women/44.jpg"},

{name:"Ali",age:28,country:"Germany",photo:"https://randomuser.me/api/portraits/men/51.jpg"}

];

let index = 0;

function showUser(){

let user = users[index];

document.getElementById("photo").src=user.photo;

document.getElementById("name").innerText=user.name;

document.getElementById("country").innerText=user.country+" • "+user.age;

}

function like(){

let user = users[index];

db.collection("likes").add({

name:user.name,

age:user.age,

country:user.country,

photo:user.photo,

time:Date.now()

});

next();

}

function skip(){

next();

}

function next(){

index++;

if(index >= users.length){

index = 0;

}

showUser();

}

showUser();

</script>

</body>

</html>
