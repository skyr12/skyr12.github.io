<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Discover</title><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
text-align:center;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
font-size:22px;
}

.card{
width:90%;
max-width:400px;
margin:40px auto;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 15px 30px rgba(0,0,0,0.2);
}

.card img{
width:100%;
height:350px;
object-fit:cover;
}

.info{
padding:20px;
}

.buttons{
margin-top:20px;
}

button{
padding:15px 30px;
font-size:20px;
border:none;
border-radius:50px;
margin:10px;
cursor:pointer;
}

.like{
background:#4CAF50;
color:white;
}

.nope{
background:#ff4d6d;
color:white;
}

.status{
font-size:14px;
margin-top:5px;
}

.online{
color:green;
}

.offline{
color:gray;
}

</style></head><body><div class="header">Discover People

</div><div id="card"></div><script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh"

}

firebase.initializeApp(firebaseConfig)

const db = firebase.firestore()

let users = []
let index = 0

firebase.auth().onAuthStateChanged(user=>{

if(!user){

window.location="login.html"
return

}

loadUsers()

})

function loadUsers(){

db.collection("users").get().then(snapshot=>{

users=[]

snapshot.forEach(doc=>{

let u = doc.data()
u.id = doc.id

users.push(u)

})

sortUsers()

showUser()

})

}

function sortUsers(){

let now = Date.now()

users.sort((a,b)=>{

let boostA = (a.boostUntil && a.boostUntil > now) ? 1 : 0
let boostB = (b.boostUntil && b.boostUntil > now) ? 1 : 0

if(boostA !== boostB){

return boostB - boostA

}

let onlineA = a.online ? 1 : 0
let onlineB = b.online ? 1 : 0

return onlineB - onlineA

})

}

function showUser(){

if(index >= users.length){

document.getElementById("card").innerHTML = "No more users"

return

}

let u = users[index]

let statusText = "Offline"
let statusClass = "offline"

if(u.online){

statusText = "Online"
statusClass = "online"

}

document.getElementById("card").innerHTML = `

<div class="card">

<img src="${u.photo || 'https://via.placeholder.com/400'}">

<div class="info">

<h2>${u.name} • ${u.age}</h2>

<p>${u.country}</p>

<p class="status ${statusClass}">${statusText}</p>

<div class="buttons">

<button class="nope" onclick="dislike()">❌</button>

<button class="like" onclick="like()">❤️</button>

</div>

</div>

</div>

`

}

function like(){

let currentUser = firebase.auth().currentUser

let likedUser = users[index]

db.collection("likes").add({

from:currentUser.uid,
to:likedUser.id,
time:Date.now()

})

index++

showUser()

}

function dislike(){

index++

showUser()

}

</script></body></html>
