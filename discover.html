<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Discover</title><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:340px;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.photo{
width:100%;
height:350px;
object-fit:cover;
}

.info{
padding:20px;
text-align:center;
}

.name{
font-size:24px;
font-weight:bold;
}

.meta{
color:#666;
margin-top:5px;
}

.actions{
display:flex;
justify-content:space-around;
padding:20px;
}

button{
padding:12px 25px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
}

.like{
background:#ff4d6d;
color:white;
}

.skip{
background:#ddd;
}

</style></head><body><div class="card"><img id="photo" class="photo"><div class="info"><div id="name" class="name"></div>
<div id="meta" class="meta"></div></div><div class="actions"><button class="skip" onclick="next()">❌ Skip</button>
<button class="like" onclick="like()">❤️ Like</button>

</div></div><script>

const firebaseConfig = {
apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh"
}

firebase.initializeApp(firebaseConfig)

const db = firebase.firestore()

let users=[]
let index=0

firebase.auth().onAuthStateChanged(user=>{

if(!user){
window.location="login.html"
return
}

loadUsers()

})

function loadUsers(){

db.collection("users").get()

.then(snapshot=>{

users=[]

snapshot.forEach(doc=>{

users.push({
id:doc.id,
...doc.data()
})

})

showUser()

})

}

function showUser(){

if(users.length==0)return

let user=users[index]

document.getElementById("photo").src=user.photo
document.getElementById("name").innerText=user.name
document.getElementById("meta").innerText=user.country+" • "+user.age

}

function next(){

index++

if(index>=users.length){

alert("No more users")
return

}

showUser()

}

function like(){

let currentUser=firebase.auth().currentUser
let likedUser=users[index]

db.collection("likes").add({
from:currentUser.uid,
to:likedUser.id,
time:Date.now()
})

checkMatch(currentUser.uid, likedUser.id)

next()

}

function checkMatch(user1,user2){

db.collection("likes")
.where("from","==",user2)
.where("to","==",user1)
.get()

.then(snapshot=>{

if(!snapshot.empty){

db.collection("matches").add({

users:[user1,user2],
time:Date.now()

})

alert("It's a Match ❤️")

}

})

}

</script></body></html>
