<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Discover</title><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><style>

body{
font-family:Arial;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:320px;
background:white;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
text-align:center;
overflow:hidden;
}

.card img{
width:100%;
height:320px;
object-fit:cover;
}

.info{
padding:15px;
}

.buttons{
display:flex;
justify-content:space-around;
padding:15px;
}

button{
padding:10px 20px;
border:none;
border-radius:20px;
font-size:16px;
}

.like{
background:#ff4d6d;
color:white;
}

.skip{
background:#ccc;
}

</style></head><body><div class="card"><img id="photo"><div class="info"><h2 id="name"></h2>
<p id="age"></p>
<p id="country"></p></div><div class="buttons"><button class="like" onclick="like()">❤️ Like</button>
<button class="skip" onclick="next()">❌ Skip</button>

</div></div><script>

const firebaseConfig = {

apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh"

};

firebase.initializeApp(firebaseConfig)

const db = firebase.firestore()

let users=[]
let index=0

firebase.auth().onAuthStateChanged(function(user){

if(!user){

window.location="login.html"
return

}

loadUsers()

})

function loadUsers(){

db.collection("users").get()

.then(snapshot=>{

users=[]

snapshot.forEach(doc=>{

users.push({
id:doc.id,
...doc.data()
})

})

showUser()

})

}

function showUser(){

if(users.length===0) return

let user=users[index]

document.getElementById("photo").src=user.photo
document.getElementById("name").innerText=user.name
document.getElementById("age").innerText="Age: "+user.age
document.getElementById("country").innerText=user.country

}

function next(){

index++

if(index>=users.length){

alert("No more users")
return

}

showUser()

}

function like(){

let currentUser=firebase.auth().currentUser
let likedUser=users[index]

db.collection("likes").add({

from:currentUser.uid,
to:likedUser.id,
time:Date.now()

})

.then(()=>{

console.log("Like saved")

})

next()

}

</script></body></html>
