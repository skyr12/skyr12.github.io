<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discover</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
text-align:center;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
font-size:20px;
}

.container{
padding:20px;
}

.card{
background:white;
width:280px;
margin:auto;
margin-top:20px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
overflow:hidden;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card h3{
margin:10px;
}

.card p{
margin:5px;
color:#666;
}

.like{
background:#ff4d6d;
color:white;
border:none;
padding:10px 20px;
border-radius:25px;
margin:15px;
cursor:pointer;
}

.navbar{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
font-size:22px;
}

.navbar a{
text-decoration:none;
}

</style>

</head>

<body>

<div class="header">🔥 Discover</div>

<div class="container">

<div id="cards"></div>

</div>


<div class="navbar">

<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="chat.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="visitors.html">👁️</a>
<a href="profile.html">👤</a>

</div>



<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh",
storageBucket:"nimeh-gomsodeh.firebasestorage.app",
messagingSenderId:"815930956932",
appId:"1:815930956932:web:e8696a6a69b4458fd936d1"

};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig)
}

const db=firebase.firestore()


firebase.auth().onAuthStateChanged(user=>{

if(!user){

location.href="login.html"
return

}

loadUsers(user.uid)

})



function loadUsers(myId){

db.collection("users")
.orderBy("boost","desc")
.get()
.then(snapshot=>{

let html=""

snapshot.forEach(doc=>{

let u=doc.data()
let id=doc.id

if(id===myId) return


let vip=u.vip ? "👑 VIP" : ""

let online=u.online ? "🟢 Online" : "⚫ Offline"


html+=`

<div class="card">

<img src="${u.photo}" onclick="openProfile('${id}')">

<h3 onclick="openProfile('${id}')">

${u.name} ${vip}

</h3>

<p>${u.country}</p>

<p>${online}</p>

<button class="like" onclick="like('${id}')">

❤️ Like

</button>

</div>

`

})

document.getElementById("cards").innerHTML=html

})

}



function like(target){

let user=firebase.auth().currentUser

db.collection("likes").add({

from:user.uid,
to:target,
time:Date.now()

})

.then(()=>{

alert("❤️ Liked")

})

}



function openProfile(id){

location.href="user.html?id="+id

}

</script>

</body>
</html>
