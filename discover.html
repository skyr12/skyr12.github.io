<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
margin:0;
text-align:center;
}

h2{
margin-top:20px;
}

.card{

width:320px;
height:420px;
margin:auto;
margin-top:30px;
background:white;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
overflow:hidden;

}

.card img{

width:100%;
height:300px;
object-fit:cover;

}

.info{

padding:15px;

}

.buttons{

margin-top:20px;

}

button{

padding:12px 25px;
border:none;
border-radius:25px;
font-size:18px;
margin:10px;

}

.like{

background:#ff4d6d;
color:white;

}

.skip{

background:#ddd;

}

.navbar{

position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
font-size:22px;

}

.navbar a{
text-decoration:none;
}

</style>

</head>


<body>

<h2>🔥 Discover</h2>

<div id="card"></div>

<div class="buttons">

<button class="skip" onclick="skip()">❌ Skip</button>
<button class="like" onclick="like()">❤️ Like</button>

</div>


<div class="navbar">

<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="chat.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="visitors.html">👁️</a>
<a href="profile.html">👤</a>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>


<script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh",
storageBucket:"nimeh-gomsodeh.firebasestorage.app",
messagingSenderId:"815930956932",
appId:"1:815930956932:web:e8696a6a69b4458fd936d1"

};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig)
}

const db = firebase.firestore()

let users=[]
let index=0
let myId=""


firebase.auth().onAuthStateChanged(user=>{

if(!user){

location.href="login.html"
return

}

myId=user.uid

loadUsers()

})


function loadUsers(){

db.collection("users").get()

.then(snapshot=>{

snapshot.forEach(doc=>{

let data=doc.data()

data.id=doc.id

if(data.id!==myId){

users.push(data)

}

})

showUser()

})

}


function showUser(){

if(index>=users.length){

document.getElementById("card").innerHTML="<h3>No more users</h3>"
return

}

let u = users[index]

document.getElementById("card").innerHTML = `

<div class="card">

<img src="${u.photo}">

<div class="info">

<h3>${u.name}</h3>

<p>${u.age} • ${u.city}</p>

</div>

</div>

`

}


function skip(){

index++

showUser()

}


function like(){

let likedUser = users[index].id

db.collection("likes").add({

from:myId,
to:likedUser,
time:Date.now()

})

index++

showUser()

}

</script>


</body>
</html>
