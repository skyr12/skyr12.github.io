<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discover</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
text-align:center;
padding-bottom:80px;
}

.header{
background:#ff4d6d;
color:white;
padding:20px;
font-size:22px;
}

.card{
width:90%;
max-width:400px;
margin:40px auto;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.card img{
width:100%;
height:300px;
object-fit:cover;
}

.info{
padding:20px;
}

.buttons{
display:flex;
justify-content:space-around;
padding:20px;
}

button{
padding:12px 25px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
}

.nope{
background:#ccc;
}

.like{
background:#ff4d6d;
color:white;
}

.status{
font-size:14px;
margin-top:5px;
}

.navbar{
position:fixed;
bottom:0;
left:0;
width:100%;
height:65px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -5px 15px rgba(0,0,0,0.15);
}

.navbar a{
text-decoration:none;
font-size:24px;
color:#444;
}

</style>

</head>

<body>

<div class="header">
Discover
</div>

<div class="card">

<img id="photo" src="https://randomuser.me/api/portraits/women/44.jpg">

<div class="info">

<h2 id="name">Sara</h2>

<p id="country">Germany • 23</p>

<p id="status" class="status">🟢 Online</p>

</div>

<div class="buttons">
<button class="nope" onclick="dislike()">❌ Nope</button>
<button class="like" onclick="like()">❤️ Like</button>
</div>

</div>

<div class="navbar">
<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="chat.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="profile.html">👤</a>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

var firebaseConfig = {

apiKey:"YOUR_API_KEY",
authDomain:"YOUR_PROJECT.firebaseapp.com",
projectId:"YOUR_PROJECT_ID"

};

firebase.initializeApp(firebaseConfig)

var db = firebase.firestore()

let currentUser="user1"

let users=[

{
name:"Sara",
country:"Germany • 23",
photo:"https://randomuser.me/api/portraits/women/44.jpg",
online:true
},

{
name:"John",
country:"USA • 27",
photo:"https://randomuser.me/api/portraits/men/65.jpg",
online:false
},

{
name:"Anna",
country:"France • 24",
photo:"https://randomuser.me/api/portraits/women/68.jpg",
online:true
}

]

let index=0

function showUser(){

if(index>=users.length){

index=0

}

let u=users[index]

document.getElementById("photo").src=u.photo
document.getElementById("name").innerText=u.name
document.getElementById("country").innerText=u.country

document.getElementById("status").innerText = u.online ? "🟢 Online" : "⚫ Offline"

}

function like(){

index++
showUser()

}

function dislike(){

index++
showUser()

}

showUser()

</script>

</body>
</html>
