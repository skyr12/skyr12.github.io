<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discover</title>

<style>

body{
font-family:Arial;
background:#f3f3f3;
text-align:center;
margin:0;
}

.filter{

margin-top:20px;

}

.card{

background:white;
width:320px;
margin:auto;
margin-top:40px;
padding:20px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);

}

img{
width:100%;
border-radius:20px;
}

</style>

</head>

<body>

<h2>Discover</h2>


<div class="filter">

<input id="country" placeholder="Country">

<input id="age" placeholder="Max Age">

<button onclick="applyFilter()">Search</button>

</div>


<div id="card" class="card">

<img id="photo">

<h3 id="name"></h3>

<p id="city"></p>

<p id="ageText"></p>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>


<script>

const firebaseConfig = {

apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",

authDomain: "nimeh-gomsodeh.firebaseapp.com",

projectId: "nimeh-gomsodeh",

storageBucket: "nimeh-gomsodeh.firebasestorage.app",

messagingSenderId: "815930956932",

appId: "1:815930956932:web:e8696a6a69b4458fd936d1"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


let users=[];
let filteredUsers=[];
let index=0;


firebase.auth().onAuthStateChanged(user=>{

if(user){

loadUsers();

}

});


function loadUsers(){

db.collection("users").get().then(snapshot=>{

snapshot.forEach(doc=>{

users.push(doc.data());

});

filteredUsers=users;

showUser();

});

}


function showUser(){

if(filteredUsers.length==0)return;

const user=filteredUsers[index];

document.getElementById("name").innerText=user.name;

document.getElementById("city").innerText=user.city+" , "+user.country;

document.getElementById("ageText").innerText="Age: "+user.age;

document.getElementById("photo").src=user.photo;

}


function applyFilter(){

const country=document.getElementById("country").value.toLowerCase();

const age=document.getElementById("age").value;

filteredUsers=users.filter(u=>{

let ok=true;

if(country && !u.country.toLowerCase().includes(country)) ok=false;

if(age && u.age>age) ok=false;

return ok;

});

index=0;

showUser();

}

</script>

</body>

</html>
