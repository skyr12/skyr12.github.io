<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Discover</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:320px;
height:420px;
background:white;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
overflow:hidden;
position:absolute;
transition:0.3s;
}

.card img{
width:100%;
height:70%;
object-fit:cover;
}

.info{
padding:15px;
text-align:center;
}

</style>

</head>

<body>

<div class="card" id="card">

<img id="photo">

<div class="info">

<h2 id="name"></h2>

<p id="country"></p>

</div>

</div>


<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {

apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


let users=[]
let index=0

db.collection("users").get().then(snapshot=>{

snapshot.forEach(doc=>{

users.push(doc.data())

})

showUser()

})


function showUser(){

let user=users[index]

document.getElementById("photo").src=user.photo
document.getElementById("name").innerText=user.name
document.getElementById("country").innerText=user.country+" • "+user.age

}


function next(){

index++

if(index>=users.length){

index=0

}

showUser()

}


let card=document.getElementById("card")

let startX=0

card.addEventListener("touchstart",function(e){

startX=e.touches[0].clientX

})


card.addEventListener("touchend",function(e){

let endX=e.changedTouches[0].clientX

if(endX-startX>100){

card.style.transform="translateX(400px) rotate(20deg)"

setTimeout(()=>{

card.style.transform="none"

next()

},300)

}

if(startX-endX>100){

card.style.transform="translateX(-400px) rotate(-20deg)"

setTimeout(()=>{

card.style.transform="none"

next()

},300)

}

})

</script>

</body>

</html>
