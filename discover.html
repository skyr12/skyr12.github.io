<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discover</title>

<style>

body{
font-family:Arial;
background:#f3f3f3;
text-align:center;
margin:0;
}

.card{
width:320px;
margin:auto;
margin-top:80px;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.card img{
width:100%;
height:320px;
object-fit:cover;
}

.info{
padding:20px;
}

.online{
color:green;
font-weight:bold;
}

button{
padding:12px 20px;
margin:10px;
border:none;
border-radius:20px;
cursor:pointer;
}

.like{
background:#ff4d6d;
color:white;
}

.skip{
background:gray;
color:white;
}

.match{
color:#ff4d6d;
font-weight:bold;
}

</style>

</head>

<body>

<h2>Discover</h2>

<div class="card">

<img id="photo">

<div class="info">

<h3 id="name"></h3>

<p id="city"></p>

<p id="age"></p>

<p id="status"></p>

<p class="match" id="score"></p>

</div>

</div>

<button class="like" onclick="likeUser()">❤️ Like</button>
<button class="skip" onclick="nextUser()">❌ Skip</button>


<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>

const firebaseConfig={
apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh"
}

firebase.initializeApp(firebaseConfig)

const db=firebase.firestore()

let users=[]
let index=0
let currentUser=null
let myData=null


firebase.auth().onAuthStateChanged(user=>{

currentUser=user

db.collection("users").doc(user.uid).get().then(doc=>{

myData=doc.data()

loadUsers()

})

})


function distance(lat1,lon1,lat2,lon2){

const R=6371

let dLat=(lat2-lat1)*Math.PI/180
let dLon=(lon2-lon1)*Math.PI/180

let a=
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2)

let c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))

return Math.round(R*c)

}


function matchScore(user){

let score=0

let ageDiff=Math.abs(user.age-myData.age)

score+=100-ageDiff

let km=distance(myData.lat,myData.lng,user.lat,user.lng)

score+=100-km

return score

}


function loadUsers(){

db.collection("users").get().then(snapshot=>{

snapshot.forEach(doc=>{

let data=doc.data()

if(doc.id===currentUser.uid) return

// جلوگیری از پروفایل فیک

if(!data.name) return
if(!data.age) return
if(!data.photo) return
if(data.age<18) return

data.id=doc.id

data.score=matchScore(data)

users.push(data)

})

users.sort((a,b)=>b.score-a.score)

showUser()

})

}


function showUser(){

if(users.length==0) return

let user=users[index]

let km=distance(
myData.lat,
myData.lng,
user.lat,
user.lng
)

document.getElementById("name").innerText=user.name

document.getElementById("city").innerText=
user.city+" • "+km+" km away"

document.getElementById("age").innerText="Age: "+user.age

document.getElementById("photo").src=user.photo


if(user.online){

document.getElementById("status").innerHTML="🟢 Online"

}else{

document.getElementById("status").innerHTML="Offline"

}


document.getElementById("score").innerText=
"Match Score: "+user.score

}


function nextUser(){

index++

if(index>=users.length){

index=0

}

showUser()

}


function likeUser(){

let target=users[index]

db.collection("likes").add({

from:currentUser.uid,
to:target.id,
time:Date.now()

})

nextUser()

}

</script>

</body>

</html>
