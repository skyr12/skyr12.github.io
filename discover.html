<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discover</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
text-align:center;
padding-bottom:80px;
}

.card{
width:90%;
max-width:400px;
margin:40px auto;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.card img{
width:100%;
}

.info{
padding:20px;
}

.buttons{
margin-top:15px;
}

button{
padding:10px 20px;
border:none;
border-radius:10px;
margin:5px;
font-size:16px;
}

.like{
background:#ff4d6d;
color:white;
}

.nope{
background:#ddd;
}

.navbar{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:15px;
box-shadow:0 -5px 15px rgba(0,0,0,0.2);
}

.navbar a{
text-decoration:none;
font-size:24px;
color:black;
}

</style>

</head>

<body>

<div class="card">

<img src="https://i.pravatar.cc/400">

<div class="info">

<h2>Farhad</h2>

<p>UK • 25</p>

<p id="status">🟢 Online</p>

<div class="buttons">

<button class="nope">❌</button>

<button class="like">❤️ Like</button>

</div>

</div>

</div>

<div class="navbar">

<a href="discover.html">🔥</a>

<a href="matches.html">❤️</a>

<a href="chat.html">💬</a>

<a href="notifications.html">🔔</a>

<a href="profile.html">👤</a>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
  authDomain: "nimeh-gomsodeh.firebaseapp.com",
  projectId: "nimeh-gomsodeh",
  storageBucket: "nimeh-gomsodeh.firebasestorage.app",
  messagingSenderId: "815930956932",
  appId: "1:815930956932:web:e8696a6a69b4458fd936d1",
  measurementId: "G-KTCV2B5R9L"
};

firebase.initializeApp(firebaseConfig)

const db = firebase.firestore()

firebase.auth().onAuthStateChanged(user=>{

if(!user){

location.href="login.html"

return

}

let uid=user.uid

// کاربر آنلاین

db.collection("users").doc(uid).set({

online:true,
lastSeen:Date.now()

},{merge:true})

// وقتی صفحه بسته شد

window.addEventListener("beforeunload",function(){

db.collection("users").doc(uid).update({

online:false,
lastSeen:Date.now()

})

})

})

</script>

</body>

</html>
