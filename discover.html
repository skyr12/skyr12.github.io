<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discover</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<style>

body{
font-family:Arial;
background:#f5f5f5;
text-align:center;
margin:0;
padding:0;
}

h2{
margin-top:20px;
}

.card{

width:300px;
margin:auto;
background:white;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
overflow:hidden;
margin-top:30px;

}

.card img{

width:100%;
height:300px;
object-fit:cover;

}

.info{
padding:15px;
}

button{

padding:10px 20px;
border:none;
border-radius:20px;
margin:5px;
font-size:16px;

}

.like{

background:red;
color:white;

}

.skip{

background:gray;
color:white;

}

</style>

</head>

<body>

<h2>Discover</h2>

<div class="card" id="card">

<img id="photo">

<div class="info">

<h3 id="name"></h3>

<p id="location"></p>

<p id="age"></p>

<button class="like" onclick="like()">❤️ Like</button>
<button class="skip" onclick="next()">❌ Skip</button>

</div>

</div>

<script>

const firebaseConfig = {
apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.firebasestorage.app",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.firestore();

let users=[];
let index=0;

db.collection("users").get().then((snapshot)=>{

snapshot.forEach((doc)=>{

users.push(doc.data())

})

showUser()

})

function showUser(){

if(users.length==0) return

let user=users[index]

document.getElementById("photo").src=user.photo
document.getElementById("name").innerText=user.name
document.getElementById("location").innerText=user.city+" , "+user.country
document.getElementById("age").innerText="Age: "+user.age

}

function next(){

index++

if(index>=users.length){

alert("No more users")

return

}

showUser()

}

function like(){

alert("Liked ❤️")

next()

}

</script>

</body>
</html>
