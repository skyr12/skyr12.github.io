<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nimeh Discover</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f3f3f3;
text-align:center;
padding-bottom:90px;
}

.header{
background:#ff4d6d;
color:white;
padding:18px;
font-size:22px;
font-weight:bold;
}

.online-bar{
background:#28c76f;
color:white;
padding:10px;
font-weight:bold;
}

.card{

width:90%;
max-width:400px;
margin:40px auto;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,0.2);

}

.card img{

width:100%;
height:320px;
object-fit:cover;

}

.info{

padding:20px;

}

.buttons{

display:flex;
justify-content:space-around;
padding:20px;

}

button{

padding:12px 25px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;

}

.nope{

background:#ccc;

}

.like{

background:#ff4d6d;
color:white;

}

.status{

margin-top:5px;
font-size:14px;

}

.actions{

margin:25px;

}

.actions button{

margin:8px;
background:#ff4d6d;
color:white;

}

.navbar{

position:fixed;
bottom:0;
left:0;
width:100%;
height:70px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -5px 15px rgba(0,0,0,0.2);

}

.navbar a{

text-decoration:none;
font-size:26px;

}

</style>

</head>

<body>

<div class="header">

Nimeh Dating

</div>

<div class="online-bar">

🟢 <span id="onlineCount">0</span> Users Online

</div>


<div class="card">

<img id="photo" src="https://randomuser.me/api/portraits/women/44.jpg">

<div class="info">

<h2 id="name">Sara</h2>

<p id="country">Germany • 23</p>

<p id="status" class="status">🟢 Online</p>

</div>

<div class="buttons">

<button class="nope" onclick="dislike()">❌</button>

<button class="like" onclick="like()">❤️</button>

</div>

</div>


<div class="actions">

<button onclick="location.href='premium.html'">💎 Premium</button>

<button onclick="location.href='coins.html'">🪙 Coins</button>

<button onclick="location.href='gifts.html'">🎁 Gifts</button>

<button onclick="location.href='boost.html'">🚀 Boost</button>

<button onclick="location.href='nearby.html'">📍 Nearby</button>

<button onclick="location.href='search.html'">🔎 Search</button>

</div>


<div class="navbar">

<a href="discover.html">🔥</a>

<a href="matches.html">❤️</a>

<a href="chat.html">💬</a>

<a href="notifications.html">🔔</a>

<a href="profile.html">👤</a>

</div>


<script>

function updateOnline(){

let online = Math.floor(Math.random()*200)+20

document.getElementById("onlineCount").innerText = online

}

updateOnline()

setInterval(updateOnline,4000)


let users=[

{

name:"Sara",

country:"Germany • 23",

photo:"https://randomuser.me/api/portraits/women/44.jpg",

online:true

},

{

name:"John",

country:"USA • 27",

photo:"https://randomuser.me/api/portraits/men/65.jpg",

online:false

},

{

name:"Anna",

country:"France • 24",

photo:"https://randomuser.me/api/portraits/women/68.jpg",

online:true

},

{

name:"Omar",

country:"Turkey • 29",

photo:"https://randomuser.me/api/portraits/men/32.jpg",

online:true

}

]


let index=0


function showUser(){

if(index>=users.length){

index=0

}

let u=users[index]

document.getElementById("photo").src=u.photo

document.getElementById("name").innerText=u.name

document.getElementById("country").innerText=u.country

document.getElementById("status").innerText = u.online ? "🟢 Online" : "⚫ Offline"

}


function like(){

index++

showUser()

}


function dislike(){

index++

showUser()

}

showUser()

</script>

</body>

</html>
