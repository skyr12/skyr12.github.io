<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discover</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
}

.card{
width:320px;
margin:40px auto;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.card img{
width:100%;
height:320px;
object-fit:cover;
}

.info{
padding:20px;
}

button{
padding:12px 25px;
margin:10px;
border:none;
border-radius:25px;
cursor:pointer;
}

.like{
background:#ff4d6d;
color:white;
}

.skip{
background:gray;
color:white;
}

</style>

</head>

<body>

<h2>Discover</h2>

<div class="card">

<img id="photo">

<div class="info">

<h3 id="name"></h3>

<p id="city"></p>

<p id="age"></p>

</div>

</div>

<button class="like" onclick="likeUser()">❤️ Like</button>
<button class="skip" onclick="nextUser()">❌ Skip</button>


<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>

const firebaseConfig={
apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh"
}

firebase.initializeApp(firebaseConfig)

const db=firebase.firestore()

let users=[]
let index=0
let currentUser=null


firebase.auth().onAuthStateChanged(user=>{

currentUser=user

loadUsers()

})


function loadUsers(){

db.collection("users").get().then(snapshot=>{

snapshot.forEach(doc=>{

let data=doc.data()

data.id=doc.id

if(data.id!==currentUser.uid){

users.push(data)

}

})

showUser()

})

}


function showUser(){

if(users.length==0) return

let user=users[index]

document.getElementById("name").innerText=user.name
document.getElementById("city").innerText=user.city
document.getElementById("age").innerText="Age: "+user.age
document.getElementById("photo").src=user.photo

}


function nextUser(){

index++

if(index>=users.length){

index=0

}

showUser()

}


function likeUser(){

let target=users[index]

db.collection("likes")
.where("from","==",target.id)
.where("to","==",currentUser.uid)
.get()
.then(snapshot=>{

if(!snapshot.empty){

db.collection("matches").add({

user1:currentUser.uid,
user2:target.id,
time:Date.now()

})

alert("🎉 It's a Match!")

window.location.href="chat.html"

}

})


db.collection("likes").add({

from:currentUser.uid,
to:target.id,
time:Date.now()

})

nextUser()

}

</script>

</body>

</html>
