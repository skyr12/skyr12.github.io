<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
margin:0;
text-align:center;
}

h2{
margin-top:20px;
}

.card{
width:320px;
margin:auto;
margin-top:30px;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.card img{
width:100%;
height:320px;
object-fit:cover;
}

.info{
padding:20px;
}

.buttons{
margin-top:10px;
}

button{
border:none;
padding:12px 20px;
border-radius:30px;
margin:5px;
font-size:16px;
cursor:pointer;
}

.skip{background:#ddd}
.like{background:#ff4d6d;color:white}
.super{background:#3b82f6;color:white}

.navbar{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
font-size:22px;
}

.navbar a{
text-decoration:none;
}

.online{
color:green;
font-size:14px;
}

</style>

</head>


<body>

<h2>🔥 Discover</h2>

<div id="card"></div>

<div class="buttons">

<button class="skip" onclick="skip()">❌ Skip</button>

<button class="super" onclick="superLike()">⭐ Super</button>

<button class="like" onclick="like()">❤️ Like</button>

</div>


<div class="navbar">

<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="inbox.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="visitors.html">👁️</a>
<a href="profile.html">👤</a>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>


<script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh",
storageBucket:"nimeh-gomsodeh.firebasestorage.app",
messagingSenderId:"815930956932",
appId:"1:815930956932:web:e8696a6a69b4458fd936d1"

};

firebase.initializeApp(firebaseConfig)

const db = firebase.firestore()

let users=[]
let index=0
let myId=""
let myLat=0
let myLng=0



firebase.auth().onAuthStateChanged(user=>{

if(!user){

location.href="login.html"
return

}

myId=user.uid

getLocation()

loadUsers()

})



function getLocation(){

navigator.geolocation.getCurrentPosition(function(position){

myLat = position.coords.latitude
myLng = position.coords.longitude

})

}



function loadUsers(){

db.collection("users")

.orderBy("boost","desc")

.get()

.then(snapshot=>{

users=[]

snapshot.forEach(doc=>{

let data=doc.data()

data.id=doc.id

if(data.id!==myId){

users.push(data)

}

})

showUser()

})

}



function showUser(){

if(index>=users.length){

document.getElementById("card").innerHTML="<h3>No more users</h3>"
return

}

let u = users[index]

let km=""

if(u.lat && u.lng){

km = distance(myLat,myLng,u.lat,u.lng)

}

let online=""

if(u.online){

online="<span class='online'>🟢 Online</span>"

}

document.getElementById("card").innerHTML=`

<div class="card">

<img src="${u.photo}">

<div class="info">

<h3>${u.name}</h3>

<p>${u.age} • ${u.city}</p>

<p>${km} km away</p>

<p>${online}</p>

</div>

</div>

`

}



function skip(){

index++

showUser()

}



function like(){

let likedUser=users[index].id

db.collection("likes").add({

from:myId,
to:likedUser,
time:Date.now()

})

checkMatch(likedUser)

index++

showUser()

}



function superLike(){

let likedUser=users[index].id

db.collection("superlikes").add({

from:myId,
to:likedUser,
time:Date.now()

})

db.collection("notifications").add({

to:likedUser,
text:"⭐ Someone Super Liked you!",
time:Date.now()

})

alert("⭐ Super Like sent!")

index++

showUser()

}



function checkMatch(likedUser){

db.collection("likes")

.where("from","==",likedUser)

.where("to","==",myId)

.get()

.then(snapshot=>{

if(!snapshot.empty){

db.collection("matches").add({

users:[myId,likedUser],
time:Date.now()

})

alert("❤️ It's a Match!")

}

})

}



function distance(lat1, lon1, lat2, lon2){

var R = 6371

var dLat = (lat2-lat1) * Math.PI/180
var dLon = (lon2-lon1) * Math.PI/180

var a =
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2)

var c = 2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))

var d = R*c

return Math.round(d)

}



let startX=0

document.addEventListener("touchstart",function(e){

startX=e.touches[0].clientX

})



document.addEventListener("touchend",function(e){

let endX=e.changedTouches[0].clientX

let diff=endX-startX

if(diff>80){like()}
if(diff<-80){skip()}

})

</script>

</body>
</html>
