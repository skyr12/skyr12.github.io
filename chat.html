<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f5f5f5;
}

header{
background:#ff4d6d;
color:white;
padding:15px;
text-align:center;
}

#messages{
padding:20px;
height:60vh;
overflow-y:auto;
}

.msg{
margin:10px 0;
padding:10px 15px;
border-radius:20px;
max-width:70%;
}

.me{
background:#ff4d6d;
color:white;
margin-left:auto;
}

.other{
background:#ddd;
}

.inputBox{
position:fixed;
bottom:60px;
width:100%;
display:flex;
background:white;
padding:10px;
}

input{
flex:1;
padding:10px;
border-radius:20px;
border:1px solid #ccc;
}

button{
margin-left:10px;
padding:10px 15px;
border:none;
background:#ff4d6d;
color:white;
border-radius:20px;
}

.navbar{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
font-size:22px;
}

.navbar a{
text-decoration:none;
}

</style>

</head>

<body>

<header>

💬 Chat

</header>

<div id="messages"></div>

<div class="inputBox">

<input id="msg" placeholder="Type message...">

<button onclick="send()">Send</button>

</div>


<div class="navbar">

<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="inbox.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="visitors.html">👁️</a>
<a href="profile.html">👤</a>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh",
storageBucket:"nimeh-gomsodeh.firebasestorage.app",
messagingSenderId:"815930956932",
appId:"1:815930956932:web:e8696a6a69b4458fd936d1"

};

firebase.initializeApp(firebaseConfig)

const db=firebase.firestore()

let myId=""
let otherId=""
let chatId=""



firebase.auth().onAuthStateChanged(user=>{

if(!user){

location.href="login.html"
return

}

myId=user.uid

const params=new URLSearchParams(window.location.search)

otherId=params.get("id")

chatId=[myId,otherId].sort().join("_")

loadMessages()

})



function loadMessages(){

db.collection("messages")

.where("chat","==",chatId)

.orderBy("time")

.onSnapshot(snapshot=>{

let html=""

snapshot.forEach(doc=>{

let m=doc.data()

let cls="other"

if(m.from==myId){

cls="me"

}

html+=`<div class="msg ${cls}">${m.text}</div>`

})

document.getElementById("messages").innerHTML=html

})

}



function send(){

let text=document.getElementById("msg").value

if(!text)return

db.collection("messages").add({

chat:chatId,
from:myId,
to:otherId,
text:text,
time:Date.now()

})

document.getElementById("msg").value=""

}

</script>

</body>
</html>
