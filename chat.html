<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat</title>

<style>

body{
font-family:Arial;
background:#f3f3f3;
text-align:center;
}

#messages{
width:320px;
height:400px;
margin:auto;
background:white;
border-radius:20px;
overflow:auto;
padding:10px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.msg{
background:#ff4d6d;
color:white;
padding:10px;
margin:5px;
border-radius:10px;
}

.status{
font-size:12px;
color:#333;
}

input{
width:200px;
padding:10px;
border-radius:10px;
border:none;
margin-top:10px;
}

button{
padding:10px 20px;
border:none;
border-radius:20px;
background:#ff4d6d;
color:white;
cursor:pointer;
margin:5px;
}

</style>

</head>

<body>

<h2>Chat</h2>

<div id="messages"></div>

<br>

<input id="message" placeholder="Type message">

<button onclick="sendMessage()">Send</button>

<button onclick="blockUser()">🚫 Block User</button>


<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>

const firebaseConfig={
apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh"
}

firebase.initializeApp(firebaseConfig)

const db=firebase.firestore()

let currentUser=null
let blocked=false
let targetUser="testUser"  // اینجا بعداً UID کاربر مقابل قرار می‌گیرد


firebase.auth().onAuthStateChanged(user=>{

currentUser=user

checkBlock()

loadMessages()

})


function checkBlock(){

db.collection("blocks")
.where("from","==",currentUser.uid)
.where("to","==",targetUser)
.get()
.then(snapshot=>{

if(!snapshot.empty){

blocked=true

}

})

}


function sendMessage(){

if(blocked){

alert("You blocked this user")

return

}

let text=document.getElementById("message").value

db.collection("messages").add({

from:currentUser.uid,
to:targetUser,
text:text,
seen:false,
time:Date.now()

})

document.getElementById("message").value=""

}


function loadMessages(){

db.collection("messages")
.orderBy("time")
.onSnapshot(snapshot=>{

document.getElementById("messages").innerHTML=""

snapshot.forEach(doc=>{

let data=doc.data()

let div=document.createElement("div")

div.className="msg"

let status="✓ Sent"

if(data.seen){

status="✓✓ Seen"

}

div.innerHTML=data.text+"<br><span class='status'>"+status+"</span>"

document.getElementById("messages").appendChild(div)

db.collection("messages")
.doc(doc.id)
.update({seen:true})

})

})

}


function blockUser(){

db.collection("blocks").add({

from:currentUser.uid,
to:targetUser,
time:Date.now()

})

blocked=true

alert("User blocked")

}

</script>

</body>

</html>
