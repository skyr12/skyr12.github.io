<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>Chat</title><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script><style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
}

#messages{
width:320px;
height:350px;
margin:20px auto;
background:white;
border-radius:20px;
padding:15px;
overflow:auto;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.message{
margin:10px;
padding:10px;
background:#eee;
border-radius:10px;
}

input{
width:200px;
padding:10px;
border-radius:10px;
border:1px solid #ccc;
}

button{
padding:10px 15px;
background:red;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

</style></head><body><h1>Chat</h1><div id="messages"></div><input id="msg" placeholder="Type message"><button onclick="sendMessage()">Send</button>

<script>

const firebaseConfig = {
apiKey: "AIzaSyAA0xYFglY_ONI-PstgS4nP3uNIpyA",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.appspot.com",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.firestore();

let chatUser=localStorage.getItem("chatUser");

firebase.auth().onAuthStateChanged((user)=>{

let chatId=[user.uid,chatUser].sort().join("_");

db.collection("messages")
.where("chat","==",chatId)
.orderBy("time")
.onSnapshot((snapshot)=>{

let messagesDiv=document.getElementById("messages");

messagesDiv.innerHTML="";

snapshot.forEach((doc)=>{

let m=doc.data();

let div=document.createElement("div");

div.className="message";

div.innerText=m.text;

messagesDiv.appendChild(div);

});

});

});


function sendMessage(){

let text=document.getElementById("msg").value;

firebase.auth().onAuthStateChanged((user)=>{

let chatId=[user.uid,chatUser].sort().join("_");

db.collection("messages").add({

chat:chatId,
text:text,
from:user.uid,
time:Date.now()

});

});

document.getElementById("msg").value="";

}

</script></body>
</html>
