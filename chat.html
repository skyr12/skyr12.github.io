<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت | نیمه گمشده</title>
    <link href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Vazir, sans-serif;
        }

        body {
            background: #fef9f7;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: white;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            border-bottom: 1px solid #f0eae7;
        }

        .back-btn {
            font-size: 1.5rem;
            color: #888;
            cursor: pointer;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex: 1;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e3636b;
        }

        .user-details h3 {
            font-size: 1rem;
            color: #333;
        }

        .user-details p {
            font-size: 0.8rem;
            color: #aaa;
        }

        .online {
            color: #4caf50;
            font-weight: 400;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 70%;
            display: flex;
            flex-direction: column;
        }

        .message.sent {
            align-self: flex-end;
        }

        .message.received {
            align-self: flex-start;
        }

        .message-content {
            padding: 0.8rem 1.2rem;
            border-radius: 1.8rem;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .sent .message-content {
            background: #e3636b;
            color: white;
            border-bottom-left-radius: 0.3rem;
        }

        .received .message-content {
            background: white;
            color: #333;
            border: 1px solid #f0e0da;
            border-bottom-right-radius: 0.3rem;
        }

        .message-time {
            font-size: 0.7rem;
            color: #aaa;
            margin-top: 0.2rem;
            padding: 0 0.5rem;
        }

        .sent .message-time {
            text-align: left;
        }

        .received .message-time {
            text-align: right;
        }

        .chat-footer {
            background: white;
            padding: 1rem;
            display: flex;
            gap: 0.5rem;
            border-top: 1px solid #f0eae7;
        }

        .chat-footer input {
            flex: 1;
            padding: 0.8rem 1.2rem;
            border: 1px solid #f0e0da;
            border-radius: 2rem;
            font-size: 0.9rem;
        }

        .chat-footer button {
            background: #e3636b;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .chat-footer button:hover {
            background: #d14f57;
        }

        .typing {
            color: #aaa;
            font-size: 0.8rem;
            padding: 0.5rem 1rem;
        }
    </style>
</head>
<body>
    <div class="chat-header">
        <span class="back-btn" onclick="history.back()">←</span>
        <div class="user-info">
            <img src="https://randomuser.me/api/portraits/women/1.jpg" class="user-avatar">
            <div class="user-details">
                <h3>سارا محمدی</h3>
                <p><span class="online">● آنلاین</span></p>
            </div>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message received">
            <div class="message-content">سلام! خوبی؟</div>
            <span class="message-time">۱۰:۲۳</span>
        </div>
        <div class="message sent">
            <div class="message-content">سلام ممنون، تو خوبی؟</div>
            <span class="message-time">۱۰:۲۴</span>
        </div>
        <div class="message received">
            <div class="message-content">مرسی، حالت چطوره؟</div>
            <span class="message-time">۱۰:۲۵</span>
        </div>
        <div class="message sent">
            <div class="message-content">عالی‌ام، تازه برگشتم از سفر 😊</div>
            <span class="message-time">۱۰:۲۶</span>
        </div>
    </div>

    <div class="typing" id="typingIndicator" style="display: none;">در حال تایپ...</div>

    <div class="chat-footer">
        <input type="text" placeholder="پیام شما..." id="messageInput">
        <button onclick="sendMessage()">➤</button>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const container = document.getElementById('chatContainer');
            const now = new Date();
            const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message sent';
            msgDiv.innerHTML = `
                <div class="message-content">${text}</div>
                <span class="message-time">${time}</span>
            `;
            container.appendChild(msgDiv);
            input.value = '';
            container.scrollTop = container.scrollHeight;

            // شبیه‌سازی دریافت پیام
            setTimeout(() => {
                const replyDiv = document.createElement('div');
                replyDiv.className = 'message received';
                replyDiv.innerHTML = `
                    <div class="message-content">ممنون از پیامت 😊</div>
                    <span class="message-time">${time}</span>
                `;
                container.appendChild(replyDiv);
                container.scrollTop = container.scrollHeight;
            }, 1500);
        }

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
