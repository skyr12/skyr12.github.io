<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat</title>

<style>

body{
font-family:Arial;
background:#f3f3f3;
text-align:center;
}

#messages{
width:320px;
height:400px;
margin:auto;
background:white;
border-radius:20px;
overflow:auto;
padding:10px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.msg{
background:#ff4d6d;
color:white;
padding:10px;
margin:5px;
border-radius:10px;
}

.msg img{
width:200px;
border-radius:10px;
}

audio{
width:200px;
}

input{
width:220px;
padding:10px;
margin-top:10px;
border-radius:10px;
border:none;
}

button{
padding:10px 20px;
background:#ff4d6d;
color:white;
border:none;
border-radius:20px;
cursor:pointer;
margin-top:5px;
}

</style>

</head>

<body>

<h2>Chat</h2>

<div id="messages"></div>

<br>

<input id="message" placeholder="Type message">

<button onclick="sendMessage()">Send</button>

<br>

<input id="imageUrl" placeholder="Image URL">

<button onclick="sendImage()">Send Image</button>

<br>

<button onclick="startRecording()">🎤 Record Voice</button>

<button onclick="stopRecording()">Stop</button>


<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>

const firebaseConfig={
apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh"
}

firebase.initializeApp(firebaseConfig)

const db=firebase.firestore()

let currentUser=null

firebase.auth().onAuthStateChanged(user=>{

currentUser=user

loadMessages()

})


function sendMessage(){

let text=document.getElementById("message").value

db.collection("messages").add({

from:currentUser.uid,
text:text,
time:Date.now()

})

document.getElementById("message").value=""

}


function sendImage(){

let img=document.getElementById("imageUrl").value

db.collection("messages").add({

from:currentUser.uid,
image:img,
time:Date.now()

})

document.getElementById("imageUrl").value=""

}


let recorder
let audioChunks=[]

function startRecording(){

navigator.mediaDevices.getUserMedia({audio:true})
.then(stream=>{

recorder=new MediaRecorder(stream)

recorder.start()

recorder.ondataavailable=e=>{

audioChunks.push(e.data)

}

})

}

function stopRecording(){

recorder.stop()

recorder.onstop=e=>{

let blob=new Blob(audioChunks)

let url=URL.createObjectURL(blob)

db.collection("messages").add({

from:currentUser.uid,
voice:url,
time:Date.now()

})

audioChunks=[]

}

}


function loadMessages(){

db.collection("messages")
.orderBy("time")
.onSnapshot(snapshot=>{

document.getElementById("messages").innerHTML=""

snapshot.forEach(doc=>{

let data=doc.data()

let div=document.createElement("div")

div.className="msg"

if(data.text){

div.innerText=data.text

}

if(data.image){

div.innerHTML="<img src='"+data.image+"'>"

}

if(data.voice){

div.innerHTML="<audio controls src='"+data.voice+"'></audio>"

}

document.getElementById("messages").appendChild(div)

})

})

}

</script>

</body>

</html>
