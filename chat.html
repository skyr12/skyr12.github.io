<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title><style>

body{
font-family:Arial;
margin:0;
background:#f2f2f2;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
text-align:center;
font-size:18px;
}

.chatbox{
height:70vh;
overflow-y:auto;
padding:10px;
}

.msg{
background:white;
padding:10px;
border-radius:10px;
margin:8px;
max-width:70%;
}

.me{
background:#ff4d6d;
color:white;
margin-left:auto;
}

.inputbox{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:white;
border-top:1px solid #ddd;
}

.inputbox input{
flex:1;
padding:12px;
border:none;
font-size:16px;
}

.inputbox button{
background:#ff4d6d;
color:white;
border:none;
padding:12px 20px;
font-size:16px;
}

</style></head><body><div class="header">💬 Chat</div><div id="chatbox" class="chatbox"></div><div class="inputbox">
<input id="msg" placeholder="Type message...">
<button onclick="send()">Send</button>
</div><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script><script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh",
storageBucket:"nimeh-gomsodeh.firebasestorage.app",
messagingSenderId:"815930956932",
appId:"1:815930956932:web:e8696a6a69b4458fd936d1"

};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig)
}

const db=firebase.firestore()

const urlParams=new URLSearchParams(window.location.search)
const otherId=urlParams.get("id")

let myId=""



firebase.auth().onAuthStateChanged(user=>{

if(!user){

location.href="login.html"
return

}

myId=user.uid

loadMessages()

})



function chatId(a,b){

return a<b ? a+"_"+b : b+"_"+a

}



function send(){

let text=document.getElementById("msg").value

if(!text) return

let cid=chatId(myId,otherId)

db.collection("messages").add({

chat:cid,
from:myId,
text:text,
time:Date.now()

})

document.getElementById("msg").value=""

}



function loadMessages(){

let cid=chatId(myId,otherId)

db.collection("messages")
.where("chat","==",cid)
.orderBy("time")
.onSnapshot(snapshot=>{

let html=""

snapshot.forEach(doc=>{

let m=doc.data()

let cls=m.from===myId ? "msg me" : "msg"

html+=`<div class="${cls}">${m.text}</div>`

})

document.getElementById("chatbox").innerHTML=html

document.getElementById("chatbox").scrollTop=999999

})

}

</script></body>
</html>
