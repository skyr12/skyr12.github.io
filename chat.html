<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#f5f5f5;
}

.chatbox{
height:80vh;
overflow:auto;
padding:10px;
}

.message{
background:white;
padding:10px;
margin:5px;
border-radius:10px;
width:fit-content;
}

.me{
background:#ff4d4d;
color:white;
margin-left:auto;
}

.inputbox{
position:fixed;
bottom:0;
width:100%;
display:flex;
}

input{
flex:1;
padding:15px;
border:none;
}

button{
padding:15px;
background:red;
color:white;
border:none;
}

</style>

</head>

<body>

<div class="chatbox" id="chat"></div>

<div class="inputbox">

<input id="msg" placeholder="Type message">
<button onclick="send()">Send</button>

</div>

<script>

const firebaseConfig = {
apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.firebasestorage.app",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.firestore();

let currentUser=null;

firebase.auth().onAuthStateChanged((user)=>{

currentUser=user;

loadMessages();

})

function send(){

let text=document.getElementById("msg").value;

db.collection("messages").add({

text:text,
user:currentUser.uid,
time:Date.now()

})

document.getElementById("msg").value="";

}

function loadMessages(){

db.collection("messages")
.orderBy("time")
.onSnapshot((snapshot)=>{

let html="";

snapshot.forEach((doc)=>{

let m=doc.data();

let cls=m.user==currentUser.uid ? "message me":"message";

html+=`<div class="${cls}">${m.text}</div>`;

})

document.getElementById("chat").innerHTML=html;

})

}

</script>

</body>
</html>
