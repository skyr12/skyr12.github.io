<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Chat</title><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
text-align:center;
font-size:20px;
}

.chat{
padding:15px;
height:70vh;
overflow:auto;
}

.message{
background:white;
padding:10px;
border-radius:10px;
margin-bottom:10px;
max-width:70%;
}

.me{
background:#ff4d6d;
color:white;
margin-left:auto;
}

.input{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
padding:10px;
}

input{
flex:1;
padding:10px;
border:1px solid #ccc;
border-radius:10px;
}

button{
margin-left:10px;
padding:10px 20px;
background:#ff4d6d;
color:white;
border:none;
border-radius:10px;
}

</style></head><body><div class="header">Chat

</div><div id="chat" class="chat"></div><div class="input"><input id="msg" placeholder="Type message"><button onclick="send()">Send</button>

</div><script>

const firebaseConfig = {

apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh"

}

firebase.initializeApp(firebaseConfig)

const db = firebase.firestore()

let matchId = new URLSearchParams(location.search).get("match")

firebase.auth().onAuthStateChanged(user=>{

if(!user){

window.location="login.html"

}

loadMessages()

})

function loadMessages(){

db.collection("messages")

.where("match","==",matchId)

.orderBy("time")

.onSnapshot(snapshot=>{

let html=""

let user=firebase.auth().currentUser

snapshot.forEach(doc=>{

let m=doc.data()

let cls="message"

if(m.from===user.uid){

cls+=" me"

}

html+=`<div class="${cls}">${m.text}</div>`

})

document.getElementById("chat").innerHTML=html

})

}

function send(){

let text=document.getElementById("msg").value

let user=firebase.auth().currentUser

db.collection("messages").add({

match:matchId,
from:user.uid,
text:text,
time:Date.now()

})

document.getElementById("msg").value=""

}

</script></body></html>
