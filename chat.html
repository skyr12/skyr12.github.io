<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
padding-bottom:100px;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
text-align:center;
font-size:20px;
}

#messages{
padding:15px;
}

.msg{
background:white;
margin:10px;
padding:10px;
border-radius:10px;
max-width:70%;
}

.me{
background:#ff4d6d;
color:white;
margin-left:auto;
}

.inputBox{
position:fixed;
bottom:70px;
width:100%;
display:flex;
background:white;
}

input{
flex:1;
padding:15px;
border:none;
outline:none;
}

button{
padding:15px;
border:none;
background:#ff4d6d;
color:white;
}

.navbar{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:15px;
box-shadow:0 -5px 15px rgba(0,0,0,0.2);
}

.navbar a{
font-size:24px;
text-decoration:none;
color:black;
}

</style>

</head>

<body>

<div class="header">
💬 Chat
</div>

<div id="messages"></div>

<div class="inputBox">

<input id="text" placeholder="Type message...">

<button onclick="send()">Send</button>

</div>


<div class="navbar">

<a href="discover.html">🔥</a>

<a href="matches.html">❤️</a>

<a href="chat.html">💬</a>

<a href="notifications.html">🔔</a>

<a href="profile.html">👤</a>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>


<script>

const firebaseConfig = {
  apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
  authDomain: "nimeh-gomsodeh.firebaseapp.com",
  projectId: "nimeh-gomsodeh",
  storageBucket: "nimeh-gomsodeh.firebasestorage.app",
  messagingSenderId: "815930956932",
  appId: "1:815930956932:web:e8696a6a69b4458fd936d1",
  measurementId: "G-KTCV2B5R9L"
};

firebase.initializeApp(firebaseConfig)

const db = firebase.firestore()

let currentUser

firebase.auth().onAuthStateChanged(user=>{

if(!user){

location.href="login.html"

return

}

currentUser=user.uid

loadMessages()

})


function send(){

let text=document.getElementById("text").value

if(text==="") return

db.collection("messages").add({

user:currentUser,

text:text,

time:Date.now()

})

document.getElementById("text").value=""

}


function loadMessages(){

db.collection("messages")
.orderBy("time")
.onSnapshot(snapshot=>{

let box=document.getElementById("messages")

box.innerHTML=""

snapshot.forEach(doc=>{

let m=doc.data()

let div=document.createElement("div")

div.className="msg"

if(m.user===currentUser){

div.classList.add("me")

}

div.innerText=m.text

box.appendChild(div)

})

})

}

</script>

</body>

</html>
