<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Chat</title><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
display:flex;
flex-direction:column;
height:100vh;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
text-align:center;
font-size:20px;
}

.messages{
flex:1;
overflow-y:auto;
padding:10px;
}

.message{
background:white;
padding:10px;
border-radius:10px;
margin:5px 0;
max-width:70%;
}

.me{
background:#ff4d6d;
color:white;
margin-left:auto;
}

.input{
display:flex;
padding:10px;
background:white;
}

input{
flex:1;
padding:10px;
border-radius:20px;
border:1px solid #ccc;
}

button{
margin-left:10px;
padding:10px 20px;
background:#ff4d6d;
color:white;
border:none;
border-radius:20px;
}

</style></head><body><div class="header">Chat

</div><div class="messages" id="messages"></div><div class="input"><input id="text" placeholder="Type message"><button onclick="send()">Send</button>

</div><script>

const firebaseConfig = {

apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh"

}

firebase.initializeApp(firebaseConfig)

const db = firebase.firestore()

let chatId = new URLSearchParams(window.location.search).get("chat")

firebase.auth().onAuthStateChanged(user=>{

if(!user){
window.location="login.html"
return
}

loadMessages(user.uid)

})

function loadMessages(uid){

db.collection("messages")
.where("chat","==",chatId)
.orderBy("time")
.onSnapshot(snapshot=>{

let box=document.getElementById("messages")
box.innerHTML=""

snapshot.forEach(doc=>{

let m=doc.data()

let div=document.createElement("div")

div.className="message"

if(m.from==uid){

div.classList.add("me")

}

div.innerText=m.text

box.appendChild(div)

})

})

}

function send(){

let user=firebase.auth().currentUser
let text=document.getElementById("text").value

if(text=="") return

db.collection("messages").add({

chat:chatId,
from:user.uid,
text:text,
time:Date.now()

})

document.getElementById("text").value=""

}

</script></body></html>
