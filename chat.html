<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>چت</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#020617;
color:white;
display:flex;
flex-direction:column;
height:100vh;
}

.header{
background:#111;
padding:15px;
text-align:center;
}

.messages{
flex:1;
overflow-y:auto;
padding:20px;
}

.msg{
background:#FF4D6D;
padding:10px 15px;
border-radius:15px;
margin:10px 0;
width:fit-content;
max-width:70%;
}

.inputBox{
display:flex;
padding:10px;
background:#111;
}

input{
flex:1;
padding:10px;
border:none;
border-radius:20px;
}

button{
margin-left:10px;
background:#FF4D6D;
border:none;
padding:10px 15px;
border-radius:20px;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<div class="header">

💬 چت

</div>

<div class="messages" id="messages"></div>

<div class="inputBox">

<input id="text" placeholder="پیام بنویس...">

<button onclick="send()">ارسال</button>

</div>

<script>

let index = localStorage.getItem("chatIndex")

let chats = JSON.parse(localStorage.getItem("chats")) || {}

if(!chats[index]){

chats[index] = []

}

function show(){

let html=""

chats[index].forEach(m=>{

html+=`<div class="msg">${m}</div>`

})

document.getElementById("messages").innerHTML=html

}

show()

function send(){

let text=document.getElementById("text").value

if(text==="") return

chats[index].push(text)

localStorage.setItem("chats",JSON.stringify(chats))

document.getElementById("text").value=""

show()

}

</script>

</body>

</html>
