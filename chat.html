<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
padding-bottom:80px;
}

.header{
background:#ff4d6d;
color:white;
padding:20px;
text-align:center;
font-size:22px;
}

.chat-box{
height:400px;
overflow-y:auto;
padding:20px;
}

.message{
background:white;
padding:10px;
margin:10px 0;
border-radius:10px;
max-width:70%;
}

.me{
background:#ff4d6d;
color:white;
margin-left:auto;
}

.input-area{
position:fixed;
bottom:70px;
width:100%;
display:flex;
}

input{
flex:1;
padding:15px;
border:none;
}

button{
padding:15px;
border:none;
background:#ff4d6d;
color:white;
}

.navbar{
position:fixed;
bottom:0;
left:0;
width:100%;
height:70px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -5px 15px rgba(0,0,0,0.2);
}

.navbar a{
text-decoration:none;
font-size:26px;
}

</style>

</head>

<body>

<div class="header">
Chat 💬
</div>

<div class="chat-box" id="chatBox"></div>

<div class="input-area">

<input id="messageInput" placeholder="Type message...">

<button onclick="sendMessage()">Send</button>

</div>

<div class="navbar">

<a href="discover.html">🔥</a>

<a href="matches.html">❤️</a>

<a href="chat.html">💬</a>

<a href="notifications.html">🔔</a>

<a href="profile.html">👤</a>

</div>

<script>

function sendMessage(){

let input=document.getElementById("messageInput")

let text=input.value

if(text=="") return

let chat=document.getElementById("chatBox")

let msg=document.createElement("div")

msg.className="message me"

msg.innerText=text

chat.appendChild(msg)

input.value=""

chat.scrollTop=chat.scrollHeight

}

</script>

</body>

</html>
