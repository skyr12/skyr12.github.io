<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat</title>

<style>

body{
font-family:Arial;
background:#f3f3f3;
}

#messages{
height:70vh;
overflow:auto;
padding:20px;
}

.message{
background:white;
padding:10px;
margin:10px;
border-radius:10px;
max-width:70%;
}

.me{
background:#ff4d6d;
color:white;
margin-left:auto;
}

input{
width:70%;
padding:10px;
border-radius:20px;
border:none;
}

button{
padding:10px 20px;
border:none;
background:#ff4d6d;
color:white;
border-radius:20px;
}

</style>

</head>

<body>

<h2 style="text-align:center;">Chat</h2>

<div id="messages"></div>

<div style="text-align:center">

<input id="msg" placeholder="Type message">

<button onclick="sendMessage()">Send</button>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.firebasestorage.app",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

const params = new URLSearchParams(window.location.search);
const otherUser = params.get("user");

let currentUser;

firebase.auth().onAuthStateChanged(user=>{

if(user){

currentUser=user.uid;

loadMessages();

}else{

window.location.href="login.html";

}

});

function sendMessage(){

const text=document.getElementById("msg").value;

if(text=="")return;

db.collection("messages").add({

from:currentUser,
to:otherUser,
text:text,
time:Date.now()

});

document.getElementById("msg").value="";

}

function loadMessages(){

db.collection("messages")
.orderBy("time")
.onSnapshot(snapshot=>{

document.getElementById("messages").innerHTML="";

snapshot.forEach(doc=>{

const m=doc.data();

if(
(m.from==currentUser && m.to==otherUser) ||
(m.from==otherUser && m.to==currentUser)
){

const div=document.createElement("div");

div.className="message";

if(m.from==currentUser){

div.classList.add("me");

}

div.innerText=m.text;

document.getElementById("messages").appendChild(div);

}

});

});

}

</script>

</body>
</html>
