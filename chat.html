<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت | همدم</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        .chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 140px);
            background: white;
            margin: 15px;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .chat-header {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .chat-back {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
        }
        
        .chat-user {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }
        
        .chat-user img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid white;
        }
        
        .chat-user-info h3 {
            font-size: 16px;
            margin-bottom: 3px;
        }
        
        .chat-user-info p {
            font-size: 12px;
            opacity: 0.8;
        }
        
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #f5f5f5;
        }
        
        .message {
            display: flex;
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease;
        }
        
        .message.sent {
            justify-content: flex-end;
        }
        
        .message.received {
            justify-content: flex-start;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 20px;
            position: relative;
        }
        
        .message.sent .message-content {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
            border-bottom-left-radius: 5px;
        }
        
        .message.received .message-content {
            background: white;
            color: #333;
            border-bottom-right-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .message-time {
            font-size: 10px;
            margin-top: 5px;
            opacity: 0.7;
        }
        
        .chat-input {
            padding: 15px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        
        .chat-input input {
            flex: 1;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 25px;
            font-size: 14px;
        }
        
        .chat-input input:focus {
            outline: none;
            border-color: #ff4d6d;
        }
        
        .chat-send {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
            border: none;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .chat-send:hover {
            transform: scale(1.1);
        }
        
        .typing-indicator {
            padding: 10px 15px;
            color: #999;
            font-size: 12px;
            font-style: italic;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .gift-button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #fee2e2;
            color: #ff4d6d;
            border: none;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .gift-button:hover {
            background: #ff4d6d;
            color: white;
        }
    </style>
</head>

        // لود اطلاعات کاربر مقابل
        function loadChatUser() {
            if (chatUserId.startsWith('sample')) {
                // کاربر نمونه
                const sampleUsers = {
                    'sample1': { name: 'سارا محمدی', photo: 'https://randomuser.me/api/portraits/women/1.jpg', online: true },
                    'sample2': { name: 'علی رضایی', photo: 'https://randomuser.me/api/portraits/men/1.jpg', online: false },
                    'sample3': { name: 'مریم کریمی', photo: 'https://randomuser.me/api/portraits/women/2.jpg', online: true }
                };
                
                const user = sampleUsers[chatUserId] || sampleUsers['sample1'];
                document.getElementById('chatName').textContent = user.name;
                document.getElementById('chatAvatar').src = user.photo;
                document.getElementById('chatStatus').textContent = user.online ? 'آنلاین' : 'آفلاین';
                document.getElementById('chatStatus').style.color = user.online ? '#4caf50' : '#999';
            } else {
                // کاربر واقعی از Firebase
                db.collection('users').doc(chatUserId).get()
                    .then(doc => {
                        if (doc.exists) {
                            const user = doc.data();
                            document.getElementById('chatName').textContent = user.name;
                            if (user.photo) document.getElementById('chatAvatar').src = user.photo;
                            document.getElementById('chatStatus').textContent = user.online ? 'آنلاین' : 'آفلاین';
                        }
                    });
            }
        }
        
        // لود پیام‌ها
        function loadMessages() {
            if (!currentUser) return;
            
            if (unsubscribeMessages) {
                unsubscribeMessages();
            }
            
            unsubscribeMessages = db.collection('messages')
                .where('chatId', '==', getChatId(currentUser.uid, chatUserId))
                .orderBy('time', 'asc')
                .onSnapshot(snapshot => {
                    let html = '';
                    let lastMessageBy = null;
                    
                    snapshot.forEach(doc => {
                        const msg = doc.data();
                        const isMe = msg.from === currentUser.uid;
                        
                        html += `
                            <div class="message ${isMe ? 'sent' : 'received'}">
                                <div class="message-content">
                                    ${msg.text}
                                    <div class="message-time">${formatTime(msg.time)}</div>
                                </div>
                            </div>
                        `;
                        
                        lastMessageBy = msg.from;
                    });
                    
                    document.getElementById('chatMessages').innerHTML = html;
                    
                    // اسکرول به پایین
                    const messagesDiv = document.getElementById('chatMessages');
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    
                    // مارک پیام‌ها به عنوان خوانده شده
                    if (lastMessageBy === chatUserId && currentUser) {
                        markMessagesAsRead();
                    }
                });
        }
