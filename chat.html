<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
padding-bottom:80px;
}

.header{
background:#ff4d6d;
color:white;
padding:20px;
text-align:center;
font-size:22px;
}

.chat-container{
width:90%;
max-width:400px;
margin:20px auto;
background:white;
border-radius:20px;
padding:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.messages{
height:250px;
overflow-y:auto;
border:1px solid #eee;
padding:10px;
margin-bottom:10px;
}

.message{
background:#ff4d6d;
color:white;
padding:8px 12px;
border-radius:10px;
margin:5px 0;
display:inline-block;
}

input{
width:70%;
padding:10px;
border-radius:10px;
border:1px solid #ccc;
}

button{
padding:10px 20px;
background:#ff4d6d;
color:white;
border:none;
border-radius:10px;
}

.navbar{
position:fixed;
bottom:0;
left:0;
width:100%;
height:65px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -5px 15px rgba(0,0,0,0.15);
}

.navbar a{
text-decoration:none;
font-size:24px;
color:#444;
}

</style>

</head>

<body>

<div class="header">
Chat 💬
</div>

<div class="chat-container">

<div id="messages" class="messages"></div>

<input id="messageInput" placeholder="Type message">

<button onclick="sendMessage()">Send</button>

</div>

<div class="navbar">
<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="chat.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="profile.html">👤</a>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

var firebaseConfig = {

apiKey:"YOUR_API_KEY",
authDomain:"YOUR_PROJECT.firebaseapp.com",
projectId:"YOUR_PROJECT_ID"

};

firebase.initializeApp(firebaseConfig)

var db = firebase.firestore()

let currentUser="user1"

function sendMessage(){

let text=document.getElementById("messageInput").value

db.collection("messages").add({

user:currentUser,
text:text,
time:Date.now()

})

document.getElementById("messageInput").value=""

}

function loadMessages(){

db.collection("messages")
.orderBy("time")
.onSnapshot(snapshot=>{

let html=""

snapshot.forEach(doc=>{

let data=doc.data()

html+=`<div class="message">${data.user}: ${data.text}</div>`

})

document.getElementById("messages").innerHTML=html

})

}

loadMessages()

</script>

</body>
</html>
