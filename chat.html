<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title><style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
text-align:center;
font-size:20px;
}

#messages{
height:65vh;
overflow-y:auto;
padding:10px;
}

.msg{
background:white;
padding:10px;
margin:5px;
border-radius:10px;
width:60%;
}

.me{
background:#ff4d6d;
color:white;
margin-left:auto;
}

.input{
position:fixed;
bottom:60px;
width:100%;
background:white;
padding:10px;
display:flex;
}

.input input{
flex:1;
padding:10px;
border-radius:20px;
border:1px solid #ccc;
}

.input button{
background:#ff4d6d;
color:white;
border:none;
padding:10px 20px;
margin-left:5px;
border-radius:20px;
}

.call{
margin-top:10px;
text-align:center;
}

.call button{
background:#2196f3;
color:white;
border:none;
padding:10px 20px;
border-radius:25px;
}

.navbar{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
font-size:22px;
}

.navbar a{
text-decoration:none;
}

</style></head><body><div class="header">💬 Chat</div><div class="call"><a id="callBtn">
<button>🎥 Video Call</button>
</a></div><div id="messages"></div><div class="input"><input id="text" placeholder="Type message..."><button onclick="send()">Send</button>

</div><div class="navbar"><a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="inbox.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="visitors.html">👁️</a>
<a href="profile.html">👤</a>

</div><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script><script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh",
storageBucket:"nimeh-gomsodeh.firebasestorage.app",
messagingSenderId:"815930956932",
appId:"1:815930956932:web:e8696a6a69b4458fd936d1"

};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig)
}

const db=firebase.firestore()

const urlParams=new URLSearchParams(window.location.search)

const otherId=urlParams.get("id")

let myId=""

document.getElementById("callBtn").href="videocall.html?id="+otherId


firebase.auth().onAuthStateChanged(user=>{

if(!user){

location.href="login.html"
return

}

myId=user.uid

loadMessages()

})


function loadMessages(){

db.collection("messages")
.orderBy("time")
.onSnapshot(snapshot=>{

let html=""

snapshot.forEach(doc=>{

let m=doc.data()

if(

(m.from===myId && m.to===otherId) ||

(m.from===otherId && m.to===myId)

){

let cls = m.from===myId ? "msg me" : "msg"

html+=`

<div class="${cls}">

${m.text}

</div>

`

}

})

document.getElementById("messages").innerHTML=html

})

}


function send(){

let text=document.getElementById("text").value

if(!text) return

db.collection("messages").add({

from:myId,
to:otherId,
text:text,
time:Date.now()

})

document.getElementById("text").value=""

}

</script></body>
</html>
