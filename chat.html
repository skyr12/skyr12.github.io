<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت | نیمه گمشده</title>
    <link href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Vazir, sans-serif;
        }

        body {
            background: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: white;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            border-bottom: 1px solid #eef2f6;
        }

        .back-btn {
            font-size: 1.5rem;
            color: #6b7280;
            cursor: pointer;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex: 1;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #10b981;
        }

        .user-details h3 {
            font-size: 1rem;
            color: #1f2937;
        }

        .user-details p {
            font-size: 0.8rem;
            color: #6b7280;
        }

        .online {
            color: #10b981;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 75%;
            display: flex;
            flex-direction: column;
        }

        .message.sent {
            align-self: flex-end;
        }

        .message.received {
            align-self: flex-start;
        }

        .bubble {
            padding: 0.8rem 1.2rem;
            border-radius: 1.5rem;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .sent .bubble {
            background: #10b981;
            color: white;
            border-bottom-left-radius: 0.3rem;
        }

        .received .bubble {
            background: white;
            color: #1f2937;
            border: 1px solid #e5e7eb;
            border-bottom-right-radius: 0.3rem;
        }

        .time {
            font-size: 0.7rem;
            color: #9ca3af;
            margin-top: 0.2rem;
            padding: 0 0.5rem;
        }

        .sent .time {
            text-align: left;
        }

        .received .time {
            text-align: right;
        }

        .chat-footer {
            background: white;
            padding: 1rem;
            display: flex;
            gap: 0.5rem;
            border-top: 1px solid #eef2f6;
        }

        .chat-footer input {
            flex: 1;
            padding: 0.8rem 1.2rem;
            border: 1px solid #d1d5db;
            border-radius: 2rem;
            font-size: 0.95rem;
        }

        .chat-footer input:focus {
            outline: none;
            border-color: #10b981;
        }

        .chat-footer button {
            background: #10b981;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .chat-footer button:hover {
            background: #059669;
        }
    </style>
</head>
<body>
    <div class="chat-header">
        <span class="back-btn" onclick="history.back()">←</span>
        <div class="user-info">
            <img src="https://randomuser.me/api/portraits/women/1.jpg" class="avatar">
            <div class="user-details">
                <h3>سارا محمدی</h3>
                <p class="online">● آنلاین</p>
            </div>
        </div>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="message received">
            <div class="bubble">سلام! خوبی؟</div>
            <span class="time">۱۰:۲۳</span>
        </div>
        <div class="message sent">
            <div class="bubble">سلام ممنون، تو خوبی؟</div>
            <span class="time">۱۰:۲۴</span>
        </div>
        <div class="message received">
            <div class="bubble">مرسی، حالت چطوره؟</div>
            <span class="time">۱۰:۲۵</span>
        </div>
    </div>

    <div class="chat-footer">
        <input type="text" id="messageInput" placeholder="پیام شما...">
        <button onclick="sendMessage()">➤</button>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const container = document.getElementById('chatMessages');
            const now = new Date();
            const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message sent';
            msgDiv.innerHTML = `<div class="bubble">${text}</div><span class="time">${time}</span>`;
            container.appendChild(msgDiv);
            input.value = '';
            container.scrollTop = container.scrollHeight;

            // پاسخ خودکار (برای تست)
            setTimeout(() => {
                const reply = document.createElement('div');
                reply.className = 'message received';
                reply.innerHTML = `<div class="bubble">ممنون از پیامت 😊</div><span class="time">${time}</span>`;
                container.appendChild(reply);
                container.scrollTop = container.scrollHeight;
            }, 1500);
        }

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
        }
    </script>
</body>
</html>
