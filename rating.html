<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Rating</title>

<style>

body{
font-family:Arial;
background:#f3f3f3;
text-align:center;
}

.card{
background:white;
width:320px;
margin:auto;
margin-top:60px;
padding:20px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

button{
padding:10px 15px;
margin:5px;
border:none;
border-radius:10px;
cursor:pointer;
background:#ff4d6d;
color:white;
}

</style>

</head>

<body>

<div class="card">

<h2>Rate User</h2>

<p>Give a rating</p>

<button onclick="rate(1)">⭐</button>
<button onclick="rate(2)">⭐⭐</button>
<button onclick="rate(3)">⭐⭐⭐</button>
<button onclick="rate(4)">⭐⭐⭐⭐</button>
<button onclick="rate(5)">⭐⭐⭐⭐⭐</button>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.firebasestorage.app",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1"
};

firebase.initializeApp(firebaseConfig)

const db=firebase.firestore()

function rate(score){

db.collection("ratings").add({

score:score,
time:Date.now()

})

alert("Rating submitted")

}

</script>

</body>

</html>
