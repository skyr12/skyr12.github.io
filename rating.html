<!DOCTYPE html>
<html>

<head>

<title>User Rating</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
margin:0;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
font-size:20px;
}

.card{
background:white;
margin:30px;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

button{
padding:10px 20px;
margin:5px;
border:none;
border-radius:20px;
background:#ff4d6d;
color:white;
font-size:16px;
}

</style>

</head>

<body>

<div class="header">⭐ Rate User</div>

<div class="card">

<h3>Rate this user</h3>

<button onclick="rate(1)">⭐</button>
<button onclick="rate(2)">⭐⭐</button>
<button onclick="rate(3)">⭐⭐⭐</button>
<button onclick="rate(4)">⭐⭐⭐⭐</button>
<button onclick="rate(5)">⭐⭐⭐⭐⭐</button>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

var firebaseConfig = {

apiKey:"YOUR_API_KEY",
authDomain:"YOUR_DOMAIN",
projectId:"YOUR_PROJECT"

}

firebase.initializeApp(firebaseConfig)

let db=firebase.firestore()

function rate(stars){

let user=firebase.auth().currentUser

if(!user) return

db.collection("ratings").add({

from:user.uid,
stars:stars,
time:Date.now()

})

alert("Rating submitted ⭐")

}

</script>

</body>

</html>
