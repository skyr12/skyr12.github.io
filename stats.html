<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Stats</title>

<style>

body{
font-family:Arial;
background:#f3f3f3;
text-align:center;
}

.card{
background:white;
width:320px;
margin:auto;
margin-top:20px;
padding:20px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.number{
font-size:28px;
color:#ff4d6d;
}

</style>

</head>

<body>

<h2>Website Statistics</h2>

<div class="card">
<p>Total Users</p>
<div class="number" id="users">0</div>
</div>

<div class="card">
<p>Total Likes</p>
<div class="number" id="likes">0</div>
</div>

<div class="card">
<p>Total Matches</p>
<div class="number" id="matches">0</div>
</div>

<div class="card">
<p>Total Reports</p>
<div class="number" id="reports">0</div>
</div>


<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.firebasestorage.app",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1"
};

firebase.initializeApp(firebaseConfig)

const db = firebase.firestore()

function loadStats(){

db.collection("users").get().then(s=>{
document.getElementById("users").innerText=s.size
})

db.collection("likes").get().then(s=>{
document.getElementById("likes").innerText=s.size
})

db.collection("matches").get().then(s=>{
document.getElementById("matches").innerText=s.size
})

db.collection("reports").get().then(s=>{
document.getElementById("reports").innerText=s.size
})

}

loadStats()

</script>

</body>

</html>
