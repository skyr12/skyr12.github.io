<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ديسکاور | نیمه گمشده</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f5f5f5;
            min-height: 100vh;
            padding-bottom: 70px;
        }

        /* هدر */
        .header {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
        }

        /* کانتینر اصلی */
        .discover-container {
            max-width: 400px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* کارت پروفایل */
        .profile-card {
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            animation: slideIn 0.5s ease;
            position: relative;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* عکس کاربر */
        .profile-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-bottom: 3px solid #ff4d6d;
        }

        /* اطلاعات کاربر */
        .profile-info {
            padding: 20px;
        }

        .name-age {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .name {
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }

        .age {
            font-size: 20px;
            color: #ff4d6d;
            background: #ffe5e9;
            padding: 5px 15px;
            border-radius: 20px;
        }

        .location {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #666;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .bio {
            color: #444;
            line-height: 1.6;
            margin-bottom: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 15px;
        }

        /* علاقه‌مندی‌ها */
        .interests {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .interest-tag {
            background: linear-gradient(135deg, #ff4d6d20, #ff8a5c20);
            color: #ff4d6d;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        /* دکمه‌های اقدام */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .action-btn {
            flex: 1;
            height: 60px;
            border: none;
            border-radius: 30px;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .dislike-btn {
            background: white;
            color: #ff4d6d;
            border: 2px solid #ff4d6d;
        }

        .dislike-btn:hover {
            background: #ff4d6d;
            color: white;
            transform: scale(1.05);
        }

        .like-btn {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
        }

        .like-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 77, 109, 0.4);
        }

        .superlike-btn {
            background: linear-gradient(135deg, #4a90e2, #357abd);
            color: white;
        }

        /* لودینگ */
        .loading {
            text-align: center;
            padding: 50px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f0f0f0;
            border-top: 4px solid #ff4d6d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* خطا */
        .error-state {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .error-emoji {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .retry-btn {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
        }

        /* نوار پایین */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #ddd;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.05);
        }

        .nav-item {
            text-decoration: none;
            font-size: 24px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #666;
        }

        .nav-item.active {
            background: #ff4d6d20;
            color: #ff4d6d;
        }

        /* حالت خالی */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 25px;
        }

        .empty-emoji {
            font-size: 80px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        🔥 ديسکاور
    </div>

    <div class="discover-container" id="discoverContainer">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>در حال پیدا کردن کاربران جدید...</p>
        </div>
    </div>

    <div class="navbar">
        <a href="discover.html" class="nav-item active">🔥</a>
        <a href="matches.html" class="nav-item">❤️</a>
        <a href="inbox.html" class="nav-item">💬</a>
        <a href="notifications.html" class="nav-item">🔔</a>
        <a href="visitors.html" class="nav-item">👁️</a>
        <a href="profile.html" class="nav-item">👤</a>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // تنظیمات Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
            authDomain: "nimeh-gomsodeh.firebaseapp.com",
            projectId: "nimeh-gomsodeh",
            storageBucket: "nimeh-gomsodeh.firebasestorage.app",
            messagingSenderId: "815930956932",
            appId: "1:815930956932:web:e8696a6a69b4458fd936d1"
        };

        // راه‌اندازی Firebase
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
                console.log("✅ Firebase راه‌اندازی شد");
            }
        } catch (error) {
            console.error("❌ خطا در راه‌اندازی Firebase:", error);
        }

        const db = firebase.firestore();
        let currentUser = null;
        let currentIndex = 0;
        let users = [];

        // بررسی احراز هویت
        firebase.auth().onAuthStateChanged(user => {
            if (!user) {
                console.log("❌ کاربر وارد نشده، انتقال به صفحه login");
                location.href = "login.html";
                return;
            }

            console.log("✅ کاربر وارد شد:", user.uid);
            currentUser = user;
            loadDiscoverUsers();
        });

        // بارگذاری کاربران
        function loadDiscoverUsers() {
            console.log("📥 در حال بارگذاری کاربران...");
            
            // نمایش لودینگ
            document.getElementById('discoverContainer').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>در حال پیدا کردن کاربران جدید...</p>
                </div>
            `;

            // دریافت کاربران از Firebase
            db.collection("users")
                .where("uid", "!=", currentUser.uid) // غیر از خود کاربر
                .limit(10)
                .get()
                .then(snapshot => {
                    console.log("📊 تعداد کاربران دریافت شده:", snapshot.size);
                    
                    if (snapshot.empty) {
                        showEmptyState();
                        return;
                    }

                    users = [];
                    snapshot.forEach(doc => {
                        users.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });

                    console.log("👥 کاربران:", users);
                    showNextUser();
                })
                .catch(error => {
                    console.error("❌ خطا در دریافت کاربران:", error);
                    showError(error.message);
                });
        }

        // نمایش کاربر بعدی
        function showNextUser() {
            if (currentIndex >= users.length) {
                showEmptyState();
                return;
            }

            const user = users[currentIndex];
            console.log("👤 نمایش کاربر:", user.name);

            // سن تصادفی (برای تست)
            const age = Math.floor(Math.random() * (35 - 18) + 18);
            
            // عکس پیش‌فرض اگر نبود
            const photoUrl = user.photo || `https://ui-avatars.com/api/?name=${user.name || 'User'}&size=400&background=ff4d6d&color=fff`;

            const html = `
                <div class="profile-card">
                    <img src="${photoUrl}" class="profile-image" alt="${user.name}" onerror="this.src='https://ui-avatars.com/api/?name=User&size=400&background=ff4d6d&color=fff'">
                    
                    <div class="profile-info">
                        <div class="name-age">
                            <span class="name">${user.name || 'کاربر'}</span>
                            <span class="age">${age}</span>
                        </div>
                        
                        <div class="location">
                            <span>📍</span>
                            <span>${user.city || 'تهران'}</span>
                        </div>
                        
                        <div class="bio">
                            ${user.bio || 'عاشق سفر، موسیقی و تکنولوژی | دنبال دوستان جدید برای ماجراجویی'}
                        </div>
                        
                        <div class="interests">
                            <span class="interest-tag">🎵 موسیقی</span>
                            <span class="interest-tag">✈️ سفر</span>
                            <span class="interest-tag">📚 کتاب</span>
                            <span class="interest-tag">🎮 بازی</span>
                        </div>
                        
                        <div class="action-buttons">
                            <button class="action-btn dislike-btn" onclick="handleAction('dislike', '${user.id}')">✕</button>
                            <button class="action-btn like-btn" onclick="handleAction('like', '${user.id}')">❤️</button>
                            <button class="action-btn superlike-btn" onclick="handleAction('superlike', '${user.id}')">⭐</button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('discoverContainer').innerHTML = html;
        }

        // مدیریت اقدامات (لایک/دیسلایک)
        function handleAction(action, userId) {
            console.log(`🎯 ${action} روی کاربر ${userId}`);

            // ذخیره در Firebase
            db.collection(action + 's').add({
                from: currentUser.uid,
                to: userId,
                time: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                console.log("✅ ذخیره شد");
                
                // بررسی تطابق (اگر لایک بود)
                if (action === 'like') {
                    checkMatch(userId);
                }

                // رفتن به کاربر بعدی
                currentIndex++;
                showNextUser();
            })
            .catch(error => {
                console.error("❌ خطا:", error);
                // حتی با خطا هم برو بعدی
                currentIndex++;
                showNextUser();
            });
        }

        // بررسی تطابق
        function checkMatch(userId) {
            db.collection("likes")
                .where("from", "==", userId)
                .where("to", "==", currentUser.uid)
                .get()
                .then(snapshot => {
                    if (!snapshot.empty) {
                        // تطابق وجود داره
                        db.collection("matches").add({
                            users: [currentUser.uid, userId],
                            time: firebase.firestore.FieldValue.serverTimestamp()
                        })
                        .then(() => {
                            alert("💕 تطابق جدید! باهم صحبت کنید.");
                        });
                    }
                });
        }

        // نمایش حالت خالی
        function showEmptyState() {
            document.getElementById('discoverContainer').innerHTML = `
                <div class="empty-state">
                    <div class="empty-emoji">😢</div>
                    <h3>کاربری پیدا نشد</h3>
                    <p>بعداً دوباره امتحان کن</p>
                    <button class="retry-btn" onclick="loadDiscoverUsers()">تلاش مجدد</button>
                </div>
            `;
        }

        // نمایش خطا
        function showError(message) {
            document.getElementById('discoverContainer').innerHTML = `
                <div class="error-state">
                    <div class="error-emoji">❌</div>
                    <h3>خطا در بارگذاری</h3>
                    <p>${message || 'لطفاً دوباره تلاش کنید'}</p>
                    <button class="retry-btn" onclick="location.reload()">تلاش مجدد</button>
                </div>
            `;
        }

        // برای تست: اضافه کردن کاربر تستی
        window.addTestUser = function() {
            db.collection("users").add({
                name: "سارا احمدی",
                city: "تهران",
                bio: "عاشق سفر و عکاسی 📸",
                photo: "https://randomuser.me/api/portraits/women/1.jpg",
                uid: "test" + Date.now()
            })
            .then(() => {
                console.log("✅ کاربر تستی اضافه شد");
                loadDiscoverUsers();
            });
        };

        console.log("🚀 صفحه دیسکاور آماده است");
    </script>

    <!-- دکمه تست (برای اضافه کردن کاربر) -->
    <div style="position: fixed; bottom: 80px; right: 10px; z-index: 1000;">
        <button onclick="addTestUser()" style="background: #ff4d6d; color: white; border: none; width: 50px; height: 50px; border-radius: 50%; font-size: 24px; cursor: pointer;">➕</button>
    </div>
</body>
</html>
