<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پروفایل</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#020617;
color:white;
text-align:center;
padding:30px;
}

.card{
background:#111;
padding:30px;
border-radius:20px;
width:320px;
margin:auto;
}

.avatar{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
margin-bottom:15px;
}

.gallery{
display:flex;
justify-content:center;
gap:10px;
margin-top:20px;
}

.gallery img{
width:80px;
height:80px;
border-radius:10px;
object-fit:cover;
}

</style>

</head>

<body>

<div class="card">

<img id="avatar" class="avatar">

<h2 id="name"></h2>

<p id="city"></p>

<p id="bio"></p>

<div class="gallery">

<img id="g1">

<img id="g2">

<img id="g3">

</div>

</div>

<script>

let users = JSON.parse(localStorage.getItem("users")) || []

if(users.length>0){

let u = users[users.length-1]

document.getElementById("avatar").src=u.photo

document.getElementById("name").innerText=u.name

document.getElementById("city").innerText=u.city

document.getElementById("bio").innerText=u.bio

document.getElementById("g1").src=u.photo

document.getElementById("g2").src=u.photo

document.getElementById("g3").src=u.photo

}

</script>

</body>

</html>
