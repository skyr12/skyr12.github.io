<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پروفایل من | نیمه گمشده</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* هدر با افکت شیشه‌ای */
        .profile-header {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            height: 200px;
            position: relative;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.3);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .header-content h2 {
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-btn {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .settings-btn:hover {
            transform: rotate(90deg);
            background: rgba(255, 255, 255, 0.3);
        }

        /* آواتار */
        .avatar-container {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        .avatar-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto;
        }

        #photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        #photo:hover {
            transform: scale(1.05);
        }

        .online-badge {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 15px;
            height: 15px;
            background: #4caf50;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .edit-avatar {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 35px;
            height: 35px;
            background: #ff4d6d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            transition: all 0.3s ease;
        }

        .edit-avatar:hover {
            transform: scale(1.1);
            background: #ff8a5c;
        }

        /* اطلاعات اصلی */
        .profile-info {
            margin-top: 70px;
            text-align: center;
            padding: 20px;
        }

        #name {
            font-size: 28px;
            font-weight: 700;
            color: white;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .user-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 15px;
            border-radius: 20px;
            color: white;
            font-size: 14px;
            backdrop-filter: blur(10px);
            margin: 10px 0;
        }

        .location-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            margin: 15px 0;
        }

        .location-info span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* آمار */
        .stats-grid {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background: white;
            margin: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        /* بخش‌های مختلف */
        .sections {
            padding: 0 20px;
        }

        .section-title {
            color: white;
            font-size: 18px;
            font-weight: 600;
            margin: 20px 0 10px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .about-card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
        }

        #bio {
            color: #666;
            line-height: 1.6;
            margin: 10px 0;
        }

        .interests {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }

        .interest-tag {
            background: linear-gradient(135deg, #667eea20, #764ba220);
            color: #667eea;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* گالری عکس */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
        }

        .gallery-item {
            aspect-ratio: 1;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .add-photo {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
        }

        /* دکمه‌های اقدام */
        .action-buttons {
            display: flex;
            gap: 15px;
            padding: 20px;
        }

        .primary-btn {
            flex: 1;
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 77, 109, 0.4);
        }

        .secondary-btn {
            flex: 1;
            background: white;
            color: #ff4d6d;
            border: 2px solid #ff4d6d;
            padding: 15px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .secondary-btn:hover {
            background: #ff4d6d;
            color: white;
        }

        /* نوار پایین */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.05);
            z-index: 1000;
        }

        .nav-item {
            text-decoration: none;
            font-size: 24px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
            color: #666;
            position: relative;
        }

        .nav-item.active {
            background: linear-gradient(135deg, #ff4d6d20, #ff8a5c20);
            color: #ff4d6d;
            transform: translateY(-5px);
        }

        .nav-badge {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #ff4d6d;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }

        /* مودال ویرایش */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 400px;
            border-radius: 30px;
            padding: 25px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 20px;
            color: #333;
        }

        .close-modal {
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .modal-input:focus {
            outline: none;
            border-color: #ff4d6d;
        }

        .save-btn {
            width: 100%;
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="profile-header">
        <div class="header-content">
            <h2>
                <span>👤</span>
                پروفایل من
            </h2>
            <div class="settings-btn" onclick="openSettings()">⚙️</div>
        </div>
        
        <div class="avatar-container">
            <div class="avatar-wrapper">
                <img id="photo" src="https://via.placeholder.com/150" alt="profile">
                <div class="online-badge" id="onlineStatus"></div>
                <div class="edit-avatar" onclick="changePhoto()">📷</div>
            </div>
        </div>
    </div>

    <div class="profile-info">
        <h2 id="name">...</h2>
        <div class="user-badge">
            <span>⭐</span>
            <span>کاربر ویژه</span>
        </div>
        
        <div class="location-info">
            <span id="city">📍 در حال تشخیص...</span>
            <span id="age">🎂 ۲۵ سال</span>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-item">
            <div class="stat-number" id="visitorsCount">۰</div>
            <div class="stat-label">بازدید</div>
        </div>
        <div class="stat-item">
            <div class="stat-number" id="likesCount">۰</div>
            <div class="stat-label">لایک</div>
        </div>
        <div class="stat-item">
            <div class="stat-number" id="matchesCount">۰</div>
            <div class="stat-label">تطابق</div>
        </div>
        <div class="stat-item">
            <div class="stat-number" id="coinsCount">۰</div>
            <div class="stat-label">سکه</div>
        </div>
    </div>

    <div class="sections">
        <div class="section-title">
            <span>📝</span>
            درباره من
        </div>
        <div class="about-card">
            <p id="bio">علاقه‌مند به سفر، موسیقی و تکنولوژی. دنبال دوستان جدید برای ماجراجویی‌های جذاب!</p>
            
            <div class="interests">
                <span class="interest-tag">🎵 موسیقی</span>
                <span class="interest-tag">✈️ سفر</span>
                <span class="interest-tag">📚 کتاب</span>
                <span class="interest-tag">🎮 بازی</span>
                <span class="interest-tag">⚽ ورزش</span>
                <span class="interest-tag">🍿 فیلم</span>
            </div>
        </div>

        <div class="section-title">
            <span>📸</span>
            گالری عکس
        </div>
        <div class="photo-grid">
            <div class="gallery-item">
                <img src="https://via.placeholder.com/150" alt="photo 1">
            </div>
            <div class="gallery-item">
                <img src="https://via.placeholder.com/150" alt="photo 2">
            </div>
            <div class="gallery-item add-photo" onclick="addPhoto()">
                +
            </div>
        </div>
    </div>

    <div class="action-buttons">
        <button class="primary-btn" onclick="boost()">
            <span>🔥</span>
            بوست پروفایل
        </button>
        <button class="secondary-btn" onclick="editProfile()">
            <span>✏️</span>
            ویرایش
        </button>
    </div>

    <div class="navbar">
        <a href="discover.html" class="nav-item">🔥</a>
        <a href="matches.html" class="nav-item">❤️</a>
        <a href="inbox.html" class="nav-item">💬</a>
        <a href="notifications.html" class="nav-item">🔔</a>
        <a href="visitors.html" class="nav-item">👁️</a>
        <a href="profile.html" class="nav-item active">👤</a>
    </div>

    <!-- مودال ویرایش -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>ویرایش پروفایل</h3>
                <span class="close-modal" onclick="closeModal()">&times;</span>
            </div>
            <input type="text" class="modal-input" id="editName" placeholder="نام">
            <input type="text" class="modal-input" id="editCity" placeholder="شهر">
            <textarea class="modal-input" id="editBio" placeholder="درباره من" rows="3"></textarea>
            <button class="save-btn" onclick="saveProfile()">ذخیره تغییرات</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
            authDomain: "nimeh-gomsodeh.firebaseapp.com",
            projectId: "nimeh-gomsodeh",
            storageBucket: "nimeh-gomsodeh.firebasestorage.app",
            messagingSenderId: "815930956932",
            appId: "1:815930956932:web:e8696a6a69b4458fd936d1"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.firestore();
        let currentUser = null;

        // بررسی احراز هویت
        firebase.auth().onAuthStateChanged(user => {
            if (!user) {
                location.href = "login.html";
                return;
            }

            currentUser = user;
            loadProfile(user.uid);
            setOnlineStatus(user.uid);
            loadStats(user.uid);
            saveLocation();
        });

        // بارگذاری پروفایل
        function loadProfile(id) {
            db.collection("users").doc(id).get()
                .then(doc => {
                    if (doc.exists) {
                        let u = doc.data();
                        document.getElementById("photo").src = u.photo || 'https://via.placeholder.com/150';
                        document.getElementById("name").innerText = u.name || 'کاربر';
                        document.getElementById("city").innerText = `📍 ${u.city || 'تهران'}`;
                        document.getElementById("bio").innerText = u.bio || 'علاقه‌مند به سفر، موسیقی و تکنولوژی';
                        
                        // پر کردن فیلدهای ویرایش
                        document.getElementById("editName").value = u.name || '';
                        document.getElementById("editCity").value = u.city || '';
                        document.getElementById("editBio").value = u.bio || '';
                    }
                })
                .catch(error => {
                    console.error("خطا در بارگذاری پروفایل:", error);
                });
        }

        // بارگذاری آمار
        function loadStats(id) {
            // بازدیدها
            db.collection("visitors").where("profileId", "==", id).get()
                .then(snapshot => {
                    document.getElementById("visitorsCount").textContent = snapshot.size;
                });

            // لایک‌ها
            db.collection("likes").where("to", "==", id).get()
                .then(snapshot => {
                    document.getElementById("likesCount").textContent = snapshot.size;
                });

            // تطابق‌ها
            db.collection("matches").where("users", "array-contains", id).get()
                .then(snapshot => {
                    document.getElementById("matchesCount").textContent = snapshot.size;
                });

            // سکه‌ها
            db.collection("users").doc(id).get()
                .then(doc => {
                    if (doc.exists) {
                        document.getElementById("coinsCount").textContent = doc.data().coins || 0;
                    }
                });
        }

        // تنظیم وضعیت آنلاین
        function setOnlineStatus(id) {
            db.collection("users").doc(id).update({
                online: true,
                lastActive: firebase.firestore.FieldValue.serverTimestamp()
            });

            // آفلاین شدن هنگام بستن صفحه
            window.addEventListener('beforeunload', () => {
                db.collection("users").doc(id).update({
                    online: false,
                    lastActive: firebase.firestore.FieldValue.serverTimestamp()
                });
            });
        }

        // ذخیره موقعیت مکانی
        function saveLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        let lat = position.coords.latitude;
                        let lng = position.coords.longitude;

                        if (currentUser) {
                            db.collection("users").doc(currentUser.uid).update({
                                lat: lat,
                                lng: lng,
                                location: new firebase.firestore.GeoPoint(lat, lng)
                            });
                        }
                    },
                    function(error) {
                        console.log("خطا در دریافت موقعیت:", error);
                    }
                );
            }
        }

        // بوست پروفایل
        function boost() {
            if (!currentUser) return;

            db.collection("users").doc(currentUser.uid).update({
                boosted: true,
                boostUntil: new Date(Date.now() + 24*60*60*1000) // 24 ساعت
            })
            .then(() => {
                alert("✅ پروفایل شما با موفقیت بوست شد! ۲۴ ساعت در صدر لیست هستید.");
            })
            .catch(error => {
                alert("❌ خطا در بوست پروفایل");
                console.error(error);
            });
        }

        // باز کردن مودال ویرایش
        function editProfile() {
            document.getElementById('editModal').classList.add('active');
        }

        // بستن مودال
        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        // ذخیره پروفایل ویرایش شده
        function saveProfile() {
            if (!currentUser) return;

            let updates = {
                name: document.getElementById('editName').value,
                city: document.getElementById('editCity').value,
                bio: document.getElementById('editBio').value,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection("users").doc(currentUser.uid).update(updates)
                .then(() => {
                    alert("✅ پروفایل با موفقیت به‌روزرسانی شد");
                    closeModal();
                    loadProfile(currentUser.uid);
                })
                .catch(error => {
                    alert("❌ خطا در به‌روزرسانی");
                    console.error(error);
                });
        }

        // تغییر عکس
        function changePhoto() {
            alert("📷 در نسخه بعدی می‌توانید عکس خود را تغییر دهید");
        }

        // افزودن عکس به گالری
        function addPhoto() {
            alert("📸 در نسخه بعدی می‌توانید عکس اضافه کنید");
        }

        // تنظیمات
        function openSettings() {
            alert("⚙️ صفحه تنظیمات به زودی اضافه می‌شود");
        }

        // بروزرسانی آنلاین بودن
        setInterval(() => {
            if (currentUser) {
                db.collection("users").doc(currentUser.uid).update({
                    online: true,
                    lastActive: firebase.firestore.FieldValue.serverTimestamp()
                });
            }
        }, 30000); // هر 30 ثانیه
    </script>
</body>
</html>
