<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پروفایل</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#111;
color:white;
text-align:center;
padding:40px;
}

.profile{
background:#222;
padding:30px;
border-radius:20px;
max-width:350px;
margin:auto;
box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

.avatar{
width:120px;
height:120px;
border-radius:50%;
background:#FF4D6D;
margin:auto;
margin-bottom:20px;
object-fit:cover;
}

.gallery{
display:flex;
gap:10px;
justify-content:center;
margin-top:20px;
}

.gallery img{
width:80px;
height:80px;
border-radius:10px;
object-fit:cover;
}

button{
margin-top:20px;
background:#FF4D6D;
border:none;
padding:10px 20px;
border-radius:20px;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<div class="profile">

<img id="avatar" class="avatar">

<h2 id="name">نام کاربر</h2>

<p id="bio">بیوگرافی</p>

<div class="gallery">

<img id="photo0">
<img id="photo1">
<img id="photo2">

</div>

<button onclick="edit()">ویرایش پروفایل</button>

</div>

<script>

let name = localStorage.getItem("name")
let bio = localStorage.getItem("bio")

let avatar = localStorage.getItem("avatar")

if(name){
document.getElementById("name").innerText = name
}

if(bio){
document.getElementById("bio").innerText = bio
}

if(avatar){
document.getElementById("avatar").src = avatar
}

for(let i=0;i<3;i++){

let photo = localStorage.getItem("photo"+i)

if(photo){
document.getElementById("photo"+i).src = photo
}

}

function edit(){

window.location.href="signup.html"

}

</script>

</body>
</html>
