<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>Profile</title><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script><style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
}

.card{
width:320px;
margin:80px auto;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.card img{
width:100%;
height:320px;
object-fit:cover;
}

.info{
padding:20px;
}

button{
padding:10px 20px;
margin:10px;
background:red;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

.boost{
background:gold;
color:black;
}

</style></head><body><h1>Your Profile</h1><div id="profile"></div><button class="boost" onclick="boostProfile()">⭐ Boost Profile</button>

<script>

const firebaseConfig = {
apiKey: "AIzaSyAA0xYFglY_ONI-PstgS4nP3uNIpyA",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.appspot.com",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.firestore();

firebase.auth().onAuthStateChanged((user)=>{

db.collection("users").doc(user.uid).get().then((doc)=>{

let data=doc.data();

document.getElementById("profile").innerHTML=`

<div class="card">

<img src="${data.photo}">

<div class="info">

<h2>${data.name}</h2>

<p>${data.city} • ${data.country}</p>

<p>Age: ${data.age}</p>

</div>

</div>

`;

});

});


function boostProfile(){

firebase.auth().onAuthStateChanged((user)=>{

db.collection("users").doc(user.uid).update({

boost:true,
boostTime:Date.now()

});

alert("Profile Boost Activated 🚀");

});

}

</script></body>
</html>
