<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile</title>

<style>

body{
font-family:Arial;
background:#f3f3f3;
text-align:center;
}

.card{
background:white;
width:300px;
margin:auto;
margin-top:40px;
padding:20px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,0.1);
}

img{
width:120px;
height:120px;
border-radius:50%;
}

button{
padding:10px 20px;
border:none;
background:#ff4d6d;
color:white;
border-radius:20px;
margin-top:15px;
cursor:pointer;
}

</style>

</head>

<body>

<h2>My Profile</h2>

<div class="card">

<img id="photo">

<h3 id="name"></h3>

<p id="city"></p>

<p id="age"></p>

<button onclick="logout()">Logout</button>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.firebasestorage.app",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

firebase.auth().onAuthStateChanged(user=>{

if(user){

db.collection("users").doc(user.uid).get().then(doc=>{

const data=doc.data();

document.getElementById("name").innerText=data.name;

document.getElementById("city").innerText=data.city+" , "+data.country;

document.getElementById("age").innerText="Age: "+data.age;

document.getElementById("photo").src=data.photo;

});

}else{

window.location.href="login.html";

}

});

function logout(){

firebase.auth().signOut();

window.location.href="login.html";

}

</script>

</body>
</html>
