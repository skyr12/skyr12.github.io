<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
text-align:center;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
font-size:20px;
}

.card{
background:white;
width:320px;
margin:30px auto;
padding:20px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.card img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
margin-bottom:10px;
}

input{
width:90%;
padding:10px;
margin:10px;
border-radius:8px;
border:1px solid #ccc;
}

button{
border:none;
padding:12px 20px;
border-radius:30px;
font-size:16px;
cursor:pointer;
margin:5px;
}

.save{background:#ff4d6d;color:white;}
.vip{background:gold;}
.boost{background:orange;color:white;}
.coins{background:#00b894;color:white;}
.logout{background:#ddd;}

.navbar{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
font-size:22px;
}

.navbar a{
text-decoration:none;
}

</style>

</head>

<body>

<div class="header">👤 My Profile</div>

<div class="card">

<img id="photoPreview">

<h3 id="coinBox">💰 Coins: 0</h3>

<input id="name" placeholder="Name">
<input id="age" placeholder="Age">
<input id="country" placeholder="Country">
<input id="photo" placeholder="Photo URL">

<button class="save" onclick="save()">Save Profile</button>

<button class="vip" onclick="vip()">Become VIP 👑</button>

<button class="boost" onclick="boost()">Boost Profile 🔥</button>

<button class="coins" onclick="addCoins()">💰 Add Coins</button>

<button class="logout" onclick="logout()">Logout</button>

</div>

<div class="navbar">
<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="chat.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="visitors.html">👁️</a>
<a href="profile.html">👤</a>
</div>


<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {

apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.firebasestorage.app",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1"

};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig);
}

const db=firebase.firestore()


firebase.auth().onAuthStateChanged(user=>{

if(!user){

location.href="login.html"
return

}

db.collection("users").doc(user.uid).get()

.then(doc=>{

let u=doc.data()

document.getElementById("name").value=u.name
document.getElementById("age").value=u.age
document.getElementById("country").value=u.country
document.getElementById("photo").value=u.photo
document.getElementById("photoPreview").src=u.photo

if(u.coins){
document.getElementById("coinBox").innerText="💰 Coins: "+u.coins
}

})

})

function save(){

let user=firebase.auth().currentUser

let name=document.getElementById("name").value
let age=document.getElementById("age").value
let country=document.getElementById("country").value
let photo=document.getElementById("photo").value

db.collection("users").doc(user.uid).update({

name:name,
age:age,
country:country,
photo:photo

})

.then(()=>{

alert("Profile Updated")

document.getElementById("photoPreview").src=photo

})

}

function vip(){

let user=firebase.auth().currentUser

db.collection("users").doc(user.uid).update({

vip:true

})

.then(()=>{

alert("👑 You are now VIP")

})

}

function boost(){

let user=firebase.auth().currentUser

db.collection("users").doc(user.uid).update({

boost:true

})

.then(()=>{

alert("🔥 Your profile is boosted!")

})

}

function addCoins(){

let user=firebase.auth().currentUser

db.collection("users").doc(user.uid).update({

coins:firebase.firestore.FieldValue.increment(100)

})

.then(()=>{

alert("💰 100 Coins added")

location.reload()

})

}

function logout(){

firebase.auth().signOut()

.then(()=>{

location.href="login.html"

})

}


navigator.geolocation.getCurrentPosition(function(position){

let lat = position.coords.latitude
let lng = position.coords.longitude

let user = firebase.auth().currentUser

db.collection("users").doc(user.uid).update({

lat: lat,
lng: lng

})

})

</script>

</body>
</html>
