<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
margin:0;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
font-size:20px;
}

.box{
background:white;
width:300px;
margin:30px auto;
padding:20px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

input{
width:100%;
padding:10px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:25px;
background:#ff4d6d;
color:white;
font-size:16px;
cursor:pointer;
}

.navbar{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
font-size:22px;
}

.navbar a{
text-decoration:none;
}

</style>

</head>

<body>

<div class="header">👤 Profile</div>

<div class="box">

<input id="name" placeholder="Name">
<input id="age" placeholder="Age">
<input id="country" placeholder="Country">
<input id="photo" placeholder="Photo URL">

<button onclick="save()">Save Profile</button>

</div>

<div class="navbar">
<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="chat.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="visitors.html">👁️</a>
<a href="profile.html">👤</a>
</div>


<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {

apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.firebasestorage.app",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1"

};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig);
}

const db = firebase.firestore();


firebase.auth().onAuthStateChanged(user=>{

if(!user){
location.href="login.html"
return
}

db.collection("users").doc(user.uid).get().then(doc=>{

let data=doc.data()

document.getElementById("name").value=data.name
document.getElementById("age").value=data.age
document.getElementById("country").value=data.country
document.getElementById("photo").value=data.photo

})

})


function save(){

let user=firebase.auth().currentUser

let name=document.getElementById("name").value
let age=document.getElementById("age").value
let country=document.getElementById("country").value
let photo=document.getElementById("photo").value


db.collection("users").doc(user.uid).update({

name:name,
age:age,
country:country,
photo:photo

})

.then(()=>{

alert("Profile updated")

})

}

</script>

</body>
</html>
