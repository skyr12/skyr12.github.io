<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل | نیمه گمشده</title>
    <link href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Vazir, sans-serif;
        }

        body {
            background: #f8fafc;
            padding-bottom: 80px;
        }

        .header {
            background: white;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            border-bottom: 1px solid #eef2f6;
        }

        .back-btn {
            font-size: 1.5rem;
            color: #6b7280;
            cursor: pointer;
        }

        .header h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1f2937;
        }

        .container {
            max-width: 600px;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #10b981;
        }

        .name {
            font-size: 1.6rem;
            font-weight: 600;
            color: #1f2937;
            margin-top: 0.5rem;
        }

        .location {
            color: #6b7280;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 1.5rem 0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 1.3rem;
            font-weight: 600;
            color: #10b981;
        }

        .stat-label {
            color: #6b7280;
            font-size: 0.8rem;
        }

        .section {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .section-title {
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 1rem;
        }

        .bio {
            color: #4b5563;
            line-height: 1.6;
        }

        .interests {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .interest {
            background: #f3f4f6;
            color: #4b5563;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-size: 0.9rem;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 0.8rem 0;
            border-top: 1px solid #eef2f6;
        }

        .nav-item {
            text-decoration: none;
            color: #9ca3af;
            font-size: 1.5rem;
        }

        .nav-item.active {
            color: #10b981;
        }
    </style>
</head>
<body>
    <header class="header">
        <span class="back-btn" onclick="history.back()">←</span>
        <h2>پروفایل من</h2>
    </header>

    <div class="container">
        <div class="profile-header">
            <img src="https://randomuser.me/api/portraits/women/1.jpg" class="avatar">
            <div class="name">سارا محمدی</div>
            <div class="location">📍 تهران • ۲۴ ساله</div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number">۱۲۸</div>
                <div class="stat-label">لایک</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">۴۵</div>
                <div class="stat-label">تطابق</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">۱٫۲k</div>
                <div class="stat-label">بازدید</div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">درباره من</div>
            <div class="bio">
                ✨ عاشق موسیقی، سفر و ماجراجویی<br>
                📸 عکاس آماتور<br>
                ☕ قهوه و کتاب فلسفی
            </div>
        </div>

        <div class="section">
            <div class="section-title">علاقه‌مندی‌ها</div>
            <div class="interests">
                <span class="interest">🎵 موسیقی</span>
                <span class="interest">✈️ سفر</span>
                <span class="interest">📚 کتاب</span>
                <span class="interest">☕ قهوه</span>
                <span class="interest">📸 عکاسی</span>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">🏠</a>
        <a href="discover.html" class="nav-item">🔍</a>
        <a href="matches.html" class="nav-item">❤️</a>
        <a href="profile.html" class="nav-item active">👤</a>
    </nav>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
        }
    </script>
</body>
</html>
