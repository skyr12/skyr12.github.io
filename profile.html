<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Profile</title>

<style>

<script>

const firebaseConfig = {
apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh"
}

firebase.initializeApp(firebaseConfig)

const db = firebase.firestore()

firebase.auth().onAuthStateChanged(user=>{

if(user){

db.collection("users").doc(user.uid).update({

online:true,
lastActive:Date.now()

})

}

})

window.addEventListener("beforeunload",function(){

let user=firebase.auth().currentUser

if(user){

db.collection("users").doc(user.uid).update({

online:false

})

}

})

</script>
}

img{
width:150px;
height:150px;
border-radius:50%;
object-fit:cover;
margin-bottom:20px;
}

input,select{
margin:10px;
padding:10px;
width:200px;
}

button{
padding:10px 20px;
background:#ff4d6d;
color:white;
border:none;
border-radius:20px;
cursor:pointer;
}

</style>

</head>

<body>

<h2>Your Profile</h2>

<img id="photo" src="https://via.placeholder.com/150">

<br>

<input type="file" id="file">

<br>

<input id="name" placeholder="Your name">

<br>

<input id="age" placeholder="Age">

<br>

<select id="country">

<option>UK</option>
<option>Germany</option>
<option>France</option>
<option>Turkey</option>
<option>UAE</option>
<option>USA</option>
<option>Canada</option>
<option>Australia</option>
<option>Indonesia</option>
<option>Pakistan</option>

</select>

<br>

<button onclick="save()">Save Profile</button>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {

apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.appspot.com"

};

firebase.initializeApp(firebaseConfig);

const storage = firebase.storage();
const db = firebase.firestore();

let currentUser = "user1";


function save(){

let name = document.getElementById("name").value;
let age = document.getElementById("age").value;
let country = document.getElementById("country").value;

let file = document.getElementById("file").files[0];

if(file){

let ref = storage.ref("profiles/"+currentUser+".jpg");

ref.put(file).then(()=>{

ref.getDownloadURL().then(url=>{

db.collection("users").doc(currentUser).set({

name:name,
age:age,
country:country,
photo:url

});

document.getElementById("photo").src=url;

});

});

}else{

db.collection("users").doc(currentUser).set({

name:name,
age:age,
country:country

});

}

alert("Profile saved")

}

</script>

</body>

</html>
