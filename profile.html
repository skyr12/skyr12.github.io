<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
text-align:center;
padding-bottom:80px;
}

.header{
background:#ff4d6d;
color:white;
padding:20px;
font-size:22px;
}

.profile-card{
width:90%;
max-width:400px;
margin:30px auto;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.profile-card img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
}

input{
width:90%;
padding:10px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
}

button{
padding:10px 25px;
border:none;
background:#ff4d6d;
color:white;
border-radius:20px;
}

.navbar{
position:fixed;
bottom:0;
left:0;
width:100%;
height:65px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -5px 15px rgba(0,0,0,0.15);
}

.navbar a{
text-decoration:none;
font-size:24px;
color:#444;
}

</style>

</head>

<body>

<div class="header">
Your Profile 👤
</div>

<div class="profile-card">

<img src="https://randomuser.me/api/portraits/men/32.jpg">

<br><br>

<input placeholder="Your name">

<input placeholder="Age">

<input placeholder="Country">

<br>

<button>Save Profile</button>

</div>

<div class="navbar">
<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="chat.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="profile.html">👤</a>
</div>

</body>
</html>
