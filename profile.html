<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پروفایل من</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#020617;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:#111;
padding:30px;
border-radius:20px;
width:300px;
text-align:center;
}

.avatar{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
margin:auto;
margin-bottom:15px;
background:#333;
}

button{
margin-top:20px;
background:#FF4D6D;
border:none;
padding:10px 20px;
border-radius:20px;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<div class="card">

<img id="avatar" class="avatar">

<h2 id="name"></h2>

<p id="age"></p>

<p id="city"></p>

<p id="bio"></p>

<a href="users.html">
<button>مشاهده کاربران</button>
</a>

</div>

<script>

document.getElementById("name").innerText =
localStorage.getItem("name") || "کاربر"

document.getElementById("age").innerText =
"سن: " + (localStorage.getItem("age") || "-")

document.getElementById("city").innerText =
"شهر: " + (localStorage.getItem("city") || "-")

document.getElementById("bio").innerText =
localStorage.getItem("bio") || ""

let photo=localStorage.getItem("photo")

if(photo){

document.getElementById("avatar").src=photo

}

</script>

</body>
</html>
