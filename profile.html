<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title><style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
margin:0;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
font-size:20px;
}

.card{
background:white;
width:300px;
margin:auto;
margin-top:30px;
padding:20px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.card img{
width:120px;
height:120px;
border-radius:100px;
object-fit:cover;
}

button{
background:#ff4d6d;
color:white;
border:none;
padding:10px 20px;
border-radius:25px;
margin:8px;
cursor:pointer;
}

.navbar{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
font-size:22px;
}

.navbar a{
text-decoration:none;
}

</style></head><body><div class="header">👤 Profile</div><div class="card"><img id="photo"><h2 id="name"></h2><p id="country"></p><a href="premium.html">
<button>💎 Premium</button>
</a><button onclick="boost()">🔥 Boost</button>

<button onclick="addCoins()">💰 Add Coins</button>

</div><div class="navbar"><a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="inbox.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="visitors.html">👁️</a>
<a href="profile.html">👤</a>

</div><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script><script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh",
storageBucket:"nimeh-gomsodeh.firebasestorage.app",
messagingSenderId:"815930956932",
appId:"1:815930956932:web:e8696a6a69b4458fd936d1"

};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig)
}

const db=firebase.firestore()

firebase.auth().onAuthStateChanged(user=>{

if(!user){

location.href="login.html"
return

}

loadProfile(user)

setOnline()

saveLocation()

})

function loadProfile(user){

db.collection("users").doc(user.uid).get()

.then(doc=>{

let u=doc.data()

document.getElementById("photo").src=u.photo
document.getElementById("name").innerText=u.name
document.getElementById("country").innerText=u.country

})

}

function boost(){

let user=firebase.auth().currentUser

db.collection("users").doc(user.uid).update({

boost:true

})

.then(()=>{

alert("🔥 Your profile is boosted!")

})

}

function addCoins(){

let user=firebase.auth().currentUser

db.collection("users").doc(user.uid).update({

coins:firebase.firestore.FieldValue.increment(100)

})

.then(()=>{

alert("💰 100 coins added!")

})

}

function saveLocation(){

navigator.geolocation.getCurrentPosition(function(position){

let lat=position.coords.latitude
let lng=position.coords.longitude

let user=firebase.auth().currentUser

db.collection("users").doc(user.uid).update({

lat:lat,
lng:lng

})

})

}

function setOnline(){

let user=firebase.auth().currentUser

db.collection("users").doc(user.uid).update({

online:true,
lastActive:Date.now()

})

}

</script></body>
</html>
