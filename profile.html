<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
padding-bottom:80px;
text-align:center;
}

.header{
background:#ff4d6d;
color:white;
padding:20px;
font-size:22px;
}

.profile-box{
width:90%;
max-width:400px;
margin:30px auto;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.profile-box img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
margin-bottom:10px;
}

input{
width:90%;
padding:10px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
}

button{
padding:12px 20px;
background:#ff4d6d;
color:white;
border:none;
border-radius:20px;
}

.navbar{
position:fixed;
bottom:0;
left:0;
width:100%;
height:65px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -5px 15px rgba(0,0,0,0.15);
}

.navbar a{
text-decoration:none;
font-size:24px;
color:#444;
}

</style>

</head>

<body>

<div class="header">
Your Profile 👤
</div>

<div class="profile-box">

<img id="photoPreview" src="https://randomuser.me/api/portraits/men/32.jpg">

<br>

<input type="file" id="photoInput">

<input id="name" placeholder="Your name">

<input id="age" placeholder="Age">

<input id="country" placeholder="Country">

<br>

<button onclick="saveProfile()">Save Profile</button>

</div>

<div class="navbar">
<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="chat.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="profile.html">👤</a>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

var firebaseConfig = {

apiKey:"YOUR_API_KEY",
authDomain:"YOUR_PROJECT.firebaseapp.com",
projectId:"YOUR_PROJECT_ID"

};

firebase.initializeApp(firebaseConfig)

var db = firebase.firestore()

let currentUser="user1"

document.getElementById("photoInput").addEventListener("change",function(){

let file=this.files[0]

let reader=new FileReader()

reader.onload=function(){

document.getElementById("photoPreview").src=reader.result

}

reader.readAsDataURL(file)

})

function saveProfile(){

let name=document.getElementById("name").value
let age=document.getElementById("age").value
let country=document.getElementById("country").value
let photo=document.getElementById("photoPreview").src

db.collection("users").doc(currentUser).set({

name:name,
age:age,
country:country,
photo:photo

})

alert("Profile Saved")

}
<script>

firebase.auth().onAuthStateChanged(user=>{

if(!user) return

let viewer=user.uid

let profile=localStorage.getItem("viewProfile")

if(!profile) return

db.collection("visitors").add({

viewer:viewer,
profile:profile,
time:Date.now()

})

})

</script>

</body>
</html>
