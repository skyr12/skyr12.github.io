<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
margin:0;
text-align:center;
}

.card{
background:white;
margin:20px;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
}

button{
padding:10px 20px;
border:none;
background:#ff4d6d;
color:white;
border-radius:20px;
margin-top:10px;
cursor:pointer;
}

.navbar{

position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
font-size:22px;

}

.navbar a{
text-decoration:none;
}

</style>

</head>

<body>

<h2>👤 Profile</h2>

<div class="card">

<img id="photo">

<h3 id="name"></h3>

<p id="city"></p>

<p id="status"></p>

<button onclick="boost()">🔥 Boost Profile</button>

</div>


<div class="navbar">

<a href="discover.html">🔥</a>
<a href="matches.html">❤️</a>
<a href="inbox.html">💬</a>
<a href="notifications.html">🔔</a>
<a href="visitors.html">👁️</a>
<a href="profile.html">👤</a>

</div>



<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>



<script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh",
storageBucket:"nimeh-gomsodeh.firebasestorage.app",
messagingSenderId:"815930956932",
appId:"1:815930956932:web:e8696a6a69b4458fd936d1"

};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig)
}

const db = firebase.firestore()



firebase.auth().onAuthStateChanged(user=>{

if(!user){

location.href="login.html"
return

}

loadProfile(user.uid)

setOnline(user.uid)

saveLocation()

})



function loadProfile(id){

db.collection("users").doc(id).get()

.then(doc=>{

let u = doc.data()

document.getElementById("photo").src = u.photo
document.getElementById("name").innerText = u.name
document.getElementById("city").innerText = u.city

})

}



function boost(){

let user = firebase.auth().currentUser

db.collection("users").doc(user.uid).update({

boost:true

})

.then(()=>{

alert("🔥 Your profile is boosted!")

})

}



function setOnline(){

let user = firebase.auth().currentUser

db.collection("users").doc(user.uid).update({

online:true,
lastActive:Date.now()

})

}



function saveLocation(){

navigator.geolocation.getCurrentPosition(function(position){

let lat = position.coords.latitude
let lng = position.coords.longitude

let user = firebase.auth().currentUser

db.collection("users").doc(user.uid).update({

lat: lat,
lng: lng

})

})

}

</script>

</body>
</html>
