<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل | نیمه گمشده</title>
    <link href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <style>
        /* استایل‌های قبلی profile.html */
    </style>
</head>
<body>
    <header class="header">
        <span class="back-btn" onclick="history.back()">←</span>
        <h2>پروفایل من</h2>
    </header>

    <div class="container">
        <div class="profile-header">
            <img src="" class="avatar" id="profileAvatar">
            <div class="name" id="profileName"></div>
            <div class="location" id="profileLocation"></div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="statLikes">۰</div>
                <div class="stat-label">لایک</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="statMatches">۰</div>
                <div class="stat-label">تطابق</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="statCoins">۰</div>
                <div class="stat-label">سکه</div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">درباره من</div>
            <div class="bio" id="profileBio"></div>
        </div>

        <div class="section">
            <div class="section-title">علاقه‌مندی‌ها</div>
            <div class="interests" id="profileInterests"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">🏠</a>
        <a href="discover.html" class="nav-item">🔍</a>
        <a href="matches.html" class="nav-item">❤️</a>
        <a href="profile.html" class="nav-item active">👤</a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
            authDomain: "nimeh-gomsodeh.firebaseapp.com",
            projectId: "nimeh-gomsodeh",
            storageBucket: "nimeh-gomsodeh.firebasestorage.app",
            messagingSenderId: "815930956932",
            appId: "1:815930956932:web:e8696a6a69b4458fd936d1"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.href = 'login.html';
            } else {
                // بارگذاری اطلاعات کاربر
                db.collection('users').doc(user.uid).get()
                    .then(doc => {
                        if (doc.exists) {
                            const data = doc.data();
                            document.getElementById('profileName').textContent = data.name || 'کاربر';
                            document.getElementById('profileLocation').textContent = `📍 تهران • ۲۴ ساله`; // می‌توانید سن را هم ذخیره کنید
                            document.getElementById('profileBio').textContent = data.bio || '✨ عاشق موسیقی، سفر و ماجراجویی';
                            document.getElementById('statCoins').textContent = data.coins || 0;
                            // اگر عکس پروفایل دارید
                            // document.getElementById('profileAvatar').src = data.photoURL || 'default.jpg';
                        }
                    });
            }
        });
    </script>
</body>
</html>
