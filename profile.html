<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Profile</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
text-align:center;
padding:20px;
}

img{
width:150px;
height:150px;
border-radius:50%;
object-fit:cover;
margin-bottom:20px;
}

input{
margin:10px 0;
}

button{
padding:10px 20px;
background:#ff4d6d;
color:white;
border:none;
border-radius:20px;
cursor:pointer;
}

</style>

</head>

<body>

<h2>Your Profile</h2>

<img id="photo" src="https://via.placeholder.com/150">

<br>

<input type="file" id="file">

<br>

<button onclick="upload()">Upload Photo</button>


<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {

apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.appspot.com"

};

firebase.initializeApp(firebaseConfig);

const storage = firebase.storage();
const db = firebase.firestore();

let currentUser = "user1";


function upload(){

let file = document.getElementById("file").files[0];

let ref = storage.ref("profiles/"+currentUser+".jpg");

ref.put(file).then(()=>{

ref.getDownloadURL().then(url=>{

document.getElementById("photo").src=url;

db.collection("users").doc(currentUser).set({

photo:url

});

});

});

}

</script>

</body>

</html>
