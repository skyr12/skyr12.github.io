<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پروفایل</title>

<style>

body{
margin:0;
font-family:sans-serif;
background:#111;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

.profile{
background:#222;
padding:40px;
border-radius:20px;
width:300px;
}

.avatar{
width:120px;
height:120px;
background:#ff4f7b;
border-radius:50%;
margin:auto;
}

.name{
font-size:24px;
margin-top:15px;
}

.bio{
opacity:0.7;
margin-top:10px;
}

button{
margin-top:20px;
padding:12px 20px;
border:none;
border-radius:10px;
background:#ff4f7b;
color:white;
font-size:16px;
}

</style>
</head>

<body>

<div class="profile">

<div class="avatar"></div>

<div class="name">نام کاربر</div>

<div class="bio">این بیوگرافی کاربر است</div>

<button>ویرایش پروفایل</button>

</div>

</body>
</html>
