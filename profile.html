<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile</title>

<style>

body{
font-family:Arial;
background:#f3f3f3;
text-align:center;
margin:0;
}

.card{

width:320px;
margin:auto;
margin-top:60px;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.2);

}

.gallery{

position:relative;

}

.gallery img{

width:100%;
height:320px;
object-fit:cover;

}

.buttons{

margin-top:10px;

}

button{

padding:10px 15px;
margin:5px;
border:none;
border-radius:10px;
cursor:pointer;

}

</style>

</head>

<body>

<h2>User Profile</h2>

<div class="card">

<div class="gallery">

<img id="photo">

</div>

<div class="buttons">

<button onclick="prev()">⬅️</button>

<button onclick="next()">➡️</button>

</div>

<h3 id="name"></h3>

<p id="city"></p>

<p id="age"></p>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>

const firebaseConfig={
apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh"
}

firebase.initializeApp(firebaseConfig)

const db=firebase.firestore()

let photos=[]
let index=0


function loadProfile(){

db.collection("users").limit(1).get().then(snapshot=>{

snapshot.forEach(doc=>{

let data=doc.data()

photos=[data.photo1,data.photo2,data.photo3,data.photo4]

document.getElementById("name").innerText=data.name

document.getElementById("city").innerText=data.city+" , "+data.country

document.getElementById("age").innerText="Age: "+data.age

document.getElementById("photo").src=photos[0]

})

})

}


function next(){

index++

if(index>=photos.length){

index=0

}

document.getElementById("photo").src=photos[index]

}


function prev(){

index--

if(index<0){

index=photos.length-1

}

document.getElementById("photo").src=photos[index]

}


loadProfile()

</script>

</body>

</html>
