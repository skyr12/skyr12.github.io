<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>همدم | صفحه اصلی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding-bottom: 70px;
        }

        .header {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .container {
            max-width: 500px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .profile-card {
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }

        .profile-info {
            padding: 25px;
        }

        .name-age {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .name {
            font-size: 28px;
            font-weight: 700;
            color: #333;
        }

        .age {
            font-size: 20px;
            color: #ff4d6d;
            background: #ffe5e9;
            padding: 5px 15px;
            border-radius: 30px;
        }

        .location {
            color: #666;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .bio {
            color: #444;
            line-height: 1.6;
            margin-bottom: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 15px;
        }

        .interests {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .interest {
            background: #f0f0f0;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            color: #555;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
        }

        .action-btn {
            flex: 1;
            height: 65px;
            border: none;
            border-radius: 35px;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .like-btn {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
        }

        .like-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255,77,109,0.4);
        }

        .dislike-btn {
            background: white;
            color: #ff4d6d;
            border: 2px solid #ff4d6d;
        }

        .dislike-btn:hover {
            background: #ff4d6d;
            color: white;
        }

        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #ddd;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
        }

        .nav-item {
            text-decoration: none;
            font-size: 24px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #666;
            transition: all 0.3s ease;
        }

        .nav-item:hover {
            background: #f0f0f0;
            color: #ff4d6d;
        }

        .logout-btn {
            background: #fee2e2;
            color: #ef4444;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 20px;
        }

        .logout-btn:hover {
            background: #ef4444;
            color: white;
        }

        .user-info {
            background: white;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        🔥 همدم
    </div>

    <div class="container">
        <div class="user-info" id="userInfo"></div>

        <div class="profile-card">
            <img src="https://randomuser.me/api/portraits/women/1.jpg" class="profile-image">
            
            <div class="profile-info">
                <div class="name-age">
                    <span class="name">سارا محمدی</span>
                    <span class="age">۲۴</span>
                </div>
                
                <div class="location">
                    <span>📍</span>
                    <span>تهران • ۳ کیلومتری شما</span>
                </div>
                
                <div class="bio">
                    عاشق موسیقی، سفر و تکنولوژی ❤️<br>
                    دنبال دوستای جدید برای گپ و گفت
                </div>
                
                <div class="interests">
                    <span class="interest">🎵 موسیقی</span>
                    <span class="interest">✈️ سفر</span>
                    <span class="interest">📚 کتاب</span>
                    <span class="interest">🎮 بازی</span>
                </div>
                
                <div class="action-buttons">
                    <button class="action-btn dislike-btn" onclick="nextProfile()">✕</button>
                    <button class="action-btn like-btn" onclick="nextProfile()">❤️</button>
                </div>
            </div>
        </div>

        <button class="logout-btn" onclick="logout()" style="width: 100%;">🚪 خروج از حساب</button>
    </div>

    <div class="navbar">
        <a href="index.html" class="nav-item">🏠</a>
        <a href="#" class="nav-item">🔥</a>
        <a href="#" class="nav-item">❤️</a>
        <a href="#" class="nav-item">👤</a>
    </div>

    <script>
        // نمایش اطلاعات کاربر
        window.onload = function() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const userEmail = localStorage.getItem('userEmail');
            
            if (!isLoggedIn) {
                // اگه کاربر وارد نشده، بفرست به صفحه ورود
                window.location.href = 'login.html';
            } else {
                // نمایش اطلاعات کاربر
                const userInfo = document.getElementById('userInfo');
                userInfo.innerHTML = `
                    <p>👤 خوش آمدید، ${userEmail === 'guest@hamdam.com' ? 'مهمان' : userEmail}</p>
                `;
            }
        };

        function nextProfile() {
            // تغییر پروفایل (برای تست)
            const images = [
                'https://randomuser.me/api/portraits/women/1.jpg',
                'https://randomuser.me/api/portraits/women/2.jpg',
                'https://randomuser.me/api/portraits/men/1.jpg'
            ];
            
            const randomImage = images[Math.floor(Math.random() * images.length)];
            document.querySelector('.profile-image').src = randomImage;
        }

        function logout() {
            // خروج از حساب
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userEmail');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
