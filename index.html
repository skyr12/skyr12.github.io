<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nimeh Gomsodeh</title>

<style>
body{
font-family: Arial;
background:#f5f5f5;
text-align:center;
}

.box{
background:white;
width:300px;
margin:auto;
margin-top:100px;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input{
width:90%;
padding:10px;
margin:5px;
}

button{
padding:10px 20px;
background:#ff4b5c;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h2>Nimeh Gomsodeh</h2>

<input id="name" placeholder="Name"><br>
<input id="city" placeholder="City"><br>

<button onclick="register()">Register</button>

<p id="msg"></p>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";


const firebaseConfig = {
apiKey: "AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain: "nimeh-gomsodeh.firebaseapp.com",
projectId: "nimeh-gomsodeh",
storageBucket: "nimeh-gomsodeh.firebasestorage.app",
messagingSenderId: "815930956932",
appId: "1:815930956932:web:e8696a6a69b4458fd936d1",
measurementId: "G-KTCV2B5R9L"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


window.register = async function(){

const name = document.getElementById("name").value;
const city = document.getElementById("city").value;

try{

await addDoc(collection(db,"users"),{
name:name,
city:city
});

document.getElementById("msg").innerHTML="User registered";

}
catch(e){

document.getElementById("msg").innerHTML="Error";

}

}

</script>


</body>
</html>
