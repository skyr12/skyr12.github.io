<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nimeh Dating</title>

<link rel="manifest" href="manifest.json">

<style>

body{
margin:0;
font-family:Arial;
background:#f3f3f3;
text-align:center;
padding-bottom:80px;
}

.header{
background:#ff4d6d;
color:white;
padding:20px;
font-size:24px;
}

.box{
margin:40px;
}

button{
padding:15px 25px;
border:none;
border-radius:30px;
font-size:18px;
background:#ff4d6d;
color:white;
margin:10px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="header">

Nimeh Dating ❤️

</div>

<div class="box">

<button onclick="location.href='discover.html'">
Start Discover 🔥
</button>

<br>

<button id="installBtn" style="display:none">
Install App 📱
</button>

</div>

<script>

let deferredPrompt

window.addEventListener('beforeinstallprompt',(e)=>{

e.preventDefault()

deferredPrompt=e

document.getElementById("installBtn").style.display="block"

})

document.getElementById("installBtn").addEventListener("click",async()=>{

if(deferredPrompt){

deferredPrompt.prompt()

}

})

</script>

</body>

</html>
