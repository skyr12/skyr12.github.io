<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>همدم | صفحه اصلی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .welcome-box {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .welcome-box h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ff4d6d;
        }

        .welcome-box p {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }

        .user-info {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .user-info div {
            margin: 10px 0;
            font-size: 16px;
        }

        .btn {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,77,109,0.3);
        }

        .btn-secondary {
            background: white;
            color: #ff4d6d;
            border: 2px solid #ff4d6d;
        }
    </style>
</head>
<body>
    <div class="welcome-box" id="welcomeBox">
        <h1>❤️ همدم</h1>
        <p>به پنل کاربری خوش آمدید</p>
        
        <div class="user-info" id="userInfo">
            <div>در حال بارگذاری...</div>
        </div>
        
        <button class="btn" onclick="goToPage('discover.html')">🔥 اکتشاف</button>
        <button class="btn" onclick="goToPage('profile.html')">👤 پروفایل</button>
        <button class="btn btn-secondary" onclick="logout()">🚪 خروج</button>
    </div>

    <script>
        function loadUser() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            const userInfo = document.getElementById('userInfo');
            
            if (user) {
                userInfo.innerHTML = `
                    <div>📧 ایمیل: ${user.email}</div>
                    <div>👤 نام: ${user.name}</div>
                    <div>🎭 نقش: ${user.role === 'admin' ? 'مدیر' : 'کاربر'}</div>
                `;
            } else {
                userInfo.innerHTML = '<div>❌ کاربر وارد نشده است</div>';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            }
        }

        function goToPage(page) {
            window.location.href = page;
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }

        loadUser();
    </script>
</body>
</html>
