<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nimeh Dating</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">

<style>

body{
margin:0;
font-family:Arial;
background:#ff4d6d;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
text-align:center;
}

.container{
max-width:400px;
padding:20px;
}

.logo{
width:120px;
margin-bottom:20px;
}

h1{
font-size:36px;
margin-bottom:10px;
}

p{
font-size:18px;
margin-bottom:30px;
}

button{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:30px;
font-size:16px;
cursor:pointer;
}

.google{
background:white;
color:black;
}

.email{
background:#e63950;
color:white;
}

#installBtn{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
padding:15px 25px;
background:#000;
color:white;
border:none;
border-radius:30px;
font-size:16px;
display:none;
}

</style>

</head>

<body>

<div class="container">

<img src="icon.png" class="logo">

<h1>NIMEH</h1>

<p>Where Muslims Meet</p>

<button class="google">
Continue with Google
</button>

<button class="email" onclick="location.href='login.html'">
Continue with Email
</button>

</div>

<button id="installBtn">Install App</button>

<script>

/* Service Worker */

if ('serviceWorker' in navigator) {

navigator.serviceWorker.register('service-worker.js')
.then(function(){

console.log("Service Worker Registered");

});

}


/* Install App Button */

let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {

e.preventDefault();

deferredPrompt = e;

document.getElementById("installBtn").style.display="block";

});

document.getElementById("installBtn").addEventListener("click", () => {

deferredPrompt.prompt();

});

</script>

</body>

</html>
