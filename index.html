<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>همدم | صفحه اصلی</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(165deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            position: relative;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        /* پس زمینه لوکس */
        .luxury-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .luxury-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(255,77,109,0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255,138,92,0.1) 0%, transparent 50%);
            animation: pulseGlow 8s ease-in-out infinite;
        }

        .luxury-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.05"><path d="M20 20 L80 20 L80 80 L20 80 Z" fill="none" stroke="white" stroke-width="2"/><circle cx="50" cy="50" r="10" fill="white"/></svg>');
            background-size: 50px 50px;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* هدر لوکس */
        .luxury-header {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(45deg);
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.3);
        }

        .logo-icon span {
            transform: rotate(-45deg);
            font-size: 28px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .wallet {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .wallet:hover {
            background: rgba(255, 77, 109, 0.2);
            border-color: #ff4d6d;
            transform: translateY(-2px);
        }

        .wallet span {
            color: #ffd700;
            font-size: 20px;
        }

        .wallet .amount {
            color: white;
            font-weight: 600;
        }

        /* کانتینر اصلی */
        .main-container {
            max-width: 500px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* کارت پروفایل لوکس */
        .profile-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 50px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: cardAppear 0.8s ease-out;
            margin-bottom: 25px;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .profile-image-container {
            position: relative;
            height: 450px;
            overflow: hidden;
        }

        .profile-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .profile-card:hover .profile-image {
            transform: scale(1.05);
        }

        .image-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
        }

        .vip-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ffd700, #ffa500);
            padding: 10px 25px;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.3);
            animation: badgePulse 2s infinite;
        }

        @keyframes badgePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .online-badge {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(76, 175, 80, 0.3);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 30px;
            color: #4caf50;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(76, 175, 80, 0.5);
        }

        .online-dot {
            width: 10px;
            height: 10px;
            background: #4caf50;
            border-radius: 50%;
            animation: dotPulse 2s infinite;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .profile-info {
            padding: 25px;
        }

        .name-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .name {
            font-size: 32px;
            font-weight: 800;
            color: white;
            letter-spacing: 1px;
        }

        .age {
            font-size: 24px;
            color: #ff4d6d;
            background: rgba(255, 77, 109, 0.2);
            padding: 5px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255, 77, 109, 0.3);
        }

        .location {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 20px;
            font-size: 16px;
        }

        .location span {
            color: #ff4d6d;
        }

        .bio {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.8;
            font-size: 15px;
        }

        .interests {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .interest {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 40px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .interest:hover {
            background: #ff4d6d;
            border-color: #ff4d6d;
            transform: translateY(-2px);
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .action-btn {
            flex: 1;
            height: 70px;
            border: none;
            border-radius: 40px;
            font-size: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .action-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .like-btn {
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            color: white;
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.4);
        }

        .like-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.6);
        }

        .dislike-btn {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .dislike-btn:hover {
            border-color: #ff4d6d;
            color: #ff4d6d;
            transform: translateY(-3px);
        }

        .superlike-btn {
            background: linear-gradient(135deg, #ffd700, #ffa500);
            color: white;
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.3);
        }

        .superlike-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px rgba(255, 215, 0, 0.5);
        }

        /* آمار پروفایل */
        .stats-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .stats-grid {
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .stat-item {
            flex: 1;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff4d6d, #ff8a5c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* منوی پایین لوکس */
        .luxury-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-item {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-item:hover {
            color: #ff4d6d;
            transform: translateY(-5px);
        }

        .nav-item.active {
            color: #ff4d6d;
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            top: -15px;
            width: 5px;
            height: 5px;
            background: #ff4d6d;
            border-radius: 50%;
            box-shadow: 0 0 20px #ff4d6d;
        }

        .nav-icon {
            font-size: 24px;
        }

        .nav-label {
            font-size: 11px;
            font-weight: 500;
        }

        .nav-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff4d6d;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
            box-shadow: 0 5px 10px rgba(255, 77, 109, 0.3);
        }

        /* دکمه خروج */
        .logout-btn {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .logout-btn:hover {
            background: rgba(255, 77, 109, 0.1);
            border-color: #ff4d6d;
            color: #ff4d6d;
            transform: translateY(-2px);
        }

        /* نوتیفیکیشن */
        .notification-toast {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 15px 30px;
            color: white;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 2000;
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .notification-toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .notification-toast.success {
            border-left: 4px solid #4caf50;
        }

        .notification-toast.error {
            border-left: 4px solid #f44336;
        }

        .notification-toast.info {
            border-left: 4px solid #2196f3;
        }

        @media (max-width: 480px) {
            .profile-image-container {
                height: 400px;
            }
            
            .name {
                font-size: 28px;
            }
            
            .age {
                font-size: 20px;
            }
            
            .action-btn {
                height: 60px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="luxury-bg"></div>

    <header class="luxury-header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">
                    <span>❤️</span>
                </div>
                <span class="logo-text">همدم</span>
            </div>
            <div class="wallet" onclick="showNotification('کیف پول شما', 'info')">
                <span>🪙</span>
                <span class="amount">۱,۲۵۰</span>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- کارت پروفایل -->
        <div class="profile-card">
            <div class="profile-image-container">
                <img src="https://randomuser.me/api/portraits/women/1.jpg" class="profile-image" id="profileImage">
                <div class="image-overlay"></div>
                <div class="vip-badge">
                    <span>👑</span>
                    <span>VIP طلایی</span>
                </div>
                <div class="online-badge">
                    <span class="online-dot"></span>
                    <span>آنلاین</span>
                </div>
            </div>
            
            <div class="profile-info">
                <div class="name-section">
                    <span class="name" id="profileName">سارا محمدی</span>
                    <span class="age" id="profileAge">۲۴</span>
                </div>
                
                <div class="location">
                    <span>📍</span>
                    <span>تهران • ۳ کیلومتری شما</span>
                </div>
                
                <div class="bio" id="profileBio">
                    ✨ عاشق موسیقی، سفر و ماجراجویی<br>
                    📸 عکاس حرفه‌ای<br>
                    ☕ عاشق قهوه و کتاب‌های فلسفی
                </div>
                
                <div class="interests" id="profileInterests">
                    <span class="interest">🎵 موسیقی</span>
                    <span class="interest">✈️ سفر</span>
                    <span class="interest">📚 کتاب</span>
                    <span class="interest">🎮 بازی</span>
                    <span class="interest">☕ قهوه</span>
                    <span class="interest">📸 عکاسی</span>
                </div>
                
                <div class="action-buttons">
                    <button class="action-btn dislike-btn" onclick="handleAction('dislike')">✕</button>
                    <button class="action-btn like-btn" onclick="handleAction('like')">❤️</button>
                    <button class="action-btn superlike-btn" onclick="handleAction('superlike')">⭐</button>
                </div>
            </div>
        </div>

        <!-- آمار پروفایل -->
        <div class="stats-card">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="statLikes">۱۲۸</div>
                    <div class="stat-label">لایک</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statMatches">۴۵</div>
                    <div class="stat-label">تطابق</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statViews">۲٫۳k</div>
                    <div class="stat-label">بازدید</div>
                </div>
            </div>
        </div>

        <!-- دکمه خروج -->
        <button class="logout-btn" onclick="logout()">
            <span>🚪</span>
            <span>خروج از حساب کاربری</span>
        </button>
    </div>

    <!-- منوی پایین -->
    <nav class="luxury-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">خانه</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">🔥</span>
                <span class="nav-label">اکتشاف</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">❤️</span>
                <span class="nav-label">تطابق</span>
                <span class="nav-badge">۳</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">💬</span>
                <span class="nav-label">پیام</span>
                <span class="nav-badge">۵</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">👤</span>
                <span class="nav-label">پروفایل</span>
            </a>
        </div>
    </nav>

    <!-- نوتیفیکیشن -->
    <div class="notification-toast" id="notification">
        <span id="notificationIcon">✅</span>
        <span id="notificationMessage">عملیات با موفقیت انجام شد</span>
    </div>

    <script>
        // داده‌های نمونه
        const profiles = [
            {
                name: 'سارا محمدی',
                age: '۲۴',
                image: 'https://randomuser.me/api/portraits/women/1.jpg',
                bio: '✨ عاشق موسیقی، سفر و ماجراجویی\n📸 عکاس حرفه‌ای\n☕ عاشق قهوه و کتاب‌های فلسفی',
                interests: ['🎵 موسیقی', '✈️ سفر', '📚 کتاب', '🎮 بازی', '☕ قهوه', '📸 عکاسی']
            },
            {
                name: 'علی رضایی',
                age: '۲۸',
                image: 'https://randomuser.me/api/portraits/men/1.jpg',
                bio: '🎮 گیمر حرفه‌ای\n💻 برنامه‌نویس\n🏋️‍♂️ بدنساز',
                interests: ['🎮 بازی', '💻 برنامه‌نویسی', '🏋️ ورزش', '🎵 موسیقی']
            },
            {
                name: 'مریم کریمی',
                age: '۲۶',
                image: 'https://randomuser.me/api/portraits/women/2.jpg',
                bio: '🎵 خواننده و موزیسین\n🎨 نقاش\n✈️ عاشق سفر',
                interests: ['🎵 موسیقی', '🎨 نقاشی', '✈️ سفر', '📚 کتاب']
            },
            {
                name: 'رضا احمدی',
                age: '۳۰',
                image: 'https://randomuser.me/api/portraits/men/2.jpg',
                bio: '🏢 مدیر بازاریابی\n📸 عکاس\n☕ عاشق قهوه',
                interests: ['📸 عکاسی', '☕ قهوه', '📚 کتاب', '✈️ سفر']
            }
        ];

        let currentProfileIndex = 0;

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            const icon = document.getElementById('notificationIcon');
            const msg = document.getElementById('notificationMessage');
            
            notification.className = 'notification-toast ' + type;
            
            if (type === 'success') icon.innerHTML = '✅';
            if (type === 'error') icon.innerHTML = '❌';
            if (type === 'info') icon.innerHTML = 'ℹ️';
            
            msg.innerHTML = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 2000);
        }

        function handleAction(action) {
            if (action === 'like') {
                showNotification('❤️ لایک شد!', 'success');
            } else if (action === 'superlike') {
                showNotification('⭐ سوپرلایک شد!', 'info');
            } else {
                showNotification('✕ رد شد', 'error');
            }
            
            // پروفایل بعدی
            currentProfileIndex = (currentProfileIndex + 1) % profiles.length;
            updateProfile();
        }

        function updateProfile() {
            const profile = profiles[currentProfileIndex];
            
            document.getElementById('profileImage').src = profile.image;
            document.getElementById('profileName').textContent = profile.name;
            document.getElementById('profileAge').textContent = profile.age;
            document.getElementById('profileBio').innerHTML = profile.bio.replace(/\n/g, '<br>');
            
            const interestsContainer = document.getElementById('profileInterests');
            interestsContainer.innerHTML = '';
            profile.interests.forEach(interest => {
                const span = document.createElement('span');
                span.className = 'interest';
                span.textContent = interest;
                interestsContainer.appendChild(span);
            });
            
            // آپدیت آمار (برای تست)
            document.getElementById('statLikes').textContent = Math.floor(Math.random() * 200) + 50;
            document.getElementById('statMatches').textContent = Math.floor(Math.random() * 100) + 20;
            document.getElementById('statViews').textContent = (Math.random() * 3 + 1).toFixed(1) + 'k';
        }

        function logout() {
            showNotification('در حال خروج...', 'info');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        }

        // چک کردن وضعیت ورود
        (function checkAuth() {
            // اینجا می‌تونی چک کنی کاربر از صفحه login اومده یا نه
            // برای الان، همیشه اجازه می‌دیم
        })();

        // انیمیشن اعداد
        function animateNumbers() {
            const stats = document.querySelectorAll('.stat-value');
            stats.forEach(stat => {
                const value = stat.textContent;
                if (value.includes('k')) return;
                
                let start = 0;
                const end = parseInt(value);
                const duration = 1000;
                const increment = end / (duration / 16);
                
                const timer = setInterval(() => {
                    start += increment;
                    if (start >= end) {
                        stat.textContent = end;
                        clearInterval(timer);
                    } else {
                        stat.textContent = Math.floor(start);
                    }
                }, 16);
            });
        }

        animateNumbers();
    </script>
</body>
</html>
