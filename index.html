<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>Nimeh</title><style>

body{
margin:0;
font-family:Arial;
background:#111;
color:white;
text-align:center;
}

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(45deg,#ff4b6e,#ff8a5b);
}

h1{
font-size:60px;
margin:20px;
}

p{
font-size:22px;
}

button{
padding:15px 40px;
margin:10px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
}

.join{
background:white;
color:black;
}

.login{
background:black;
color:white;
border:2px solid white;
}

select{
padding:10px;
border-radius:10px;
margin-top:20px;
}

</style></head><body><div class="hero"><h1 id="title">NIMEH</h1><p id="subtitle">Find your perfect partner anywhere in the world</p><a href="register.html">
<button class="join" id="joinBtn">Join Now</button>
</a><a href="login.html">
<button class="login" id="loginBtn">Login</button>
</a><select onchange="changeLang(this.value)"><option value="en">English</option>
<option value="fa">Persian</option>
<option value="ar">Arabic</option>
<option value="tr">Turkish</option>
<option value="fr">French</option>
<option value="es">Spanish</option>
<option value="de">German</option>
<option value="ur">Urdu</option>
<option value="id">Indonesian</option></select></div><script>

function changeLang(lang){

if(lang=="fa"){

title.innerText="نیمه";
subtitle.innerText="نیمه گمشده خود را پیدا کنید";
joinBtn.innerText="ثبت نام";
loginBtn.innerText="ورود";

}

if(lang=="ar"){

title.innerText="نيمه";
subtitle.innerText="اعثر على شريك حياتك";
joinBtn.innerText="إنشاء حساب";
loginBtn.innerText="تسجيل الدخول";

}

if(lang=="tr"){

subtitle.innerText="Hayat arkadaşını bul";
joinBtn.innerText="Kayıt ol";
loginBtn.innerText="Giriş";

}

if(lang=="fr"){

subtitle.innerText="Trouvez votre partenaire idéal";
joinBtn.innerText="S'inscrire";
loginBtn.innerText="Connexion";

}

if(lang=="es"){

subtitle.innerText="Encuentra tu pareja ideal";
joinBtn.innerText="Registrarse";
loginBtn.innerText="Iniciar sesión";

}

if(lang=="de"){

subtitle.innerText="Finde deinen perfekten Partner";
joinBtn.innerText="Registrieren";
loginBtn.innerText="Login";

}

if(lang=="ur"){

subtitle.innerText="اپنا جیون ساتھی تلاش کریں";
joinBtn.innerText="سائن اپ";
loginBtn.innerText="لاگ ان";

}

if(lang=="id"){

subtitle.innerText="Temukan pasangan hidupmu";
joinBtn.innerText="Daftar";
loginBtn.innerText="Masuk";

}

if(lang=="en"){

title.innerText="NIMEH";
subtitle.innerText="Find your perfect partner anywhere in the world";
joinBtn.innerText="Join Now";
loginBtn.innerText="Login";

}

}

</script></body>
</html>
