<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nimeh Gomshodeh</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
color:white;
text-align:center;
background:linear-gradient(135deg,#0f172a,#1e293b,#020617);
}

header{
font-size:26px;
font-weight:bold;
padding:20px;
}

.hero{
margin-top:30px;
}

h1{
font-size:36px;
margin:10px;
}

p{
opacity:0.8;
margin-bottom:30px;
}

.buttons{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:15px;
margin-bottom:50px;
}

button{
background:#FF4D6D;
border:none;
padding:14px 28px;
border-radius:30px;
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
box-shadow:0 10px 30px rgba(255,77,109,0.5);
}

.users{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
padding-bottom:40px;
}

.card{
background:#222;
padding:20px;
border-radius:20px;
width:150px;
}

.avatar{
width:80px;
height:80px;
border-radius:50%;
object-fit:cover;
margin-bottom:10px;
}

footer{
opacity:0.6;
padding:20px;
}

</style>

</head>

<body>

<header>
❤️ نیمه گمشده
</header>

<div class="hero">

<p>
پلتفرم مدرن آشنایی و ازدواج فارسی‌زبانان در سراسر جهان
</p>

<div class="buttons">

<a href="signup.html">
<button>ثبت نام</button>
</a>

<a href="profile.html">
<button>ورود</button>
</a>

<a href="users.html">
<button>کاربران</button>
</a>

<a href="swipe.html">
<button>پیدا کردن افراد</button>
</a>

</div>

</div>

<h2>⭐ کاربران محبوب</h2>

<div class="users">

<div class="card">

</div>

</div>

<div class="card">
