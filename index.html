<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox</title><style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
}

.header{
background:#ff4d6d;
color:white;
padding:15px;
text-align:center;

}

.chat{

margin:10px;

.navbar{

bottom:0;

background:white;
display:flex;

}

</style></head><body><div class="header">💬 Inbox</div><div id="chats"></div><div class="navbar">

</div><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script><script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh",
storageBucket:"nimeh-gomsodeh.firebasestorage.app",
messagingSenderId:"815930956932",
appId:"1:815930956932:web:e8696a6a69b4458fd936d1"

};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig)
}

const db=firebase.firestore()


firebase.auth().onAuthStateChanged(user=>{

if(!user){

location.href="login.html"
return

}

loadChats(user.uid)

})



function loadChats(uid){

db.collection("messages")
.orderBy("time","desc")
.onSnapshot(snapshot=>{

let chats={}
let html=""

snapshot.forEach(doc=>{

let m=doc.data()

if(m.from!==uid && m.chat.includes(uid)){

let other=m.chat.replace(uid,"").replace("_","")

chats[other]=m

}

})

for(let id in chats){

html+=`

<div class="chat" onclick="openChat('${id}')">

💬 Chat with ${id}

</div>

`

}

document.getElementById("chats").innerHTML=html

})

}



function openChat(id){

location.href="chat.html?id="+id

}

</script></body>
</html>
