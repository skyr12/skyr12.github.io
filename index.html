<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Nimeh</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">

<style>

body{
font-family:Arial;
background:#ff4d6d;
color:white;
text-align:center;
padding-top:100px;
}

button{
padding:15px 25px;
margin:10px;
border:none;
border-radius:30px;
font-size:16px;
cursor:pointer;
}

</style>

</head>

<body>

<h1>NIMEH</h1>

<p>Where people meet</p>

<button onclick="notify()">Test Notification</button>


<script>

function notify(){

if(Notification.permission==="granted"){

new Notification("Nimeh",{

body:"You have a new match ❤️"

})

}

else{

Notification.requestPermission().then(p=>{

if(p==="granted"){

new Notification("Nimeh",{

body:"Notifications enabled 🔔"

})

}

})

}

}

</script>

</body>

</html>
