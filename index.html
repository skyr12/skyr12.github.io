<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>همدم | صفحه اصلی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding-bottom: 70px;
        }

        .header {
            background: #ff4d6d;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            max-width: 500px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .welcome-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .welcome-card h2 {
            color: #ff4d6d;
            margin-bottom: 15px;
            font-size: 28px;
        }

        .welcome-card p {
            color: #666;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .profile-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .profile-card img {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }

        .profile-info {
            padding: 25px;
        }

        .name {
            font-size: 26px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .location {
            color: #666;
            margin-bottom: 15px;
        }

        .bio {
            color: #444;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
        }

        .btn-like {
            background: #ff4d6d;
            color: white;
        }

        .btn-like:hover {
            background: #ff3355;
        }

        .btn-dislike {
            background: #eee;
            color: #333;
        }

        .btn-dislike:hover {
            background: #ddd;
        }

        .logout-btn {
            background: white;
            color: #ff4d6d;
            border: 2px solid #ff4d6d;
            padding: 12px;
            border-radius: 10px;
            margin-top: 20px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #ff4d6d;
            color: white;
        }

        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #ddd;
        }

        .nav-item {
            text-decoration: none;
            font-size: 24px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        ❤️ همدم
    </div>

    <div class="container">
        <div class="welcome-card">
            <h2>خوش آمدید!</h2>
            <p>شما با موفقیت وارد شدید</p>
        </div>

        <div class="profile-card">
            <img src="https://randomuser.me/api/portraits/women/1.jpg">
            <div class="profile-info">
                <div class="name">سارا محمدی، ۲۴</div>
                <div class="location">📍 تهران • ۳ کیلومتری شما</div>
                <div class="bio">عاشق موسیقی، سفر و کتاب ❤️</div>
                <div class="buttons">
                    <button class="btn btn-dislike" onclick="nextProfile()">✕</button>
                    <button class="btn btn-like" onclick="nextProfile()">❤️</button>
                </div>
            </div>
        </div>

        <button class="logout-btn" onclick="logout()">🚪 خروج از حساب</button>
    </div>

    <div class="navbar">
        <a href="index.html" class="nav-item">🏠</a>
        <a href="#" class="nav-item">🔥</a>
        <a href="#" class="nav-item">❤️</a>
        <a href="#" class="nav-item">👤</a>
    </div>

    <script>
        function nextProfile() {
            const images = [
                'https://randomuser.me/api/portraits/women/1.jpg',
                'https://randomuser.me/api/portraits/women/2.jpg',
                'https://randomuser.me/api/portraits/men/1.jpg',
                'https://randomuser.me/api/portraits/men/2.jpg'
            ];
            const randomImage = images[Math.floor(Math.random() * images.length)];
            document.querySelector('.profile-card img').src = randomImage;
        }

        function logout() {
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
