            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

</head>
<body>
    <div class="header">
        <div class="logo">
            <span>❤️</span>

        </div>
        <div class="wallet" onclick="location.href='wallet.html'">
            <span>🪙</span>
            <span id="userCoins">۱,۲۵۰</span>

    </div>

    <div class="tabs">
        <div class="tab active" onclick="location.href='index.html'">خانه</div>
        <div class="tab" onclick="location.href='live.html'">لایو</div>
        <div class="tab" onclick="location.href='gifts.html'">هدایا</div>
        <div class="tab" onclick="location.href='vip.html'">VIP</div>
    </div>

    <!-- میزبان ویژه -->
    <div class="featured-host">
        <img src="https://randomuser.me/api/portraits/women/1.jpg" class="host-avatar">
        <div>
            <h3>✨ الناز شاکردوست</h3>
            <p>میزبان ویژه امشب</p>
            <button class="enter-btn" onclick="location.href='live.html'">ورود به لایو</button>
        </div>
    </div>

    <!-- استوری‌ها -->
    <div style="display: flex; gap: 15px; padding: 15px; overflow-x: auto;">
        <div style="text-align: center;">
            <div style="width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #ff4d6d, #ff8a5c); padding: 3px;">
                <img src="https://randomuser.me/api/portraits/women/2.jpg" style="width: 100%; height: 100%; border-radius: 50%; border: 3px solid white;">
            </div>
            <span style="color: white; font-size: 12px;">سارا</span>
        </div>
        <div style="text-align: center;">
            <div style="width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #ff4d6d, #ff8a5c); padding: 3px;">
                <img src="https://randomuser.me/api/portraits/men/1.jpg" style="width: 100%; height: 100%; border-radius: 50%; border: 3px solid white;">
            </div>
            <span style="color: white; font-size: 12px;">علی</span>
        </div>
        <div style="text-align: center;">
            <div style="width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #ff4d6d, #ff8a5c); padding: 3px;">
                <img src="https://randomuser.me/api/portraits/women/3.jpg" style="width: 100%; height: 100%; border-radius: 50%; border: 3px solid white;">
            </div>
            <span style="color: white; font-size: 12px;">مریم</span>
        </div>
    </div>

    <!-- کارت اصلی دیسکاور -->
    <div class="profile-card">
        <img src="https://randomuser.me/api/portraits/women/4.jpg" class="profile-image">
        <div class="vip-badge">👑 VIP طلایی</div>
        
        <div style="padding: 20px;">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                <h2 style="font-size: 28px;">زهرا محمدی</h2>
                <span style="color: #ff4d6d; font-size: 20px;">۲۴</span>
            </div>
            
            <p style="color: #666; margin-bottom: 10px;">📍 تهران، ۳ کیلومتری</p>
            <p style="margin-bottom: 15px;">عاشق موسیقی و سفر ❤️</p>
            
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <span style="background: #f0f0f0; padding: 5px 15px; border-radius: 20px;">🎵 موسیقی</span>
                <span style="background: #f0f0f0; padding: 5px 15px; border-radius: 20px;">✈️ سفر</span>
                <span style="background: #f0f0f0; padding: 5px 15px; border-radius: 20px;">📚 کتاب</span>
            </div>
            
            <div class="action-buttons">
                <button class="action-btn dislike-btn" onclick="handleAction('dislike')">✕</button>
                <button class="action-btn like-btn" onclick="handleAction('like')">❤️</button>
                <button class="action-btn superlike-btn" onclick="handleAction('superlike')">⭐</button>
            </div>
        </div>
    </div>

    <!-- لایوهای محبوب -->
    <h3 style="color: white; padding: 15px; margin-top: 10px;">🔴 لایوهای محبوب</h3>
    
    <div class="live-grid">
        <div class="live-card" onclick="location.href='live.html'">
            <span class="live-badge">LIVE</span>
            <div style="height: 80px; display: flex; align-items: center; justify-content: center; font-size: 40px;">🎤</div>
            <div style="padding: 10px;">
                <strong>سارا جان</strong>
                <span class="viewer-count">👥 ۲.۳k</span>
            </div>
        </div>
        <div class="live-card" onclick="location.href='live.html'">
            <span class="live-badge">LIVE</span>
            <div style="height: 80px; display: flex; align-items: center; justify-content: center; font-size: 40px;">🎵</div>
            <div style="padding: 10px;">
                <strong>علی‌رضا</strong>
                <span class="viewer-count">👥 ۱.۲k</span>
            </div>
        </div>
        <div class="live-card" onclick="location.href='live.html'">
            <span class="live-badge">LIVE</span>
            <div style="height: 80px; display: flex; align-items: center; justify-content: center; font-size: 40px;">🎮</div>
            <div style="padding: 10px;">
                <strong>نیما</strong>
                <span class="viewer-count">👥 ۸۹۰</span>
            </div>
        </div>
        <div class="live-card" onclick="location.href='live.html'">
            <span class="live-badge">LIVE</span>
            <div style="height: 80px; display: flex; align-items: center; justify-content: center; font-size: 40px;">🎨</div>
            <div style="padding: 10px;">
                <strong>الناز</strong>
                <span class="viewer-count">👥 ۵۶۷</span>
            </div>
        </div>
    </div>

    <!-- نوار پایین -->
    <div class="navbar">
        <a href="index.html" class="nav-item active">🏠</a>
        <a href="discover.html" class="nav-item">🔥</a>
        <a href="live.html" class="nav-item">🎥</a>
        <a href="gifts.html" class="nav-item">🎁</a>
        <a href="profile.html" class="nav-item">👤</a>
    </div>

    <script>
        let userCoins = 1250;

        function handleAction(action) {
            if (action === 'like') {
                showToast('❤️ لایک شد!');
                setTimeout(() => location.reload(), 1000);
            } else if (action === 'superlike') {
                if (userCoins >= 50) {
                    userCoins -= 50;
                    document.getElementById('userCoins').textContent = userCoins.toLocaleString();
                    showToast('⭐ سوپرلایک شد!');
                    setTimeout(() => location.reload(), 1000);
                } else {
                    showToast('❌ سکه کافی ندارید!', 'error');
                }
            } else {
                location.reload();
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span>${type === 'success' ? '✅' : '❌'}</span>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
    </script>
</body>
</html>
