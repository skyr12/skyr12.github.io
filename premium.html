<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Premium</title><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
margin:0;
}

.header{
background:gold;
padding:20px;
font-size:24px;
}

.packages{
margin-top:40px;
display:flex;
flex-direction:column;
gap:20px;
max-width:400px;
margin-left:auto;
margin-right:auto;
}

.package{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

button{
margin-top:10px;
padding:12px 30px;
background:#ff4d6d;
color:white;
border:none;
border-radius:10px;
font-size:16px;
}

</style></head><body><div class="header">⭐ Premium Membership

</div><div class="packages"><div class="package"><h2>1 Month Premium</h2><p>1000 Coins</p><button onclick="buyPremium()">Buy</button>

</div></div><script>

const firebaseConfig = {

apiKey:"AIzaSyAA0xYFglY_0NI-PstgS4nP3uNIpyAq0_A",
authDomain:"nimeh-gomsodeh.firebaseapp.com",
projectId:"nimeh-gomsodeh"

}

firebase.initializeApp(firebaseConfig)

const db=firebase.firestore()

function buyPremium(){

let user=firebase.auth().currentUser

let userRef=db.collection("users").doc(user.uid)

userRef.get().then(doc=>{

let coins=doc.data().coins || 0

if(coins < 1000){

alert("Not enough coins")

return

}

userRef.update({

coins:coins-1000,
premium:true

})

alert("Premium activated ⭐")

})

}

</script></body></html>
